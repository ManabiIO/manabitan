name: Numeric suffix on merged parser correctness c563d487

on:
  push:
    branches: [perf/numeric-suffix-972-build-20261128-c563d487]

permissions:
  contents: read

env:
  TOOL_ROOT: dev/perf/numeric-suffix-972-build-c563d487
  OUTPUT_ROOT: ${{ github.workspace }}/builds/numeric-suffix-972-build
  BASE_ROOT: ${{ github.workspace }}/../numeric-suffix-972-baseline
  CANDIDATE_ROOT: ${{ github.workspace }}/../numeric-suffix-972-candidate
  MANABITAN_CLANG: /usr/bin/clang-21
  MANABITAN_WASM_LD: /usr/bin/wasm-ld-21

jobs:
  build-and-validate:
    name: Separate merged-source build and correctness gates
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the source-bound preparation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up dependencies
        uses: ./.github/actions/setup
        with:
          node-version: 22.22.0
      - name: Install the pinned native compiler
        run: |
          mkdir -p "$OUTPUT_ROOT"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 lld-21
      - name: Prepare and verify the one fixed composition
        run: python3 "$TOOL_ROOT/prepare-and-validate.py"
      - name: Preserve source artifacts and every correctness log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: numeric-suffix-972-build-${{ github.run_attempt }}
          path: builds/numeric-suffix-972-build
          if-no-files-found: warn
          retention-days: 14
