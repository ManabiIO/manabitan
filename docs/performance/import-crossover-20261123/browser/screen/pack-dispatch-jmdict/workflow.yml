name: Import optimization checks (frozen sources)

on:
  push:
    branches: [perf/import-crossover-20261123-0a175]
    paths:
      - '.github/workflows/import-runtime-next.yml'
      - 'dev/perf/import-runtime-next.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-crossover-0a175-${{ github.sha }}
  cancel-in-progress: false

jobs:
  study:
    name: Frozen import check (${{ matrix.candidate }}, ${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: pack-dispatch
            sha: 78a2adcfba8d72d8cba070319b53d4b2b354a8f9
            dictionary: jmdict
          - candidate: pack-dispatch
            sha: 78a2adcfba8d72d8cba070319b53d4b2b354a8f9
            dictionary: jitendex
          - candidate: pack-dispatch
            sha: 78a2adcfba8d72d8cba070319b53d4b2b354a8f9
            dictionary: vndb
          - candidate: media-path
            sha: 32c13e05c1a7fda88fd531dab40648c1978565f2
            dictionary: vndb
    env:
      PERF_BASELINE_SHA: 3d65e403c644b9a5a6be3128d72f9d30050b70e0
      PERF_CANDIDATE_SHA: ${{ matrix.sha }}
      PERF_CANDIDATE_NAME: ${{ matrix.candidate }}
      PERF_STAGE: screen
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Retain measurement source before setup
        run: |
          mkdir -p "$RUNNER_TEMP/import-crossover-evidence"
          cp .github/workflows/import-runtime-next.yml "$RUNNER_TEMP/import-crossover-evidence/workflow.yml"
          cp dev/perf/import-runtime-next.py "$RUNNER_TEMP/import-crossover-evidence/runner.py"
          git rev-parse HEAD > "$RUNNER_TEMP/import-crossover-evidence/tooling-sha.txt"
          git status --porcelain > "$RUNNER_TEMP/import-crossover-evidence/tooling-status.txt"

      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'

      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore pinned source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}

      - name: Run frozen sources and separate exhaustive diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/perf/import-runtime-next.py \
            --baseline "$PERF_BASELINE_SHA" \
            --candidate "$PERF_CANDIDATE_SHA" \
            --dictionary "$PERF_DICTIONARY" \
            --stage "$PERF_STAGE" \
            --output "$RUNNER_TEMP/import-crossover-evidence" \
            2>&1 | tee "$RUNNER_TEMP/import-crossover-evidence/study.log"

      - name: Preserve all observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-crossover-${{ env.PERF_CANDIDATE_NAME }}-${{ env.PERF_STAGE }}-${{ env.PERF_DICTIONARY }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/import-crossover-evidence
          if-no-files-found: error
          retention-days: 14
