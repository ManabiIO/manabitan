name: Original dictionary shared archive screen
on:
  push:
    branches: [research/import-jitendex-jmdict-20260919]
    paths: [.github/workflows/import-jj-archive-20260919.yml]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jitendex, jmdict]
    env:
      MANABITAN_CLANG: clang-18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npx playwright install --with-deps chromium
      - name: Fixed original dictionary comparisons
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: python dev/perf/jj-archive-screen.py --dictionary "$DICTIONARY" --blocks 2 --out "$RUNNER_TEMP/jj-archive"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jj-archive-screen-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/jj-archive
          retention-days: 21
          if-no-files-found: error
