name: JMdict canonical overlap diagnostic

on:
  push:
    branches: ['perf/jmdict-canonical-timeline-20261128-b9cacc']
    paths:
      - '.github/workflows/import-canonical-timeline-b9cacc.yml'
      - 'dev/perf/canonical-timeline-b9cacc/**'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze tooling and check out exact product baseline
        shell: bash
        env:
          TOOLING_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp -R dev/perf/canonical-timeline-b9cacc "$RUNNER_TEMP/canonical-timeline-tools"
          cp .github/workflows/import-canonical-timeline-b9cacc.yml "$RUNNER_TEMP/canonical-timeline-tools/workflow.yml"
          git checkout --detach "$PERF_BASELINE"
          mkdir -p builds/perf/canonical-timeline-b9cacc
          printf '%s\n' "$TOOLING_COMMIT" > builds/perf/canonical-timeline-b9cacc/tooling-commit.txt
          cp -R "$RUNNER_TEMP/canonical-timeline-tools" builds/perf/canonical-timeline-b9cacc/tooling
          git status --porcelain > builds/perf/canonical-timeline-b9cacc/baseline-status.txt
      - uses: ./.github/actions/setup
      - name: Validate marker guards, identities, and interval arithmetic
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s "$RUNNER_TEMP/canonical-timeline-tools" -p 'test_*.py' -v
          node "$RUNNER_TEMP/canonical-timeline-tools/test_runtime.mjs"
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Apply removable source markers and build release package
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/canonical-timeline-tools/instrument.py" \
            --root "$GITHUB_WORKSPACE" --output builds/perf/canonical-timeline-b9cacc
          npm run build -- --target chrome
          python "$RUNNER_TEMP/canonical-timeline-tools/instrument.py" \
            --root "$GITHUB_WORKSPACE" --output builds/perf/canonical-timeline-b9cacc \
            --verify --package builds/manabitan-chrome.zip
      - name: Capture one marks-only import with production defaults
        shell: bash
        run: |
          set -euo pipefail
          node dev/perf/import-benchmark.js jmdict --runs 1 --build-target chrome \
            --no-build --media-check sample \
            --output builds/perf/canonical-timeline-b9cacc/marks
      - name: Verify acquisition and derive diagnostic overlap ceilings
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/canonical-timeline-tools/instrument.py" \
            --root "$GITHUB_WORKSPACE" --output builds/perf/canonical-timeline-b9cacc \
            --verify --package builds/manabitan-chrome.zip
          python "$RUNNER_TEMP/canonical-timeline-tools/analyze.py" \
            --summary builds/perf/canonical-timeline-b9cacc/marks/summary.json \
            --instrumentation-dir builds/perf/canonical-timeline-b9cacc \
            --output builds/perf/canonical-timeline-b9cacc/analysis
      - name: Retain raw marks, source identities, derived ceilings, and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jmdict-canonical-timeline-b9cacc
          path: builds/perf/canonical-timeline-b9cacc
          if-no-files-found: error
          retention-days: 90
