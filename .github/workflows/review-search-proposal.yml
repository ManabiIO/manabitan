name: Qualify live-search proposal
on:
  push:
    branches: [review/search-proposal-20260928]
    paths: [.github/workflows/review-search-proposal.yml, .review/search.patch.gz.b64]
permissions:
  contents: write
jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: proposal
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7294d63871e7e0a6a6ee714b443c0f5e9dec7b1f
          path: product
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Apply exact reviewed patch
        working-directory: product
        run: |
          set -euo pipefail
          test -f ../proposal/.review/search.patch.gz.b64
          base64 --decode ../proposal/.review/search.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/search.patch"
          echo '3ef68cc0b52c07d5e872bbbaca7b0eed9fd71a5b72895af9b00ae5854aaf726f  '"$RUNNER_TEMP/search.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/search.patch"
          git apply "$RUNNER_TEMP/search.patch"
          git add -A
      - name: Install locked dependencies
        working-directory: product
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Format only proposed files
        working-directory: product
        run: |
          mkdir -p "$RUNNER_TEMP/search-evidence"
          git diff --cached --name-only -z -- '*.js' '*.ts' '*.mjs' | xargs -0 npx eslint --fix > "$RUNNER_TEMP/search-evidence/lint.txt" 2>&1 || true
          npx prettier docs/design/unified-search.md .github/workflows/search-contract.yml --write
      - name: Qualify focused source behavior
        working-directory: product
        run: |
          set -euo pipefail
          node --test test/search/search.test.mjs test/display-search-input-refresh.test.js | tee "$RUNNER_TEMP/search-evidence/focused.txt"
      - name: Publish bounded product branch
        working-directory: product
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'Manabi development'
          git config user.email 'development@manabi.io'
          git switch -c feat/live-dictionary-search-20260928
          git commit -m 'feat(search): add IME-safe live search and shared bounded dictionary previews'
          git push origin HEAD:refs/heads/feat/live-dictionary-search-20260928
          git rev-parse HEAD | tee "$RUNNER_TEMP/search-evidence/product-head.txt"
          git diff 7294d63871e7e0a6a6ee714b443c0f5e9dec7b1f HEAD > "$RUNNER_TEMP/search-evidence/product.patch"
      - name: Build shared runtime
        working-directory: product
        run: npm run build:libs && node web/build.mjs
      - name: Type and lint qualification
        working-directory: product
        run: |
          set +e
          npx tsc --noEmit --project web/tsconfig.json > "$RUNNER_TEMP/search-evidence/web-types.txt" 2>&1
          echo "web_types_exit=$?" >> "$RUNNER_TEMP/search-evidence/status.txt"
          npm run test:ts > "$RUNNER_TEMP/search-evidence/types.txt" 2>&1
          echo "types_exit=$?" >> "$RUNNER_TEMP/search-evidence/status.txt"
          npm run test:js > "$RUNNER_TEMP/search-evidence/all-lint.txt" 2>&1
          echo "lint_exit=$?" >> "$RUNNER_TEMP/search-evidence/status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-search-proposal-evidence
          path: ${{ runner.temp }}/search-evidence
          if-no-files-found: warn
          retention-days: 3
