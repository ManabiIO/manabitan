name: Qualify live-search proposal
on:
  push:
    branches: [review/search-proposal-20260928]
    paths: [.github/workflows/review-search-proposal.yml]
permissions:
  contents: write
jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a50e88412cc8ab8009fbe5fee223ca2f45fc8406
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:libs
      - name: Complete local style and API documentation
        run: |
          mkdir -p "$RUNNER_TEMP/search-evidence"
          python3 - <<'PY'
          from pathlib import Path
          header = Path('ext/js/display/display.js').read_text().split('*/', 1)[0] + '*/'
          for name in ['dictionary-preview', 'japanese-search']:
              p = Path(f'ext/js/search/{name}.js')
              p.write_text(p.read_text().replace('/* SPDX-License-Identifier: GPL-3.0-or-later */', header, 1))
          p = Path('ext/js/search/japanese-search.js')
          p.write_text(p.read_text().replace(' * @returns {string[]}', ' * @throws {RangeError} The query exceeds the length limit or contains NUL.\n * @returns {string[]}'))
          p = Path('ext/js/display/search-display-controller.js')
          p.write_text(p.read_text().replace('        this._composing = false;', '        /** @type {boolean} */\n        this._composing = false;', 1))
          p = Path('ext/web/client.ts')
          p.write_text(p.read_text().replace('/** Search-page spelling alternatives; preview payloads never contain full glossaries. */', '/**\n     * Search-page spelling alternatives; preview payloads never contain full glossaries.\n     * @param text\n     * @param full\n     * @param options\n     */'))
          PY
          git diff 7294d63871e7e0a6a6ee714b443c0f5e9dec7b1f --name-only -z -- '*.js' '*.ts' '*.mjs' | xargs -0 npx eslint --fix > "$RUNNER_TEMP/search-evidence/focused-lint.txt" 2>&1 || true
      - name: Qualify and publish only product changes
        run: |
          set -euo pipefail
          node --test test/search/search.test.mjs test/util/search-refresh-cases.js | tee "$RUNNER_TEMP/search-evidence/focused.txt"
          npm run test:ts > "$RUNNER_TEMP/search-evidence/types.txt" 2>&1
          npx tsc --noEmit --project web/tsconfig.json > "$RUNNER_TEMP/search-evidence/web-types.txt" 2>&1
          npm run test:js > "$RUNNER_TEMP/search-evidence/all-lint.txt" 2>&1
          node web/build.mjs | tee "$RUNNER_TEMP/search-evidence/build.txt"
          git add ext/js/display ext/js/search ext/web test/search web/extended-e2e.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'Manabi development'
            git config user.email 'development@manabi.io'
            git commit -m 'style(search): satisfy repository lint and document query contracts'
            git push origin HEAD:refs/heads/feat/live-dictionary-search-20260928
          fi
          git rev-parse HEAD > "$RUNNER_TEMP/search-evidence/product-head.txt"
          git diff 7294d63871e7e0a6a6ee714b443c0f5e9dec7b1f HEAD > "$RUNNER_TEMP/search-evidence/product.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-search-final-qualification
          path: ${{ runner.temp }}/search-evidence
          retention-days: 3
