name: Import close diagnostics 7762

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: import-close-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  profile:
    if: github.head_ref == 'diagnostic/import-close-20261124-7762' && github.event.pull_request.head.repo.full_name == github.repository
    name: Attribute ${{ matrix.dictionary }} finalization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Apply diagnostic-only clocks and package
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 698d685c21618a8e8dbdab7a49a8dcf0d30680eb HEAD -- ext test package.json package-lock.json
          mkdir -p builds/close-profile
          git rev-parse HEAD > builds/close-profile/source-sha.txt
          cp dev/perf/import-close-profile.patch builds/close-profile/overlay.patch
          cp dev/perf/import-envelope-profile.patch builds/close-profile/envelope-overlay.patch
          cp .github/workflows/import-close-profile-7762.yml builds/close-profile/executed-workflow.yml
          git apply --check dev/perf/import-close-profile.patch
          git apply dev/perf/import-close-profile.patch
          git apply --check dev/perf/import-envelope-profile.patch
          git apply dev/perf/import-envelope-profile.patch
          git diff -- ext > builds/close-profile/applied-overlay.patch
          node dev/perf/prepare-dictionaries.js '${{ matrix.dictionary }}'
          npm run build -- --target chrome
          cp builds/manabitan-chrome.zip builds/close-profile/instrumented-package.zip
          sha256sum builds/close-profile/overlay.patch builds/close-profile/envelope-overlay.patch builds/close-profile/applied-overlay.patch builds/close-profile/instrumented-package.zip > builds/close-profile/sha256.txt
          node dev/perf/host-environment.js > builds/close-profile/host-before.json
          printf '%s\n' 'Diagnostic-only operation clocks on frozen baseline 698d685c21618a8e8dbdab7a49a8dcf0d30680eb. Instrumentation can perturb timings. No speed qualification or change in production defaults. Original harness metadata is retained unchanged; its internal authoritativeTiming field is not used to make a speed claim for this study. Three complete imports, fixed media sample, full existing row/lookup/restart validation.' > builds/close-profile/DIAGNOSTIC_ONLY.txt
      - name: Run three complete imports
        run: node dev/perf/import-benchmark.js '${{ matrix.dictionary }}' --runs 3 --no-build --build-target chrome --media-check sample --output builds/close-profile/observations
      - name: Capture final host state
        if: always()
        run: node dev/perf/host-environment.js > builds/close-profile/host-after.json
      - name: Retain results and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-close-profile-7762-${{ matrix.dictionary }}
          path: builds/close-profile
          if-no-files-found: error
          retention-days: 14
