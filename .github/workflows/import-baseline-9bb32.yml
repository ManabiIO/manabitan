name: Import baseline profiling 9bb32

on:
  push:
    branches: [diagnostic/import-baseline-20261127-9bb32]
    paths: [.github/workflows/import-baseline-9bb32.yml]

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Ordinary complete import
        run: node dev/perf/import-benchmark.js "$PERF_DICTIONARY" --build-target chrome --runs 1 --media-check sample --output "builds/perf/baseline-9bb32-$PERF_DICTIONARY/ordinary"
      - name: Diagnostic import trace
        run: node dev/perf/import-benchmark.js "$PERF_DICTIONARY" --build-target chrome --no-build --trace --media-check sample --output "builds/perf/baseline-9bb32-$PERF_DICTIONARY/trace"
      - name: Retain observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: baseline-9bb32-${{ matrix.dictionary }}
          path: builds/perf/baseline-9bb32-${{ matrix.dictionary }}
          if-no-files-found: error
          retention-days: 14
