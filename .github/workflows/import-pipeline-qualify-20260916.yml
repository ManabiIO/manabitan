name: Exact shared-gather source qualification
on:
  push:
    branches: [verify/import-pipeline-research-20260916]
    paths: [.github/workflows/import-pipeline-qualify-20260916.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
      - name: Retrieve immutable source recipe and regression tests
        run: |
          mkdir -p "$RUNNER_TEMP/gather-qualification" builds/gather-qualification
          git fetch --depth=1 origin 96764973fe07f60358747dfb4d61ed3630e86964
          git show FETCH_HEAD:dev/perf/pipeline-research-20260916/apply.py > "$RUNNER_TEMP/gather-qualification/apply.py"
          git show FETCH_HEAD:dev/perf/pipeline-research-20260916/tests/zstd-shared-gather.test.js > test/zstd-shared-gather.test.js
          printf '%s\n' '56dd01bf78ec8a85b08d12e0f71757751a42188c14812bc740837a5be3b284c5  test/zstd-shared-gather.test.js' > builds/gather-qualification/tests.sha256
          sha256sum -c builds/gather-qualification/tests.sha256
          git rev-parse HEAD 'HEAD^{tree}' > builds/gather-qualification/baseline.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Parent conformance and unchanged full-repository lint baseline
        run: |
          npm run build:libs > builds/gather-qualification/parent-build.log 2>&1
          node node_modules/vitest/vitest.mjs run test/zstd-shared-gather.test.js test/zstd-wasm.test.js 2>&1 | tee builds/gather-qualification/parent-tests.log
          set +e
          npm run test:js > builds/gather-qualification/parent-full-lint.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > builds/gather-qualification/parent-full-lint-status.txt
      - name: Apply precisely the measured source and build libraries
        run: |
          python3 "$RUNNER_TEMP/gather-qualification/apply.py" gather64 > builds/gather-qualification/source-change.json
          printf '%s\n' 'e0d637333ce3a6714955960de5f4cd3df48b1da3ab7a8cadacbf3df4c749dad9  dev/lib/zstd-wasm.js' > builds/gather-qualification/source.sha256
          sha256sum -c builds/gather-qualification/source.sha256
          clang --version > builds/gather-qualification/compiler.txt
          node --version > builds/gather-qualification/node.txt
          npm run build:libs 2>&1 | tee builds/gather-qualification/candidate-build.log
          sha256sum dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js ext/lib/zstd-wasm.js.map test/perf/dictionaries.lock.json > builds/gather-qualification/input-hashes.txt
      - name: New and adjacent Zstd tests
        id: focused
        continue-on-error: true
        run: node node_modules/vitest/vitest.mjs run test/zstd-shared-gather.test.js test/zstd-wasm.test.js test/dictionary-database-content-dedup.test.js test/term-content-block-store.test.js 2>&1 | tee builds/gather-qualification/focused.log
      - name: Full unit suite
        id: unit
        continue-on-error: true
        run: npm run test:unit 2>&1 | tee builds/gather-qualification/unit.log
      - name: Options suite
        id: options
        continue-on-error: true
        run: npm run test:unit:options 2>&1 | tee builds/gather-qualification/options.log
      - name: All four strict type projects
        id: types
        continue-on-error: true
        run: npm run test:ts 2>&1 | tee builds/gather-qualification/types.log
      - name: Exact changed-source and new-test lint without rewriting
        id: lint
        continue-on-error: true
        run: node node_modules/eslint/bin/eslint.js dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js 2>&1 | tee builds/gather-qualification/changed-lint.log
      - name: Verify full-repository lint has no new diagnostics
        id: lint_baseline
        continue-on-error: true
        run: |
          set +e
          npm run test:js > builds/gather-qualification/candidate-full-lint.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > builds/gather-qualification/candidate-full-lint-status.txt
          cmp builds/gather-qualification/parent-full-lint-status.txt builds/gather-qualification/candidate-full-lint-status.txt
          cmp builds/gather-qualification/parent-full-lint.log builds/gather-qualification/candidate-full-lint.log
      - name: All build plans and actual Chrome and Firefox packages
        id: build
        continue-on-error: true
        run: |
          npm run test:build 2>&1 | tee builds/gather-qualification/build-plans.log
          node dev/bin/build.js --target chrome-dev 2>&1 | tee builds/gather-qualification/chrome-build.log
          node dev/bin/build.js --target firefox-dev 2>&1 | tee builds/gather-qualification/firefox-build.log
      - name: Install pinned browser and fixtures
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Full strict Chromium lifecycle
        id: browser
        continue-on-error: true
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/gather-qualification/browser.html
        run: |
          npm run test:e2e:chromium-extension 2>&1 | tee builds/gather-qualification/browser.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('builds/gather-qualification/browser.json').read_text())
          assert report['status'] == 'success' and report['skippedVerification'] is False
          assert len(report['phases']) >= 80
          PY
      - name: Publish two-file qualified source on a new optimization branch only
        if: steps.focused.outcome == 'success' && steps.unit.outcome == 'success' && steps.options.outcome == 'success' && steps.types.outcome == 'success' && steps.lint.outcome == 'success' && steps.lint_baseline.outcome == 'success' && steps.build.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          git diff --check
          sha256sum -c builds/gather-qualification/input-hashes.txt
          sha256sum -c builds/gather-qualification/source.sha256
          sha256sum -c builds/gather-qualification/tests.sha256
          git add dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert paths == ['dev/lib/zstd-wasm.js','test/zstd-shared-gather.test.js'], paths
          PY
          git -c core.hooksPath=/dev/null -c user.name='Manabitan contributors' -c user.email='contributors@manabi.io' commit -m 'perf: align shared source gathers into private compression memory'
          test -z "$(git status --porcelain)"
          branch='perf/import-shared-gather-20260916'
          test -z "$(git ls-remote --heads origin "$branch")"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD 'HEAD^{tree}' > builds/gather-qualification/qualified.txt
      - name: Record outcomes and fail closed
        if: always()
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          LINT_BASELINE: ${{ steps.lint_baseline.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          mkdir -p builds/gather-qualification
          printf '%s\n' "focused=$FOCUSED unit=$UNIT options=$OPTIONS types=$TYPES changed-lint=$LINT lint-baseline=$LINT_BASELINE build=$BUILD browser=$BROWSER" > builds/gather-qualification/outcomes.txt
          git diff c0a1b7ee6fa1383a0a422361d2a8b7f826499fff -- dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js > builds/gather-qualification/source.patch
          cp test/zstd-shared-gather.test.js builds/gather-qualification/
          cp "$RUNNER_TEMP/gather-qualification/apply.py" builds/gather-qualification/
          test "$FOCUSED/$UNIT/$OPTIONS/$TYPES/$LINT/$LINT_BASELINE/$BUILD/$BROWSER" = 'success/success/success/success/success/success/success/success'
          test -s builds/gather-qualification/qualified.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-gather-exact-qualification
          path: builds/gather-qualification
          retention-days: 30
