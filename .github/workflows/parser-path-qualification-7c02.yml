name: Parser path batching qualification 7c02

on:
  push:
    branches: [research/parser-path-batch-20261128-7c02]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-path-batch-7c02-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare evidence
        run: mkdir -p builds/path-validation-7c02
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install pinned native compiler and dependencies
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-21 lld-21
            npm ci
            npm run build:dictionary-wasm -- --check
            npm run build:libs
            npm run license-report:html
          } 2>&1 | tee builds/path-validation-7c02/setup.log
      - name: Validate changed code, all unit tests and all-target build
        run: |
          set -euo pipefail
          {
            npx eslint ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-wasm-parser-worker.js test/term-bank-media-projection.test.js
            npm run test:ts:main
            npm run test:ts:test
            npm run test:unit -- --maxWorkers=2
            npm run test:build
          } 2>&1 | tee builds/path-validation-7c02/validation.log
      - name: Retain validation evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-path-validation-7c02
          path: builds/path-validation-7c02
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: validate
    name: Path qualification ${{ matrix.dictionary }} ${{ matrix.order }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare evidence
        run: mkdir -p builds/path-qualification-7c02
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install pinned native compiler and dependencies
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-21 lld-21
            npm ci
            npm run build:dictionary-wasm -- --check
            npm run build:libs
            npm run license-report:html
          } 2>&1 | tee builds/path-qualification-7c02/setup.log
      - name: Install lockfile Chromium
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium 2>&1 | tee builds/path-qualification-7c02/browser-setup.log
      - name: Restore locked dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Acquire the fixed ordinary and separate verification cohorts
        env:
          DICTIONARY: ${{ matrix.dictionary }}
          INITIAL_ORDER: ${{ matrix.order }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$DICTIONARY" == vndb ]]; then
            extra=(--vndb-sah-allocation-units 36 38)
          fi
          python3 dev/perf/import-qualification-20261125-a7f7.py \
            --baseline 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2 \
            --candidate a8194e107c741dc1fd7e38cd9602e1aaacfc95ee \
            --dictionary "$DICTIONARY" --initial-order "$INITIAL_ORDER" \
            --pairs 12 --flags '{}' --expected-workers 3 \
            --expected-package-entry js/dictionary/term-bank-wasm-parser.js \
            --expected-package-entry js/dictionary/term-bank-wasm-parser-worker.js \
            --evidence builds/path-qualification-7c02/result \
            "${extra[@]}" 2>&1 | tee builds/path-qualification-7c02/acquisition.log
      - name: Report complete or partial cell without replacing observations
        if: always()
        run: python3 dev/perf/path-qualification-7c02/summarize.py builds/path-qualification-7c02/result '${{ matrix.dictionary }}' '${{ matrix.order }}'
      - name: Retain all cell evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-path-qualification-7c02-${{ matrix.dictionary }}-${{ matrix.order }}
          path: |
            builds/path-qualification-7c02
            !builds/path-qualification-7c02/result-sources/**
          if-no-files-found: error
          retention-days: 14
