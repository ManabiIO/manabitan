name: Lookup chunk validation verification
on:
  push:
    branches: [verify/lookup-chunk-validation-20260909]
    paths: [.github/workflows/lookup-chunk-validation-verify.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source: ${{ steps.publish.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Reconstruct exact candidate and execute full contracts
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          product="$RUNNER_TEMP/product"
          mkdir -p "$evidence"
          base64 -d dev/perf/lookup-chunk-validation.patch.gz.b64 | gzip -d > "$evidence/source.patch"
          echo "6d221b24cf58a5a5f40e9ca50d237e73232068201945cc22878efd5001f8b923  $evidence/source.patch" | sha256sum --check
          cp dev/perf/lookup-validation-test-fix.patch "$evidence/test-fix.patch"
          git worktree add --detach "$product" 03478be25506176610b2133be658ee697d9bb3f1
          cp -al node_modules "$product/node_modules"
          cd "$product"
          git apply --index "$evidence/source.patch"
          test "$(git write-tree)" = 8b4eebb60a10f07b41178bd746a9e07551f352f6
          git apply --index "$evidence/test-fix.patch"
          test "$(git write-tree)" = 8e0c2290c46c52dfc9f276030bafbb46727cd756
          git diff --cached --name-only > "$evidence/changed-files.txt"
          node dev/bin/build-libs.js > "$evidence/libraries.log" 2>&1
          node node_modules/vitest/vitest.mjs run > "$evidence/unit.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$evidence/options.log" 2>&1
          npm run test:ts > "$evidence/types.log" 2>&1
          npm run test:js > "$evidence/lint.log" 2>&1
          node dev/bin/build.js --dryRun --all > "$evidence/build.log" 2>&1
          test "$(git write-tree)" = 8e0c2290c46c52dfc9f276030bafbb46727cd756
          test -z "$(git diff --name-only)"
      - name: Publish only the validated source and tests
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/product"
          branch=perf/lookup-chunk-validation-20260909
          git switch -c "$branch"
          git config user.name OpenAI
          git config user.email agent@openai.com
          git -c core.hooksPath=/dev/null commit -m 'perf(import): validate interned string metadata once per synchronous chunk preparation'
          test "$(git rev-parse HEAD^{tree})" = 8e0c2290c46c52dfc9f276030bafbb46727cd756
          test -z "$(git status --porcelain)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/source.txt"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lookup-chunk-validation-source
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
  comparison:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmnedict, jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build immutable source and adapt only the audit identity gates
        shell: bash
        env:
          SOURCE: ${{ needs.source.outputs.source }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          git worktree add --detach "$RUNNER_TEMP/A" 03478be25506176610b2133be658ee697d9bb3f1
          git worktree add --detach "$RUNNER_TEMP/B" "$SOURCE"
          for arm in A B; do
            cp -al node_modules "$RUNNER_TEMP/$arm/node_modules"
            (cd "$RUNNER_TEMP/$arm" && node dev/bin/build.js --target chrome-dev) > "$evidence/build-$arm.log" 2>&1
            git -C "$RUNNER_TEMP/$arm" rev-parse HEAD HEAD^{tree} > "$evidence/source-$arm.txt"
            test -z "$(git -C "$RUNNER_TEMP/$arm" status --porcelain)"
          done
          (cd "$RUNNER_TEMP/A" && node dev/perf/prepare-dictionaries.js) > "$evidence/fixtures.log" 2>&1
          ln -s "$RUNNER_TEMP/A/builds/e2e-dictionary-cache" "$RUNNER_TEMP/B/builds/e2e-dictionary-cache"
          git show 37da84b091b8c7e5b2c91d0778f087d60ce2f42a:dev/perf/definition-span-verify/paired.py > "$evidence/paired.py"
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'evidence/paired.py'
          source = path.read_text()
          old_tree = 'e604fea040cffee4e557d0c3797632b17328036f'
          old_files = "assert changed == ['js/dictionary/term-content-block-store.js'], changed"
          assert source.count(old_tree) == 1 and source.count(old_files) == 1
          source = source.replace(old_tree, '8e0c2290c46c52dfc9f276030bafbb46727cd756')
          source = source.replace(old_files, "assert sorted(changed) == ['js/dictionary/term-lookup-index-preparation.js', 'js/dictionary/term-record-preinterned-plan.js'], changed")
          path.write_text(source)
          PY
          sha256sum "$evidence/paired.py" > "$evidence/driver.sha256"
          clang --version > "$evidence/compiler.txt"
          node --version > "$evidence/node.txt"
          lscpu > "$evidence/cpu.txt"
          free -b > "$evidence/memory.txt"
          node --input-type=module <<'NODE' > "$evidence/native-memory.json"
          import {createServer} from 'node:http';
          import {chromium} from 'playwright';
          const server = createServer((req, res) => res.end('<!doctype html><title>memory</title>'));
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          const browser = await chromium.launch({headless: true, channel: 'chromium'});
          try {
            const page = await browser.newPage();
            await page.goto(`http://127.0.0.1:${server.address().port}`);
            const policy = await page.evaluate(async () => {
              const url = URL.createObjectURL(new Blob(['postMessage({deviceMemory: navigator.deviceMemory, hardwareConcurrency: navigator.hardwareConcurrency})'], {type: 'text/javascript'}));
              const worker = new Worker(url);
              try {
                const result = await new Promise((resolve, reject) => { worker.onmessage = e => resolve(e.data); worker.onerror = reject; });
                return {page: {deviceMemory: navigator.deviceMemory, hardwareConcurrency: navigator.hardwareConcurrency}, worker: result};
              } finally { worker.terminate(); URL.revokeObjectURL(url); }
            });
            console.log(JSON.stringify({browser: browser.version(), ...policy}, null, 2));
            if (policy.page.deviceMemory !== policy.worker.deviceMemory || !(policy.worker.deviceMemory > 4)) { throw new Error('Unexpected native memory policy'); }
          } finally { await browser.close(); server.close(); }
          NODE
      - name: Fixed twelve pairs plus excluded warmups and same-binary controls
        shell: bash
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/evidence/paired.py" --a "$RUNNER_TEMP/A" --b "$RUNNER_TEMP/B" --out "$RUNNER_TEMP/evidence/paired" --dictionaries "$DICTIONARY" --pairs 12 --controls 2>&1 | tee "$RUNNER_TEMP/evidence/driver.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lookup-chunk-validation-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
  integration:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Strict full Chromium integration of the exact source
        shell: bash
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: ${{ runner.temp }}/evidence/integration.html
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/source.txt"
          node dev/bin/build.js --target chrome-dev > "$RUNNER_TEMP/evidence/build.log" 2>&1
          node dev/perf/prepare-dictionaries.js > "$RUNNER_TEMP/evidence/fixtures.log" 2>&1
          node test/chromium/extension-two-dictionary-import.e2e.js > "$RUNNER_TEMP/evidence/integration.log" 2>&1
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lookup-chunk-validation-integration
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
