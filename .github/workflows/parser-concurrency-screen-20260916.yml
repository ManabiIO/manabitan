name: Parser concurrency import screen 20260916
on:
  push:
    branches: [verify/parser-concurrency-20260916]
    paths:
      - .github/workflows/parser-concurrency-screen-20260916.yml
      - dev/perf/parser-concurrency-screen-20260916.py
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        candidate: [workers3-groups4, workers4-groups4, workers3-groups3, workers4-groups2]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve immutable driver and pin exact baseline
        run: |
          cp dev/perf/parser-concurrency-screen-20260916.py "$RUNNER_TEMP/parser-concurrency.py"
          git fetch --depth=1 origin 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          python3 -m py_compile "$RUNNER_TEMP/parser-concurrency.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npx playwright install --with-deps chromium
      - name: Fetch checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Build baseline package
        run: node dev/bin/build.js --target chrome-dev
      - name: Six fixed source A/B pairs with A/A controls
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
        run: python3 "$RUNNER_TEMP/parser-concurrency.py"
      - name: Preserve exact driver
        if: always()
        run: |
          mkdir -p builds/parser-concurrency-screen
          cp "$RUNNER_TEMP/parser-concurrency.py" builds/parser-concurrency-screen/executed-driver.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-concurrency-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/parser-concurrency-screen
          retention-days: 30
