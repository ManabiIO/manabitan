name: Qualify private parser in Firefox
on:
  push:
    branches: [research/import-owned-handoff-20260918]
    paths: [.github/workflows/import-owned-firefox-20260918.yml]
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, private-owned]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build exact source variant
        env:
          VARIANT: ${{ matrix.variant }}
          MANABITAN_CLANG: clang-18
        run: |
          set -euo pipefail
          mkdir -p firefox-evidence
          python - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('candidate', 'dev/perf/owned-handoff-20260918.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.configure(os.environ['VARIANT'])
          PY
          npm run build:libs > firefox-evidence/libraries.log 2>&1
          node dev/bin/build.js firefox-dev > firefox-evidence/package.log 2>&1
          cp builds/manabitan-firefox-dev.zip builds/manabitan-firefox-dev.xpi
          sha256sum ext/lib/term-bank-parser.wasm ext/js/dictionary/term-bank-wasm-parser-worker.js builds/manabitan-firefox-dev.xpi > firefox-evidence/source.sha256
      - name: Official Firefox Developer Edition runtime
        run: |
          set -euo pipefail
          curl -fL 'https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=linux64&lang=en-US' -o /tmp/firefox.tar
          mkdir -p "$RUNNER_TEMP/firefox"
          tar -xf /tmp/firefox.tar -C "$RUNNER_TEMP/firefox"
          sha256sum /tmp/firefox.tar > firefox-evidence/runtime.sha256
          "$RUNNER_TEMP/firefox/firefox/firefox" --version > firefox-evidence/version.txt
          echo "MANABITAN_FIREFOX_BINARY=$RUNNER_TEMP/firefox/firefox/firefox" >> "$GITHUB_ENV"
      - name: Actual extension lifecycle using repository Firefox harness
        env:
          MANABITAN_FIREFOX_XPI: ${{ github.workspace }}/builds/manabitan-firefox-dev.xpi
          MANABITAN_FIREFOX_HEADLESS: '0'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_FIREFOX_E2E_REPORT: firefox-evidence/lifecycle.html
        run: |
          set -euo pipefail
          xvfb-run -a node test/firefox/extension-two-dictionary-import.e2e.js > firefox-evidence/lifecycle.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('firefox-evidence/lifecycle.json').read_text())
          assert r['status'] == 'success' and r['skippedVerification'] is False, r.get('failureReason')
          PY
          sha256sum --check firefox-evidence/source.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-firefox-${{ matrix.variant }}
          path: firefox-evidence
          retention-days: 30
          if-no-files-found: error
