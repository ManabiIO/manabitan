name: Qualify three dictionary decoder publication
on:
  push:
    branches: [verify/three-dictionary-import-20260917]
    paths: [.github/workflows/three-dictionary-publish-20260917.yml]
permissions:
  contents: write
  actions: read
  pull-requests: read
defaults:
  run:
    shell: bash
jobs:
  qualify-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8191f6c6997d7afc5d54e647e93af6def48dfa98
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35175334044
          pattern: three-inflate-confirm-*
          path: ${{ runner.temp }}/confirmation
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35175888618
          pattern: three-inflate-replication-*
          path: ${{ runner.temp }}/replication
      - name: Re-read complete fixed plans, raw reports and exact source receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p builds/three-publication
          git fetch --depth=1 origin bdb25d403291771bd1cdb7801efd62d9e0a28870
          git show FETCH_HEAD:dev/perf/three-dictionary-20260917/publish-gate.py > "$RUNNER_TEMP/publish-gate.py"
          python3 "$RUNNER_TEMP/publish-gate.py" | tee builds/three-publication/gate.log
          gh api repos/ManabiIO/manabitan/pulls/41 > builds/three-publication/pr-before.json
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=json.loads(Path('builds/three-publication/pr-before.json').read_text())
          assert p['state']=='open' and p['merged'] is False
          assert p['head']['sha']=='726c5b7444a1b3c131c90de356f8261ac2fe65a2'
          assert p['head']['ref']=='perf/libdeflate-import-20260915' and p['base']['ref']=='develop'
          current=subprocess.check_output(['git','ls-remote','origin','refs/heads/develop'],text=True).split()[0]
          assert current=='8191f6c6997d7afc5d54e647e93af6def48dfa98'
          PY
      - run: npm ci
      - name: Reproduce missing flag behavior on the unchanged parent
        run: |
          npm run build:libs > builds/three-publication/parent-build.log 2>&1
          git apply --include=test/term-bank-experiments.test.js "$RUNNER_TEMP/confirmation/three-inflate-confirm-jmdict/product.patch"
          set +e
          node node_modules/vitest/vitest.mjs run test/term-bank-experiments.test.js -t 'full-buffer inflation experiment' --reporter=json --outputFile=builds/three-publication/red.json > builds/three-publication/red.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('builds/three-publication/red.json').read_text())
          assert r['numFailedTests']==1
          failures=[a for t in r['testResults'] for a in t['assertionResults'] if a['status']=='failed']
          assert len(failures)==1 and 'defaults off and requires literal true' in failures[0]['fullName']
          assert 'undefined' in '\n'.join(failures[0]['failureMessages'])
          PY
          git restore --source=HEAD -- test/term-bank-experiments.test.js
      - name: Apply and requalify only the measured isolated source
        run: |
          git apply --check "$RUNNER_TEMP/confirmation/three-inflate-confirm-jmdict/product.patch"
          git apply "$RUNNER_TEMP/confirmation/three-inflate-confirm-jmdict/product.patch"
          npm run build:libs > builds/three-publication/libs.log 2>&1
          sha256sum -c "$RUNNER_TEMP/confirmation/three-inflate-confirm-jmdict/qualified-inputs.sha256"
          node node_modules/vitest/vitest.mjs run test/term-bank-inflater.test.js test/term-bank-experiments.test.js test/term-bank-inflate-matches.test.js test/term-bank-join-boundaries.test.js > builds/three-publication/focused.log 2>&1
          npm run test:unit > builds/three-publication/unit.log 2>&1
          npm run test:unit:options > builds/three-publication/options.log 2>&1
          npm run test:ts > builds/three-publication/types.log 2>&1
          npm run test:build > builds/three-publication/build-plans.log 2>&1
          node node_modules/eslint/bin/eslint.js dev/build-libs.js ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js test/term-bank-experiments.test.js test/term-bank-inflater.test.js > builds/three-publication/changed-lint.log 2>&1
          node dev/bin/build.js --target chrome-dev > builds/three-publication/chrome-build.log 2>&1
          node dev/bin/build.js --target firefox-dev > builds/three-publication/firefox-build.log 2>&1
          sha256sum -c "$RUNNER_TEMP/confirmation/three-inflate-confirm-jmdict/qualified-inputs.sha256"
      - name: Verify full lint has only the inherited composite-test errors
        run: |
          set +e
          node node_modules/eslint/bin/eslint.js . --ignore-pattern '**/*.json' -f json > builds/three-publication/full-lint.json 2> builds/three-publication/full-lint-stderr.log
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('test/term-bank-composite-state.test.js')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='9384dca84f8e29bc0cc728c19d50bc946191ce25a6ce48566c75480dc99edd17'
          issues=[r for r in json.loads(Path('builds/three-publication/full-lint.json').read_text()) if r['errorCount'] or r['warningCount']]
          assert len(issues)==1 and issues[0]['filePath'].endswith('/test/term-bank-composite-state.test.js')
          assert issues[0]['errorCount']==38 and issues[0]['warningCount']==0
          PY
      - name: Publish a qualified holding ref, preserving both PR and develop ancestry
        run: |
          git fetch --depth=1 origin 726c5b7444a1b3c131c90de356f8261ac2fe65a2
          test "$(git ls-remote origin refs/heads/perf/libdeflate-import-20260915 | cut -f1)" = 726c5b7444a1b3c131c90de356f8261ac2fe65a2
          test "$(git ls-remote origin refs/heads/develop | cut -f1)" = 8191f6c6997d7afc5d54e647e93af6def48dfa98
          git add dev/build-libs.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/wasm/term-bank-parser.c ext/js/dictionary/wasm/term-bank-inflate.c ext/js/dictionary/wasm/vendor/libdeflate test/term-bank-experiments.test.js test/term-bank-inflater.test.js test/native/term-bank-inflater-sanitizer.c types/ext/dictionary-importer.d.ts
          python3 - <<'PY'
          import subprocess
          allowed={'dev/build-libs.js','ext/js/dictionary/term-bank-experiments.js','ext/js/dictionary/term-bank-wasm-parser.js','ext/js/dictionary/wasm/term-bank-parser.c','ext/js/dictionary/wasm/term-bank-inflate.c','test/term-bank-experiments.test.js','test/term-bank-inflater.test.js','test/native/term-bank-inflater-sanitizer.c','types/ext/dictionary-importer.d.ts'}
          vendor={'COPYING','README.md','common_defs.h','libdeflate.h','lib/lib_common.h','lib/deflate_constants.h','lib/deflate_decompress.c','lib/decompress_template.h'}
          allowed|={'ext/js/dictionary/wasm/vendor/libdeflate/'+name for name in vendor}
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==allowed,(actual-allowed,allowed-actual)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','diff','--cached','--exit-code','726c5b7444a1b3c131c90de356f8261ac2fe65a2','--','ext/js/dictionary/wasm/vendor/libdeflate','ext/js/dictionary/wasm/term-bank-inflate.c'],check=True)
          PY
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'perf: gate full-buffer inflation and qualify three dictionaries' | git -c user.name='Manabitan contributors' -c user.email='contributors@manabi.io' commit-tree "$tree" -p 726c5b7444a1b3c131c90de356f8261ac2fe65a2 -p 8191f6c6997d7afc5d54e647e93af6def48dfa98)
          test "$(git rev-parse "$commit^{tree}")" = "$tree"
          git push origin "$commit:refs/heads/verify/three-dictionary-libdeflate-qualified-20260917"
          printf '%s\n%s\n' "$commit" "$tree" > builds/three-publication/qualified.txt
          git diff 8191f6c6997d7afc5d54e647e93af6def48dfa98 "$commit" > builds/three-publication/published.patch
          cp "$RUNNER_TEMP/confirmation/three-inflate-confirm-jmdict/qualified-inputs.sha256" builds/three-publication/
          echo QUALIFIED > builds/three-publication/complete.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-dictionary-publication
          path: builds/three-publication
          retention-days: 30
