name: Publisher configuration readiness (no publication)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  configuration-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cd
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.0"
      - name: Check effective credential presence without revealing values
        env:
          G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          G_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          G_REFRESH_TOKEN: ${{ secrets.G_REFRESH_TOKEN }}
          G_STABLE_EXTENSION_ID: ${{ secrets.G_STABLE_EXTENSION_ID }}
          G_DEVELOPMENT_EXTENSION_ID: ${{ secrets.G_DEVELOPMENT_EXTENSION_ID }}
          FF_EXTENSION_ID: ${{ secrets.FF_EXTENSION_ID }}
          FF_OFFLINE_EXT_ID: ${{ secrets.FF_OFFLINE_EXT_ID }}
          FF_JWT_ISSUER: ${{ secrets.FF_JWT_ISSUER }}
          FF_JWT_SECRET: ${{ secrets.FF_JWT_SECRET }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          CHROME_CRX_PRIVATE_KEY: ${{ secrets.CHROME_CRX_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const groups = {
            chromeStable: ['G_CLIENT_ID', 'G_CLIENT_SECRET', 'G_REFRESH_TOKEN', 'G_STABLE_EXTENSION_ID'],
            chromeDevelopment: ['G_CLIENT_ID', 'G_CLIENT_SECRET', 'G_REFRESH_TOKEN', 'G_DEVELOPMENT_EXTENSION_ID'],
            firefoxStable: ['FF_EXTENSION_ID', 'FF_JWT_ISSUER', 'FF_JWT_SECRET'],
            firefoxDevelopment: ['FF_OFFLINE_EXT_ID', 'FF_JWT_ISSUER', 'FF_JWT_SECRET'],
            edgeStable: ['EDGE_PRODUCT_ID', 'EDGE_CLIENT_ID', 'EDGE_API_KEY'],
            chromeOfflineSigning: ['CHROME_CRX_PRIVATE_KEY'],
          };
          const names = [...new Set(Object.values(groups).flat())];
          const present = Object.fromEntries(names.map((name) => [name, Boolean(process.env[name]?.trim())]));
          const channels = Object.fromEntries(Object.entries(groups).map(([channel, names]) => [channel, {
            configured: names.every((name) => present[name]),
            missing: names.filter((name) => !present[name]),
          }]));
          const listingChecks = {
            chromeStableIdFormatValid: /^[a-p]{32}$/.test(process.env.G_STABLE_EXTENSION_ID ?? ''),
            chromeDevelopmentIdFormatValid: /^[a-p]{32}$/.test(process.env.G_DEVELOPMENT_EXTENSION_ID ?? ''),
            firefoxStableMatchesManifest: process.env.FF_EXTENSION_ID === '{1e12d533-8e72-4ec5-9edc-cd50e26d7d43}',
            firefoxDevelopmentMatchesManifest: process.env.FF_OFFLINE_EXT_ID === '{accbebce-862b-48a9-bb9a-1da9ad1f8702}',
            edgeIdFormatValid: /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(process.env.EDGE_PRODUCT_ID ?? ''),
            edgeIsNotUpstreamListing: present.EDGE_PRODUCT_ID && process.env.EDGE_PRODUCT_ID.toLowerCase() !== '18e6c4cd-6383-4f38-95e9-92a629f60817',
          };
          const ready = ['chromeStable', 'firefoxStable', 'edgeStable'].every((channel) => channels[channel].configured) &&
            listingChecks.chromeStableIdFormatValid && listingChecks.firefoxStableMatchesManifest &&
            listingChecks.edgeIdFormatValid && listingChecks.edgeIsNotUpstreamListing;
          const report = {
            status: ready ? 'configuration-present-unverified-authentication' : 'blocked-missing-or-invalid-configuration',
            checkedAt: new Date().toISOString(),
            sourceCommit: process.env.GITHUB_SHA,
            environment: 'cd',
            present, channels, listingChecks,
            scope: 'Presence and public manifest identity comparisons only; authentication, ownership, signing, installation and updates are not verified.',
            publicationAttempted: false,
          };
          const output = JSON.stringify(report, null, 2) + '\n';
          fs.writeFileSync('publisher-readiness.json', output);
          console.log(output);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Publisher configuration audit: **' + report.status + '**. No signing, upload or publication was attempted.\n\n' +
            Object.entries(channels).map(([name, state]) => '- ' + name + ': ' + (state.configured ? 'present' : 'missing ' + state.missing.join(', '))).join('\n') + '\n');
          if (!ready) { process.exitCode = 1; }
          NODE
      - name: Retain non-secret readiness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publisher-readiness
          path: publisher-readiness.json
          if-no-files-found: error
          retention-days: 14
