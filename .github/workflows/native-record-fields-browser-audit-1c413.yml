name: Read original native fields browser qualification records

on:
  push:
    branches: [audit/native-record-fields-browser-20261128-1c413]

permissions:
  contents: read
  actions: read

concurrency:
  group: native-fields-browser-records-audit-1c413
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

# Records-only audit of all six original artifacts from run 46138650386.
# Original VNDB AB failure and every observation remain retained and disqualifying.
# The exact unfiltered branch avoids the prior registration issue; no imports run here.
jobs:
  audit:
    name: Inspect all original records without acquisition
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Preserve launcher context before dependency setup
        id: startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir setup-evidence
          printf '{"stage":"before-setup","runId":"%s","attempt":"%s","head":"%s","runnerOs":"%s","runnerArch":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" > setup-evidence/launcher.json
          uname -a > setup-evidence/uname.txt
          sw_vers > setup-evidence/os.txt
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$RUNNER_OS" == macOS ]]
          [[ "$RUNNER_ARCH" == ARM64 ]]
      - id: audit_source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: audit-source
          fetch-depth: 1
          persist-credentials: false
      - name: Preserve exact audit source before Python installation
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          cp -R audit-source/dev/perf/native-record-fields-browser-audit-20261128-1c413 setup-evidence/auditor-source
          cp audit-source/.github/workflows/native-record-fields-browser-audit-1c413.yml setup-evidence/workflow.yml
      - id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: arm64
          check-latest: false
      - name: Check pure schedule, arithmetic and records-reader logic
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s audit-source/dev/perf/native-record-fields-browser-audit-20261128-1c413 \
            -p 'test_*.py' 2>&1 | tee auditor-tests.log
      - name: Inspect immutable original artifacts and prerequisite records
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 audit-source/dev/perf/native-record-fields-browser-audit-20261128-1c413/audit_fields_browser.py \
            --manifest audit-source/dev/perf/native-record-fields-browser-audit-20261128-1c413/manifest.json \
            --output audit-evidence 2>&1 | tee auditor-console.log
      - name: Preserve every launcher and reader outcome
        if: always()
        shell: bash
        env:
          AUDIT_STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          mkdir -p setup-evidence
          printf '%s\n' "$AUDIT_STEP_RESULTS" > setup-evidence/step-outcomes.json
      - name: Preserve source, every original member and all analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-fields-browser-records-audit-${{ github.sha }}
          path: |
            setup-evidence
            audit-evidence
            auditor-tests.log
            auditor-console.log
            audit-source/dev/perf/native-record-fields-browser-audit-20261128-1c413
            audit-source/.github/workflows/native-record-fields-browser-audit-1c413.yml
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          compression-level: 6
