name: Publish and confirm exact glossary source

# The one-shot push-triggered confirmation is already running. Subsequent
# maintenance must not launch duplicate benchmarks or republish the source.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - id: source
        name: Publish only the exact already-validated source tree
        shell: bash
        run: |
          set -euo pipefail
          base=394d8eb799dd1eb5e194cee11472a4beab915080
          expected=0f96f37220d52f1a5e395ac698c242e2f6c7c4e8
          branch=perf-exact-adjacent-glossary-20260908
          source="$RUNNER_TEMP/source"
          git worktree add --detach "$source" "$base"
          git -C "$source" apply --index "$GITHUB_WORKSPACE/dev/perf/glossary-experiment/source.patch"
          cp dev/perf/glossary-experiment/term-bank-adjacent-glossary.test.js "$source/test/"
          git -C "$source" add test/term-bank-adjacent-glossary.test.js
          test "$(git -C "$source" write-tree)" = "$expected"
          test "$(git -C "$source" diff --cached --name-only | wc -l)" -eq 2
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            sha=$(git rev-parse "refs/remotes/origin/$branch")
            test "$(git rev-parse "$sha^{tree}")" = "$expected"
            test "$(git rev-parse "$sha^")" = "$base"
          else
            sha=$(printf '%s\n' 'Reuse validation of byte-identical adjacent glossaries' '' 'Require a complete byte comparison to the preceding validated row in the current parser call. Preserve current-row spans, media and normalization hints, delimiters, and logical input bounds. Add 21 regression tests. No ZIP, hashing, storage, or import-policy changes.' | git -c user.name='Alex Ehlke' -c user.email='alex.ehlke@gmail.com' commit-tree "$expected" -p "$base")
            # A normal push to a new dedicated source branch: never force or merge.
            git push origin "$sha:refs/heads/$branch"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/publication"
          printf '%s\n' "$sha" > "$RUNNER_TEMP/publication/source-sha.txt"
          printf '%s\n' "$branch" > "$RUNNER_TEMP/publication/source-branch.txt"
          git -C "$source" diff --cached --binary > "$RUNNER_TEMP/publication/source.patch"
          git update-ref refs/heads/glossary-export "$sha"
          git bundle create "$RUNNER_TEMP/publication/source.bundle" refs/heads/glossary-export ^"$base"
      - uses: actions/upload-artifact@v4
        with:
          name: glossary-source-publication
          path: ${{ runner.temp }}/publication/
          retention-days: 14
          if-no-files-found: error

  confirm:
    needs: publish-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ needs.publish-source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build independently from the published source commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arms" "$RUNNER_TEMP/evidence"
          git worktree add --detach "$RUNNER_TEMP/arms/baseline" 394d8eb799dd1eb5e194cee11472a4beab915080
          git worktree add --detach "$RUNNER_TEMP/arms/candidate" "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/arms/candidate" rev-parse 'HEAD^{tree}')" = 0f96f37220d52f1a5e395ac698c242e2f6c7c4e8
          for arm in baseline candidate; do
            ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/arms/$arm/node_modules"
            (cd "$RUNNER_TEMP/arms/$arm" && node dev/bin/build-libs.js && node dev/bin/build.js --target chrome-dev) > "$RUNNER_TEMP/evidence/build-$arm.log" 2>&1
            git -C "$RUNNER_TEMP/arms/$arm" diff HEAD --binary > "$RUNNER_TEMP/evidence/source-$arm.patch"
          done
          (cd "$RUNNER_TEMP/arms/baseline" && node dev/perf/prepare-dictionaries.js) > "$RUNNER_TEMP/evidence/fixtures.log" 2>&1
          ln -s "$RUNNER_TEMP/arms/baseline/builds/e2e-dictionary-cache" "$RUNNER_TEMP/arms/candidate/builds/e2e-dictionary-cache"
          cp dev/perf/glossary-experiment/run-paired.py "$RUNNER_TEMP/evidence/"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/evidence/source-sha.txt"
          clang --version > "$RUNNER_TEMP/evidence/compiler.txt"
          lscpu > "$RUNNER_TEMP/evidence/cpu.txt"
          free -b > "$RUNNER_TEMP/evidence/memory.txt"
      - name: Full correctness, types, and build checks before timing
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
          npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
          node dev/bin/build.js --dryRun --all > "$RUNNER_TEMP/evidence/build-dry-run.log" 2>&1
      - name: Twelve predeclared pairs per dictionary on the new runner
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/perf/glossary-experiment/run-paired.py \
            --baseline "$RUNNER_TEMP/arms/baseline" \
            --candidate "$RUNNER_TEMP/arms/candidate" \
            --pairs 12 --warmups 1 \
            --output "$RUNNER_TEMP/evidence/paired" \
            --label "Fresh-runner confirmation of the unchanged published glossary candidate; twelve pairs per dictionary" \
            | tee "$RUNNER_TEMP/evidence/driver.log"
      - name: Strict full Chromium integration after timing
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          MANABITAN_E2E_STRICT_RUNTIME=1 MANABITAN_CHROMIUM_HEADLESS=1 MANABITAN_E2E_SKIP_BUILD=1 MANABITAN_CHROMIUM_E2E_REPORT="$RUNNER_TEMP/evidence/full-chromium.html" node test/chromium/extension-two-dictionary-import.e2e.js > "$RUNNER_TEMP/evidence/full-chromium.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glossary-confirmation
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
