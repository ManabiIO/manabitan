name: Current import profiles 20261127 beb5

on:
  push:
    branches: ['test/import-profile-20261127-beb5']
    paths: ['.github/workflows/import-profile-beb5.yml']

permissions:
  contents: read

jobs:
  profile:
    name: Current profile (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Build source-bound release package
        run: npm run build -- --target chrome
      - name: Collect ordinary observation and separate diagnostic trace
        shell: bash
        run: |
          set -euo pipefail
          evidence="builds/perf/current-profile-beb5/$PERF_DICTIONARY"
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          git status --porcelain > "$evidence/source-status.txt"
          sha256sum package-lock.json test/perf/dictionaries.lock.json builds/manabitan-chrome.zip > "$evidence/source-identities.txt"
          node dev/perf/host-environment.js > "$evidence/host.json"
          node dev/perf/import-benchmark.js "$PERF_DICTIONARY" --runs 1 --build-target chrome --no-build --output "$evidence/ordinary" 2>&1 | tee "$evidence/ordinary.log"
          node dev/perf/import-benchmark.js "$PERF_DICTIONARY" --runs 1 --build-target chrome --no-build --trace --output "$evidence/trace" 2>&1 | tee "$evidence/trace.log"
      - name: Preserve source identities, observations, traces and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: current-profile-beb5-${{ matrix.dictionary }}
          path: builds/perf/current-profile-beb5
          if-no-files-found: error
          retention-days: 14
