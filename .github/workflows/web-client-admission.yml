name: Web client admission
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test web/test/client-admission.test.mjs
      - name: Web TypeScript
        run: npx tsc --noEmit -p web/tsconfig.json
