name: Import recovery review
on:
  push:
    branches: [review/import-recovery-qualification-20260920]
    paths:
      - .github/workflows/import-recovery-review.yml
permissions:
  contents: read
jobs:
  native-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dependencies and Chromium
        run: |
          mkdir -p /tmp/import-native-recovery
          npm ci
          npm run build:libs
          npx playwright install --with-deps chromium
      - name: Native unfixed witnesses
        run: |
          set +e
          node .github/review/native-opfs-recovery.mjs . /tmp/import-native-recovery/native-red.json > /tmp/import-native-recovery/native-red.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs'
          const r=JSON.parse(readFileSync('/tmp/import-native-recovery/native-red.json'))
          if (r.cases.length !== 6 || r.failed === 0) throw new Error('Native regression witnesses missing')
          JS
      - name: Apply checksum-verified production composition
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          raw=gzip.decompress(base64.b64decode(pathlib.Path('.github/review/import-storage-production.patch.gz.b64').read_text()))
          assert hashlib.sha256(raw).hexdigest() == '934881f2b4f396f71a85cee14f08c918ca80844dbe35fcf1b2a615815028d79e'
          pathlib.Path('/tmp/production.patch').write_bytes(raw)
          PY
          git apply /tmp/production.patch
          git diff --check
          git diff --name-only -- ext/js/dictionary | xargs sha256sum > /tmp/import-native-recovery/source-sha256.txt
      - name: Native fixed witnesses
        run: node .github/review/native-opfs-recovery.mjs . /tmp/import-native-recovery/native-green.json > /tmp/import-native-recovery/native-green.log 2>&1
      - name: Real interrupted update and recovery
        env:
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_STOP_AFTER_CRASH_RECOVERY: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: /tmp/import-native-recovery/interrupted-update.html
        run: node test/chromium/extension-two-dictionary-import.e2e.js > /tmp/import-native-recovery/interrupted-update.log 2>&1
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-storage-native-recovery
          path: /tmp/import-native-recovery/
          retention-days: 14
