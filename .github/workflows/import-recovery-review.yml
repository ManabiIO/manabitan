name: Import recovery review
on:
  push:
    branches: [review/import-recovery-qualification-20260920]
    paths:
      - .github/workflows/import-recovery-review.yml
permissions:
  contents: read
jobs:
  verify-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify transported patches
        run: |
          mkdir -p /tmp/review-transport
          cp .github/review/*.b64 /tmp/review-transport/
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          out = []
          for p in pathlib.Path('/tmp/review-transport').glob('*.b64'):
              try:
                  decoded = gzip.decompress(base64.b64decode(p.read_text(), validate=False))
                  out.append({'name': p.name, 'bytes': len(decoded), 'sha256': hashlib.sha256(decoded).hexdigest()})
              except Exception as e:
                  out.append({'name': p.name, 'error': str(e)})
          text = json.dumps(out, indent=2)
          print(text)
          pathlib.Path('/tmp/review-transport/receipt.json').write_text(text)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: import-review-transport-check
          path: /tmp/review-transport/
          retention-days: 3
