name: Import recovery review
on:
  push:
    branches: [review/import-recovery-qualification-20260920]
    paths:
      - .github/workflows/import-recovery-review.yml
permissions:
  contents: read
jobs:
  review-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve locked real dictionaries
        run: |
          mkdir -p /tmp/import-recovery-fixtures
          node --input-type=module <<'JS'
          import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'
          import {writeFile} from 'node:fs/promises'
          const fixtures = await ensurePinnedDictionaryCache('/tmp/import-recovery-fixtures')
          await writeFile('/tmp/import-recovery-fixtures/manifest.json', JSON.stringify(fixtures, null, 2))
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: import-recovery-locked-fixtures
          path: /tmp/import-recovery-fixtures/
          compression-level: 0
          retention-days: 7
