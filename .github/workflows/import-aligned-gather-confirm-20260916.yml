name: Smaller shared-gather independent confirmation
on:
  push:
    branches: [verify/import-pipeline-research-20260916]
    paths: [.github/workflows/import-aligned-gather-confirm-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 96764973fe07f60358747dfb4d61ed3630e86964
          persist-credentials: false
      - name: Preserve exact candidate and fixed-plan driver
        run: |
          mkdir -p "$RUNNER_TEMP/pipeline-inputs"
          cp dev/perf/pipeline-research-20260916/apply-next.py "$RUNNER_TEMP/pipeline-inputs/apply.py"
          cp dev/perf/pipeline-research-20260916/screen.py "$RUNNER_TEMP/pipeline-inputs/screen.py"
          git fetch --depth=1 origin c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          git checkout --detach c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Twelve reversed-order pairs with interleaved A/A controls
        env:
          CANDIDATE: gather-aligned
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: |
          mkdir -p builds/pipeline-review
          python3 "$RUNNER_TEMP/pipeline-inputs/screen.py" 2>&1 | tee builds/pipeline-review/driver.log
      - name: Retain exact executable inputs
        if: always()
        run: |
          mkdir -p builds/pipeline-review/executed-inputs
          cp "$RUNNER_TEMP/pipeline-inputs/"*.py builds/pipeline-review/executed-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-confirm-gather-aligned-${{ matrix.dictionary }}
          path: builds/pipeline-review
          retention-days: 30
