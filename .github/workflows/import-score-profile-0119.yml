name: Import score cache candidate diagnostic 0119

on:
  push:
    branches: ['perf/import-score-cache-20261128-0119']
    paths:
      - '.github/workflows/import-score-profile-0119.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: import-score-profile-0119-${{ github.sha }}
  cancel-in-progress: false

env:
  MANABITAN_E2E_STRICT_RUNTIME: '1'
  MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'

jobs:
  candidate-profile:
    name: Diagnostic JMdict profile of exact candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install locked Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Retain exact diagnostic inputs
        run: |
          inputs=builds/perf/import-score-cache-candidate-profile-inputs
          mkdir -p "$inputs"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD > "$inputs/source.txt"
          git status --porcelain > "$inputs/worktree.txt"
          cp .github/workflows/import-score-profile-0119.yml "$inputs/workflow.yml"
          cp test/perf/dictionaries.lock.json "$inputs/dictionaries.lock.json"
          sha256sum package-lock.json dev/perf/import-benchmark.js \
            ext/js/dictionary/term-record-opfs-store.js \
            ext/js/dictionary/dictionary-database.js \
            ext/lib/term-bank-parser.wasm > "$inputs/source-sha256.txt"
      - name: Build candidate release package before profiling
        run: |
          npm run build -- --target chrome
          sha256sum builds/manabitan-chrome.zip > builds/perf/import-score-cache-candidate-profile-inputs/package-sha256.txt
      - name: Capture diagnostic trace with production defaults
        # Trace timings are diagnostic only. Sampled helper presence proves
        # execution; absence alone cannot rule it out because V8 may inline it.
        run: |
          node dev/perf/import-benchmark.js jmdict --runs 1 --no-build \
            --build-target chrome --media-check sample --trace \
            --output builds/perf/import-score-cache-candidate-profile
      - name: Retain diagnostic trace and exact package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-score-cache-candidate-profile-0119-${{ github.sha }}
          path: |
            builds/perf/import-score-cache-candidate-profile
            builds/perf/import-score-cache-candidate-profile-inputs
            builds/manabitan-chrome.zip
          if-no-files-found: error
          retention-days: 30
