name: Exact content comparison import screen
on:
  push:
    branches: [verify/import-round2-20260915]
    paths: [.github/workflows/import-round2-content-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 743bde4ce4df7731b2d9dd6fd454d2c4b9b54316
          persist-credentials: false
      - name: Prepare source-isolated JavaScript comparison
        run: |
          cp -a dev/perf/round2-20260915 "$RUNNER_TEMP/round2-review"
          git fetch --depth=1 origin 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round2-review/source-screen.py'
          s = p.read_text()
          old = "    'int-span': '37906a98494fbc28dcc9e8a0170e516d8abb4f4ddb4070704fb54539ee973a1c',"
          assert s.count(old) == 1
          s = s.replace(old, "    'content-word-compare': 'b020a7638e0ac15e03acfb4336377f97affd4273a2c1a0aba8f004d3fe6eb1c4',")
          s = s.replace("source = Path('ext/js/dictionary/wasm/term-bank-parser.c')", "source = Path('ext/js/dictionary/dictionary-database.js')")
          a = s.index('exports = [')
          b = s.index('with zipfile.ZipFile(root / package)', a)
          s = s[:a] + "replacements = {'js/dictionary/dictionary-database.js'}\n" + s[b:]
          a = s.index('# Correctness and complete resident-corpus')
          b = s.index("roots = {'A': root, 'B': candidate}", a)
          s = s[:a] + '''# Qualification precedes timing. The parser component does not exercise this change.
          with (output / 'focused.log').open('w') as log:
              subprocess.run(['node', 'node_modules/vitest/vitest.mjs', 'run',
                  'test/dictionary-database-content-dedup.test.js'], cwd=candidate,
                  stdout=log, stderr=subprocess.STDOUT, timeout=180, check=True)
          (output / 'component-not-applicable.json').write_text(json.dumps({
              'reason': 'Changed database equality path is outside the parser/lookup component runner',
              'wasmUnchanged': sha(root / 'ext/lib/term-bank-parser.wasm') == sha(candidate / 'ext/lib/term-bank-parser.wasm')}))

          ''' + s[b:]
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round2-review/source-screen.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Checksum-pinned complete dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Build baseline
        run: node dev/bin/build.js --target chrome-dev
      - name: Six alternating pairs and three interleaved AA controls
        env:
          CANDIDATE: content-word-compare
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: python3 "$RUNNER_TEMP/round2-review/source-screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round2-content-word-compare-${{ matrix.dictionary }}
          path: builds/round2-screen
          retention-days: 30
