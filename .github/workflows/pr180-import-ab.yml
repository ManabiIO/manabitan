name: PR 180 import A/B qualification 13-pair

on:
  push:
    branches:
      - perf/short-term-key-copy-20260924

permissions:
  contents: read

jobs:
  qualify:
    name: Pinned JMDict import A/B
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: '24.20.0'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore pinned dictionary cache
        uses: actions/cache@v5
        with:
          path: builds/e2e-dictionary-cache
          key: pr180-import-ab-${{ runner.os }}-v1

      - name: Run alternating source-import A/B
        shell: bash
        env:
          BASE_SHA: c9fa57e20f08442953299485e053d0f8601674fa
          CANDIDATE_SHA: 9981f7c0d117838f55e41dc10ec12c79cf9688ed
        run: |
          set -euo pipefail
          mkdir -p builds/pr180-ab
          results="$PWD/builds/pr180-ab/results.ndjson"
          : > "$results"

          build_variant() {
            local sha="$1"
            local output="$2"
            git checkout --force "$sha"
            node ./dev/bin/build.js --target chrome-dev
            cp builds/manabitan-chrome-dev.zip "$output"
          }

          build_variant "$BASE_SHA" "$RUNNER_TEMP/pr180-base.zip"
          build_variant "$CANDIDATE_SHA" "$RUNNER_TEMP/pr180-candidate.zip"

          run_one() {
            local pair="$1"
            local variant="$2"
            local sha="$3"
            local zip="$4"
            local report="$PWD/builds/pr180-ab/pair-${pair}-${variant}.html"
            local report_json="${report%.html}.json"

            git checkout --force "$sha"
            cp "$zip" builds/manabitan-chrome-dev.zip

            MANABITAN_CHROMIUM_HEADLESS=1 \
            MANABITAN_E2E_STRICT_RUNTIME=1 \
            MANABITAN_E2E_IMPORT_BENCH_QUICK=1 \
            MANABITAN_E2E_IMPORT_BENCH_DICTIONARY=jmdict \
            MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK=1 \
            MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS=1 \
            MANABITAN_E2E_IMPORT_FLAGS_JSON='{"enableTermEntryContentDedup":true}' \
            MANABITAN_E2E_PHASE_PROFILING=0 \
            MANABITAN_E2E_PHASE_SCREENSHOTS=0 \
            MANABITAN_E2E_PROCESS_SAMPLING=0 \
            MANABITAN_E2E_SKIP_BUILD=1 \
            MANABITAN_CHROMIUM_E2E_REPORT="$report" \
            xvfb-run -a node ./test/chromium/extension-two-dictionary-import.e2e.js

            REPORT_JSON="$report_json" VARIANT="$variant" PAIR="$pair" node --input-type=module <<'NODE' >> "$results"
          import {readFile} from 'node:fs/promises'
          import {extractImportResult} from './dev/perf/benchmark-support.js'
          import {loadDictionaryFixtures} from './dev/perf/dictionary-fixtures.js'

          const report = JSON.parse(await readFile(process.env.REPORT_JSON, 'utf8'))
          const fixtures = await loadDictionaryFixtures()
          const importFlags = {enableTermEntryContentDedup: true}
          const result = extractImportResult(report, 'jmdict', fixtures.jmdict, false, importFlags)
          console.log(JSON.stringify({
              pair: Number(process.env.PAIR),
              variant: process.env.VARIANT,
              totalImportMs: result.totalImportMs,
              workerImportMs: result.workerImportMs,
              validation: result.validation,
          }))
          NODE
          }

          for pair in $(seq 1 13); do
            if (( pair % 2 == 1 )); then
              run_one "$pair" base "$BASE_SHA" "$RUNNER_TEMP/pr180-base.zip"
              run_one "$pair" candidate "$CANDIDATE_SHA" "$RUNNER_TEMP/pr180-candidate.zip"
            else
              run_one "$pair" candidate "$CANDIDATE_SHA" "$RUNNER_TEMP/pr180-candidate.zip"
              run_one "$pair" base "$BASE_SHA" "$RUNNER_TEMP/pr180-base.zip"
            fi
          done

          git checkout --force "$CANDIDATE_SHA"
          RESULTS="$results" node --input-type=module <<'NODE'
          import {readFile, writeFile} from 'node:fs/promises'

          const rows = (await readFile(process.env.RESULTS, 'utf8'))
              .trim()
              .split('\n')
              .filter(Boolean)
              .map((line) => JSON.parse(line))
          const median = (values) => {
              const sorted = [...values].sort((a, b) => a - b)
              const mid = Math.floor(sorted.length / 2)
              return sorted.length % 2 === 1 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2
          }
          const pairs = []
          for (let pair = 1; pair <= 13; ++pair) {
              const base = rows.find((row) => row.pair === pair && row.variant === 'base')
              const candidate = rows.find((row) => row.pair === pair && row.variant === 'candidate')
              if (!base || !candidate) throw new Error(`Missing pair ${pair}`)
              pairs.push({
                  pair,
                  baseTotalImportMs: base.totalImportMs,
                  candidateTotalImportMs: candidate.totalImportMs,
                  deltaMs: candidate.totalImportMs - base.totalImportMs,
                  deltaPercent: ((candidate.totalImportMs - base.totalImportMs) / base.totalImportMs) * 100,
                  baseWorkerImportMs: base.workerImportMs,
                  candidateWorkerImportMs: candidate.workerImportMs,
              })
          }
          const summary = {
              baseSha: process.env.BASE_SHA,
              candidateSha: process.env.CANDIDATE_SHA,
              dictionary: 'jmdict',
              dedupe: true,
              pairCount: pairs.length,
              baseMedianMs: median(pairs.map((pair) => pair.baseTotalImportMs)),
              candidateMedianMs: median(pairs.map((pair) => pair.candidateTotalImportMs)),
              pairedDeltaMedianMs: median(pairs.map((pair) => pair.deltaMs)),
              pairedDeltaPercentMedian: median(pairs.map((pair) => pair.deltaPercent)),
              pairs,
              correctness: 'extractImportResult validated title, revision, row count, readable content, and >=12 content probes for every run',
          }
          await writeFile('builds/pr180-ab/summary.json', `${JSON.stringify(summary, null, 2)}\n`)
          console.log(JSON.stringify(summary, null, 2))
          if (process.env.GITHUB_STEP_SUMMARY) {
              const lines = [
                  '## PR #180 pinned JMDict import A/B',
                  `- Base median: ${summary.baseMedianMs.toFixed(1)} ms`,
                  `- Candidate median: ${summary.candidateMedianMs.toFixed(1)} ms`,
                  `- Median paired delta: ${summary.pairedDeltaMedianMs.toFixed(1)} ms (${summary.pairedDeltaPercentMedian.toFixed(2)}%)`,
                  `- Correctness: ${summary.correctness}`,
              ]
              await writeFile(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`, {flag: 'a'})
          }
          NODE

      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr180-import-ab
          path: builds/pr180-ab
          if-no-files-found: error
          retention-days: 7
