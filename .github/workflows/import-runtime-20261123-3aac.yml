name: Independent structured-import regression assessment

on:
  push:
    branches: [perf/structured-import-confirmation-20261123-3aac]
    paths:
      - '.github/workflows/import-runtime-20261123-3aac.yml'
      - 'dev/perf/import-runtime-20261123-3aac.py'

permissions:
  contents: read

concurrency:
  group: frozen-import-3aac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Structured strings independent host ${{ matrix.replication }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jitendex]
        replication: [1, 2]
    env:
      PERF_BASELINE_SHA: 3d65e403c644b9a5a6be3128d72f9d30050b70e0
      PERF_CANDIDATE_SHA: 09dfb90d926758205ff52d127ef3d950f0b15a65
      PERF_STAGE: qualification
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_REPLICATION: ${{ matrix.replication }}
      PERF_EXPECTED_DIFFERENCES: '["js/dictionary/wasm/term-bank-parser.c","lib/term-bank-parser.wasm"]'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retain the frozen acquisition plan
        run: |
          mkdir -p "$RUNNER_TEMP/import-3aac-evidence"
          cp .github/workflows/import-runtime-20261123-3aac.yml "$RUNNER_TEMP/import-3aac-evidence/workflow.yml"
          cp dev/perf/import-runtime-20261123-3aac.py "$RUNNER_TEMP/import-3aac-evidence/runner.py"
          git rev-parse HEAD > "$RUNNER_TEMP/import-3aac-evidence/tooling-sha.txt"
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Run the fixed cohort and exhaustive media diagnostics
        shell: bash
        run: |
          set -euo pipefail
          reverse_args=()
          if [ "$PERF_REPLICATION" = 2 ]; then reverse_args+=(--reverse); fi
          python3 dev/perf/import-runtime-20261123-3aac.py "${reverse_args[@]}" \
            --baseline "$PERF_BASELINE_SHA" \
            --candidate "$PERF_CANDIDATE_SHA" \
            --dictionary "$PERF_DICTIONARY" \
            --stage "$PERF_STAGE" \
            --expected-differences "$PERF_EXPECTED_DIFFERENCES" \
            --output "$RUNNER_TEMP/import-3aac-evidence" \
            2>&1 | tee "$RUNNER_TEMP/import-3aac-evidence/study.log"
      - name: Preserve every observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-3aac-structured-confirmation-${{ matrix.replication }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/import-3aac-evidence
          if-no-files-found: error
          retention-days: 30
