name: Import allocation regression screen 9175

on:
  push:
    branches: ['perf/import-allocation-screen-20261126-9175']
    paths:
      - '.github/workflows/import-allocation-screen-9175.yml'
      - 'dev/perf/import-allocation-screen-9175.py'

permissions:
  contents: read

jobs:
  screen:
    name: ${{ matrix.candidate }} / ${{ matrix.dictionary }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        candidate: [scratch, media]
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_BASELINE: 0143e9596cd8f790d5e166d4ba6a2425fbc57f14
      PERF_CANDIDATE: ${{ matrix.candidate == 'scratch' && '400d4375a89cdf93805cc9566da2068a741dc059' || 'bdb9c74874e2612fbb8741f4d36ed4397e4eaf57' }}
      PERF_KIND: ${{ matrix.candidate }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Check screen syntax
        run: python -m py_compile dev/perf/import-allocation-screen-9175.py
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fetch exact product revisions
        run: git fetch --no-tags origin "$PERF_BASELINE" "$PERF_CANDIDATE"
      - name: Run frozen ABBA imports and verify every image
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          entries = {
              'scratch': [
                  'js/dictionary/dictionary-database.js',
                  'js/dictionary/term-bank-wasm-parser.js',
                  'js/dictionary/term-content-plan-resolution.js',
              ],
              'media': [
                  'js/dictionary/dense-zip-file-map.js',
                  'js/dictionary/dictionary-importer.js',
              ],
          }
          command = [
              'python', 'dev/perf/import-allocation-screen-9175.py',
              '--baseline', os.environ['PERF_BASELINE'],
              '--candidate', os.environ['PERF_CANDIDATE'],
              '--dictionary', os.environ['PERF_DICTIONARY'],
              '--output', 'builds/perf/allocation-screen',
          ]
          for entry in entries[os.environ['PERF_KIND']]:
              command.extend(['--allowed-entry', entry])
          subprocess.run(command, check=True)
          PY
      - name: Retain raw evidence, including failed observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: allocation-${{ matrix.candidate }}-${{ matrix.dictionary }}-9175
          path: builds/perf/allocation-screen
          if-no-files-found: error
          retention-days: 14
