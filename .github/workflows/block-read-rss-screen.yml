name: Bounded block-read peak RSS screen
on:
  push:
    branches: [codex/qualify-block-read-rss-20260921]
permissions:
  contents: read
jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        repeat: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Pin compared source trees
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/block-rss"
          git show 90344f6e8cd04783d0e3a6d98a7f7ea8eb26af50:ext/js/dictionary/term-content-block-store.js > "$RUNNER_TEMP/block-rss/A.js"
          git show 29ed60958fd7d31ff7f21c70a1d27b796a178180:ext/js/dictionary/term-content-block-store.js > "$RUNNER_TEMP/block-rss/B.js"
          sha256sum "$RUNNER_TEMP/block-rss/A.js" "$RUNNER_TEMP/block-rss/B.js" > "$RUNNER_TEMP/block-rss/source-fingerprints.txt"
          cp test/perf/dictionaries.lock.json "$RUNNER_TEMP/block-rss/dictionaries.lock.json"
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/cache@v5
        with:
          path: builds/e2e-dictionary-cache
          key: chromium-e2e-dictionaries-${{ runner.os }}-v1
      - name: Build A and B packages
        run: |
          set -euo pipefail
          for variant in A B; do
            git switch --detach 90344f6e8cd04783d0e3a6d98a7f7ea8eb26af50
            cp "$RUNNER_TEMP/block-rss/$variant.js" ext/js/dictionary/term-content-block-store.js
            git diff --check
            node dev/bin/build.js --target chrome-dev > "$RUNNER_TEMP/block-rss/$variant-build.log" 2>&1
            cp builds/manabitan-chrome-dev.zip "$RUNNER_TEMP/$variant-block-rss.zip"
          done
          git switch --detach 90344f6e8cd04783d0e3a6d98a7f7ea8eb26af50
      - name: Alternating import memory samples
        env:
          REPEAT_INDEX: ${{ matrix.repeat }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,json,subprocess,shutil,statistics
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'block-rss'
          repeat=int(os.environ['REPEAT_INDEX'])
          rows=[]
          def run(dictionary,variant,role,pair,position):
              shutil.copyfile(pathlib.Path(os.environ['RUNNER_TEMP'])/f'{variant}-block-rss.zip','builds/manabitan-chrome-dev.zip')
              label=f'{dictionary}-{role}-{pair}-{position}-{variant}'
              report=root/f'{label}.html'
              env={k:v for k,v in os.environ.items() if not k.startswith('MANABITAN_')}
              env.update({
                'MANABITAN_CHROMIUM_HEADLESS':'1',
                'MANABITAN_CHROMIUM_E2E_REPORT':str(report),
                'MANABITAN_E2E_IMPORT_BENCH_QUICK':'1',
                'MANABITAN_E2E_IMPORT_BENCH_DICTIONARY':dictionary,
                'MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK':'1',
                'MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS':'1',
                'MANABITAN_E2E_PHASE_PROFILING':'0',
                'MANABITAN_E2E_PHASE_SCREENSHOTS':'0',
                'MANABITAN_E2E_PROCESS_SAMPLING':'1',
                'MANABITAN_E2E_SKIP_BUILD':'1',
                'MANABITAN_CHROMIUM_E2E_MAX_LOG_LINES':'10000',
                'MANABITAN_E2E_STRICT_RUNTIME':'1',
              })
              with (root/f'{label}.log').open('w') as log:
                  subprocess.run(['xvfb-run','-a','node','test/chromium/extension-two-dictionary-import.e2e.js'],env=env,stdout=log,stderr=subprocess.STDOUT,check=True,timeout=240)
              data=json.loads(report.with_suffix('.json').read_text())
              assert data['status']=='success'
              phases=[p for p in data.get('phases',[]) if isinstance(p.get('data'),dict) and p['data'].get('kind')=='dictionary-import']
              assert len(phases)==1,(label,len(phases))
              usage=phases[0].get('resourceUsage')
              assert usage and usage.get('sampleCount',0)>0,(label,usage)
              validation=(data.get('benchmark') or {}).get('validation')
              row={'repeat':repeat,'dictionary':dictionary,'variant':variant,'role':role,'pair':pair,'position':position,'durationMs':phases[0]['durationMs'],'resourceUsage':usage,'validation':validation,'browserVersion':data.get('browserVersion')}
              rows.append(row)
              (root/'ledger.json').write_text(json.dumps(rows,indent=2))
              print(json.dumps(row),flush=True)
          for dictionary in ['jmdict','jitendex']:
              for i,v in enumerate(['A','B']): run(dictionary,v,'warmup',0,i)
              for pair in range(1,4):
                  order=['A','B'] if (pair+repeat)%2==0 else ['B','A']
                  for i,v in enumerate(order): run(dictionary,v,'paired',pair,i)
          summary={}
          for dictionary in ['jmdict','jitendex']:
              pairs=[]
              for pair in range(1,4):
                  q=[x for x in rows if x['dictionary']==dictionary and x['role']=='paired' and x['pair']==pair]
                  a=next(x['resourceUsage']['peakRssMb'] for x in q if x['variant']=='A')
                  b=next(x['resourceUsage']['peakRssMb'] for x in q if x['variant']=='B')
                  pairs.append({'baselinePeakRssMb':a,'candidatePeakRssMb':b,'deltaMb':b-a,'deltaPct':(b/a-1)*100})
              summary[dictionary]={'pairs':pairs,'medianDeltaMb':statistics.median(x['deltaMb'] for x in pairs),'medianDeltaPct':statistics.median(x['deltaPct'] for x in pairs)}
          (root/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-rss-repeat-${{ matrix.repeat }}
          path: ${{ runner.temp }}/block-rss/
          retention-days: 14
