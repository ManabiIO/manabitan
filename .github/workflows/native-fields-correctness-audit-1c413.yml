name: Audit original native fields correctness artifacts 20261128

on:
  push:
    branches: [audit/native-fields-correctness-20261128-1c413]
    paths:
      - '.github/workflows/native-fields-correctness-audit-1c413.yml'
      - 'dev/perf/native-record-fields-correctness-audit-20261128-1c413/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: native-fields-correctness-audit-1c413-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

# Records-only original artifact audit. No importer, browser, native module,
# compiler, npm setup, benchmark, polling job or replacement observation.
jobs:
  audit:
    name: Verify immutable original validation and corpus artifacts
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create setup evidence and bind exact read-only source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/perf/native-fields-correctness-original-audit
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys
          from pathlib import Path, PurePosixPath
          if sys.flags.optimize:
              raise RuntimeError('Optimized assertions are not permitted')
          prefix = 'dev/perf/native-record-fields-correctness-audit-20261128-1c413'
          output = Path('builds/perf/native-fields-correctness-original-audit')
          source_path = prefix + '/source.json'
          source = json.loads(Path(source_path).read_text())
          baseline = 'dcfc02a0a5534929b1e9fa1f2801ec7a0784ea16'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['GITHUB_SHA'] or os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise RuntimeError('Unexpected reader source or attempt')
          ancestry = subprocess.check_output(['git', 'rev-list', '--parents', '-n', '1', head], text=True).split()
          if ancestry != [head, baseline]:
              raise RuntimeError('Reader must have the exact baseline as sole parent')
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '--no-renames', baseline, head], text=True).splitlines())
          if changed != set(source['files']) | {source_path}:
              raise RuntimeError('Unexpected read-only source boundary')
          verified = {}
          for name, expected in source['files'].items():
              pure = PurePosixPath(name)
              if str(pure) != name or pure.is_absolute() or '..' in pure.parts or '\\' in name:
                  raise RuntimeError('Unsafe source binding')
              path = Path(name)
              if path.is_symlink() or not path.is_file():
                  raise RuntimeError('Expected regular reader source')
              data = path.read_bytes()
              identity = {
                  'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                  'gitBlob': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest(),
              }
              if identity != expected:
                  raise RuntimeError('Read-only source differs: ' + name)
              committed = subprocess.check_output(['git', 'show', head + ':' + name])
              if data != committed:
                  raise RuntimeError('Working source differs: ' + name)
              verified[name] = identity
          for name in sorted(set(source['files']) | {source_path}):
              target = output / 'source-snapshot' / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(name, target)
          receipt = {'passed': True, 'headSha': head, 'parent': baseline, 'files': verified,
                     'sourceBindingSha256': hashlib.sha256(Path(source_path).read_bytes()).hexdigest(),
                     'performanceMeasurements': False}
          (output / 'reader-source.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          (output / 'setup-request.json').write_text(json.dumps({
              'runnerOs': os.environ.get('RUNNER_OS'), 'runnerArch': os.environ.get('RUNNER_ARCH'),
              'requestedPython': '3.12.10', 'requestedArchitecture': 'arm64',
              'performanceMeasurements': False}, indent=2) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          PY
      - name: Set up the supported records-only Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: arm64
      - name: Verify the pure archive and receipt reader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, platform, sys
          from pathlib import Path
          if sys.version_info[:3] != (3, 12, 10) or sys.flags.optimize or platform.machine() != 'arm64':
              raise RuntimeError('Unexpected records-only Python/architecture')
          Path('builds/perf/native-fields-correctness-original-audit/python.json').write_text(
              json.dumps({'version': sys.version, 'machine': platform.machine(),
                          'performanceMeasurements': False}, indent=2) + '\n')
          PY
          python dev/perf/native-record-fields-correctness-audit-20261128-1c413/test-audit.py \
            2>&1 | tee builds/perf/native-fields-correctness-original-audit/reader-tests.log
      - name: Audit only the exact two completed original artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python dev/perf/native-record-fields-correctness-audit-20261128-1c413/audit.py \
            --manifest dev/perf/native-record-fields-correctness-audit-20261128-1c413/manifest.json \
            --output builds/perf/native-fields-correctness-original-audit/originals \
            2>&1 | tee builds/perf/native-fields-correctness-original-audit/full-result.log
      - name: Preserve original archives, every reader outcome and exact source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-fields-original-correctness-audit-${{ github.sha }}
          path: |
            builds/perf/native-fields-correctness-original-audit
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
