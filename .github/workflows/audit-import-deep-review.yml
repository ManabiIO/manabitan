name: Import deep-review checkout
on:
  push:
    branches: [audit/import-deep-review-20260924-b6c2]
    paths: [.github/workflows/audit-import-deep-review.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2185eeaac05efa0fd60eea49e3f00ce3e048aabe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Package public source and installed dependencies
        run: |
          git rev-parse HEAD > REVIEW_BASE_SHA
          tar --exclude=.git --exclude=builds -czf "$RUNNER_TEMP/manabitan-review-checkout.tar.gz" .
          sha256sum "$RUNNER_TEMP/manabitan-review-checkout.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: manabitan-review-checkout
          path: ${{ runner.temp }}/manabitan-review-checkout.tar.gz
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
