# One-shot qualification workflow; removed after a successful red-green run.
name: Apply main final reliability fixes

on:
  push:
    branches:
      - fix/runtime-reliability-main-20260914
    paths:
      - .github/workflows/apply-main-final-reliability-fixes.yml
      - dev/apply-main-final-reliability-fixes.py

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-reliability-main-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Confirm new product regressions are red before source fixes
        shell: bash
        run: |
          set +e
          npx vitest run test/offscreen-proxy-bridge.test.js test/dictionary-controller-task-resolution.test.js 2>&1 | tee /tmp/main-final-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected product regression tests to fail before source fixes.'
            exit 1
          fi
          grep -q 'offscreen-proxy-bridge.test.js' /tmp/main-final-red.log
          grep -q 'dictionary-controller-task-resolution.test.js' /tmp/main-final-red.log
      - name: Apply source fixes
        run: python dev/apply-main-final-reliability-fixes.py
      - name: Confirm targeted regression and adjacent suites are green
        run: >-
          npx vitest run
          test/runtime-reliability-regressions.test.js
          test/offscreen-proxy.test.js
          test/offscreen-proxy-bridge.test.js
          test/backend-lookup-refresh.test.js
          test/dictionary-controller-task-resolution.test.js
          test/dictionary-import-controller-update-profile.test.js
          test/dictionary-importer-zip-filename-alias.test.js
      - name: Run full unit suite
        run: npm run test:unit
      - name: Syntax-check changed runtime sources
        run: >-
          node --check ext/js/background/backend.js &&
          node --check ext/js/background/offscreen-proxy.js &&
          node --check ext/js/pages/settings/dictionary-controller.js
      - name: Build Chromium development extension
        run: node ./dev/bin/build.js --target chrome-dev
      - name: Commit fixes and remove one-shot files
        run: |
          rm .github/workflows/apply-main-final-reliability-fixes.yml
          rm dev/apply-main-final-reliability-fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ext/js/background/offscreen-proxy.js \
            ext/js/pages/settings/dictionary-controller.js \
            test/offscreen-proxy-bridge.test.js \
            test/dictionary-import-controller-update-profile.test.js \
            test/dictionary-importer-zip-filename-alias.test.js \
            .github/workflows/apply-main-final-reliability-fixes.yml \
            dev/apply-main-final-reliability-fixes.py
          git commit -m 'Finish main runtime reliability qualification'
          git push origin HEAD:fix/runtime-reliability-main-20260914
