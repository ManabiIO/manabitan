name: String-prefix independent import confirmation
on:
  push:
    branches: [verify/import-round8-20260916]
    paths: [.github/workflows/import-round8-prefix-confirm-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0e49ac2cec77962d5a2fb042a4b1a75acb88bae3
          persist-credentials: false
      - name: Pin unchanged source and comparison protocol
        run: |
          mkdir -p "$RUNNER_TEMP/round8-review"
          cp dev/perf/round8-20260916/apply-more.py "$RUNNER_TEMP/round8-review/apply.py"
          git fetch --depth=1 origin ef53e3bb8d7acaa645dba562cc818c4b35fe94bb
          git show FETCH_HEAD:dev/perf/round6-20260916/screen.py > "$RUNNER_TEMP/round8-review/screen.py"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'round8-review/screen.py'
          s = p.read_text()
          old = "assert variant in ('word-jump', 'simd-jump', 'inflight-bounds')"
          assert s.count(old) == 1
          s = s.replace(old, "assert variant == 'string-prefix'")
          s = s.replace('round6', 'round8').replace('round-six', 'round-eight')
          marker = "identities = {arm: identity(directory) for arm, directory in roots.items()}"
          s = s.replace(marker, marker + "\n(output / 'sizes.json').write_text(json.dumps({arm: {'wasmBytes': (directory / 'ext/lib/term-bank-parser.wasm').stat().st_size, 'packageBytes': (directory / package).stat().st_size} for arm, directory in roots.items()}, indent=2))")
          p.write_text(s)
          PY
          git fetch --depth=1 origin b4094a423c20bb0ed424d944238f922c1b36559c
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify complete locked fixtures
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Twelve reversed-order pairs and six interleaved AA controls
        env:
          CANDIDATE: string-prefix
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: |
          mkdir -p builds/round8
          python3 "$RUNNER_TEMP/round8-review/screen.py" 2>&1 | tee builds/round8/driver.log
      - name: Preserve exact inputs and failure evidence
        if: always()
        run: |
          mkdir -p builds/round8/driver-inputs
          cp "$RUNNER_TEMP/round8-review/"*.py builds/round8/driver-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round8-prefix-confirm-${{ matrix.dictionary }}
          path: builds/round8
          retention-days: 30
