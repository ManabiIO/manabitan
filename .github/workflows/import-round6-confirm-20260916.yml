name: First-special scanner independent confirmation
on:
  push:
    branches: [verify/import-round6-20260916]
    paths: [.github/workflows/import-round6-confirm-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        comparison: [production, simd-vs-word]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5ad1ae5069fb9758e61434fdf5b6cf84780ccd4a
          persist-credentials: false
      - name: Preserve fixed comparison protocol and source
        env:
          COMPARISON: ${{ matrix.comparison }}
        run: |
          cp -a dev/perf/round6-20260916 "$RUNNER_TEMP/round6-review"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'round6-review/screen.py'
          s = p.read_text()
          s = s.replace("{'baseline': BASE, 'candidate': variant, 'dictionary': dictionary,", "{'baseline': BASE, 'candidate': variant, 'dictionary': dictionary, 'comparison': os.environ['COMPARISON'],")
          if os.environ['COMPARISON'] == 'simd-vs-word':
              before = "logrun(['node', 'dev/bin/build.js', '--target', 'chrome-dev'], 'base-build.log')"
              insert = """# A is the alternative SIMD source, not production; B stays scalar word-jump.
          run(['python3', str(inputs / 'apply.py'), 'simd-jump'])
          run(['git', 'add', str(source)])
          run(['git', '-c', 'core.hooksPath=/dev/null', '-c', 'user.name=Comparison control', '-c',
              'user.email=control@manabi.io', 'commit', '-m', 'Local SIMD comparison arm'])
          """
              assert s.count(before) == 1
              s = s.replace(before, insert + before)
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round6-review/"*.py
          git fetch --depth=1 origin b4094a423c20bb0ed424d944238f922c1b36559c
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Fixed reversed-order cohorts with interleaved AA controls
        env:
          CANDIDATE: word-jump
          COMPARISON: ${{ matrix.comparison }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: ${{ matrix.comparison == 'production' && '12' || '6' }}
          INITIAL_ORDER: BA
        run: |
          mkdir -p builds/round6
          python3 "$RUNNER_TEMP/round6-review/screen.py" 2>&1 | tee builds/round6/driver.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round6-confirm-${{ matrix.comparison }}-${{ matrix.dictionary }}
          path: builds/round6
          retention-days: 30
