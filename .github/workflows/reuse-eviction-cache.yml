name: Reuse-gated cache eviction comparison
on:
  push:
    branches: [verify/reuse-eviction-cache-20260910]
    paths:
      - .github/workflows/reuse-eviction-cache.yml
      - dev/perf/reuse-eviction-cache/**
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jmnedict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Frozen source and package-checked whole-import comparison
        shell: bash
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/arms"
          echo '5308eeb4edfa0b576b859935cf3f3754b7271b27819a9d6336a3f052eff4cf3d  dev/perf/reuse-eviction-cache/source.patch' | sha256sum -c -
          cp dev/perf/reuse-eviction-cache/source.patch "$RUNNER_TEMP/evidence/source.patch"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('dev/perf/stable-word-copy/paired.py').read_text()
          for old, new in [
              ('8385544b3e978ea4c3140d78a27c1e31118392f4', '788a2b70120304d53cdb850cc870befee7e0e71e'),
              ("{'js/core/copy-stable-bytes.js'}", 'set()'),
              (", 'dedupRecentSourceCacheBytes'", ''),
          ]:
              assert text.count(old) == 1
              text = text.replace(old, new)
          Path(os.environ['RUNNER_TEMP'], 'evidence', 'paired.py').write_text(text)
          PY
          for arm in A B; do
            git worktree add --detach "$RUNNER_TEMP/arms/$arm" d5dd9cb0072059b326f333ef425018ce1227a756
          done
          git -C "$RUNNER_TEMP/arms/B" apply --index "$RUNNER_TEMP/evidence/source.patch"
          test "$(git -C "$RUNNER_TEMP/arms/B" write-tree)" = 788a2b70120304d53cdb850cc870befee7e0e71e
          git -C "$RUNNER_TEMP/arms/B" -c core.hooksPath=/dev/null -c user.name='Manabitan verification' -c user.email='verification@users.noreply.github.com' commit -m 'perf(import): retain warm cache without copying low-reuse eviction candidates'
          git -C "$RUNNER_TEMP/arms/B" rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/evidence/source.txt"
          git -C "$RUNNER_TEMP/arms/B" cat-file commit HEAD > "$RUNNER_TEMP/evidence/commit.txt"
          for arm in A B; do
            cp -al "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/arms/$arm/node_modules"
            (cd "$RUNNER_TEMP/arms/$arm" && node dev/bin/build-libs.js && node dev/bin/build.js --target chrome-dev) > "$RUNNER_TEMP/evidence/build-$arm.log" 2>&1
            test -z "$(git -C "$RUNNER_TEMP/arms/$arm" status --porcelain)"
          done
          node node_modules/playwright/cli.js install --with-deps chromium
          (cd "$RUNNER_TEMP/arms/A" && node dev/perf/prepare-dictionaries.js) > "$RUNNER_TEMP/evidence/fixtures.log" 2>&1
          ln -s "$RUNNER_TEMP/arms/A/builds/e2e-dictionary-cache" "$RUNNER_TEMP/arms/B/builds/e2e-dictionary-cache"
          node --version > "$RUNNER_TEMP/evidence/node.txt"
          clang --version > "$RUNNER_TEMP/evidence/compiler.txt"
          lscpu > "$RUNNER_TEMP/evidence/cpu.txt"
          free -b > "$RUNNER_TEMP/evidence/memory.txt"
          python3 "$RUNNER_TEMP/evidence/paired.py" --baseline "$RUNNER_TEMP/arms/A" --candidate "$RUNNER_TEMP/arms/B" --dictionary "$DICTIONARY" --pairs 6 --reverse --output "$RUNNER_TEMP/evidence/paired" 2>&1 | tee "$RUNNER_TEMP/evidence/driver.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reuse-eviction-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
