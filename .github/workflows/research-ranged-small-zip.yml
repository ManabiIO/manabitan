name: Research Ranged Small ZIP Import AB

on:
  push:
    branches:
      - research/ranged-small-zip-jitendex-20260930

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          path: candidate

      - name: Checkout baseline
        uses: actions/checkout@v6
        with:
          ref: d6ce1fd85ffa7ff5eb97d97c85cd443c44ade741
          path: baseline

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install dependencies and libraries
        working-directory: candidate
        run: |
          npm ci
          npm run build:libs

      - name: Reuse dependencies and build baseline libraries
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/candidate/node_modules" "$GITHUB_WORKSPACE/baseline/node_modules"
          (cd baseline && npm run build:libs)

      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install chromium

      - name: Prepare verified dictionaries
        working-directory: candidate
        run: node ./dev/perf/prepare-dictionaries.js

      - name: Share dictionary cache
        shell: bash
        run: |
          mkdir -p baseline/builds
          cp -a candidate/builds/e2e-dictionary-cache baseline/builds/

      - name: Build both extensions
        shell: bash
        run: |
          (cd baseline && node ./dev/bin/build.js --target chrome-dev)
          (cd candidate && node ./dev/bin/build.js --target chrome-dev)

      - name: Run Jitendex alternating pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/results"
          for pair in 1 2 3 4 5 6; do
            if (( pair % 2 == 1 )); then order="baseline candidate"; else order="candidate baseline"; fi
            for arm in $order; do
              out="$GITHUB_WORKSPACE/results/jitendex-pair${pair}-${arm}"
              (cd "$arm" && node ./dev/perf/import-benchmark.js jitendex --runs 1 --no-build --output "$out")
            done
          done

      - name: Run unchanged-path controls
        shell: bash
        run: |
          set -euo pipefail
          for dictionary in jmdict jmnedict; do
            for pair in 1 2 3 4; do
              if (( pair % 2 == 1 )); then order="baseline candidate"; else order="candidate baseline"; fi
              for arm in $order; do
                out="$GITHUB_WORKSPACE/results/${dictionary}-pair${pair}-${arm}"
                (cd "$arm" && node ./dev/perf/import-benchmark.js "$dictionary" --runs 1 --no-build --output "$out")
              done
            done
          done
          for pair in 1 2 3 4; do
            for sample in a b; do
              out="$GITHUB_WORKSPACE/results/jitendex-aa${pair}-${sample}"
              (cd baseline && node ./dev/perf/import-benchmark.js jitendex --runs 1 --no-build --output "$out")
            done
          done

      - name: Summarize
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs'
          import path from 'node:path'

          const root='results'
          const median=(xs)=>{const s=[...xs].sort((a,b)=>a-b); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2}
          const run=(name)=>JSON.parse(readFileSync(path.join(root,name,'summary.json'),'utf8')).runs[0]
          const sourceRead=(r)=>{
            const phases=r.importDebug?.importerPhaseTimings
            if(!Array.isArray(phases)) return null
            const p=phases.find((x)=>typeof x?.phase==='string' && x.phase.startsWith('term-file-fast-path:'))
            return typeof p?.details?.sourceArchiveReadMs==='number'?p.details.sourceArchiveReadMs:null
          }
          const workerWall=(r)=>{
            const phases=r.importDebug?.importerPhaseTimings
            if(!Array.isArray(phases)) return null
            const p=phases.find((x)=>typeof x?.phase==='string' && x.phase.startsWith('term-file-fast-path:'))
            return typeof p?.details?.parserParallelWorkerWallMs==='number'?p.details.parserParallelWorkerWallMs:null
          }
          const compare=(dictionary,pairs)=>{
            const rows=[]
            for(let pair=1;pair<=pairs;++pair){
              const a=run(`${dictionary}-pair${pair}-baseline`)
              const b=run(`${dictionary}-pair${pair}-candidate`)
              const as=sourceRead(a), bs=sourceRead(b)
              const aw=workerWall(a), bw=workerWall(b)
              rows.push({
                pair,
                baselineMs:a.totalImportMs,
                candidateMs:b.totalImportMs,
                changePct:(b.totalImportMs/a.totalImportMs-1)*100,
                sourceReadBaselineMs:as,
                sourceReadCandidateMs:bs,
                sourceReadChangePct:as!==null&&bs!==null?(bs/as-1)*100:null,
                workerWallBaselineMs:aw,
                workerWallCandidateMs:bw,
                workerWallChangePct:aw!==null&&bw!==null?(bw/aw-1)*100:null,
              })
            }
            return {
              pairs:rows,
              pairedMedianChangePct:median(rows.map(x=>x.changePct)),
              fasterPairs:rows.filter(x=>x.candidateMs<x.baselineMs).length,
              sourceReadPairedMedianChangePct:median(rows.flatMap(x=>x.sourceReadChangePct===null?[]:[x.sourceReadChangePct])),
              workerWallPairedMedianChangePct:median(rows.flatMap(x=>x.workerWallChangePct===null?[]:[x.workerWallChangePct])),
            }
          }
          const aa=[]
          for(let pair=1;pair<=4;++pair){
            const a=run(`jitendex-aa${pair}-a`).totalImportMs
            const b=run(`jitendex-aa${pair}-b`).totalImportMs
            const pct=(b/a-1)*100
            aa.push({pair,aMs:a,bMs:b,changePct:pct,absoluteChangePct:Math.abs(pct)})
          }
          const result={
            schemaVersion:1,
            candidate:process.env.GITHUB_SHA,
            baseline:'d6ce1fd85ffa7ff5eb97d97c85cd443c44ade741',
            jitendex:compare('jitendex',6),
            jmdict:compare('jmdict',4),
            jmnedict:compare('jmnedict',4),
            jitendexAA:{pairs:aa,medianAbsoluteChangePct:median(aa.map(x=>x.absoluteChangePct)),maxAbsoluteChangePct:Math.max(...aa.map(x=>x.absoluteChangePct))},
          }
          const out=JSON.stringify(result,null,2)
          writeFileSync(path.join(root,'summary.json'),out)
          console.log(out)
          NODE

      - uses: actions/upload-artifact@v6
        with:
          name: ranged-small-zip-import-ab
          path: results
          compression-level: 6
          retention-days: 7
