name: Verify single-probe canonical reservations

on:
  push:
    branches: [perf-reserve-first-verify-20260908]
    paths:
      - .github/workflows/reserve-first-verification.yml
      - dev/perf/reserve-first-experiment/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Prepare isolated source arms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arms" "$RUNNER_TEMP/evidence"
          for arm in baseline candidate; do
            git worktree add --detach "$RUNNER_TEMP/arms/$arm" 394d8eb799dd1eb5e194cee11472a4beab915080
            ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/arms/$arm/node_modules"
          done
          git -C "$RUNNER_TEMP/arms/candidate" apply --index "$GITHUB_WORKSPACE/dev/perf/reserve-first-experiment/reserve.patch"
          cp dev/perf/reserve-first-experiment/dictionary-database-reserve-first.test.js "$RUNNER_TEMP/arms/candidate/test/"
          git -C "$RUNNER_TEMP/arms/candidate" add test/dictionary-database-reserve-first.test.js
          git -C "$RUNNER_TEMP/arms/candidate" apply --index "$GITHUB_WORKSPACE/dev/perf/reserve-first-experiment/fixture-fix.patch"
          test "$(git -C "$RUNNER_TEMP/arms/candidate" write-tree)" = 19c99a67891054a1fb86654f5acf9633a341e502
          for arm in baseline candidate; do
            (cd "$RUNNER_TEMP/arms/$arm" && node dev/bin/build.js --target chrome-dev) > "$RUNNER_TEMP/evidence/build-$arm.log" 2>&1
            git -C "$RUNNER_TEMP/arms/$arm" diff HEAD --binary > "$RUNNER_TEMP/evidence/source-$arm.patch"
          done
          for file in term-bank-parser.wasm zstd.wasm zip.js z-worker.js; do
            cmp "$RUNNER_TEMP/arms/baseline/ext/lib/$file" "$RUNNER_TEMP/arms/candidate/ext/lib/$file"
          done
          (cd "$RUNNER_TEMP/arms/baseline" && node dev/perf/prepare-dictionaries.js) > "$RUNNER_TEMP/evidence/fixtures.log" 2>&1
          ln -s "$RUNNER_TEMP/arms/baseline/builds/e2e-dictionary-cache" "$RUNNER_TEMP/arms/candidate/builds/e2e-dictionary-cache"
          cp dev/perf/reserve-first-experiment/run-paired.py "$RUNNER_TEMP/evidence/"
          clang --version > "$RUNNER_TEMP/evidence/compiler.txt"
          lscpu > "$RUNNER_TEMP/evidence/cpu.txt"
      - name: Full unit, options and type checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
          npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
      - name: Eight paired full imports per dictionary
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/perf/reserve-first-experiment/run-paired.py \
            --baseline "$RUNNER_TEMP/arms/baseline" --candidate "$RUNNER_TEMP/arms/candidate" \
            --pairs 8 --warmups 1 --output "$RUNNER_TEMP/evidence/paired" \
            --label 'PR20 vs reserve-first dedup, fixed eight pairs' | tee "$RUNNER_TEMP/evidence/driver.log"
      - name: Strict full Chromium E2E
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          MANABITAN_E2E_STRICT_RUNTIME=1 MANABITAN_CHROMIUM_HEADLESS=1 MANABITAN_E2E_SKIP_BUILD=1 MANABITAN_CHROMIUM_E2E_REPORT="$RUNNER_TEMP/evidence/full-chromium.html" node test/chromium/extension-two-dictionary-import.e2e.js > "$RUNNER_TEMP/evidence/full-chromium.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reserve-first-verification
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
