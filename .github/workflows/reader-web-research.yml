name: Reader web qualification research
on:
  push:
    branches: [research/reader-web-qualification-20260917]
permissions:
  contents: read
concurrency:
  group: reader-web-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reader-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ttu-ttu/ebook-reader
          ref: 301aef4957c3cb22162276b11f4a47b35533faae
          path: reader
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact upstream package manager
        run: npm install --global pnpm@12.3.4
      - name: Audit and qualify baseline without rewriting its lockfile
        working-directory: reader
        shell: bash
        run: |
          mkdir -p ../evidence
          node --version > ../evidence/node.txt
          pnpm --version > ../evidence/pnpm.txt
          git rev-parse HEAD > ../evidence/reader-head.txt
          python3 - <<'PY'
          import json, pathlib, subprocess
          out = pathlib.Path('../evidence')
          commands = {
              'install': ['pnpm', 'install', '--frozen-lockfile', '--ignore-scripts'],
              'audit': ['pnpm', 'audit', '--json'],
              'sync': ['pnpm', '--dir', 'apps/web', 'exec', 'svelte-kit', 'sync'],
              'types': ['pnpm', '--dir', 'apps/web', 'exec', 'svelte-check', '--tsconfig', './tsconfig.json'],
              'build': ['pnpm', 'build'],
              'lint': ['pnpm', 'exec', 'eslint', '.'],
          }
          receipts = {}
          for name, command in commands.items():
              try:
                  result = subprocess.run(command, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=420)
                  (out / (name + '.log')).write_text(result.stdout)
                  receipts[name] = {'command': command, 'exitCode': result.returncode}
              except subprocess.TimeoutExpired as error:
                  (out / (name + '.log')).write_text(str(error.stdout))
                  receipts[name] = {'command': command, 'timeout': True}
              (out / 'results.json').write_text(json.dumps(receipts, indent=2) + '\n')
          subprocess.run(['git', 'diff', '--exit-code'], check=True)
          PY
      - name: Record current compatible package and advisory inputs
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          for p in dompurify svelte vite @sveltejs/kit @sveltejs/vite-plugin-svelte @zip.js/zip.js ua-parser-js; do
            npm view "$p" version engines peerDependencies license --json >> evidence/registry.jsonl
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-baseline-qualification
          path: evidence/
          retention-days: 14
          if-no-files-found: error
