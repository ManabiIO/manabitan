name: Reader web qualification research
on:
  push:
    branches: [research/reader-web-qualification-20260917]
permissions:
  contents: read
concurrency:
  group: reader-web-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          path: recipe
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: e6f85c1fb8fec871eef76363ac0ba3c59aff78f7
          path: work
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install and build pinned baseline libraries
        working-directory: work
        run: |
          npm ci
          npm run build:libs
      - name: Repair only the two rejected test-style declarations in the research generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('recipe/dev/reader-web-research/prepare-assets.py')
          s = p.read_text().replace('vi.fn(function ()', 'vi.fn(function createWorker()')
          s = s.replace('/** @param {string} name @param {(event: MessageEvent) => void} listener */', '/**\n             * @param {string} name\n             * @param {(event: MessageEvent) => void} listener\n             */')
          p.write_text(s)
          PY
      - name: Reproduce resource failures before fixing them
        working-directory: work
        shell: bash
        run: |
          mkdir -p ../evidence
          python3 ../recipe/dev/reader-web-research/prepare-assets.py . --tests-only
          set +e
          npx vitest run test/web-asset-paths.test.js > ../evidence/assets-red.log 2>&1
          status=$?
          set -e
          echo "$status" > ../evidence/assets-red-exit.txt
          test "$status" -ne 0
      - name: Apply and qualify the production correction
        working-directory: work
        shell: bash
        run: |
          python3 ../recipe/dev/reader-web-research/prepare-assets.py .
          npx eslint --fix ext/js/dictionary/dictionary-database.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/dictionary-worker.js ext/js/dictionary/zstd-term-content.js ext/js/display/display-generator.js test/mdx-client.test.js test/web-asset-paths.test.js > ../evidence/assets-lint.log 2>&1
          npx vitest run test/web-asset-paths.test.js test/mdx-client.test.js > ../evidence/assets-green.log 2>&1
          npm run test:ts:main > ../evidence/assets-types.log 2>&1
          npm run test:build > ../evidence/assets-build-plans.log 2>&1
          npm run build -- --target chrome-dev > ../evidence/assets-chrome-build.log 2>&1
      - name: Publish only qualified source and tests to a clean feature branch
        working-directory: work
        shell: bash
        run: |
          git config user.name 'Manabi contributors'
          git config user.email 'contributors@manabi.io'
          git add ext/js/dictionary/dictionary-database.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/dictionary-worker.js ext/js/dictionary/zstd-term-content.js ext/js/display/display-generator.js test/mdx-client.test.js test/web-asset-paths.test.js
          git -c core.hooksPath=/dev/null commit -m 'fix: resolve shared dictionary assets relative to their modules'
          git push origin HEAD:refs/heads/feat/reader-web-portable-assets-20260917
          git rev-parse HEAD > ../evidence/published-head.txt
          git diff e6f85c1fb8fec871eef76363ac0ba3c59aff78f7 HEAD > ../evidence/portable-assets.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-web-portable-assets-qualification
          path: evidence/
          retention-days: 14
          if-no-files-found: error
