name: Import storage pass workspace
on:
  push:
    branches: [verify/import-storage-pass-20260909-2250]
    paths: [.github/workflows/import-storage-pass.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 03478be25506176610b2133be658ee697d9bb3f1
          fetch-depth: 0
          persist-credentials: false
      - name: Export identified history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          git branch export-pr31 03478be25506176610b2133be658ee697d9bb3f1
          git bundle create "$RUNNER_TEMP/source/pr31.bundle" export-pr31
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          sha256sum package-lock.json > "$RUNNER_TEMP/source/package-lock.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: import-storage-source
          path: ${{ runner.temp }}/source/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
