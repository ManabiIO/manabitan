name: Import memory comparison 20261122

on:
  push:
    branches: [perf/import-qualification-20261122-71149a]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_BASELINE_SHA: 5e1f8c12f7ff798ba407323aff675cb23b22af02
      PERF_CANDIDATE_SHA: f8dae7026d57488d4097caba942783bc1bbef6d4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: import-memory-20261122-${{ matrix.dictionary }}-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Compare complete imports and restart readback
        run: python3 dev/perf/import-memory-study-20261122/run.py
      - name: Preserve every observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-memory-20261122-${{ matrix.dictionary }}
          path: builds/import-memory-study
          if-no-files-found: error
          retention-days: 30
