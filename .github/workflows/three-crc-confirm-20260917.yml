name: Three dictionary isolated CRC confirmation
on:
  push:
    branches: [verify/three-crc-20260917]
    paths: [.github/workflows/three-crc-confirm-20260917.yml]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51c06f03da22a416d331a9c72bf76f8435666f50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Isolate only the 32-byte CRC candidate
        run: |
          mkdir -p "$RUNNER_TEMP/crc-tools" builds/crc-qualification
          git fetch --depth=1 origin 6d398150af8615284bef5ef10a0470b39a0e80d4
          for file in prepare.py qualify.py test-crc.js setup-harness.py; do
            git show "FETCH_HEAD:dev/perf/crc-round-20260917/$file" > "$RUNNER_TEMP/crc-tools/$file"
          done
          python3 "$RUNNER_TEMP/crc-tools/prepare.py" slice32
          python3 "$RUNNER_TEMP/crc-tools/qualify.py" slice32
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 builds/crc-qualification/crc-sanitizer > builds/crc-qualification/sanitizer.log 2>&1
          git diff --check
      - run: npm ci
      - name: Freeze exact source and run the complete qualification suite
        run: |
          npm run build:libs > builds/crc-qualification/lint-dependencies.log 2>&1
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          import {spawnSync} from 'node:child_process'
          import * as espree from 'espree'
          const files=['ext/js/dictionary/term-bank-wasm-parser.js','ext/js/dictionary/term-bank-experiments.js','test/term-bank-crc.test.js']
          const ast=p=>JSON.stringify(espree.parse(fs.readFileSync(p,'utf8'),{ecmaVersion:'latest',sourceType:'module'}),(key,value)=>['start','end','raw'].includes(key)?undefined:value)
          const before=files.map(ast)
          const result=spawnSync(process.execPath,['node_modules/eslint/bin/eslint.js','--fix',...files],{encoding:'utf8'})
          fs.writeFileSync('builds/crc-qualification/changed-lint.log',result.stdout+result.stderr)
          assert.equal(result.status,0)
          assert.deepEqual(files.map(ast),before)
          JS
          npm run build:libs > builds/crc-qualification/libs.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-crc.test.js test/term-bank-experiments.test.js test/term-bank-inflater.test.js test/term-bank-inflate-matches.test.js test/term-bank-join-boundaries.test.js > builds/crc-qualification/focused.log 2>&1
          npm run test:unit > builds/crc-qualification/unit.log 2>&1
          npm run test:unit:options > builds/crc-qualification/options.log 2>&1
          npm run test:ts > builds/crc-qualification/types.log 2>&1
          npm run test:build > builds/crc-qualification/build-plans.log 2>&1
          sha256sum ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/wasm/term-bank-parser.c types/ext/dictionary-importer.d.ts test/term-bank-crc.test.js ext/lib/term-bank-parser.wasm > builds/crc-qualification/qualified-inputs.sha256
          git add -N test/term-bank-crc.test.js
          git diff HEAD -- ext/js types/ext test/term-bank-crc.test.js > builds/crc-qualification/product.patch
          node dev/bin/build.js --target chrome-dev > builds/crc-qualification/chrome-build.log 2>&1
          node dev/bin/build.js --target firefox-dev > builds/crc-qualification/firefox-build.log 2>&1
          cp "$RUNNER_TEMP/crc-tools/setup-harness.py" builds/crc-qualification/
          cp ext/lib/term-bank-parser.wasm builds/crc-qualification/
          echo QUALIFIED > builds/crc-qualification/complete.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crc-qualified-source
          path: builds/crc-qualification
          retention-days: 30
  confirm:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
        backend: ['miniz', 'libdeflate']
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/crc-confirm
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51c06f03da22a416d331a9c72bf76f8435666f50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: crc-qualified-source
          path: ${{ runner.temp }}/qualified
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35175334044
          name: three-inflate-confirm-jitendex
          path: ${{ runner.temp }}/prior
      - name: Apply only the qualified patch and fixed-plan driver
        run: |
          mkdir -p builds/crc-confirm
          test "$(cat "$RUNNER_TEMP/qualified/complete.txt")" = QUALIFIED
          git apply --check "$RUNNER_TEMP/qualified/product.patch"
          git apply "$RUNNER_TEMP/qualified/product.patch"
          python3 "$RUNNER_TEMP/qualified/setup-harness.py" "$RUNNER_TEMP/prior/source/inflate-abba.mjs"
      - run: npm ci
      - name: Rebuild exact executable and common fixture harness
        run: |
          npm run build:libs > builds/crc-confirm/libs.log 2>&1
          sha256sum -c "$RUNNER_TEMP/qualified/qualified-inputs.sha256"
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          p=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=p.read_text(); assert s.count('maxBuffer: 32 * 1024 * 1024')==2
          p.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Build actual Chromium extension with complete pinned dictionaries
        run: |
          python3 "$RUNNER_TEMP/fixture.py" > builds/crc-confirm/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/crc-confirm/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Six-block same-build ABBA and interleaved A/A
        run: |
          if [ "$BACKEND" = libdeflate ]; then export CRC_WITH_LIBDEFLATE=1; fi
          node "$RUNNER_TEMP/prior/source/crc-abba.mjs" slice32,control 6 | tee builds/crc-confirm/abba.log
          sha256sum -c "$RUNNER_TEMP/qualified/qualified-inputs.sha256"
          echo COMPLETE > builds/crc-confirm/complete.txt
      - name: Retain every observation and source identity
        if: always()
        run: |
          mkdir -p builds/crc-confirm/source
          cp "$RUNNER_TEMP/qualified/product.patch" "$RUNNER_TEMP/qualified/qualified-inputs.sha256" builds/crc-confirm/ 2>/dev/null || true
          cp "$RUNNER_TEMP/prior/source/crc-abba.mjs" builds/crc-confirm/source/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crc-confirm-${{ matrix.dictionary }}-${{ matrix.backend }}
          path: builds/crc-confirm
          retention-days: 30
