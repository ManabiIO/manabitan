      - name: Freeze identities and recover exact portable runner
        id: identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/perf/source-ack-hosted/verification builds/perf/source-ack-hosted/runner
          python3 - <<'PYCODE'
          import base64, gzip, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          evidence = root / 'builds/perf/source-ack-hosted'
          mapping = json.loads(r'''{"base":{"local":"9e10d3b3fcf66d344ab31bc42c9b522fa5215da2","remote":"9e10d3b3fcf66d344ab31bc42c9b522fa5215da2"},"atomic":{"local":"855e9438753c676ad31cf9c1a4c7355e12de92bd","remote":"0f342dfc386ba6ed08acc1b7a953ea168cdc5bfc","runtimeAndTests":{"ext/js/dictionary/zstd-term-content-compression-worker.js":{"bytes":7359,"sha256":"22e44f9472a34e835c66385f43eeb8b8bac8872de808fca091b92d93335121bc"},"ext/js/dictionary/zstd-term-content.js":{"bytes":44922,"sha256":"c361496f51f7eb7298f3c5f1a5a68afb4e2dd72c68a0b5a27e2223114fb8cf7f"},"test/zstd-compression-worker-context.test.js":{"bytes":14135,"sha256":"e40da9f2462319812b697648e1c7210f6ba4cc9dc70a665929f4b2a821fd5914"},"test/zstd-term-content-batch-claim.test.js":{"bytes":9472,"sha256":"6d8fddc27f4f96eef9f1b829254be580285e69b4d31e7ed972c33ff99ebed927"},"test/zstd-term-content-packed-dispatch.test.js":{"bytes":18841,"sha256":"23c522e5d75c7ddffadc5a944fe7b1d8de3b691ec41cedd35e89823293c9b395"},"test/zstd-term-content-pool.test.js":{"bytes":12537,"sha256":"2747b3c54daa206c9c9be2759ba1d645575a6550d0c7498ef144581882ce2948"}},"onlyIgnoredStudyFile":".github/workflows/import-worker-claim-92c09.yml","ignoredStudyFileSha256":"ac3fff4da8bd9f16669b3300087923e99c5cf15fb51a7c3532dd0320e5412b1e"},"ack":{"local":"d7449ebecd6f9424bd6f4112a2e83497c313aa33","remote":"2729a4784e6eb897fdc7a7426ac82e5c4d9329ac","runtimeAndTests":{"ext/js/dictionary/zstd-term-content-compression-worker.js":{"bytes":8907,"sha256":"579811b5f3a578e2b3c6b3ec0de3733f8af918ec83eeb7e1120718e2c4c90703"},"ext/js/dictionary/zstd-term-content.js":{"bytes":47777,"sha256":"a3a548c2476e7ad608fcc436342165d1c5d39f1dd215c52017697c9fdf8b2b28"},"test/zstd-compression-worker-context.test.js":{"bytes":20539,"sha256":"727811aba839ad7a730b50dc45b74ca5878bc8671f1979b3f5a12f34a25da22e"},"test/zstd-term-content-batch-claim.test.js":{"bytes":17893,"sha256":"f9485d9b18de55026e4cdd8679a4740d8ebcb145fce8878581cb83d9f86a47da"},"test/zstd-term-content-packed-dispatch.test.js":{"bytes":19138,"sha256":"6d226f51120c1882575f3da67df534ef0f98d7528385deaf3664ecf094287101"},"test/zstd-term-content-pool.test.js":{"bytes":12537,"sha256":"2747b3c54daa206c9c9be2759ba1d645575a6550d0c7498ef144581882ce2948"}}},"localScreen":{"status":"incomplete; no performance claim","completedChildren":3,"killedChildren":1,"unattemptedChildren":14,"runnerSha256":"c6b28cce29a9e750933f29c4e2724c92ca81b64d650f42c97e3af8fa6f3c7986"},"portableRunnerSha256":"78afd084016e95e367c1c9eb1ec07e22acecc9ce18b5f8dc0d0a0d2e10ff821b","replication":"One independent fixed18-child hosted replication to resolve the concrete local SIGKILL during preparation. Do not pool with local observations or repeat adaptively."}''')
          expected_bundle = json.loads(r'''{"source-ack-screen.mjs":{"sha256":"78afd084016e95e367c1c9eb1ec07e22acecc9ce18b5f8dc0d0a0d2e10ff821b","bytes":23835},"worker-atomic.mjs":{"sha256":"4e488dc7a085526187233278318059a33274ca5d9f6560868d1f88bbb4d84df7","bytes":827},"source-ack-protocol-reference.json":{"sha256":"9b35556362c371c7212489075776c05ded9e8f65ea8ef7921840428de415ed43","bytes":220821}}''')
          encoded = (evidence / 'runner-bundle.b64').read_text()
          raw = json.loads(gzip.decompress(base64.b64decode(encoded)))
          assert set(raw) == set(expected_bundle)
          for name, encoded_file in raw.items():
              assert pathlib.Path(name).name == name
              data = base64.b64decode(encoded_file)
              expected = expected_bundle[name]
              assert len(data) == expected['bytes'] and hashlib.sha256(data).hexdigest() == expected['sha256'], name
              (evidence / 'runner' / name).write_bytes(data)
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def file_bytes(commit, name):
              return subprocess.check_output(['git', 'show', commit + ':' + name])
          baseline, atomic, candidate = (os.environ[key] for key in ['PERF_BASELINE', 'PERF_ATOMIC', 'PERF_CANDIDATE'])
          orchestration = os.environ['GITHUB_SHA']
          assert git('rev-parse', 'HEAD') == candidate
          assert mapping['base']['remote'] == baseline and mapping['atomic']['remote'] == atomic and mapping['ack']['remote'] == candidate
          expected_files = sorted(mapping['ack']['runtimeAndTests'])
          candidate_files = git('diff', '--name-only', baseline, candidate).splitlines()
          atomic_files = git('diff', '--name-only', baseline, atomic).splitlines()
          ignored = mapping['atomic']['onlyIgnoredStudyFile']
          assert candidate_files == expected_files, candidate_files
          assert atomic_files == sorted(expected_files + [ignored]), atomic_files
          assert hashlib.sha256(file_bytes(atomic, ignored)).hexdigest() == mapping['atomic']['ignoredStudyFileSha256']
          assert git('diff', '--name-only', baseline, orchestration).splitlines() == [os.environ['PERF_WORKFLOW_PATH']]
          for label, commit in [('atomic', atomic), ('ack', candidate)]:
              for name, expected in mapping[label]['runtimeAndTests'].items():
                  data = file_bytes(commit, name)
                  assert len(data) == expected['bytes'] and hashlib.sha256(data).hexdigest() == expected['sha256'], (label, name)
          mapping['orchestration'] = {'commit': orchestration, 'workflow': os.environ['PERF_WORKFLOW_PATH'],
              'workflowSha256': hashlib.sha256(file_bytes(orchestration, os.environ['PERF_WORKFLOW_PATH'])).hexdigest(),
              'runId': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          mapping['expectedBundle'] = expected_bundle
          mapping['exactSourceDifferenceChecks'] = {'candidateFiles': candidate_files, 'atomicFiles': atomic_files}
          (evidence / 'source-identities.json').write_text(json.dumps(mapping, indent=2) + '\n')
          PYCODE
      - name: Standard pinned Node and dependency setup
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install supported native compiler for existing unit tests
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update 2>&1 | tee builds/perf/source-ack-hosted/verification/apt-update.log
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 2>&1 | tee builds/perf/source-ack-hosted/verification/toolchain.log
      - name: Full unit, type, scoped lint and all-target dry build gates
        id: verification
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee builds/perf/source-ack-hosted/verification/node-version.log
          npm run test:unit 2>&1 | tee builds/perf/source-ack-hosted/verification/unit.log
          npm run test:ts:main 2>&1 | tee builds/perf/source-ack-hosted/verification/types-main.log
          npm run test:ts:test 2>&1 | tee builds/perf/source-ack-hosted/verification/types-test.log
          mapfile -t changed_js < <(git diff --name-only --diff-filter=AM "$PERF_BASELINE" "$PERF_CANDIDATE" -- '*.js')
          test "${#changed_js[@]}" -eq 6
          npx eslint "${changed_js[@]}" 2>&1 | tee builds/perf/source-ack-hosted/verification/lint.log
          npm run test:build 2>&1 | tee builds/perf/source-ack-hosted/verification/build.log
          git diff --exit-code
      - name: Prepare unchanged parser and atomic baseline worktrees
        id: worktrees
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          evidence = root / 'builds/perf/source-ack-hosted'
          targets = {'baseline': pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-ack-baseline', 'atomic': pathlib.Path(os.environ['RUNNER_TEMP']) / 'source-ack-atomic'}
          for label, ref in [('baseline', os.environ['PERF_BASELINE']), ('atomic', os.environ['PERF_ATOMIC'])]:
              target = targets[label]
              with (evidence / ('prepare-' + label + '.log')).open('w') as log:
                  subprocess.run(['git', 'worktree', 'add', '--detach', str(target), ref], check=True, stdout=log, stderr=subprocess.STDOUT)
                  (target / 'node_modules').symlink_to(root / 'node_modules', target_is_directory=True)
                  subprocess.run(['npm', 'run', 'build:libs'], cwd=target, check=True, stdout=log, stderr=subprocess.STDOUT)
                  subprocess.run(['git', 'diff', '--exit-code'], cwd=target, check=True, stdout=log, stderr=subprocess.STDOUT)
          environment = {'MANABITAN_ACK_BASELINE_ROOT': str(targets['baseline']), 'MANABITAN_ACK_ATOMIC_ROOT': str(targets['atomic']),
              'MANABITAN_ACK_CANDIDATE_ROOT': str(root), 'MANABITAN_ACK_FIXTURE_ROOT': str(root / 'builds/e2e-dictionary-cache'),
              'MANABITAN_ACK_REFERENCE': str(evidence / 'runner/source-ack-protocol-reference.json')}
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key, value in environment.items():
                  assert '\n' not in value and '\r' not in value
                  stream.write(key + '=' + value + '\n')
          (evidence / 'resolved-environment.json').write_text(json.dumps(environment, indent=2) + '\n')
          PYCODE
      - name: Restore only the pinned JMdict fixture
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache/JMdict.zip
          key: source-ack-jmdict-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Verify the selected JMdict archive
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          node dev/perf/prepare-dictionaries.js jmdict 2>&1 | tee builds/perf/source-ack-hosted/fixture.log
      - name: Freeze preflight before the single hosted acquisition
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          node builds/perf/source-ack-hosted/runner/source-ack-screen.mjs prepare builds/perf/source-ack-hosted/cohort 2>&1 | tee builds/perf/source-ack-hosted/preflight.log
      - name: Run the frozen six-triplet component cohort once
        id: cohort
        shell: bash
        run: |
          set -euo pipefail
          node builds/perf/source-ack-hosted/runner/source-ack-screen.mjs run builds/perf/source-ack-hosted/cohort 2>&1 | tee builds/perf/source-ack-hosted/acquisition.log
      - name: Preserve the complete job status even after failure
        if: always()
        env:
          SOURCE_ACK_JOB_STATUS: ${{ job.status }}
          SOURCE_ACK_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SOURCE_ACK_IDENTITIES_OUTCOME: ${{ steps.identities.outcome }}
          SOURCE_ACK_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          SOURCE_ACK_TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          SOURCE_ACK_VERIFICATION_OUTCOME: ${{ steps.verification.outcome }}
          SOURCE_ACK_WORKTREES_OUTCOME: ${{ steps.worktrees.outcome }}
          SOURCE_ACK_FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
          SOURCE_ACK_PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SOURCE_ACK_COHORT_OUTCOME: ${{ steps.cohort.outcome }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib
          evidence = pathlib.Path('builds/perf/source-ack-hosted')
          evidence.mkdir(parents=True, exist_ok=True)
          report = {key: value for key, value in os.environ.items() if key.startswith('SOURCE_ACK_')}
          report['orchestrationSha'] = os.environ['GITHUB_SHA']
          report['runId'] = os.environ['GITHUB_RUN_ID']
          report['runAttempt'] = os.environ['GITHUB_RUN_ATTEMPT']
          (evidence / 'job-status.json').write_text(json.dumps(report, indent=2) + '\n')
          PYCODE
      - name: Upload every raw observation, identity and failed-stage log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-ack-component-92c09
          path: builds/perf/source-ack-hosted
          if-no-files-found: error
          retention-days: 14
