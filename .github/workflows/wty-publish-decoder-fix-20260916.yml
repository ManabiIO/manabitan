# Rerun after lint/type-clean browser regression.
name: Publish WTY shared-WASM decoder fix
on:
  push:
    branches: [verify/wty-import-abba-20260916]
    paths: [.github/workflows/wty-publish-decoder-fix-20260916.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Preserve reviewed repair assets and reset to exact develop baseline
        run: |
          mkdir -p "$RUNNER_TEMP/wty-decoder" builds/wty-decoder-publish
          cp dev/perf/wty-abba-20260916/apply-decoder-fix.py "$RUNNER_TEMP/wty-decoder/"
          cp dev/perf/wty-abba-20260916/shared-decoder-browser.mjs "$RUNNER_TEMP/wty-decoder/term-bank-shared-decoder.e2e.js"
          git checkout --detach c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          cp "$RUNNER_TEMP/wty-decoder/term-bank-shared-decoder.e2e.js" test/chromium/
          npm ci
          npm run build:libs > builds/wty-decoder-publish/build-libs-red.log 2>&1
          npx playwright install --with-deps chromium
      - name: RED - reproduce browser TextDecoder rejection on parent
        run: |
          set -o pipefail
          node test/chromium/term-bank-shared-decoder.e2e.js --expect-failure 2>&1 | tee builds/wty-decoder-publish/red.log
      - name: Apply minimal repair
        run: |
          python3 "$RUNNER_TEMP/wty-decoder/apply-decoder-fix.py"
          git diff --check
          git diff -- ext/js/dictionary/term-bank-wasm-parser.js test/chromium/term-bank-shared-decoder.e2e.js > builds/wty-decoder-publish/source.patch
      - name: GREEN - browser regression and focused correctness
        run: |
          set -o pipefail
          node test/chromium/term-bank-shared-decoder.e2e.js 2>&1 | tee builds/wty-decoder-publish/green.log
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/term-bank-wasm-parser.js test/chromium/term-bank-shared-decoder.e2e.js 2>&1 | tee builds/wty-decoder-publish/lint.log
          node node_modules/vitest/vitest.mjs run test/term-bank-experiments.test.js test/dictionary-import-ownership.test.js 2>&1 | tee builds/wty-decoder-publish/focused.log
          npm run test:ts 2>&1 | tee builds/wty-decoder-publish/types.log
      - name: Full unit and build qualification
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee builds/wty-decoder-publish/unit.log
          npm run test:unit:options 2>&1 | tee builds/wty-decoder-publish/options.log
          npm run test:build 2>&1 | tee builds/wty-decoder-publish/build-plans.log
          node dev/bin/build.js --target chrome-dev 2>&1 | tee builds/wty-decoder-publish/chrome-build.log
          node dev/bin/build.js --target firefox-dev 2>&1 | tee builds/wty-decoder-publish/firefox-build.log
      - name: Publish only the isolated repair and regression
        run: |
          sha256sum ext/js/dictionary/term-bank-wasm-parser.js test/chromium/term-bank-shared-decoder.e2e.js ext/lib/term-bank-parser.wasm > builds/wty-decoder-publish/qualified-inputs.sha256
          git add ext/js/dictionary/term-bank-wasm-parser.js test/chromium/term-bank-shared-decoder.e2e.js
          python3 - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert files == ['ext/js/dictionary/term-bank-wasm-parser.js', 'test/chromium/term-bank-shared-decoder.e2e.js'], files
          PY
          git -c user.name='Manabitan contributors' -c user.email='contributors@manabi.io' commit -m 'fix: decode shared parser tokens through owned bytes'
          git push origin HEAD:refs/heads/fix/wty-shared-wasm-textdecoder-20260916
          git rev-parse HEAD 'HEAD^{tree}' > builds/wty-decoder-publish/published.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wty-shared-decoder-publish
          path: builds/wty-decoder-publish
          retention-days: 30
