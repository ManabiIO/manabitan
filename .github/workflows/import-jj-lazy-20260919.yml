name: Lazy archive qualification and original import confirmation
on:
  push:
    branches: [research/import-jitendex-jmdict-20260919]
    paths: [.github/workflows/import-jj-lazy-20260919.yml]
permissions:
  contents: read
jobs:
  confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jitendex, jmdict]
    env:
      MANABITAN_CLANG: clang-18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npx playwright install --with-deps chromium
      - name: Twelve complete-import pairs and same-binary controls
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: python dev/perf/jj-lazy-screen.py --dictionary "$DICTIONARY" --blocks 6 --out "$RUNNER_TEMP/jj-lazy"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jj-lazy-confirmation-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/jj-lazy
          retention-days: 30
          if-no-files-found: error
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MANABITAN_CLANG: clang-18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Failure-first regression and full exact-source qualification
        run: |
          set -euo pipefail
          mkdir -p qualification
          set +e
          node node_modules/vitest/vitest.mjs run test/shared-archive-read.test.js --reporter=json --outputFile=qualification/red.json > qualification/red.log 2>&1
          red=$?
          set -e
          test "$red" -ne 0
          git apply --recount dev/perf/jj-lazy-archive.patch
          node node_modules/vitest/vitest.mjs run test/shared-archive-read.test.js test/raw-zip-range-reader.test.js test/dictionary-import-ownership.test.js > qualification/focused.log 2>&1
          node node_modules/vitest/vitest.mjs run --no-file-parallelism > qualification/unit.log 2>&1
          npm run test:unit:options > qualification/options.log 2>&1
          npm run test:ts > qualification/types.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-source-pipeline.js test/shared-archive-read.test.js > qualification/lint.log 2>&1
          npm run test:build > qualification/build-plans.log 2>&1
          node dev/bin/build.js chrome-dev > qualification/chrome-build.log 2>&1
          node dev/bin/build.js firefox-dev > qualification/firefox-build.log 2>&1
          git diff --check
          sha256sum ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-source-pipeline.js test/shared-archive-read.test.js ext/lib/term-bank-parser.wasm > qualification/hashes.txt
      - run: npx playwright install --with-deps chromium
      - name: Strict original-dictionary Chromium lifecycle
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_CHROMIUM_E2E_REPORT: qualification/lifecycle.html
        run: |
          set -euo pipefail
          node test/chromium/extension-two-dictionary-import.e2e.js > qualification/lifecycle.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('qualification/lifecycle.json').read_text())
          assert d['status']=='success' and d['skippedVerification'] is False
          PY
          sha256sum --check qualification/hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jj-lazy-qualification
          path: qualification
          retention-days: 30
          if-no-files-found: error
