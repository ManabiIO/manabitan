name: Bounded ZIP range memory diagnostics
on:
  push:
    branches: [research/import-zip-ranges-20260919]
    paths: [.github/workflows/import-zip-memory-20260919.yml]
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jmnedict, jitendex]
    env:
      MANABITAN_CLANG: clang-18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npx playwright install --with-deps chromium
      - run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('builds/e2e-dictionary-cache');"
      - name: Sample browser descendant PSS and RSS during fixed diagnostic imports
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: |
          set -euo pipefail
          python dev/perf/zip-ranges-memory-20260919.py --dictionary "$DICTIONARY" --blocks 2 --out "$RUNNER_TEMP/zip-memory"
          cp dev/perf/zip-ranges-memory-20260919.py "$RUNNER_TEMP/zip-memory/memory-driver.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zip-range-memory-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/zip-memory
          retention-days: 30
          if-no-files-found: error
