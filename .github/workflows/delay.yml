# This workflow is used to delay the execution of workflows that need to use an environment.
# The delay occurs thanks to the usage of the 12hoursDelay environment.
#
# It is used to delay the execution of the publish-chrome(-development) workflow to avoid the
# Google Web Store rejecting the upload of a new version because it is still in review.
#
# The reason we can't directly do a workflow-dispatch is because the 12hoursDelay
# environment does not include our secrets, so instead we chain two workflow-dispatch calls.

name: delay
on:
  workflow_dispatch:
    inputs:
      workflow:
        description: "Workflow name"
        required: true
      attemptNumber:
        description: "Attempt number"
        required: false
        default: "1"
      maxAttempts:
        description: "Max attempts"
        required: false
        default: "10"
      tag:
        description: "Release tag for development publishing retries"
        required: false
      upload_url:
        description: "Release asset upload URL for development publishing retries"
        required: false
permissions: {}
jobs:
  delay:
    runs-on: ubuntu-latest
    environment: 12hoursDelay
    permissions:
      actions: write
    steps:
      - name: Prepare retry inputs
        id: retryInputs
        env:
          ATTEMPT_NUMBER: ${{ inputs.attemptNumber }}
          MAX_ATTEMPTS: ${{ inputs.maxAttempts }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_UPLOAD_URL: ${{ inputs.upload_url }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const inputs = {attemptNumber: process.env.ATTEMPT_NUMBER, maxAttempts: process.env.MAX_ATTEMPTS};
          if (process.env.RELEASE_TAG) inputs.tag = process.env.RELEASE_TAG;
          if (process.env.RELEASE_UPLOAD_URL) inputs.upload_url = process.env.RELEASE_UPLOAD_URL;
          appendFileSync(process.env.GITHUB_OUTPUT, `inputs=${JSON.stringify(inputs)}\n`);
          NODE

      - name: Start the next attempt
        uses: aurelien-baudet/workflow-dispatch@3133c5d135c7dbe4be4f9793872b6ef331b53bc7 # pin@v2
        with:
          workflow: ${{ github.event.inputs.workflow }}
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          wait-for-completion: false
          inputs: ${{ steps.retryInputs.outputs.inputs }}
