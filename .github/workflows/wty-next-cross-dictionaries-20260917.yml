name: WTY flags cross-dictionary checks
on:
  push:
    branches: [verify/wty-next-20260917]
    paths: [.github/workflows/wty-next-cross-dictionaries-20260917.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        id: [keys, skip, retain]
    env:
      CANDIDATE_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f8f868903c4733f6017d479f65b9600a583bedb2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Build the independently isolated candidate
        run: |
          mkdir -p "$RUNNER_TEMP/wty-tools" builds/wty-cross
          git fetch --depth=1 origin 1654d15dc4b27ddc75f27ec3168b30a891ce5725
          for file in known-keys.patch.gz.b64 prepare-candidates.py select-candidate.py abba.mjs fix-harness.py; do
            git show "FETCH_HEAD:dev/perf/wty-next-20260917/$file" > "$RUNNER_TEMP/wty-tools/$file"
          done
          python3 "$RUNNER_TEMP/wty-tools/select-candidate.py" "$CANDIDATE_ID"
          npm run build:libs
          node node_modules/eslint/bin/eslint.js --fix ext/js/dictionary/term-bank-wasm-parser.js test/term-bank-experiments.test.js
          npm run build:libs
          sha256sum ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/wasm/term-bank-parser.c types/ext/dictionary-importer.d.ts test/term-bank-experiments.test.js ext/lib/term-bank-parser.wasm > builds/wty-cross/source.sha256
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare identical fixture handling and browser package
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/wty-prepare-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'wty-prepare.py').write_text((p/'wty-prepare-original.py').read_text().split('# Common correctness prerequisite')[0])
          PY
          python3 "$RUNNER_TEMP/wty-prepare.py"
          python3 "$RUNNER_TEMP/wty-tools/fix-harness.py"
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev
          npx playwright install --with-deps chromium
      - name: Serial two-block ABBA for each complete Japanese dictionary
        run: |
          for dictionary in jmdict jitendex; do
            mkdir -p "builds/wty-cross/$dictionary"
            WTY_DICTIONARY="$dictionary" WTY_OUTPUT="builds/wty-cross/$dictionary" node "$RUNNER_TEMP/wty-tools/abba.mjs" "control,$CANDIDATE_ID" 2 | tee "builds/wty-cross/$dictionary/abba.log"
          done
          sha256sum -c builds/wty-cross/source.sha256
      - name: Preserve source and all raw observations
        if: always()
        run: |
          mkdir -p builds/wty-cross
          git diff -- ext/js types/ext test/term-bank-experiments.test.js > builds/wty-cross/source.patch
          cp "$RUNNER_TEMP/wty-tools/abba.mjs" builds/wty-cross/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wty-cross-${{ matrix.id }}
          path: builds/wty-cross
          retention-days: 30
