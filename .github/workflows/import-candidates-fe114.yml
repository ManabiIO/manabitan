name: Import candidate screen 20261126 fe114

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'ext/js/dictionary/zstd-term-content.js'
      - 'ext/js/dictionary/wasm/term-bank-parser.c'
      - 'dev/data/dictionary-wasm/**'
      - '.github/workflows/import-candidates-fe114.yml'

permissions:
  contents: read

concurrency:
  group: import-candidates-fe114-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.head_ref == 'perf/zstd-startup-overlap-20261126-fe114' ||
       github.head_ref == 'perf/glossary-type-literals-20261126-fe114')
    runs-on: ubuntu-latest
    outputs:
      acquire: ${{ steps.changed.outputs.acquire }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        name: Skip evidence-only follow-ups
        shell: bash
        env:
          PERF_ACTION: ${{ github.event.action }}
          PERF_BEFORE: ${{ github.event.before }}
          PERF_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          acquire=true
          if [[ "$PERF_ACTION" == synchronize && "$PERF_BEFORE" =~ ^[a-f0-9]{40}$ ]] &&
             git cat-file -e "${PERF_BEFORE}^{commit}" &&
             git diff --quiet "$PERF_BEFORE" "$PERF_CANDIDATE" -- \
               ext/js/dictionary/zstd-term-content.js \
               ext/js/dictionary/wasm/term-bank-parser.c \
               dev/data/dictionary-wasm \
               .github/workflows/import-candidates-fe114.yml; then
            acquire=false
          fi
          echo "acquire=$acquire" >> "$GITHUB_OUTPUT"

  screen:
    needs: select
    if: needs.select.outputs.acquire == 'true'
    name: Complete import (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_BASELINE: 0143e9596cd8f790d5e166d4ba6a2425fbc57f14
      PERF_CANDIDATE: ${{ github.event.pull_request.head.sha }}
      PERF_BRANCH: ${{ github.head_ref }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Compare exact release packages with unchanged qualification tooling
        shell: bash
        run: |
          set -euo pipefail
          entries=()
          case "$PERF_BRANCH" in
            perf/zstd-startup-overlap-20261126-fe114)
              entries+=(--expected-package-entry js/dictionary/zstd-term-content.js)
              ;;
            perf/glossary-type-literals-20261126-fe114)
              entries+=(--expected-package-entry js/dictionary/wasm/term-bank-parser.c)
              entries+=(--expected-package-entry lib/term-bank-parser.wasm)
              ;;
            *) exit 1 ;;
          esac
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order AB \
            --pairs 6 \
            "${entries[@]}" \
            --evidence builds/perf/import-candidate-screen
      - name: Preserve every observation, package, and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-candidate-fe114-${{ matrix.dictionary }}
          path: builds/perf/import-candidate-screen
          if-no-files-found: error
          retention-days: 14
