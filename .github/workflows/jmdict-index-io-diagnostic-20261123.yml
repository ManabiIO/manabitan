name: Frozen JMdict index I/O diagnosis

on:
  push:
    branches: ['perf/jmdict-index-io-diagnostic-20261123-72c24']

permissions:
  contents: read

concurrency:
  group: jmdict-index-io-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Check lifecycle receipts and readback guards
        run: |
          node --test dev/perf/jmdict-index-io-diagnostic-20261123/verify.test.mjs
          node --test dev/perf/import-study-20261123/verify.test.mjs
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore verified dictionary archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: import-study-20261123-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Acquire every fixed diagnostic once
        run: python3 dev/perf/jmdict-index-io-diagnostic-20261123/run.py
      - name: Retain every receipt, report and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jmdict-index-io-diagnostic-attempt-${{ github.run_attempt }}
          path: builds/jmdict-index-io-diagnostic-20261123
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
