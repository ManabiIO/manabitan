name: Contiguous string compaction import comparison
on:
  push:
    branches: [verify/import-round4-20260915]
    paths: [.github/workflows/import-round4-string-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b6866f59724ebe8a962bc6fbd5bb06f28e47a22b
          persist-credentials: false
      - name: Prepare immutable source and component verification
        run: |
          cp -a dev/perf/round4-20260915 "$RUNNER_TEMP/round4-review"
          git fetch --depth=1 origin 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round4-review/source-screen.py'
          s = p.read_text()
          s = s.replace('CANDIDATES = {', "CANDIDATES = {\n    'string-runs': ('term-record-preinterned-plan.js', 'a6f19c1f090f24ff51cc06da444ec3060da731fc8826bf60353f7df0fb927a1f'),")
          start = s.index("(output / 'component-not-applicable.json')")
          end = s.index("roots = {'A': root, 'B': candidate}", start)
          s = s[:start] + '''with (output / 'lookup-tests.log').open('w') as log:
              subprocess.run(['node', 'node_modules/vitest/vitest.mjs', 'run',
                  'test/term-lookup-index-preparation.test.js', 'test/term-lookup-index.test.js',
                  'test/lookup-construction-experiments.test.js'], cwd=candidate,
                  stdout=log, stderr=subprocess.STDOUT, timeout=180, check=True)
          with (output / 'component.log').open('w') as log:
              subprocess.run(['node', 'dev/perf/import-lookup-screen.js', dictionary, '--pairs', '4', '--flags', '{}',
                  '--baseline-root', str(root), '--cache-dir', str(root / 'builds/e2e-dictionary-cache'),
                  '--out', str(output / 'component.json')], cwd=candidate, stdout=log,
                  stderr=subprocess.STDOUT, timeout=240, check=True)

          ''' + s[end:]
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round4-review/source-screen.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - run: node dev/bin/build.js --target chrome-dev
      - name: Fixed six-pair comparison
        env:
          CANDIDATE: string-runs
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: python3 "$RUNNER_TEMP/round4-review/source-screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-string-runs-${{ matrix.dictionary }}
          path: builds/round4-screen
          retention-days: 30
