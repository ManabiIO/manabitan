name: Full-buffer DEFLATE independent replication
on:
  push:
    branches: [verify/import-radical-20260915]
    paths: [.github/workflows/radical-libdeflate-replicate-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [libdeflate, libdeflate64]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2e49757be70d11cce74a9e0b865936c2343dbe2
          persist-credentials: false
      - name: Freeze reviewed inputs and baseline
        run: |
          cp -a dev/perf/radical-20260915 "$RUNNER_TEMP/radical-review"
          git fetch --depth=1 origin 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned complete dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Build baseline
        run: node dev/bin/build.js --target chrome-dev
      - name: Twelve alternating pairs, reversed order, and six AA controls
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: python3 "$RUNNER_TEMP/radical-review/source-ab.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radical-replication-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/radical-screen
          retention-days: 30
