name: Import pipeline discovery and confirmation

on:
  push:
    branches: ['perf/import-*-study-20261123-72c24']

permissions:
  contents: read

concurrency:
  group: import-study-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require frozen sources and fixed schedule
        id: plan
        run: |
          matrix=$(python3 dev/perf/import-study-20261123/run.py --matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  compare:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Check comparison guards
        run: |
          node --test dev/perf/import-study-20261123/verify.test.mjs
          python3 dev/perf/import-study-20261123/test_media_reference.py
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore verified dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: import-study-20261123-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Acquire every fixed observation once
        run: python3 dev/perf/import-study-20261123/run.py --dictionary '${{ matrix.dictionary }}' --replication '${{ matrix.replication }}'
      - name: Retain raw reports, logs and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-study-${{ matrix.dictionary }}-${{ matrix.replication }}-attempt-${{ github.run_attempt }}
          path: builds/import-study-20261123
          if-no-files-found: error
          retention-days: 30
