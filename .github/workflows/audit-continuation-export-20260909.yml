name: Audit continuation source export
on:
  push:
    branches: [audit/source-export-20260909]
    paths: [.github/workflows/audit-continuation-export-20260909.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export immutable objects and refs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          git show-ref > "$RUNNER_TEMP/export/refs.txt"
          git bundle create "$RUNNER_TEMP/export/manabitan.bundle" --all
          cd "$RUNNER_TEMP/export"
          sha256sum manabitan.bundle refs.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: audit-continuation-manabitan
          path: ${{ runner.temp }}/export
          retention-days: 30
          if-no-files-found: error
