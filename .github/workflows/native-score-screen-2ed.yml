name: Native prepared score import screen 2ed

on:
  push:
    branches: ['perf/native-score-screen-20261127-2ed']

permissions:
  contents: read

jobs:
  unit:
    name: Unit suite, scoped lint and all types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - run: npm run test:unit
      - name: Lint changed JavaScript
        if: always()
        run: npx eslint eslint.config.js ext/js/dictionary/dictionary-database.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-wasm-parser-worker.js ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-record-opfs-store.js ext/js/dictionary/term-score-plan.js test/dictionary-importer-score-plan.test.js test/term-bank-native-score-plan.test.js test/term-record-score-plan.test.js test/term-record-split-reference-origin.test.js test/term-score-plan.test.js
      - name: Check all TypeScript projects
        if: always()
        run: npm run test:ts
  screen:
    name: Six paired imports (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Fetch frozen source revisions
        run: git fetch --no-tags --depth=1 origin 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2 cc369aec9d0233b8491bcef4d82d185eb5c5086d
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore locked dictionaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Prospectively fixed paired screen
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: |
          extra=()
          if [[ "$DICTIONARY" == vndb ]]; then
            extra=(--vndb-sah-allocation-units 37 37)
          fi
          python3 dev/perf/import-qualification-native-score-2ed.py \
            --baseline 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2 \
            --candidate cc369aec9d0233b8491bcef4d82d185eb5c5086d \
            --dictionary "$DICTIONARY" --initial-order AB --pairs 6 \
            --expected-package-entry js/dictionary/dictionary-database.js \
            --expected-package-entry js/dictionary/dictionary-importer.js \
            --expected-package-entry js/dictionary/term-bank-wasm-parser-worker.js \
            --expected-package-entry js/dictionary/term-bank-wasm-parser.js \
            --expected-package-entry js/dictionary/term-record-opfs-store.js \
            --expected-package-entry js/dictionary/wasm/term-bank-parser.c \
            --expected-package-entry lib/term-bank-parser.wasm \
            --expected-package-entry js/dictionary/term-score-plan.js \
            --expected-added-package-entry js/dictionary/term-score-plan.js \
            --evidence "builds/perf/native-score-screen-$DICTIONARY" "${extra[@]}"
      - name: Separate JMdict CPU traces after the fixed study
        if: always() && matrix.dictionary == 'jmdict'
        run: |
          study_evidence="$GITHUB_WORKSPACE/builds/perf/native-score-screen-jmdict"
          if [[ ! -f "$study_evidence/analysis.json" ]]; then
            exit 0
          fi
          for arm in A B; do
            study_source="$GITHUB_WORKSPACE/builds/perf/native-score-screen-jmdict-sources/$arm"
            if [[ -n "$(git -C "$study_source" status --porcelain)" ]]; then
              echo 'Refusing to trace a changed study source'
              exit 1
            fi
            (
              cd "$study_source"
              node dev/perf/import-benchmark.js jmdict --build-target chrome --no-build --runs 1 --trace --media-check sample --output "$study_evidence/diagnostic-trace-$arm"
            )
          done
      - name: Print compact result
        if: always()
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: |
          if [[ -f "builds/perf/native-score-screen-$DICTIONARY/analysis.json" ]]; then
            cat "builds/perf/native-score-screen-$DICTIONARY/analysis.json"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: native-score-screen-2ed-${{ matrix.dictionary }}
          path: builds/perf/native-score-screen-${{ matrix.dictionary }}
          retention-days: 14
