name: Import sink and compact primitive screens
on:
  push:
    branches: [verify/import-review-20260916-1705]
    paths: [.github/workflows/import-review-sinks-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [dataview-exact, cache-copy-set, primitive-stack]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e18b056dab4d13e1ab016118a2ecf0bbcdcb3573
          persist-credentials: false
      - name: Pin source and isolated candidates
        run: |
          mkdir -p "$RUNNER_TEMP/sink-review"
          cp dev/perf/import-review-20260916/apply.py "$RUNNER_TEMP/sink-review/apply-native.py"
          cp dev/perf/import-review-20260916/apply-sinks.py "$RUNNER_TEMP/sink-review/apply.py"
          git fetch --depth=1 origin 23524cf48cb08482ebd271406fe48da773bb516c
          git show FETCH_HEAD:dev/perf/round6-20260916/screen.py > "$RUNNER_TEMP/sink-review/screen.py"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'sink-review/screen.py'
          s = p.read_text()
          replacements = {
              'b4094a423c20bb0ed424d944238f922c1b36559c': 'c0a1b7ee6fa1383a0a422361d2a8b7f826499fff',
              '604c5c2b64b8d217e87895dbd981aa3a30579bcb': 'a48da18d4244b00661d0c6518b2ce77b9f2f9b55',
              "('word-jump', 'simd-jump', 'inflight-bounds')": "('dataview-exact', 'cache-copy-set', 'primitive-stack')",
              "variant != 'inflight-bounds'": "source.suffix == '.c'",
              "variant == 'inflight-bounds'": "source.suffix == '.js'",
              'round6': 'sink-review',
              'round-six': 'sink-review',
              "'test/term-bank-join-boundaries.test.js']": "'test/term-bank-join-boundaries.test.js', 'test/term-bank-first-special.test.js', 'test/term-bank-adjacent-delimiters.test.js']",
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new)
          old = 'identities = {arm: identity(directory) for arm, directory in roots.items()}'
          assert s.count(old) == 1
          s = s.replace(old, old + "\n(output / 'sizes.json').write_text(json.dumps({arm: {'wasmBytes': (directory / 'ext/lib/term-bank-parser.wasm').stat().st_size, 'packageBytes': (directory / package).stat().st_size} for arm, directory in roots.items()}, indent=2))")
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/sink-review/"*.py
          git fetch --depth=1 origin c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          git checkout --detach c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned complete dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Six alternating browser pairs with interleaved A/A controls
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: |
          mkdir -p builds/sink-review
          python3 "$RUNNER_TEMP/sink-review/screen.py" 2>&1 | tee builds/sink-review/driver.log
      - name: Retain exact driver inputs
        if: always()
        run: |
          mkdir -p builds/sink-review/executed-inputs
          cp "$RUNNER_TEMP/sink-review/"*.py builds/sink-review/executed-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sink-review-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/sink-review
          retention-days: 30
