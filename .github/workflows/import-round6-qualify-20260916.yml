name: First-special scanner exact-source qualification
on:
  push:
    branches: [verify/import-round6-20260916]
    paths: [.github/workflows/import-round6-qualify-20260916.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b4094a423c20bb0ed424d944238f922c1b36559c
      - name: Retrieve immutable test, source transformation and sanitizer harness
        run: |
          git fetch --depth=1 origin 23524cf48cb08482ebd271406fe48da773bb516c
          git show FETCH_HEAD:test/term-bank-first-special.test.js > test/term-bank-first-special.test.js
          git show FETCH_HEAD:dev/perf/round6-20260916/apply.py > "$RUNNER_TEMP/apply-scanner.py"
          git show FETCH_HEAD:dev/perf/round6-20260916/scanner-conformance.c > "$RUNNER_TEMP/scanner-conformance.c"
          test "$(git hash-object test/term-bank-first-special.test.js)" = 2d051a2f20467dce052efdaa12f8913f6cde172c
          mkdir -p builds/round6-qualification
          git switch -c perf/first-special-string-scan-20260916
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Verify new grammar and boundary tests on unchanged parent
        run: |
          npm run build:libs > builds/round6-qualification/parent-build.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-first-special.test.js 2>&1 | tee builds/round6-qualification/parent-tests.log
      - name: Apply the exact measured scalar candidate
        run: |
          python3 "$RUNNER_TEMP/apply-scanner.py" word-jump | tee builds/round6-qualification/source-change.json
          test "$(sha256sum ext/js/dictionary/wasm/term-bank-parser.c | cut -d ' ' -f 1)" = 25d1c8054ad0978466eeb1cb7e7be8865673efb6b672b9bd9a1066b90b40b1e3
          npm run build:libs 2>&1 | tee builds/round6-qualification/candidate-build.log
          test "$(sha256sum ext/lib/term-bank-parser.wasm | cut -d ' ' -f 1)" = 4da14e1bdb67de0bcee79982961337e86901bb86439ac0ccef878820326d8e52
          node --version > builds/round6-qualification/node.txt
          clang --version > builds/round6-qualification/compiler.txt
      - name: Native scanner differential cases under ASan and UBSan
        id: sanitizers
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          s = Path('ext/js/dictionary/wasm/term-bank-parser.c').read_text()
          a = s.index('static inline uint64_t has_zero_byte64')
          b = s.index('static int is_media_marker_at', a)
          (Path(os.environ['RUNNER_TEMP']) / 'scanner-under-test.h').write_text(s[a:b])
          PY
          clang -O2 -g -fsanitize=address,undefined -fno-omit-frame-pointer "$RUNNER_TEMP/scanner-conformance.c" -o "$RUNNER_TEMP/scanner-conformance"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/scanner-conformance" | tee builds/round6-qualification/sanitizers.json
          cp "$RUNNER_TEMP/scanner-under-test.h" "$RUNNER_TEMP/scanner-conformance.c" builds/round6-qualification/
      - name: Focused parser, lookup, join and new scanner suites
        id: focused
        continue-on-error: true
        run: node node_modules/vitest/vitest.mjs run test/term-bank-first-special.test.js test/term-bank-wasm-parser.test.js test/term-bank-parser-string-scan.test.js test/term-bank-composite-state.test.js test/term-bank-experiments.test.js test/lookup-construction-experiments.test.js test/term-bank-join-boundaries.test.js 2>&1 | tee builds/round6-qualification/focused.log
      - name: Complete unit suite
        id: unit
        continue-on-error: true
        run: npm run test:unit 2>&1 | tee builds/round6-qualification/unit.log
      - name: Options suite
        id: options
        continue-on-error: true
        run: npm run test:unit:options 2>&1 | tee builds/round6-qualification/options.log
      - name: All strict typecheck projects
        id: types
        continue-on-error: true
        run: npm run test:ts 2>&1 | tee builds/round6-qualification/types.log
      - name: New test style without source rewriting
        id: lint
        continue-on-error: true
        run: node node_modules/eslint/bin/eslint.js test/term-bank-first-special.test.js 2>&1 | tee builds/round6-qualification/lint.log
      - name: Build plans and actual Chrome and Firefox development packages
        id: build
        continue-on-error: true
        run: |
          npm run test:build 2>&1 | tee builds/round6-qualification/build-plans.log
          node dev/bin/build.js --target chrome-dev 2>&1 | tee builds/round6-qualification/chrome-build.log
          node dev/bin/build.js --target firefox-dev 2>&1 | tee builds/round6-qualification/firefox-build.log
      - name: Install pinned browser and checksum-locked corpus
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Full strict Chromium lifecycle qualification
        id: browser
        continue-on-error: true
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/round6-qualification/full-browser.html
        run: |
          npm run test:e2e:chromium-extension 2>&1 | tee builds/round6-qualification/browser.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('builds/round6-qualification/full-browser.json').read_text())
          assert r['status'] == 'success' and r['skippedVerification'] is False
          assert len(r['phases']) >= 80
          PY
      - name: Publish only the unchanged qualified C source and regression tests
        if: steps.sanitizers.outcome == 'success' && steps.focused.outcome == 'success' && steps.unit.outcome == 'success' && steps.options.outcome == 'success' && steps.types.outcome == 'success' && steps.lint.outcome == 'success' && steps.build.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          git diff --check
          test "$(git hash-object test/term-bank-first-special.test.js)" = 2d051a2f20467dce052efdaa12f8913f6cde172c
          test "$(sha256sum ext/js/dictionary/wasm/term-bank-parser.c | cut -d ' ' -f 1)" = 25d1c8054ad0978466eeb1cb7e7be8865673efb6b672b9bd9a1066b90b40b1e3
          git add ext/js/dictionary/wasm/term-bank-parser.c test/term-bank-first-special.test.js
          git -c core.hooksPath=/dev/null -c user.name='Manabitan contributors' -c user.email='contributors@manabi.io' commit -m 'perf: jump directly to the first special byte in string scanning'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/perf/first-special-string-scan-20260916
          git rev-parse HEAD 'HEAD^{tree}' > builds/round6-qualification/published.txt
      - name: Preserve outcomes and fail closed
        if: always()
        env:
          SANITIZERS: ${{ steps.sanitizers.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          mkdir -p builds/round6-qualification
          printf '%s\n' "sanitizers=$SANITIZERS focused=$FOCUSED unit=$UNIT options=$OPTIONS types=$TYPES lint=$LINT build=$BUILD browser=$BROWSER" > builds/round6-qualification/outcomes.txt
          cp test/term-bank-first-special.test.js builds/round6-qualification/
          git diff b4094a423c20bb0ed424d944238f922c1b36559c -- ext/js/dictionary/wasm/term-bank-parser.c > builds/round6-qualification/candidate.patch
          test "$SANITIZERS/$FOCUSED/$UNIT/$OPTIONS/$TYPES/$LINT/$BUILD/$BROWSER" = 'success/success/success/success/success/success/success/success'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round6-first-special-qualification
          path: builds/round6-qualification
          retention-days: 30
