name: Export performance browser runtime

on:
  push:
    branches: [perf-mise-chatgpt-harness]
    paths: [.github/workflows/chatgpt-perf-refine.yml]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: node ./node_modules/playwright/cli.js install chromium
      - name: Pack browser runtime
        run: tar -C "${HOME}/.cache" -czf "${RUNNER_TEMP}/manabitan-perf-browser.tar.gz" ms-playwright
      - uses: actions/upload-artifact@v6
        with:
          name: manabitan-perf-browser-linux-x64
          path: ${{ runner.temp }}/manabitan-perf-browser.tar.gz
          compression-level: 0
          retention-days: 2
