name: ChatGPT Perf Refinement

on:
  push:
    branches: [perf-mise-chatgpt-harness]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf-mise-chatgpt-harness
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: '24.20.0'

      - name: Apply reviewed refinements
        run: python3 dev/perf/refine-temp.py

      - name: Install matching Chromium
        run: npx playwright install chromium

      - name: Format touched JavaScript
        run: |
          npx eslint --fix dev/perf/host-environment.js dev/perf/import-ab.js dev/perf/import-benchmark.js dev/perf/dictionary-fixtures.js dev/perf/prepare-dictionaries.js test/chromium/import-flags-ab-benchmark.js test/chromium/extension-two-dictionary-import.e2e.js || true

      - name: Fix semantic lint findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/chromium/extension-two-dictionary-import.e2e.js')
          text = path.read_text()

          old = """            const matchesDictionaryName = (observedName, expectedName) => {
              const observed = String(observedName || '').trim();
              const expected = String(expectedName || '').trim();
              if (observed.length === 0 || expected.length === 0) { return false; }
              if (observed === expected) { return true; }
              if (observed.startsWith(`${expected} `) || observed.startsWith(`${expected}.`)) { return true; }
              return observed.includes(expected);
            };
          """
          new = """            const matchesDictionaryName = (observedName, expectedName) => {
              const observed = String(observedName || '').trim();
              const expected = String(expectedName || '').trim();
              if (observed.length === 0 || expected.length === 0) { return false; }
              const expectedPrefixes = [`${expected} `, `${expected}.`];
              return (
                observed === expected ||
                expectedPrefixes.some((prefix) => observed.startsWith(prefix)) ||
                observed.includes(expected)
              );
            };
          """
          if text.count(old) != 1:
              raise SystemExit(f'nested dictionary matcher: expected 1 post-format match, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = "await new Promise((resolve) => setTimeout(resolve, 50));"
          new = "await new Promise((resolve) => { setTimeout(resolve, 50); });"
          if text.count(old) != 1:
              raise SystemExit(f'popup wait promise: expected 1 match, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          npx eslint --fix test/chromium/extension-two-dictionary-import.e2e.js

      - name: Lint and typecheck performance tooling
        run: |
          npx eslint dev/perf/host-environment.js dev/perf/import-ab.js dev/perf/import-benchmark.js dev/perf/dictionary-fixtures.js dev/perf/prepare-dictionaries.js test/chromium/import-flags-ab-benchmark.js test/chromium/extension-two-dictionary-import.e2e.js
          npm run test:ts:dev

      - name: Smoke local microbenchmark path
        run: |
          mkdir -p builds/perf
          node ./node_modules/vitest/vitest.mjs bench benches/canary.bench.js --outputJson builds/perf/canary.json
          test -s builds/perf/canary.json

      - name: Prepare pinned dictionaries and build extension
        run: |
          node ./dev/perf/prepare-dictionaries.js
          node ./dev/bin/build.js --target chrome-dev

      - name: Smoke authoritative import benchmark
        run: node ./dev/perf/import-benchmark.js jmdict --runs 1 --no-build --output builds/perf/refine-smoke

      - name: Smoke browser-wide import trace
        run: |
          node ./dev/perf/import-benchmark.js jmdict --trace --no-build --output builds/perf/refine-trace
          test -s builds/perf/refine-trace/run-1.trace.json

      - name: Smoke paired A/B runner
        run: node ./dev/perf/import-ab.js jmdict --pairs 1 --flags '{"zipMaxWorkers":3}' --label '3 ZIP workers'

      - name: Commit reviewed refinements
        run: |
          rm .github/workflows/chatgpt-perf-refine.yml dev/perf/refine-temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine performance benchmark fidelity'
          git push origin HEAD:perf-mise-chatgpt-harness
