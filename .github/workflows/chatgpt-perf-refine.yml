name: Validate final performance source fixes

on:
  push:
    branches: [perf-mise-chatgpt-harness]
    paths: [.github/workflows/chatgpt-perf-refine.yml]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply exact locally tested source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7a099ecc5cdfa02b18565eac16eb82110766ec06
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = '''
          
          
          
          '''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '6fdca77be97725dadc142f9407278d5d796889acc0faa471e9fe9719537e9521'
          path = pathlib.Path('/tmp/verified-source.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          git rm .github/workflows/chatgpt-perf-refine.yml dev/perf/refine-temp.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix benchmark validity and verify dictionary import outputs'
          echo "VERIFIED_SOURCE_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
      - uses: ./.github/actions/setup
        with:
          node-version: '24.20.0'
      - name: Validate source and regression coverage
        run: |
          node ./node_modules/eslint/bin/eslint.js dev/perf/*.js test/perf-benchmark-support.test.js test/dictionary-importer-zip-filename-alias.test.js test/chromium/import-flags-ab-benchmark.js test/chromium/extension-two-dictionary-import.e2e.js
          npm run test:ts:main
          npm run test:ts:dev
          npm run test:ts:bench
          node ./node_modules/vitest/vitest.mjs run --maxWorkers=3 --minWorkers=1
          node ./node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json --maxWorkers=2 --minWorkers=1
          npm run test:build
      - name: Prepare browser and pinned fixtures
        run: |
          node ./node_modules/playwright/cli.js install chromium
          node ./dev/perf/prepare-dictionaries.js
      - name: Verify real imports and separate trace on the source commit
        env:
          MANABITAN_E2E_IMPORT_FLAGS_JSON: deliberately-invalid-inherited-flags
          MANABITAN_E2E_IMPORT_TRACE_PATH: /tmp/forbidden-inherited.trace.json
          MANABITAN_CHROMIUM_BROWSER: edge
          MANABITAN_E2E_CONTENT_PROBE_LIMIT: '1'
        run: |
          node ./dev/perf/import-benchmark.js jmdict --runs 1 --output builds/perf/ci-acceptance
          node ./dev/perf/import-benchmark.js jitendex --trace --no-build --output builds/perf/ci-trace
          test ! -e /tmp/forbidden-inherited.trace.json
      - name: Publish only validated source
        env:
          EXPECTED_REMOTE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/perf-mise-chatgpt-harness | cut -f1)" = "${EXPECTED_REMOTE_SHA}"
          git diff --exit-code
          test ! -e .github/workflows/chatgpt-perf-refine.yml
          test ! -e dev/perf/refine-temp.py
          git push origin HEAD:perf-mise-chatgpt-harness
          echo "Validated and published ${VERIFIED_SOURCE_SHA}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verified-performance-source-reports
          path: builds/perf/ci-*
          retention-days: 7
