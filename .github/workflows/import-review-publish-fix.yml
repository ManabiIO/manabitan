name: Validate artifact preload fix
on:
  push:
    branches: [bench/import-review-20260924-1558]
    paths: [.github/workflows/import-review-publish-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact locally validated changes to pinned baseline
        run: |
          cp .review/artifact-preload.test.txt "$RUNNER_TEMP/artifact-preload.test.js"
          git switch -c fix/artifact-preload-drain-20260924 2185eeaac05efa0fd60eea49e3f00ce3e048aabe
          cp "$RUNNER_TEMP/artifact-preload.test.js" test/dictionary-importer-artifact-preload.test.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ext/js/dictionary/dictionary-importer.js')
          s=p.read_text()
          anchor='/**\n * Chromium rejects SharedArrayBuffer-backed views passed to TextDecoder.'
          helper='''/**
           * Keep the archive alive until every admitted read settles, including when
           * one read fails early. Preserve Promise.all's first rejection and tuple types.
           * @template {unknown[]|[]} T
           * @param {T} reads
           * @returns {Promise<{[K in keyof T]: Awaited<T[K]>}>}
           */
          async function joinArchiveReads(reads) {
              try {
                  return await Promise.all(reads);
              } catch (error) {
                  await Promise.allSettled(reads);
                  throw error;
              }
          }

          '''
          assert s.count(anchor)==1
          s=s.replace(anchor,helper+anchor)
          a='const [parallelPackedTermArtifactBytes, parallelPackedMediaArtifact] = await Promise.all(['
          b='const batchResults = await Promise.all(batch.map(async (termFile) => {'
          assert s.count(a)==1 and s.count(b)==1
          s=s.replace(a,a.replace('Promise.all','joinArchiveReads')).replace(b,b.replace('Promise.all','joinArchiveReads'))
          p.write_text(s)
          PY
          echo '89e51d0651219b9247190ed57def2f881debcb0a2e7cc0e4f2605f166cdc2b4a  ext/js/dictionary/dictionary-importer.js' | sha256sum -c -
          echo '18f4d2cef2a294576c6ac6971b63926b0a6b91fa814bf9d6fbaddae1ad2c0db5  test/dictionary-importer-artifact-preload.test.js' | sha256sum -c -
      - run: npm ci
      - run: npx eslint ext/js/dictionary/dictionary-importer.js test/dictionary-importer-artifact-preload.test.js
      - run: npm run test:ts && npm run test:unit && npm run test:build
      - name: Publish clean source branch
        run: |
          git config user.name 'Alex Ehlke'
          git config user.email 'alex.ehlke@gmail.com'
          git add ext/js/dictionary/dictionary-importer.js test/dictionary-importer-artifact-preload.test.js
          git -c core.hooksPath=/dev/null commit -m 'fix(import): drain artifact preloads before closing the archive'
          git push origin HEAD:refs/heads/fix/artifact-preload-drain-20260924
