name: Validate artifact preload fix
on:
  push:
    branches: [bench/import-review-20260924-1558]
    paths: [.github/workflows/import-review-publish-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2185eeaac05efa0fd60eea49e3f00ce3e048aabe
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact locally validated patch
        env:
          PATCH: 
        run: |
          python3 - <<'PY'
          import os,base64,zlib,subprocess
          patch=zlib.decompress(base64.b64decode(os.environ['PATCH']))
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
          echo '89e51d0651219b9247190ed57def2f881debcb0a2e7cc0e4f2605f166cdc2b4a  ext/js/dictionary/dictionary-importer.js' | sha256sum -c -
          echo '18f4d2cef2a294576c6ac6971b63926b0a6b91fa814bf9d6fbaddae1ad2c0db5  test/dictionary-importer-artifact-preload.test.js' | sha256sum -c -
      - run: npm ci
      - run: npx eslint ext/js/dictionary/dictionary-importer.js test/dictionary-importer-artifact-preload.test.js
      - run: npm run test:ts && npm run test:unit && npm run test:build
      - name: Publish clean source branch
        run: |
          git switch -c fix/artifact-preload-drain-20260924
          git config user.name 'Alex Ehlke'
          git config user.email 'alex.ehlke@gmail.com'
          git add ext/js/dictionary/dictionary-importer.js test/dictionary-importer-artifact-preload.test.js
          git commit -m 'fix(import): drain artifact preloads before closing the archive'
          git push origin HEAD:refs/heads/fix/artifact-preload-drain-20260924
