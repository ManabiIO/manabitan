name: Raw ZIP slice-copy screen
on:
  push:
    branches: [verify/rawzip-slice-20260917]
    paths:
      - .github/workflows/rawzip-slice-screen-20260917.yml
      - dev/perf/rawzip-slice-20260917/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      RAWZIP_DICTIONARY: ${{ matrix.dictionary }}
      RAWZIP_OUTPUT: builds/rawzip-slice
      RECIPE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f407e86fae0d3e39f506e6b1ce30886697698ea
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Apply only the default-off source-copy candidate
        run: |
          mkdir -p "$RUNNER_TEMP/rawzip" builds/rawzip-slice
          git fetch --depth=1 origin "$RECIPE_SHA"
          git show "FETCH_HEAD:dev/perf/rawzip-slice-20260917/prepare.py" > "$RUNNER_TEMP/rawzip/prepare.py"
          git show "FETCH_HEAD:dev/perf/rawzip-slice-20260917/abba.mjs" > "$RUNNER_TEMP/rawzip/abba.mjs"
          python3 "$RUNNER_TEMP/rawzip/prepare.py"
          git add -N test/raw-zip-slice-copy.test.js
          git diff --check
          git diff -- ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-source-pipeline.js ext/js/dictionary/term-bank-experiments.js types/ext/dictionary-importer.d.ts test/raw-zip-slice-copy.test.js > builds/rawzip-slice/candidate.patch
      - run: npm ci
      - name: Qualify ownership, headers, types and existing source-pipeline coverage
        run: |
          npm run build:libs > builds/rawzip-slice/libs.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-source-pipeline.js ext/js/dictionary/term-bank-experiments.js test/raw-zip-slice-copy.test.js > builds/rawzip-slice/lint.log 2>&1
          node node_modules/vitest/vitest.mjs run test/raw-zip-slice-copy.test.js test/dictionary-import-ownership.test.js test/term-bank-experiments.test.js > builds/rawzip-slice/focused.log 2>&1
          npm run test:ts:main > builds/rawzip-slice/types-main.log 2>&1
          npm run test:ts:dev > builds/rawzip-slice/types-dev.log 2>&1
          npm run test:ts:bench > builds/rawzip-slice/types-bench.log 2>&1
          set +e
          npm run test:ts:test > builds/rawzip-slice/types-test.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          git diff --exit-code 2f407e86fae0d3e39f506e6b1ce30886697698ea -- test/dictionary-importer-shared-buffer.test.js
          python3 - <<'PY'
          from pathlib import Path
          errors=[line for line in Path('builds/rawzip-slice/types-test.log').read_text().splitlines() if 'error TS' in line]
          assert len(errors)==2, errors
          assert any('dictionary-importer-shared-buffer.test.js(22,20): error TS7006' in line for line in errors), errors
          assert any('dictionary-importer-shared-buffer.test.js(39,45): error TS2502' in line for line in errors), errors
          PY
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare immutable full fixtures and one browser package
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          h=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          text=h.read_text(); assert text.count('maxBuffer: 32 * 1024 * 1024')==2
          h.write_text(text.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/rawzip-slice/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/rawzip-slice/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Four-block complete-import ABBA with same-binary controls
        run: node "$RUNNER_TEMP/rawzip/abba.mjs" control,rawSlice 4 | tee builds/rawzip-slice/abba.log
      - name: Preserve every observation and exact source
        if: always()
        run: |
          mkdir -p builds/rawzip-slice/source
          cp "$RUNNER_TEMP/rawzip/abba.mjs" "$RUNNER_TEMP/rawzip/prepare.py" builds/rawzip-slice/source/ 2>/dev/null || true
          git diff -- ext/js types/ext test/raw-zip-slice-copy.test.js > builds/rawzip-slice/final.patch
          tar -czf builds/rawzip-slice/source.tar.gz ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-source-pipeline.js ext/js/dictionary/term-bank-experiments.js types/ext/dictionary-importer.d.ts test/raw-zip-slice-copy.test.js test/dictionary-import-ownership.test.js test/chromium/extension-two-dictionary-import.e2e.js test/perf/dictionaries.lock.json
          git rev-parse HEAD > builds/rawzip-slice/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rawzip-slice-${{ matrix.dictionary }}
          path: builds/rawzip-slice
          retention-days: 30
