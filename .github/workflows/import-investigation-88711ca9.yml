name: Import investigation 88711ca9

on:
  push:
    branches: [perf/import-investigation-20261127-88711ca9]
    paths:
      - .github/workflows/import-investigation-88711ca9.yml
      - dev/perf/import-investigation-20261127-88711ca9.py

permissions:
  contents: read

concurrency:
  group: import-investigation-88711ca9-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_SHA: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
  MANABITAN_E2E_STRICT_RUNTIME: '1'
  MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'

jobs:
  profile:
    name: Diagnose ${{ matrix.dictionary }}
    if: github.repository == 'ManabiIO/manabitan'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Restore locked dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare frozen release source
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('builds/e2e-dictionary-cache', [process.env.DICTIONARY])"
          git fetch --no-tags --depth 1 origin "$PRODUCT_SHA"
          product_root="$RUNNER_TEMP/import-product-88711ca9"
          git worktree add --detach "$product_root" "$PRODUCT_SHA"
          cmp package-lock.json "$product_root/package-lock.json"
          cmp test/perf/dictionaries.lock.json "$product_root/test/perf/dictionaries.lock.json"
          cp -al "$GITHUB_WORKSPACE/node_modules" "$product_root/node_modules"
          mkdir -p "$product_root/builds"
          ln -s "$GITHUB_WORKSPACE/builds/e2e-dictionary-cache" "$product_root/builds/e2e-dictionary-cache"
          (
            cd "$product_root"
            npm run build:libs
            npm run build -- --target chrome
          )
      - name: Acquire ordinary import, separate CPU trace, and media proof
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/perf/import-investigation-20261127-88711ca9.py \
            --source "$RUNNER_TEMP/import-product-88711ca9" \
            --expected-source "$PRODUCT_SHA" \
            --dictionary "$DICTIONARY" \
            --output "builds/perf/import-investigation-88711ca9/$DICTIONARY"
      - name: Preserve completed and failed diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-investigation-88711ca9-${{ matrix.dictionary }}
          path: builds/perf/import-investigation-88711ca9
          if-no-files-found: error
          retention-days: 14
