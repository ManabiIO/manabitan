name: Verify fully occupied paired-hash SIMD stripes

on:
  push:
    branches: [perf-hash-stripes-verify-20260908]
    paths:
      - .github/workflows/hash-stripes-verification.yml
      - dev/perf/hash-stripes-experiment/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Prepare exact isolated source arms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arms" "$RUNNER_TEMP/evidence"
          for arm in baseline candidate; do
            git worktree add --detach "$RUNNER_TEMP/arms/$arm" 394d8eb799dd1eb5e194cee11472a4beab915080
            ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/arms/$arm/node_modules"
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'arms/candidate/ext/js/dictionary/wasm/term-bank-parser.c'
          text = source.read_text()
          start = text.index('static void hash_content_xxh32_pair(')
          start = text.index('        uint32_t a1 =', start)
          end = text.index('    } else {', start)
          source.write_text(text[:start] + Path('dev/perf/hash-stripes-experiment/stripes.c.txt').read_text() + text[end:])
          PY
          cp dev/perf/hash-stripes-experiment/term-bank-hash-stripes.test.js "$RUNNER_TEMP/arms/candidate/test/"
          git -C "$RUNNER_TEMP/arms/candidate" add ext/js/dictionary/wasm/term-bank-parser.c test/term-bank-hash-stripes.test.js
          test "$(git -C "$RUNNER_TEMP/arms/candidate" write-tree)" = 52819fdbe0412bc4827d9df26fc712427ce17927
          for arm in baseline candidate; do
            (cd "$RUNNER_TEMP/arms/$arm" && node dev/bin/build.js --target chrome-dev) > "$RUNNER_TEMP/evidence/build-$arm.log" 2>&1
            git -C "$RUNNER_TEMP/arms/$arm" diff HEAD --binary > "$RUNNER_TEMP/evidence/source-$arm.patch"
          done
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, json, os
          root = Path(os.environ['RUNNER_TEMP'])
          with ZipFile(root/'arms/baseline/builds/manabitan-chrome-dev.zip') as a, ZipFile(root/'arms/candidate/builds/manabitan-chrome-dev.zip') as b:
              assert set(a.namelist()) == set(b.namelist())
              changed = {name: {'baseline': hashlib.sha256(a.read(name)).hexdigest(), 'candidate': hashlib.sha256(b.read(name)).hexdigest()} for name in a.namelist() if a.read(name) != b.read(name)}
              assert set(changed) == {'lib/term-bank-parser.wasm', 'js/dictionary/wasm/term-bank-parser.c'}, changed
          (root/'evidence/packaged-payload-diff.json').write_text(json.dumps(changed, indent=2))
          PY
          (cd "$RUNNER_TEMP/arms/baseline" && node dev/perf/prepare-dictionaries.js) > "$RUNNER_TEMP/evidence/fixtures.log" 2>&1
          ln -s "$RUNNER_TEMP/arms/baseline/builds/e2e-dictionary-cache" "$RUNNER_TEMP/arms/candidate/builds/e2e-dictionary-cache"
          cp dev/perf/hash-stripes-experiment/run-paired.py "$RUNNER_TEMP/evidence/"
          clang --version > "$RUNNER_TEMP/evidence/compiler.txt"
          lscpu > "$RUNNER_TEMP/evidence/cpu.txt"
      - name: Full correctness before timing
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
          npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
      - name: Eight adjacent full-import pairs per dictionary, warmups excluded
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/perf/hash-stripes-experiment/run-paired.py \
            --baseline "$RUNNER_TEMP/arms/baseline" --candidate "$RUNNER_TEMP/arms/candidate" \
            --pairs 8 --warmups 1 --output "$RUNNER_TEMP/evidence/paired" \
            --label 'PR20 vs full-lane paired XXH32, eight fixed pairs, exact packaged-payload guard' | tee "$RUNNER_TEMP/evidence/driver.log"
      - name: Strict full Chromium E2E
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          MANABITAN_E2E_STRICT_RUNTIME=1 MANABITAN_CHROMIUM_HEADLESS=1 MANABITAN_E2E_SKIP_BUILD=1 MANABITAN_CHROMIUM_E2E_REPORT="$RUNNER_TEMP/evidence/full-chromium.html" node test/chromium/extension-two-dictionary-import.e2e.js > "$RUNNER_TEMP/evidence/full-chromium.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hash-stripes-verification
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
