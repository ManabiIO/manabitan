name: Smaller shared-gather exact-source qualification
on:
  push:
    branches: [verify/import-pipeline-research-20260916]
    paths: [.github/workflows/import-aligned-gather-qualify-20260916.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
      - name: Retrieve exact candidate and tests
        run: |
          mkdir -p "$RUNNER_TEMP/aligned-qualification" builds/aligned-qualification
          git fetch --depth=1 origin 96764973fe07f60358747dfb4d61ed3630e86964
          git show FETCH_HEAD:dev/perf/pipeline-research-20260916/apply-next.py > "$RUNNER_TEMP/aligned-qualification/apply.py"
          git show FETCH_HEAD:dev/perf/pipeline-research-20260916/tests/zstd-shared-gather.test.js > test/zstd-shared-gather.test.js
          printf '%s\n' '56dd01bf78ec8a85b08d12e0f71757751a42188c14812bc740837a5be3b284c5  test/zstd-shared-gather.test.js' > builds/aligned-qualification/tests.sha256
          sha256sum -c builds/aligned-qualification/tests.sha256
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Parent correctness and repository-lint baseline
        run: |
          npm run build:libs > builds/aligned-qualification/parent-build.log 2>&1
          node node_modules/vitest/vitest.mjs run test/zstd-shared-gather.test.js test/zstd-wasm.test.js 2>&1 | tee builds/aligned-qualification/parent-tests.log
          set +e
          npm run test:js > builds/aligned-qualification/parent-full-lint.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > builds/aligned-qualification/parent-full-lint-status.txt
      - name: Build and check the measured alternative
        run: |
          python3 "$RUNNER_TEMP/aligned-qualification/apply.py" gather-aligned | tee builds/aligned-qualification/source-change.json
          printf '%s\n' '88c127aa4a4339f193ae68d21b675bcd47a676328e178c31a58eb1ea009314e3  dev/lib/zstd-wasm.js' > builds/aligned-qualification/source.sha256
          sha256sum -c builds/aligned-qualification/source.sha256
          npm run build:libs 2>&1 | tee builds/aligned-qualification/candidate-build.log
          sha256sum dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js ext/lib/zstd-wasm.js.map test/perf/dictionaries.lock.json > builds/aligned-qualification/input-hashes.txt
          node node_modules/vitest/vitest.mjs run test/zstd-shared-gather.test.js test/zstd-wasm.test.js test/dictionary-database-content-dedup.test.js test/term-content-block-store.test.js 2>&1 | tee builds/aligned-qualification/focused.log
          npm run test:unit 2>&1 | tee builds/aligned-qualification/unit.log
          npm run test:unit:options 2>&1 | tee builds/aligned-qualification/options.log
          npm run test:ts 2>&1 | tee builds/aligned-qualification/types.log
          node node_modules/eslint/bin/eslint.js dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js 2>&1 | tee builds/aligned-qualification/changed-lint.log
      - name: No additional full-repository lint diagnostics
        run: |
          set +e
          npm run test:js > builds/aligned-qualification/candidate-full-lint.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > builds/aligned-qualification/candidate-full-lint-status.txt
          cmp builds/aligned-qualification/parent-full-lint-status.txt builds/aligned-qualification/candidate-full-lint-status.txt
          cmp builds/aligned-qualification/parent-full-lint.log builds/aligned-qualification/candidate-full-lint.log
      - name: Build every plan and actual Chrome and Firefox packages
        run: |
          npm run test:build 2>&1 | tee builds/aligned-qualification/build-plans.log
          node dev/bin/build.js --target chrome-dev 2>&1 | tee builds/aligned-qualification/chrome-build.log
          node dev/bin/build.js --target firefox-dev 2>&1 | tee builds/aligned-qualification/firefox-build.log
      - name: Install pinned browser and fixtures
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Full strict Chromium lifecycle
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/aligned-qualification/browser.html
        run: |
          npm run test:e2e:chromium-extension 2>&1 | tee builds/aligned-qualification/browser.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('builds/aligned-qualification/browser.json').read_text())
          assert report['status']=='success' and report['skippedVerification'] is False and len(report['phases'])>=80
          PY
      - name: Publish only exact source and tests to a new non-release branch
        run: |
          git diff --check
          sha256sum -c builds/aligned-qualification/input-hashes.txt
          sha256sum -c builds/aligned-qualification/source.sha256
          sha256sum -c builds/aligned-qualification/tests.sha256
          git add dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js
          python3 - <<'PY'
          import subprocess
          assert subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()==['dev/lib/zstd-wasm.js','test/zstd-shared-gather.test.js']
          PY
          git -c core.hooksPath=/dev/null -c user.name='Manabitan contributors' -c user.email='contributors@manabi.io' commit -m 'perf: align shared byte gathers before private compression'
          test -z "$(git status --porcelain)"
          branch='perf/import-aligned-byte-gather-20260916'
          test -z "$(git ls-remote --heads origin "$branch")"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD 'HEAD^{tree}' > builds/aligned-qualification/qualified.txt
      - name: Preserve source and test evidence
        if: always()
        run: |
          mkdir -p builds/aligned-qualification
          git diff c0a1b7ee6fa1383a0a422361d2a8b7f826499fff -- dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js > builds/aligned-qualification/source.patch
          cp test/zstd-shared-gather.test.js builds/aligned-qualification/
          cp "$RUNNER_TEMP/aligned-qualification/apply.py" builds/aligned-qualification/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aligned-gather-exact-qualification
          path: builds/aligned-qualification
          retention-days: 30
