name: Import hot-path qualification
on:
  push:
    branches: [bench/import-hotpath-screen-20260925]
    paths: [.github/workflows/import-hotpath-screen.yml]
permissions:
  contents: read
jobs:
  confirmation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dictionary: jmdict, id: jmdict, numeric: '0', flags: '{}'}
          - {dictionary: jmnedict, id: jmnedict, numeric: '0', flags: '{}'}
          - {dictionary: jitendex, id: jitendex, numeric: '0', flags: '{}'}
          - {dictionary: wty-en-en, id: wty, numeric: '0', flags: '{}'}
          - {dictionary: wty-en-en, id: wty-numeric-span, numeric: '1', flags: '{"experimentalGenericSpanCompression":true}'}
    env:
      DICTIONARY: ${{ matrix.dictionary }}
      PAIRS: '12'
      INITIAL_ORDER: AB
      FLAG: native-fallback-interner
      INCLUDE_NUMERIC: ${{ matrix.numeric }}
      COMMON_FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Build and verify the two measured packages
        run: python3 dev/perf/hotpath-round-20260925/prepare-source.py
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: hotpath-corpus-${{ runner.os }}-763627-${{ matrix.dictionary }}
      - name: Counterbalanced full imports with unchanged-code controls
        run: node dev/perf/hotpath-round-20260925/run-source.generated.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fallback-confirmation-${{ matrix.id }}
          path: |
            builds/hotpath-round
            builds/hotpath-source/build-identities.json
            dev/perf/hotpath-round-20260925/run-source.generated.mjs
          retention-days: 30
  qualify-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Validate and publish only the dedicated four-file product branch
        run: python3 dev/perf/hotpath-round-20260925/qualify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fallback-product-qualification
          path: builds/hotpath-qualification
          retention-days: 30
