name: Import hot-path qualification
on:
  push:
    branches: [bench/import-hotpath-screen-20260925]
    paths: [.github/workflows/import-hotpath-screen.yml]
permissions:
  contents: read
jobs:
  escaped-keys:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jmnedict, jitendex, wty-en-en]
    env:
      DICTIONARY: ${{ matrix.dictionary }}
      PAIRS: '6'
      FLAG: experimentalNativeEscapedKeys
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run build -- --target chrome-dev
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: hotpath-corpus-${{ runner.os }}-763627-${{ matrix.dictionary }}
      - name: Counterbalanced full imports with unchanged-code controls
        run: node dev/perf/hotpath-round-20260925/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escaped-keys-${{ matrix.dictionary }}
          path: builds/hotpath-round
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: matrix.dictionary == 'wty-en-en' && success()
        with:
          name: hotpath-verified-corpora
          path: builds/e2e-dictionary-cache/*.zip
          compression-level: 0
          retention-days: 2
