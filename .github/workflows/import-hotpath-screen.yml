name: Import hot-path qualification
on:
  push:
    branches: [bench/import-hotpath-screen-20260925]
    paths: [.github/workflows/import-hotpath-screen.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Export pinned source and built test dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/hotpath-environment"
          git rev-parse HEAD > "$RUNNER_TEMP/hotpath-environment/commit.txt"
          git archive HEAD > "$RUNNER_TEMP/hotpath-environment/source.tar"
          tar --exclude='*/.git' -czf "$RUNNER_TEMP/hotpath-environment/dependencies.tar.gz" node_modules ext/lib
          sha256sum "$RUNNER_TEMP/hotpath-environment/"*.tar* > "$RUNNER_TEMP/hotpath-environment/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: import-hotpath-pinned-environment
          path: ${{ runner.temp }}/hotpath-environment
          compression-level: 0
          retention-days: 2
