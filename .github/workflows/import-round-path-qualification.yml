name: Import round path qualification
on:
  push:
    branches: [verify/import-round-20260924-b73d]
    paths: [.github/workflows/import-round-path-qualification.yml]
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 2185eeaac05efa0fd60eea49e3f00ce3e048aabe
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci && npm run build:libs
      - name: Prove all eleven regressions fail on the pinned baseline
        run: |
          mkdir -p ../qualification-results
          cp ../transport/review-payload/mdict-import-path-identity.test.js test/
          set +e
          node node_modules/vitest/vitest.mjs run test/mdict-import-path-identity.test.js --minWorkers=1 --maxWorkers=1 --reporter=json --outputFile=../qualification-results/baseline.json
          status=$?
          set -e
          test "$status" -eq 1
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("../qualification-results/baseline.json")); if(r.numFailedTests!==11 || r.numPassedTests!==0) process.exit(1);'
          git switch -c fix/mdict-filename-identity-20260924-b73d
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/mdict-import-path-identity.test.js
          git commit -m 'test(mdict): cover whitespace-distinct files and URL resources'
      - name: Apply only the filename identity repair
        run: git apply --check ../transport/review-payload/path-fix.patch && git apply ../transport/review-payload/path-fix.patch
      - name: Focused tests and lint
        run: |
          npx eslint ext/js/dictionary/mdict-import-sources.js ext/js/pages/settings/dictionary-import-controller.js test/mdict-import-path-identity.test.js 2>&1 | tee ../qualification-results/lint.log
          node node_modules/vitest/vitest.mjs run test/mdict-import-path-identity.test.js test/mdict-import-ui-regressions.test.js --minWorkers=1 --maxWorkers=1 2>&1 | tee ../qualification-results/focused.log
      - name: All type projects
        run: npm run test:ts 2>&1 | tee ../qualification-results/types.log
      - name: Full unit suite
        run: npm run test:unit -- --minWorkers=1 --maxWorkers=2 2>&1 | tee ../qualification-results/unit.log
      - name: All build targets
        run: npm run test:build 2>&1 | tee ../qualification-results/build.log
      - name: Publish the qualified product branch without transport files
        run: |
          git add ext/js/dictionary/mdict-import-sources.js ext/js/pages/settings/dictionary-import-controller.js
          git commit -m 'fix(mdict): preserve filename identity when pairing resources'
          git diff --name-only 2185eeaac05efa0fd60eea49e3f00ce3e048aabe > ../qualification-results/changed-files.txt
          node --input-type=module -e 'import fs from "node:fs"; const a=fs.readFileSync("../qualification-results/changed-files.txt","utf8").trim().split("\n"); const b=["ext/js/dictionary/mdict-import-sources.js","ext/js/pages/settings/dictionary-import-controller.js","test/mdict-import-path-identity.test.js"]; if(JSON.stringify(a)!==JSON.stringify(b)) process.exit(1);'
          git rev-parse HEAD | tee ../qualification-results/published-head.txt
          git push origin HEAD:refs/heads/fix/mdict-filename-identity-20260924-b73d
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-round-path-qualification-b73d
          path: qualification-results/
          retention-days: 7
