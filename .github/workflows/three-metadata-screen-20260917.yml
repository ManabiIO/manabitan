name: Three dictionary metadata screen
on:
  push:
    branches: [verify/three-crc-20260917]
    paths: [.github/workflows/three-metadata-screen-20260917.yml]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/metadata-screen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51c06f03da22a416d331a9c72bf76f8435666f50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35175334044
          name: three-inflate-confirm-jitendex
          path: ${{ runner.temp }}/prior
      - name: Prepare only metadata experiments and an unchanged timing boundary
        run: |
          mkdir -p "$RUNNER_TEMP/metadata-tools" builds/metadata-screen
          git fetch --depth=1 origin 8fa1b0f70aa6ed8cb619bd7ef103fa728c5250f4
          git show FETCH_HEAD:dev/perf/metadata-round-20260917/prepare.py > "$RUNNER_TEMP/metadata-tools/prepare.py"
          git show FETCH_HEAD:dev/perf/metadata-round-20260917/test-metadata.js > test/metadata-import-experiments.test.js
          python3 "$RUNNER_TEMP/metadata-tools/prepare.py"
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'prior/source/inflate-abba.mjs'
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='70ef1cb988f56eb0b662c3d19f5b1cb5b5c843b63a872f23e3a8c79405884e29'
          s=p.read_text(); start=s.index('const variants = {'); end=s.index('\nconst selected',start)
          variants="""const variants = {
              control: {},
              sparse: {experimentalSparseMetadataSlots: true},
              allocate: {experimentalDenseMetadataAllocation: true},
              intern: {experimentalMetadataLastDictionary: true},
              all: {experimentalSparseMetadataSlots: true, experimentalDenseMetadataAllocation: true, experimentalMetadataLastDictionary: true},
          }"""
          s=s[:start]+variants+s[end:]
          s=s.replace("base: '8191f6c6997d7afc5d54e647e93af6def48dfa98'", "base: '51c06f03da22a416d331a9c72bf76f8435666f50'")
          needle='        assert.ok(parser && finalization)'
          assert s.count(needle)==1
          s=s.replace(needle,needle+"\n        for (const flag of ['experimentalSparseMetadataSlots','experimentalDenseMetadataAllocation','experimentalMetadataLastDictionary']) assert.equal(finalization[flag], entry.flags[flag] === true, `Storage flag failed: ${flag}`)")
          p.with_name('metadata-abba.mjs').write_text(s)
          PY
          git diff --check
      - run: npm ci
      - name: Build and qualify real metadata behavior before screening
        run: |
          npm run build:libs > builds/metadata-screen/libs.log 2>&1
          node node_modules/vitest/vitest.mjs run test/metadata-import-experiments.test.js test/dictionary-database-content-dedup.test.js test/term-content-block-store.test.js test/term-bank-experiments.test.js > builds/metadata-screen/focused.log 2>&1
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare common pinned fixture harness and actual Chromium package
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          p=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=p.read_text(); assert s.count('maxBuffer: 32 * 1024 * 1024')==2
          p.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/metadata-screen/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/metadata-screen/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Serial complete-import ABBA and interleaved A/A controls
        run: node "$RUNNER_TEMP/prior/source/metadata-abba.mjs" control,sparse,allocate,intern,all 2 | tee builds/metadata-screen/abba.log
      - name: Retain exact source and every observation
        if: always()
        run: |
          mkdir -p builds/metadata-screen/source
          git add -N test/metadata-import-experiments.test.js
          git diff HEAD -- ext/js types/ext test/metadata-import-experiments.test.js > builds/metadata-screen/product.patch
          cp "$RUNNER_TEMP/prior/source/metadata-abba.mjs" "$RUNNER_TEMP/metadata-tools/prepare.py" builds/metadata-screen/source/ 2>/dev/null || true
          tar -czf builds/metadata-screen/source.tar.gz ext/js/dictionary/dictionary-database.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-experiments.js types/ext/dictionary-importer.d.ts test/metadata-import-experiments.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-screen-${{ matrix.dictionary }}
          path: builds/metadata-screen
          retention-days: 30
