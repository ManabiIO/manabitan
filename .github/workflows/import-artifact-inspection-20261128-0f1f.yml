name: Inspect frozen import artifacts 20261128 0f1f

on:
  push:
    branches: ["perf/import-artifact-inspection-20261128-0f1f"]
    paths:
      - ".github/workflows/import-artifact-inspection-20261128-0f1f.yml"
      - "dev/perf/import-artifact-inspection-20261128-0f1f.py"
      - "dev/perf/import-artifact-inspection-20261128-0f1f.json"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Read and verify frozen original artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify provenance and recompute original analysis without measurements
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -u dev/perf/import-artifact-inspection-20261128-0f1f.py
