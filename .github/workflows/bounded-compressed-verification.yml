name: Verify bounded low-memory compressed imports
on:
  push:
    branches: [perf-bounded-compressed-verify-20260909]
    paths: [.github/workflows/bounded-compressed-verification.yml, 'dev/perf/bounded-compressed-experiment/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --memory=4g --cpus=4
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Container prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates curl clang lld python3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Record actual browser memory policy without overrides
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          node dev/perf/bounded-compressed-experiment/preflight.mjs "$RUNNER_TEMP/evidence/runtime-preflight.json"
      - name: Build exact independent source arms
        run: |
          set -euo pipefail
          arms="$RUNNER_TEMP/arms"
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$arms" "$evidence"
          for arm in baseline candidate; do
            git worktree add --detach "$arms/$arm" b8d68458cde8788b5d5301ceaf36beae7a1363f9
            ln -s "$GITHUB_WORKSPACE/node_modules" "$arms/$arm/node_modules"
          done
          git -C "$arms/candidate" apply --index "$GITHUB_WORKSPACE/dev/perf/bounded-compressed-experiment/source.patch"
          cp dev/perf/bounded-compressed-experiment/bounded.test.js "$arms/candidate/test/term-bank-bounded-compressed-plan.test.js"
          git -C "$arms/candidate" add test/term-bank-bounded-compressed-plan.test.js
          test "$(git -C "$arms/candidate" write-tree)" = b2946fcd9645eba26b6c124fb34d079d44cf2c51
          for arm in baseline candidate; do
            (cd "$arms/$arm" && node dev/bin/build-libs.js && node dev/bin/build.js --target chrome-dev) > "$evidence/build-$arm.log" 2>&1
          done
          for file in term-bank-parser.wasm zstd.wasm zip.js z-worker.js; do
            cmp "$arms/baseline/ext/lib/$file" "$arms/candidate/ext/lib/$file"
          done
          git -C "$arms/candidate" diff HEAD --binary > "$evidence/source.patch"
          git -C "$arms/candidate" write-tree > "$evidence/source-tree.txt"
          (cd "$arms/baseline" && node dev/perf/prepare-dictionaries.js) > "$evidence/fixtures.log" 2>&1
          ln -s "$arms/baseline/builds/e2e-dictionary-cache" "$arms/candidate/builds/e2e-dictionary-cache"
          cp dev/perf/bounded-compressed-experiment/run-paired.py "$evidence/"
          clang --version > "$evidence/compiler.txt"
      - name: Full correctness and types
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
          npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
          node dev/bin/build.js --dryRun --all > "$RUNNER_TEMP/evidence/dry-build.log" 2>&1
      - name: Native low-memory comparison only
        run: |
          set -euo pipefail
          node -e 'const p=require(process.env.RUNNER_TEMP+"/evidence/runtime-preflight.json");if(!p.nativeLowMemory)throw Error("Browser did not select low-memory policy; do not claim this lane measures bounded imports")'
          python3 dev/perf/bounded-compressed-experiment/run-paired.py --baseline "$RUNNER_TEMP/arms/baseline" --candidate "$RUNNER_TEMP/arms/candidate" --pairs 8 --warmups 1 --output "$RUNNER_TEMP/evidence/paired" --label 'PR23 vs bounded compressed batches; real 4 GiB container; native low-memory selection; eight fixed pairs' | tee "$RUNNER_TEMP/evidence/driver.log"
      - name: Strict full Chromium integration
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          MANABITAN_E2E_STRICT_RUNTIME=1 MANABITAN_CHROMIUM_HEADLESS=1 MANABITAN_E2E_SKIP_BUILD=1 MANABITAN_CHROMIUM_E2E_REPORT="$RUNNER_TEMP/evidence/full-chromium.html" node test/chromium/extension-two-dictionary-import.e2e.js > "$RUNNER_TEMP/evidence/full-chromium.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-compressed-verification
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
