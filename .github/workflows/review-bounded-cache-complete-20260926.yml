name: Bounded oversized cache complete imports
on:
  push:
    branches: [review/mdict-bounded-cache-complete-20260926]
    paths: [.github/workflows/review-bounded-cache-complete-20260926.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workload: [oversized, normal, overcap]
        cohort: [initial, confirmation]
    steps:
      - uses: actions/checkout@v6
      - name: Pin product and retain exact executed driver
        run: |
          cp dev/review/bounded-cache-complete-import-20260926.mjs /tmp/bounded-cache-driver.mjs
          git fetch --no-tags --depth=1 origin 9fe19a57864653d84dc5f7c41b6277ccd6d2f7f0 3997012b4fd04d0803f2ef39993da371ca00ee45
          git checkout --detach 9fe19a57864653d84dc5f7c41b6277ccd6d2f7f0
          mkdir -p dev/review builds/bounded-cache-completion
          cp /tmp/bounded-cache-driver.mjs dev/review/bounded-cache-complete-import-20260926.mjs
          cp /tmp/bounded-cache-driver.mjs builds/bounded-cache-completion/executed-driver.mjs
          git diff 9fe19a57864653d84dc5f7c41b6277ccd6d2f7f0 3997012b4fd04d0803f2ef39993da371ca00ee45 -- ext/ > builds/bounded-cache-completion/product.patch
          test "$(git diff --name-only 9fe19a57864653d84dc5f7c41b6277ccd6d2f7f0 3997012b4fd04d0803f2ef39993da371ca00ee45 -- ext/ | tr '\n' ' ')" = "ext/js/dictionary/mdx/mdx-converter.js ext/js/dictionary/mdx/vendor/js-mdict/mdict.js "
          git rev-parse HEAD > builds/bounded-cache-completion/product-head.txt
      - uses: ./.github/actions/setup
        with:
          node-version: '22'
      - name: Build and install browser
        run: |
          npm run build -- --target chrome-dev
          npx playwright install --with-deps chromium
      - name: Preflight both arms
        env:
          PREFLIGHT: '1'
          WORKLOAD: ${{ matrix.workload }}
        run: |
          set -o pipefail
          xvfb-run -a node dev/review/bounded-cache-complete-import-20260926.mjs "$WORKLOAD" 2>&1 | tee "builds/bounded-cache-completion/${WORKLOAD}-preflight.log"
      - name: Counterbalanced cohort with unchanged-code controls
        env:
          WORKLOAD: ${{ matrix.workload }}
          REVERSE_ORDER: ${{ matrix.cohort == 'confirmation' && '1' || '0' }}
        run: |
          set -o pipefail
          xvfb-run -a node dev/review/bounded-cache-complete-import-20260926.mjs "$WORKLOAD" 2>&1 | tee "builds/bounded-cache-completion/${WORKLOAD}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-cache-complete-${{ matrix.workload }}-${{ matrix.cohort }}
          path: builds/bounded-cache-completion/
          retention-days: 14
