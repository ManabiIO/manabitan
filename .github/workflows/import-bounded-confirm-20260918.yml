name: Final bounded lookup complete-import confirmation
on:
  push:
    branches: [research/import-structural-20260918]
    paths: [.github/workflows/import-bounded-confirm-20260918.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: source
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jmnedict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 671732a91ac2801b1acf5d5c3675fb099fefc7d0
          path: recipe
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fb7241deb70950dc113089cd774c9489ede48f8a
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - name: Correct component-only minimum without changing the import timing plan
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('../recipe/.github/workflows/import-bounded-native-20260918.yml')
          s=p.read_text(); old=' --pairs 1 --flags '; assert s.count(old)==1
          p.write_text(s.replace(old,' --pairs 2 --flags '))
          PY
      - name: Exact-source full corpus parity and fixed complete-import cohorts
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: node ../recipe/dev/perf/structural-20260918/run-v2-recipe.mjs confirm
      - name: Retain the exact executed qualification recipe
        if: always()
        run: |
          mkdir -p builds/bounded-native
          cp ../recipe/.github/workflows/import-bounded-native-20260918.yml builds/bounded-native/executed-recipe.yml
          cp ../recipe/dev/perf/structural-20260918/run-v2-recipe.mjs builds/bounded-native/run-v2-recipe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-final-confirm-${{ matrix.dictionary }}
          path: source/builds/bounded-native
          retention-days: 30
          if-no-files-found: error
