name: Import allocation comparison (frozen sources)

on:
  push:
    branches: [perf/import-study-20261123-1d04f]
    paths:
      - '.github/workflows/import-optimization-20261123-1d04f.yml'
      - 'dev/perf/import-runtime-next.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-allocation-20261123-1d04f-${{ github.ref }}
  cancel-in-progress: false

jobs:
  comparison:
    name: ${{ matrix.variant }} / ${{ matrix.dictionary }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [record-fields, projected-media]
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_BASELINE_SHA: 3d65e403c644b9a5a6be3128d72f9d30050b70e0
      PERF_CANDIDATE_SHA: ${{ matrix.variant == 'record-fields' && '10a8f09e96ff943ec1351b1391cb56fa7e20feed' || '3597a103b0f35d076587e08196caa9f5d12f53ef' }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record workflow and runner
        run: |
          mkdir -p "$RUNNER_TEMP/import-allocation-evidence"
          cp .github/workflows/import-optimization-20261123-1d04f.yml "$RUNNER_TEMP/import-allocation-evidence/workflow.yml"
          cp dev/perf/import-runtime-next.py "$RUNNER_TEMP/import-allocation-evidence/runner.py"
          git rev-parse HEAD > "$RUNNER_TEMP/import-allocation-evidence/tooling-sha.txt"
          git status --porcelain > "$RUNNER_TEMP/import-allocation-evidence/tooling-status.txt"

      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'

      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}

      - name: Compare complete imports and verify persisted media
        run: |
          set -euo pipefail
          python3 dev/perf/import-runtime-next.py \
            --baseline "$PERF_BASELINE_SHA" \
            --candidate "$PERF_CANDIDATE_SHA" \
            --dictionary "$PERF_DICTIONARY" \
            --stage screen \
            --output "$RUNNER_TEMP/import-allocation-evidence" \
            2>&1 | tee "$RUNNER_TEMP/import-allocation-evidence/study.log"

      - name: Preserve every observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-allocation-${{ matrix.variant }}-${{ matrix.dictionary }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/import-allocation-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
