name: Lazy archive browser memory
on:
  push:
    branches: [research/import-jitendex-jmdict-20260919]
    paths: [.github/workflows/import-jj-lazy-memory-20260919.yml]
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jitendex, jmdict]
    env:
      MANABITAN_CLANG: clang-18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npx playwright install --with-deps chromium
      - name: Fixed diagnostic memory comparisons
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: python dev/perf/jj-lazy-memory.py --dictionary "$DICTIONARY" --blocks 2 --out "$RUNNER_TEMP/jj-lazy-memory"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jj-lazy-memory-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/jj-lazy-memory
          retention-days: 30
          if-no-files-found: error
