name: Deep import review snapshot

on:
  push:
    branches: [review/import-lookup-deep-20260920]
    paths: [.github/workflows/deep-import-review-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package exact tracked source
        run: |
          mkdir -p /tmp/manabitan-review-artifacts
          git rev-parse HEAD > /tmp/manabitan-review-artifacts/REVISION.txt
          git archive --format=tar.gz HEAD > /tmp/manabitan-review-artifacts/source.tar.gz
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Package test dependencies
        run: tar -czf /tmp/manabitan-review-artifacts/node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-import-review-snapshot
          path: /tmp/manabitan-review-artifacts/
          retention-days: 3
          compression-level: 0
