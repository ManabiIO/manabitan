name: Stop rejected cache contiguity study 92c09

on:
  push:
    branches: ['perf/jmdict-cache-contiguity-20261128-92c09']
    paths: ['.github/workflows/import-cache-contiguity-92c09.yml']

permissions:
  contents: read

concurrency:
  group: import-cache-contiguity-92c09-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record-rejection:
    name: Record correctness rejection
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Retain cancellation reason in the job log
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          print(json.dumps({
              "decision": "Stop queued browser qualification; do not promote this candidate",
              "reason": "The cached contiguity proof can become invalid across caller callbacks",
              "rejected_source": "88f7d75422bfd9b3979c7b69eb0f5a16f69d0904",
              "superseded_run": 46105217926,
              "scope": "This study branch only; no benchmark or product execution"
          }, sort_keys=True))
          PYTHON
