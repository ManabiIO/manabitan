name: Research Libdeflate Default AB

on:
  push:
    branches:
      - research/libdeflate-default-20260929

permissions:
  contents: read

jobs:
  import-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          path: candidate

      - name: Checkout current baseline
        uses: actions/checkout@v6
        with:
          ref: 4b0ee2e40a31025e510a2f62bac073d0dff26286
          path: baseline

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install dependencies and build libraries
        working-directory: candidate
        run: |
          npm ci
          npm run build:libs

      - name: Reuse dependencies and build baseline libraries
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/candidate/node_modules" "$GITHUB_WORKSPACE/baseline/node_modules"
          (cd baseline && npm run build:libs)

      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install chromium

      - name: Prepare verified dictionaries
        working-directory: candidate
        run: node ./dev/perf/prepare-dictionaries.js

      - name: Share dictionary cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline/builds
          cp -a candidate/builds/e2e-dictionary-cache baseline/builds/

      - name: Build both extensions
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && node ./dev/bin/build.js --target chrome-dev)
          (cd candidate && node ./dev/bin/build.js --target chrome-dev)

      - name: Run six alternating pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/results"
          for dictionary in jmdict jitendex; do
            for pair in 1 2 3 4 5 6; do
              if (( pair % 2 == 1 )); then order="baseline candidate"; else order="candidate baseline"; fi
              for arm in $order; do
                out="$GITHUB_WORKSPACE/results/${dictionary}-pair${pair}-${arm}"
                echo "::group::${dictionary} pair ${pair} ${arm}"
                (cd "$arm" && node ./dev/perf/import-benchmark.js "$dictionary" --runs 1 --no-build --output "$out")
                echo "::endgroup::"
              done
            done
          done

      - name: Run four Jitendex baseline A/A pairs
        shell: bash
        run: |
          set -euo pipefail
          for pair in 1 2 3 4; do
            for sample in a b; do
              out="$GITHUB_WORKSPACE/results/jitendex-aa${pair}-${sample}"
              (cd baseline && node ./dev/perf/import-benchmark.js jitendex --runs 1 --no-build --output "$out")
            done
          done

      - name: Summarize and validate receipts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs'
          import path from 'node:path'
          const root=process.env.GITHUB_WORKSPACE
          const median=(values)=>{
            const s=[...values].sort((a,b)=>a-b)
            const m=Math.floor(s.length/2)
            return s.length%2?s[m]:(s[m-1]+s[m])/2
          }
          const load=(dir)=>{
            const x=JSON.parse(readFileSync(path.join(root,'results',dir,'summary.json'),'utf8'))
            const run=x.runs[0]
            const phases=run.importDebug?.importerPhaseTimings ?? []
            const fast=phases.find((p)=>typeof p.phase==='string' && p.phase.startsWith('term-file-fast-path:'))
            const effective=fast?.details?.parserExperiments ?? null
            if(!effective || typeof effective.experimentalLibdeflate!=='boolean'){
              throw new Error(`Missing libdeflate receipt for ${dir}`)
            }
            return {total:run.totalImportMs,worker:run.workerImportMs,libdeflate:effective.experimentalLibdeflate}
          }
          const out={candidate:process.env.GITHUB_SHA,baseline:'4b0ee2e40a31025e510a2f62bac073d0dff26286',dictionaries:{},aa:{}}
          for(const dictionary of ['jmdict','jitendex']){
            const pairs=[]
            for(let pair=1;pair<=6;++pair){
              const a=load(`${dictionary}-pair${pair}-baseline`)
              const b=load(`${dictionary}-pair${pair}-candidate`)
              if(a.libdeflate!==false) throw new Error(`Baseline libdeflate unexpectedly active: ${dictionary} pair ${pair}`)
              if(b.libdeflate!==true) throw new Error(`Candidate libdeflate inactive: ${dictionary} pair ${pair}`)
              pairs.push({
                pair,
                baselineMs:a.total,
                candidateMs:b.total,
                changePct:(b.total/a.total-1)*100,
                workerBaselineMs:a.worker,
                workerCandidateMs:b.worker,
                workerChangePct:(b.worker/a.worker-1)*100,
              })
            }
            out.dictionaries[dictionary]={
              pairs,
              pairedMedianChangePct:median(pairs.map(x=>x.changePct)),
              fasterPairs:pairs.filter(x=>x.candidateMs<x.baselineMs).length,
              workerPairedMedianChangePct:median(pairs.map(x=>x.workerChangePct)),
            }
          }
          const aa=[]
          for(let pair=1;pair<=4;++pair){
            const a=load(`jitendex-aa${pair}-a`)
            const b=load(`jitendex-aa${pair}-b`)
            if(a.libdeflate||b.libdeflate) throw new Error('A/A baseline receipt unexpectedly active')
            const change=(b.total/a.total-1)*100
            aa.push({pair,aMs:a.total,bMs:b.total,changePct:change,absoluteChangePct:Math.abs(change)})
          }
          out.aa.jitendex={
            pairs:aa,
            medianAbsoluteChangePct:median(aa.map(x=>x.absoluteChangePct)),
            signedMedianChangePct:median(aa.map(x=>x.changePct)),
            maxAbsoluteChangePct:Math.max(...aa.map(x=>x.absoluteChangePct)),
          }
          writeFileSync(path.join(root,'results','summary-ab.json'),JSON.stringify(out,null,2))
          console.log(JSON.stringify(out,null,2))
          NODE

      - uses: actions/upload-artifact@v6
        with:
          name: libdeflate-default-screen
          path: results
          retention-days: 7
