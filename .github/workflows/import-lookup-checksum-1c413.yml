name: Lookup checksum import experiment 20261128

on:
  push:
    branches: [perf/lookup-native-hash-20261128]
    paths:
      - 'ext/js/dictionary/term-record-opfs-store.js'
      - 'ext/js/dictionary/dictionary-database.js'
      - 'ext/js/dictionary/term-record-checksum.js'
      - 'ext/js/dictionary/wasm/term-record-checksum.c'
      - 'dev/data/dictionary-wasm/**'
      - 'test/term-record-checksum.test.js'
      - 'test/term-record-import-checksum.test.js'
      - 'dev/perf/lookup-checksum-20261128/verify-control.py'
      - 'dev/perf/lookup-checksum-20261128/audit-activation.py'
      - 'dev/perf/lookup-checksum-20261128/test_protocol.py'
      - 'dev/perf/lookup-checksum-20261128/PLAN.md'
      - '.github/workflows/import-lookup-checksum-1c413.yml'

permissions:
  contents: read

concurrency:
  group: lookup-checksum-1c413-${{ github.ref }}
  cancel-in-progress: false

env:
  PERF_ORIGINAL_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
  PERF_BASELINE: 5ac6a79d9bcf99673922df2c39174078dccbb62d
  PERF_CANDIDATE: ${{ github.sha }}

jobs:
  correctness:
    name: Native rebuild, unit tests, types, and dry build
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prove the asset-only control and frozen runtime boundary
        run: |
          python dev/perf/lookup-checksum-20261128/verify-control.py \
            --original "$PERF_ORIGINAL_BASELINE" --control "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --output builds/perf/lookup-checksum-validation/control-proof.json
      - name: Install pinned dictionary WASM toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21
      - name: Validate the activation witness and unchanged receipt boundary
        run: python -m unittest discover -s dev/perf/lookup-checksum-20261128 -p 'test_*.py'
      - name: Verify native rebuild and changed source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/perf/lookup-checksum-validation
          npm run build:dictionary-wasm -- --check 2>&1 | tee builds/perf/lookup-checksum-validation/native-build.log
          npx eslint ext/js/dictionary/term-record-checksum.js ext/js/dictionary/term-record-opfs-store.js ext/js/dictionary/dictionary-database.js 2>&1 | tee builds/perf/lookup-checksum-validation/runtime-lint.log
          npx eslint test/term-record-checksum.test.js test/term-record-import-checksum.test.js test/dictionary-wasm-build.test.js 2>&1 | tee builds/perf/lookup-checksum-validation/test-lint.log
          npx eslint dev/dictionary-wasm.js dev/bin/audit-release-packages.js eslint.config.js 2>&1 | tee builds/perf/lookup-checksum-validation/build-lint.log
      - name: Complete unit suite
        shell: bash
        run: |
          set -euo pipefail
          npm run test:unit 2>&1 | tee builds/perf/lookup-checksum-validation/unit.log
      - name: Type validation
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ts 2>&1 | tee builds/perf/lookup-checksum-validation/types.log
      - name: All-target dry build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/perf/lookup-checksum-validation
          npm run test:build 2>&1 | tee builds/perf/lookup-checksum-validation/dry-build.log
      - name: Preserve correctness results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lookup-checksum-validation-${{ github.sha }}
          path: builds/perf/lookup-checksum-validation
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Complete import (${{ matrix.dictionary }}, ${{ matrix.initial_order }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        initial_order: [AB, BA]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_INITIAL_ORDER: ${{ matrix.initial_order }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Prove the asset-only control and frozen runtime boundary
        run: |
          python dev/perf/lookup-checksum-20261128/verify-control.py \
            --original "$PERF_ORIGINAL_BASELINE" --control "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --output builds/perf/lookup-checksum-control-proof.json
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Run frozen comparisons and separate media and memory verification
        shell: bash
        run: |
          set -euo pipefail
          allocation=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            allocation+=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" --initial-order "$PERF_INITIAL_ORDER" \
            --pairs 12 \
            --expected-package-entry js/dictionary/term-record-opfs-store.js \
            --expected-package-entry js/dictionary/dictionary-database.js \
            "${allocation[@]}" \
            --evidence builds/perf/lookup-checksum-comparison
      - name: Verify native activation in every original observation
        if: always()
        run: python dev/perf/lookup-checksum-20261128/audit-activation.py --evidence builds/perf/lookup-checksum-comparison
      - name: Preserve every observation, package, and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lookup-checksum-${{ matrix.dictionary }}-${{ matrix.initial_order }}-${{ github.sha }}
          path: |
            builds/perf/lookup-checksum-comparison
            builds/perf/lookup-checksum-control-proof.json
          if-no-files-found: error
          retention-days: 14
