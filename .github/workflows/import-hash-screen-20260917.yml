name: Single-pass block hash component screen
on:
  push:
    branches: [verify/import-shared-round3-20260917]
    paths:
      - .github/workflows/import-hash-screen-20260917.yml
      - dev/perf/import-round3-20260917/hash-bench.mjs
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f407e86fae0d3e39f506e6b1ce30886697698ea
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Exact equality and ABBA throughput gate
        run: |
          mkdir -p builds/hash-screen
          git fetch --depth=1 origin ${{ github.sha }}
          git show FETCH_HEAD:dev/perf/import-round3-20260917/hash-bench.mjs > "$RUNNER_TEMP/hash-bench.mjs"
          sed "s#../../../ext/js/dictionary/term-entry-content-hash.js#${GITHUB_WORKSPACE}/ext/js/dictionary/term-entry-content-hash.js#" "$RUNNER_TEMP/hash-bench.mjs" > builds/hash-screen/hash-bench.mjs
          node builds/hash-screen/hash-bench.mjs > builds/hash-screen/result.json
          git rev-parse HEAD HEAD^{tree} > builds/hash-screen/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-pass-hash-screen
          path: builds/hash-screen
          retention-days: 30
