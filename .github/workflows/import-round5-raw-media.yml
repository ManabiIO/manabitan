name: Bounded full-buffer media import comparison
on:
  push:
    branches: [verify/import-round5-20260915]
    paths: [.github/workflows/import-round5-raw-media.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f003e43d2277331e8889e947e968cf1230f015c0
          persist-credentials: false
      - name: Prepare immutable raw-media candidate driver
        run: |
          cp -a dev/perf/round5-20260915 "$RUNNER_TEMP/round5-review"
          git fetch --depth=1 origin b4094a423c20bb0ed424d944238f922c1b36559c
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'round5-review/screen.py'
          s=p.read_text().replace("('media-local', 'media-streams', 'cdict', 'exports-control')", "('media-local', 'media-streams', 'cdict', 'exports-control', 'raw-media')")
          old="if variant.startswith('media-'):"
          insertion='''additions = set()
          if variant == 'raw-media':
              apply(candidate,'raw-media')
              changed = ['ext/js/dictionary/dictionary-importer.js','dev/build-libs.js',
                  'ext/js/dictionary/media-inflater.js','ext/js/dictionary/wasm/media-inflate.c']
              hashes = ['c46fad276771ea807bb3734d18c70432f77064200a264de3e74dd8f1ea6ef17e',
                  '23093b938fd91912d9eb495ac13c6d69384975deb764dc7aa2057bd0cb830d03',
                  'fdee51f5994af7df48725491d145005ef282d032a17a4057400afbc9e97e5e39',
                  '1b975c40616f1fbd23e43ad639e44741cd8468116ab0b4cbaa0ba8a462b2b713']
              for f,expected in zip(changed,hashes): assert sha(candidate/f)==expected, f
              with (OUT/'native-build.log').open('w') as log:
                  subprocess.run(['npm','run','build:libs'],cwd=candidate,stdout=log,stderr=subprocess.STDOUT,check=True)
              assert sha(ROOT/'ext/lib/term-bank-parser.wasm')==sha(candidate/'ext/lib/term-bank-parser.wasm')
              with (OUT/'native-conformance.log').open('w') as log:
                  subprocess.run(['node',str(REVIEW/'raw-conformance.mjs'),'ext/lib/media-inflate.wasm'],
                      cwd=candidate,stdout=log,stderr=subprocess.STDOUT,timeout=90,check=True)
              shutil.copy(REVIEW/'raw-conformance.mjs',OUT/'raw-conformance.mjs')
              replacements = {'js/dictionary/dictionary-importer.js'}
              additions = {'js/dictionary/media-inflater.js','js/dictionary/wasm/media-inflate.c','lib/media-inflate.wasm'}
          elif variant.startswith('media-'):'''
          assert s.count(old)==2
          s=s.replace(old,insertion,1)
          s=s.replace("if variant.startswith('media-'):\n    with (OUT/'focused.log')", "if variant.startswith('media-') or variant == 'raw-media':\n    with (OUT/'focused.log')")
          old="with zipfile.ZipFile(ROOT/PACKAGE) as a, zipfile.ZipFile(candidate/PACKAGE) as b:\n    assert a.namelist()==b.namelist()\n    actual = {n for n in a.namelist() if a.read(n)!=b.read(n)}"
          new="    for name in sorted(additions): b.writestr(name,(candidate/'ext'/name).read_bytes())\nwith zipfile.ZipFile(ROOT/PACKAGE) as a, zipfile.ZipFile(candidate/PACKAGE) as b:\n    assert set(b.namelist()) == set(a.namelist()) | additions\n    actual = {n for n in a.namelist() if a.read(n)!=b.read(n)}"
          assert old in s
          s=s.replace(old,new)
          s=s.replace("'changedPackageMembers':sorted(actual)", "'changedPackageMembers':sorted(actual),'addedPackageMembers':sorted(additions)")
          old="'hashes':{p:sha(directory/p) for p in [str(PACKAGE),'test/perf/dictionaries.lock.json',"
          new="'hashes':{p:sha(directory/p) if (directory/p).exists() else None for p in [str(PACKAGE),'test/perf/dictionaries.lock.json',"
          assert old in s
          s=s.replace(old,new)
          old='    assert receipts\n'
          new='''    assert receipts
              native_count = sum((p.get('details') or {}).get('nativeMediaFiles',0) for p in measurement['importDebug']['importerPhaseTimings'])
              if item['binary']=='B' and dictionary=='jitendex': assert native_count > 0, 'Native media route did not execute'
              else: assert native_count == 0
          '''
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round5-review/screen.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch complete checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - run: node dev/bin/build.js --target chrome-dev
      - name: Native conformance and six alternating source pairs
        env:
          CANDIDATE: raw-media
          DICTIONARY: ${{ matrix.dictionary }}
        run: python3 "$RUNNER_TEMP/round5-review/screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round5-raw-media-${{ matrix.dictionary }}
          path: builds/round5
          retention-days: 30
