name: Apply browser CI runtime diagnostic fixes

on:
  push:
    branches:
      - fix/ci-browser-runtime-diagnostics-20260914
    paths:
      - .github/workflows/apply-ci-browser-runtime-fixes.yml
      - dev/apply-ci-browser-runtime-fixes.py

permissions:
  contents: write

concurrency:
  group: apply-ci-browser-runtime-fixes
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:libs

      - name: Reproduce Chromium readiness false negative from recorded worker diagnostics
        shell: bash
        run: |
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const runtime = {
            hasStorageGetDirectory: true,
            hasCreateSyncAccessHandle: false,
            hasOpfsSahpoolVfs: true,
            openStorageMode: 'opfs-sahpool',
            openStorageDiagnostics: {
              runtimeContext: {
                hasStorageGetDirectory: true,
                hasCreateSyncAccessHandle: true,
              },
            },
          };
          const oldReady = (
            runtime.hasStorageGetDirectory === true &&
            runtime.hasCreateSyncAccessHandle === true &&
            runtime.hasOpfsSahpoolVfs === true &&
            runtime.openStorageMode === 'opfs-sahpool'
          );
          const worker = runtime.openStorageDiagnostics.runtimeContext;
          const expectedReady = (
            (runtime.hasStorageGetDirectory === true || worker.hasStorageGetDirectory === true) &&
            (runtime.hasCreateSyncAccessHandle === true || worker.hasCreateSyncAccessHandle === true) &&
            runtime.hasOpfsSahpoolVfs === true &&
            runtime.openStorageMode === 'opfs-sahpool'
          );
          assert.equal(oldReady, false);
          assert.equal(expectedReady, true);
          console.log('Confirmed old CI predicate rejects a runtime that actually opened opfs-sahpool in the worker.');
          NODE

      - name: Capture inherited Firefox harness diagnostics before patch
        shell: bash
        run: |
          mkdir -p /tmp/browser-ci-fix
          set +e
          npx eslint test/firefox/extension-two-dictionary-import.e2e.js --format=json --output-file=/tmp/browser-ci-fix/eslint-before.json
          echo "eslint-before=$?" > /tmp/browser-ci-fix/status-before.txt
          npm run test:ts:test > /tmp/browser-ci-fix/types-before.log 2>&1
          echo "types-before=$?" >> /tmp/browser-ci-fix/status-before.txt
          set -e

      - name: Apply CI and Firefox harness fixes
        run: python dev/apply-ci-browser-runtime-fixes.py

      - name: Reject new Firefox lint or type diagnostics while preserving baseline debt
        shell: bash
        run: |
          set +e
          npx eslint test/firefox/extension-two-dictionary-import.e2e.js --format=json --output-file=/tmp/browser-ci-fix/eslint-after.json
          echo "eslint-after=$?" > /tmp/browser-ci-fix/status-after.txt
          npm run test:ts:test > /tmp/browser-ci-fix/types-after.log 2>&1
          echo "types-after=$?" >> /tmp/browser-ci-fix/status-after.txt
          set -e
          python - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          root = Path('/tmp/browser-ci-fix')

          def lint_errors(name):
              counter = Counter()
              for result in json.loads((root / name).read_text()):
                  for message in result.get('messages', []):
                      if message.get('severity') == 2:
                          counter[(message.get('ruleId'), message.get('message'))] += 1
              return counter

          def type_errors(name):
              counter = Counter()
              pattern = re.compile(r'test/firefox/extension-two-dictionary-import\.e2e\.js\(\d+,\d+\): error (TS\d+): (.*)')
              for line in (root / name).read_text().splitlines():
                  match = pattern.search(line)
                  if match:
                      counter[match.groups()] += 1
              return counter

          lint_before = lint_errors('eslint-before.json')
          lint_after = lint_errors('eslint-after.json')
          types_before = type_errors('types-before.log')
          types_after = type_errors('types-after.log')
          new_lint = lint_after - lint_before
          new_types = types_after - types_before
          summary = {
              'lint_before': sum(lint_before.values()),
              'lint_after': sum(lint_after.values()),
              'new_lint': [{'diagnostic': key, 'count': count} for key, count in new_lint.items()],
              'types_before': sum(types_before.values()),
              'types_after': sum(types_after.values()),
              'new_types': [{'diagnostic': key, 'count': count} for key, count in new_types.items()],
          }
          (root / 'diagnostic-comparison.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          if new_lint or new_types:
              raise SystemExit('Browser CI patch introduced new Firefox-file static diagnostics.')
          PY

      - name: Validate patched source predicates and deterministic UUID path
        shell: bash
        run: |
          node --check test/firefox/extension-two-dictionary-import.e2e.js
          git diff --check
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/ci.yml').read_text()
          firefox = Path('test/firefox/extension-two-dictionary-import.e2e.js').read_text()
          assert workflow.count('workerRuntimeContext?.hasCreateSyncAccessHandle === true') == 4
          assert workflow.count('workerRuntimeContext?.hasStorageGetDirectory === true') == 4
          assert 'const handlesUnknown = /** @type {unknown} */ (await driver.getAllWindowHandles());' not in firefox
          assert 'moz-extension://${firefoxDevExtensionUuid}' in firefox
          print('Confirmed worker-context OPFS predicates and deterministic Firefox startup UUID path.')
          PY

      - name: Commit only qualified CI/harness changes and self-clean
        shell: bash
        run: |
          git fetch origin fix/ci-browser-runtime-diagnostics-20260914
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci.yml test/firefox/extension-two-dictionary-import.e2e.js
          git rm .github/workflows/apply-ci-browser-runtime-fixes.yml dev/apply-ci-browser-runtime-fixes.py
          git diff --cached --stat > /tmp/browser-ci-fix/commit-stat.txt
          git commit -m 'Fix browser E2E runtime capability detection and Firefox UUID discovery'
          git rev-parse HEAD > /tmp/browser-ci-fix/verified-commit.txt
          git push origin HEAD:fix/ci-browser-runtime-diagnostics-20260914

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ci-fix-${{ github.run_id }}
          path: /tmp/browser-ci-fix
          if-no-files-found: warn
