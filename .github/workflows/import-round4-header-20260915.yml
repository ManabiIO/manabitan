name: Validated reference header import comparison
on:
  push:
    branches: [verify/import-round4-20260915]
    paths: [.github/workflows/import-round4-header-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 91da5153ca59fa19acddccb0daa6fa034cda0505
          persist-credentials: false
      - name: Preserve reviewed inputs and fetch exact baseline
        run: |
          cp -a dev/perf/round4-20260915 "$RUNNER_TEMP/round4-review"
          git fetch --depth=1 origin 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round4-review/source-screen.py'
          s = p.read_text()
          assert s.count('CANDIDATES = {') == 1
          p.write_text(s.replace('CANDIDATES = {', "CANDIDATES = {\n    'reference-header': ('term-content-block-store.js', '21d402db6433f7a59e2847355279abd0a75288f9c449dd6c59289fc5792cf1a4'),"))
          PY
          python3 -m py_compile "$RUNNER_TEMP/round4-review/source-screen.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - run: node dev/bin/build.js --target chrome-dev
      - name: Fixed six-pair comparison
        env:
          CANDIDATE: reference-header
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: python3 "$RUNNER_TEMP/round4-review/source-screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-reference-header-${{ matrix.dictionary }}
          path: builds/round4-screen
          retention-days: 30
