name: Current-base canonical checksum BA confirmation 20261128 beb5

on:
  push:
    branches: ['test/canonical-current-confirmation-20261128-beb5']
    paths:
      - '.github/workflows/canonical-current-confirmation-beb5.yml'

permissions:
  contents: read

env:
  CANDIDATE_COMMIT: dcbbab6d1bfcebede50969f6d4b23e4f09561aa3

jobs:
  source-checks:
    name: Frozen canonical checksum source and static gates
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MANABITAN_CLANG: /usr/bin/clang-21
      MANABITAN_WASM_LD: /usr/bin/wasm-ld-21
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify unchanged acquisition and qualification rules
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py' -v
      - name: Verify prospective source bindings without a benchmark
        run: python dev/perf/canonical-current-confirmation-20261128-beb5/run.py jmdict --verify-only --evidence builds/perf/canonical-current-source-beb5/source-preflight
      - name: Install pinned compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21
      - name: Prepare exact product checkout for source gates
        shell: bash
        run: |
          git worktree add --detach builds/canonical-current-source-runtime "$CANDIDATE_COMMIT"
          ln -s "$GITHUB_WORKSPACE/node_modules" builds/canonical-current-source-runtime/node_modules
          mkdir -p builds/perf/canonical-current-source-beb5
      - name: Build source-bound third-party assets
        working-directory: builds/canonical-current-source-runtime
        run: npm run build:libs
      - name: Complete JavaScript lint
        working-directory: builds/canonical-current-source-runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run test:js 2>&1 | tee "$GITHUB_WORKSPACE/builds/perf/canonical-current-source-beb5/lint.log"
      - name: Complete type validation
        working-directory: builds/canonical-current-source-runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ts 2>&1 | tee "$GITHUB_WORKSPACE/builds/perf/canonical-current-source-beb5/types.log"
      - name: Reproduce the exact frozen native bytes
        working-directory: builds/canonical-current-source-runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run build:dictionary-wasm -- --check 2>&1 | tee "$GITHUB_WORKSPACE/builds/perf/canonical-current-source-beb5/native-build.log"
      - name: Complete all-target build dry run
        working-directory: builds/canonical-current-source-runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run test:build 2>&1 | tee "$GITHUB_WORKSPACE/builds/perf/canonical-current-source-beb5/build-dry-run.log"
      - name: Complete JSON format gate
        working-directory: builds/canonical-current-source-runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run test:json:format 2>&1 | tee "$GITHUB_WORKSPACE/builds/perf/canonical-current-source-beb5/json-format.log"
      - name: Retain source-gate evidence after any failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-current-source-beb5
          path: builds/perf/canonical-current-source-beb5
          if-no-files-found: error
          retention-days: 14

  units:
    name: Frozen canonical checksum complete unit suite
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MANABITAN_CLANG: /usr/bin/clang-21
      MANABITAN_WASM_LD: /usr/bin/wasm-ld-21
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned compiler and versioned default linker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21
      - name: Verify the exact unchanged unit-test compiler probe
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {execFileSync} from 'node:child_process'
          import {mkdirSync, writeFileSync} from 'node:fs'
          import {findCompiler} from './test/util/wasm-compiler.js'
          const output = 'builds/perf/canonical-current-units-beb5'
          mkdirSync(output, {recursive: true})
          const compiler = findCompiler(output)
          assert.equal(compiler.command, process.env.MANABITAN_CLANG)
          const compilerVersion = execFileSync(compiler.command, ['--version'], {encoding: 'utf8'})
          const linkerVersion = execFileSync('wasm-ld-21', ['--version'], {encoding: 'utf8'})
          assert.match(compilerVersion, /\bversion 21\.1\.8(?:\s|$)/)
          assert.match(linkerVersion, /\bLLD 21\.1\.8(?:\s|$)/)
          const receipt = {compiler, compilerVersion, linkerVersion, exactRepositoryProbePassed: true}
          writeFileSync(output + '/compiler-probe.json', JSON.stringify(receipt, null, 2) + '\n')
          console.log(JSON.stringify(receipt))
          JS
      - name: Complete unit suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/perf/canonical-current-units-beb5
          npm run test:unit 2>&1 | tee builds/perf/canonical-current-units-beb5/unit.log
      - name: Retain full unit output after any failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-current-units-beb5
          path: builds/perf/canonical-current-units-beb5
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Canonical checksum imports (${{ matrix.dictionary }}, 12 BA-start pairs)
    needs: [source-checks, units]
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Execute the frozen BA-start 42-observation protocol
        run: python dev/perf/canonical-current-confirmation-20261128-beb5/run.py "$PERF_DICTIONARY" --evidence "builds/perf/canonical-current-confirmation-beb5/$PERF_DICTIONARY"
      - name: Independently audit original complete or partial receipts
        if: always()
        run: python dev/perf/canonical-current-confirmation-20261128-beb5/audit-browser.py "builds/perf/canonical-current-confirmation-beb5/$PERF_DICTIONARY" --out "builds/perf/canonical-current-confirmation-beb5/$PERF_DICTIONARY/independent-audit.json"
      - name: Retain every original package, observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-current-confirmation-beb5-${{ matrix.dictionary }}-BA
          path: builds/perf/canonical-current-confirmation-beb5/${{ matrix.dictionary }}
          if-no-files-found: error
          retention-days: 14
