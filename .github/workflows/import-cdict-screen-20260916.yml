name: Prepared Zstd dictionary full-import screen
on:
  push:
    branches: [verify/import-crc-lifetime-20260916]
    paths: [.github/workflows/import-cdict-screen-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c6bf1c6522e14847ae083250b9f645720cb13d6d
          persist-credentials: false
      - name: Preserve immutable candidate and driver then pin production baseline
        run: |
          mkdir -p "$RUNNER_TEMP/cdict-inputs"
          cp dev/perf/cdict-20260916/{apply,screen}.py "$RUNNER_TEMP/cdict-inputs/"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'cdict-inputs/screen.py'
          s = p.read_text()
          old = "change=json.loads(run(['python3',str(inputs/'apply.py'),variant],candidate))\nzstd_build(candidate,True,'candidate-zstd-build.log')"
          new = '\n'.join([
              "change=json.loads(run(['python3',str(inputs/'apply.py'),variant],candidate))",
              "term=candidate/'ext/js/dictionary/zstd-term-content.js'",
              "text=term.read_text()",
              "assert text.count('ReturnType<typeof prepareSpanCompression>') == 2",
              "term.write_text(text.replace('ReturnType<typeof prepareSpanCompression>', 'ReturnType<typeof prepareSpanCompressionUsingCDict>'))",
              "zstd_build(candidate,True,'candidate-zstd-build.log')",
          ])
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          python3 -m py_compile "$RUNNER_TEMP/cdict-inputs/"*.py
          git fetch --depth=1 origin c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          git checkout --detach c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify complete checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Pull recorded Emscripten toolchain
        run: docker pull emscripten/emsdk:5.0.1
      - name: Six alternating whole-import pairs with interleaved A/A controls
        env:
          CANDIDATE: cdict
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: |
          mkdir -p builds/cdict-review
          python3 "$RUNNER_TEMP/cdict-inputs/screen.py" 2>&1 | tee builds/cdict-review/driver.log
      - name: Preserve exact driver and candidate assets
        if: always()
        run: |
          mkdir -p builds/cdict-review/executed-inputs
          cp "$RUNNER_TEMP/cdict-inputs/"*.py builds/cdict-review/executed-inputs/
          if test -f "$RUNNER_TEMP/cdict-candidate/dev/data/zstd-simd.wasm"; then
            tar -czf builds/cdict-review/candidate-assets.tar.gz -C "$RUNNER_TEMP/cdict-candidate" dev/lib/zstd-wasm.js dev/lib/zstd-simd-module.js dev/lib/zstd-simd-module.d.ts dev/data/zstd-simd.wasm ext/js/dictionary/zstd-term-content.js
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdict-screen-${{ matrix.dictionary }}
          path: builds/cdict-review
          retention-days: 30
