name: Import optimization screen 5ccd

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/import-screen-20261125-5ccd.yml'
      - 'dev/perf/import-screen-20261125-5ccd.py'

permissions:
  contents: read

jobs:
  screen:
    if: github.head_ref == 'bench/import-screen-20261125-5ccd'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install matching browser
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Compare fixed source revisions
        env:
          PERF_DICTIONARY: ${{ matrix.dictionary }}
        run: python3 dev/perf/import-screen-20261125-5ccd.py
      - name: Preserve every observation and setup receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-screen-5ccd-${{ matrix.dictionary }}
          path: builds/perf/import-screen-5ccd
          if-no-files-found: error
          retention-days: 14
