name: Qualify legacy index tags

on:
  push:
    branches:
      - audit/legacy-index-tags-20260924-1609
    paths:
      - .github/workflows/qualify-legacy-index-tags.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 2185eeaac05efa0fd60eea49e3f00ce3e048aabe
          path: qualified
      - uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
      - name: Verify and apply the reviewed patch
        working-directory: qualified
        run: |
          echo '3ce9f80264e1ebab6edec84cdb71e8aca88655a5b1473fc869e24b375d2d8953  ../transport/review/legacy-tags.patch' | sha256sum -c -
          git apply --check ../transport/review/legacy-tags.patch
          git apply ../transport/review/legacy-tags.patch
          echo 'e843edd90c43b7f25c35d4c0531219e5c2242a4ab2237e41c55bbeef32e75f52  ext/js/dictionary/dictionary-importer.js' | sha256sum -c -
          echo 'cd61bf510d9768b41db29cb5e72cb4b0f23af5c5a1d83cc85528139c1cbc93a5  test/dictionary-importer-legacy-tags.test.js' | sha256sum -c -
          npm ci
          npm run build:libs
      - name: Reproduce the six failures on the unmodified importer
        working-directory: qualified
        run: |
          cp ext/js/dictionary/dictionary-importer.js "$RUNNER_TEMP/fixed-importer.js"
          git restore ext/js/dictionary/dictionary-importer.js
          set +e
          node node_modules/vitest/vitest.mjs run test/dictionary-importer-legacy-tags.test.js --reporter=json --outputFile="$RUNNER_TEMP/legacy-before.json"
          result=$?
          set -e
          test "$result" -ne 0
          node -e 'const r=require(process.argv[1]); if(r.numFailedTests!==6 || r.numPassedTests!==4) throw Error(JSON.stringify(r));' "$RUNNER_TEMP/legacy-before.json"
          cp "$RUNNER_TEMP/fixed-importer.js" ext/js/dictionary/dictionary-importer.js
      - name: Focused regressions, lint and types
        working-directory: qualified
        run: |
          node node_modules/vitest/vitest.mjs run test/dictionary-importer-legacy-tags.test.js test/dictionary-importer-zip-filename-alias.test.js test/dictionary-import-publication-cleanup.test.js --reporter=json --outputFile="$RUNNER_TEMP/legacy-after.json"
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/dictionary-importer.js test/dictionary-importer-legacy-tags.test.js
          npm run test:ts
      - name: Complete unit suite
        working-directory: qualified
        run: npm run test:unit
      - name: All-target dry build
        working-directory: qualified
        run: npm run test:build
      - name: Publish only the qualified source and tests
        working-directory: qualified
        run: |
          echo 'e843edd90c43b7f25c35d4c0531219e5c2242a4ab2237e41c55bbeef32e75f52  ext/js/dictionary/dictionary-importer.js' | sha256sum -c -
          echo 'cd61bf510d9768b41db29cb5e72cb4b0f23af5c5a1d83cc85528139c1cbc93a5  test/dictionary-importer-legacy-tags.test.js' | sha256sum -c -
          git checkout -b fix/import-legacy-index-tags-20260924-1609
          git config user.name 'Manabitan review'
          git config user.email 'review@users.noreply.github.com'
          git add ext/js/dictionary/dictionary-importer.js test/dictionary-importer-legacy-tags.test.js
          git -c core.hooksPath=/dev/null commit -m 'fix(import): import legacy index tags exactly once'
          git push origin HEAD:refs/heads/fix/import-legacy-index-tags-20260924-1609
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-index-tag-regressions
          path: ${{ runner.temp }}/legacy-*.json
          retention-days: 7
          if-no-files-found: warn
