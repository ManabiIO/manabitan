name: Baseline import profiles 20261128

on:
  push:
    branches: [perf/import-baseline-profiles-20261128-1c413]
    paths: ['.github/workflows/import-baseline-profile-1c413.yml']

permissions:
  contents: read

concurrency:
  group: baseline-import-profiles-1c413-${{ github.ref }}
  cancel-in-progress: false

env:
  PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2

jobs:
  trace:
    if: github.run_attempt == 1
    name: Diagnostic trace (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify unchanged product and measurement sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/perf/baseline-import-profile
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          baseline = os.environ['PERF_BASELINE']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip()
          changed = subprocess.check_output(['git', 'diff', '--name-only', baseline, head]).decode().splitlines()
          assert changed == ['.github/workflows/import-baseline-profile-1c413.yml'], changed
          files = [
              'dev/perf/import-benchmark.js',
              'dev/perf/benchmark-support.js',
              'test/chromium/extension-two-dictionary-import.e2e.js',
              'test/perf/dictionaries.lock.json',
              'dev/data/dictionary-wasm/manifest.json',
              'dev/data/dictionary-wasm/term-bank-parser.wasm',
              'dev/data/dictionary-wasm/term-content-canonical-scan-v1.wasm',
              '.github/workflows/import-baseline-profile-1c413.yml',
          ]
          report = {
              'diagnosticOnly': True,
              'authoritativeTiming': False,
              'baseline': baseline,
              'workflowHead': head,
              'dictionary': os.environ['PERF_DICTIONARY'],
              'productAndMeasurementSourcesUnchanged': True,
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'schedule': 'one original traced production import per dictionary; no reruns or timing comparisons',
              'sourceSha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files},
              'scope': 'Existing browser-wide V8/DevTools trace through import-worker completion; samples and overlapping phase counters describe work, not an uninstrumented duration or a speedup',
          }
          pathlib.Path('builds/perf/baseline-import-profile/source-identity.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: ./.github/actions/setup
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Capture one diagnostic import trace
        shell: bash
        run: |
          set -euo pipefail
          node dev/perf/import-benchmark.js "$PERF_DICTIONARY" \
            --trace --runs 1 --build-target chrome --media-check sample \
            --output builds/perf/baseline-import-profile/import \
            2>&1 | tee builds/perf/baseline-import-profile/import.log
      - name: Preserve trace, report, source binding, and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-import-profile-${{ matrix.dictionary }}-${{ github.sha }}
          path: builds/perf/baseline-import-profile
          if-no-files-found: error
          retention-days: 14
