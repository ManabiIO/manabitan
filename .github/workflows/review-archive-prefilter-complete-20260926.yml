name: Archive prefilter complete imports
# independent repeat cohort 2
on:
  push:
    branches: [review/archive-prefilter-complete-20260926]
    paths: [.github/workflows/review-archive-prefilter-complete-20260926.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cohort: [initial, confirmation]
    steps:
      - uses: actions/checkout@v6
      - name: Pin product and retain exact driver
        run: |
          cp dev/review/archive-prefilter-complete-import-20260926.mjs /tmp/archive-driver.mjs
          git fetch --no-tags --depth=1 origin 65294053e65f7e45937d51dbc3cab70543f327e4 a3e50fdfd01774502e3b3b3d9ed557062d95b299
          git checkout --detach 65294053e65f7e45937d51dbc3cab70543f327e4
          mkdir -p dev/review builds/archive-prefilter-completion
          cp /tmp/archive-driver.mjs dev/review/archive-prefilter-complete-import-20260926.mjs
          cp /tmp/archive-driver.mjs builds/archive-prefilter-completion/executed-driver.mjs
          git diff 65294053e65f7e45937d51dbc3cab70543f327e4 a3e50fdfd01774502e3b3b3d9ed557062d95b299 -- ext/ > builds/archive-prefilter-completion/product.patch
          test "$(git diff --name-only 65294053e65f7e45937d51dbc3cab70543f327e4 a3e50fdfd01774502e3b3b3d9ed557062d95b299 -- ext/)" = ext/js/dictionary/dictionary-importer.js
          node --check dev/review/archive-prefilter-complete-import-20260926.mjs
      - uses: ./.github/actions/setup
        with:
          node-version: '22'
      - name: Build and install browser
        run: |
          npm run build -- --target chrome-dev
          npx playwright install --with-deps chromium
      - name: Preflight both arms
        env:
          PREFLIGHT: '1'
        run: |
          set -o pipefail
          xvfb-run -a node dev/review/archive-prefilter-complete-import-20260926.mjs 2>&1 | tee builds/archive-prefilter-completion/preflight.log
      - name: Counterbalanced complete-import cohort
        env:
          REVERSE_ORDER: ${{ matrix.cohort == 'confirmation' && '1' || '0' }}
        run: |
          set -o pipefail
          xvfb-run -a node dev/review/archive-prefilter-complete-import-20260926.mjs 2>&1 | tee builds/archive-prefilter-completion/result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archive-prefilter-${{ matrix.cohort }}
          path: builds/archive-prefilter-completion/
          retention-days: 14
