name: Import optimization round two additional screen
on:
  push:
    branches: [verify/import-round2-20260915]
    paths: [.github/workflows/import-round2-extra-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [signature-loads, empty-strings]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve source-screen inputs and fetch the exact baseline
        run: |
          cp -a dev/perf/round2-20260915 "$RUNNER_TEMP/round2-review"
          git fetch --depth=1 origin 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round2-review/source-screen.py'
          s = p.read_text()
          assert s.count('EXPECTED = {') == 1
          s = s.replace('EXPECTED = {', "EXPECTED = {\n    'signature-loads': 'c64742ddb2f80abd2dee81aeb9ba5f02750ed6f20a4b4d6a1d001ac3c7f9d1a4',\n    'empty-strings': 'e3ba0849015956aa97f668795457863b8277dd6936921166ec633e363bcfb970',")
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round2-review/source-screen.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Checksum-pinned complete dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Build baseline
        run: node dev/bin/build.js --target chrome-dev
      - name: Six alternating pairs with three interleaved AA controls
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: python3 "$RUNNER_TEMP/round2-review/source-screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round2-extra-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/round2-screen
          retention-days: 30
