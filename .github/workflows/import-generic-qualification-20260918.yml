name: Qualify isolated generic span compression
on:
  push:
    branches: [research/import-structural-20260918]
    paths: [.github/workflows/import-generic-qualification-20260918.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jmnedict, jitendex, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/generic-qualification
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb7241deb70950dc113089cd774c9489ede48f8a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Isolate existing generic implementation without overlap experiment
        run: |
          mkdir -p builds/generic-qualification/source "$RUNNER_TEMP/generic-tools"
          git fetch --depth=2 origin 6c75ae517f8a4d74a27e1b7d0f69c1dcdb01e243
          git show --format= --binary 6c75ae517f8a4d74a27e1b7d0f69c1dcdb01e243 > builds/generic-qualification/generic.patch
          git apply --exclude=ext/js/dictionary/term-bank-experiments.js --exclude=types/ext/dictionary-importer.d.ts builds/generic-qualification/generic.patch
          git fetch --depth=1 origin f00b61bb2d851024f4124f1d854502ba602b506d
          git show FETCH_HEAD:dev/perf/import-transport-20260917/abba.mjs > "$RUNNER_TEMP/generic-tools/abba-original.mjs"
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/generic-tools/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          def replace(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,old);p.write_text(s.replace(old,new))
          replace('ext/js/dictionary/term-bank-experiments.js','return Object.freeze({','return Object.freeze({\n        experimentalGenericSpanCompression: options.experimentalGenericSpanCompression === true,')
          replace('types/ext/dictionary-importer.d.ts','experimentalLibdeflate?: boolean;','experimentalLibdeflate?: boolean;\n    experimentalGenericSpanCompression?: boolean;')
          tools=Path(os.environ['RUNNER_TEMP'])/'generic-tools'
          s=(tools/'abba-original.mjs').read_text();start=s.index('const variants=');end=s.index('\n',start)
          s=s[:start]+"const variants={control:{},generic:{experimentalGenericSpanCompression:true}}"+s[end:]
          s=s.replace("base:'2f407e86fae0d3e39f506e6b1ce30886697698ea'","base:'fb7241deb70950dc113089cd774c9489ede48f8a'")
          (tools/'abba.mjs').write_text(s)
          (tools/'fixture.py').write_text((tools/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          h=Path('test/chromium/extension-two-dictionary-import.e2e.js');s=h.read_text();assert s.count('maxBuffer: 32 * 1024 * 1024')==2;h.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/generic-tools/fixture.py" > builds/generic-qualification/fixture.log
      - run: npm ci
      - name: Validate actual candidate
        run: |
          npm run build:libs > builds/generic-qualification/libs.log 2>&1
          npm run test:unit > builds/generic-qualification/unit.log 2>&1
          npm run test:unit:options > builds/generic-qualification/options.log 2>&1
          npm run test:ts:main > builds/generic-qualification/types-main.log 2>&1
          npm run test:ts:dev > builds/generic-qualification/types-dev.log 2>&1
          npm run test:build > builds/generic-qualification/build-plans.log 2>&1
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/generic-qualification/build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Frozen six-block same-build ABBA with interleaved A-A controls
        run: node "$RUNNER_TEMP/generic-tools/abba.mjs" control,generic 6 | tee builds/generic-qualification/abba.log
      - name: Full Chromium import and recovery lifecycle
        if: matrix.dictionary == 'jmdict'
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{"experimentalGenericSpanCompression":true}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/generic-qualification/lifecycle.html
        run: |
          node test/chromium/extension-two-dictionary-import.e2e.js > builds/generic-qualification/lifecycle.log 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('builds/generic-qualification/lifecycle.json').read_text());assert r['status']=='success' and r['skippedVerification'] is False and len(r['phases'])>=80
          PY
      - name: Retain exact isolated source and all observations
        if: always()
        run: |
          find "$RUNNER_TEMP/generic-tools" -maxdepth 1 -type f -exec cp '{}' builds/generic-qualification/source/ ';'
          git diff > builds/generic-qualification/source.patch
          git diff --name-only | xargs -r tar -czf builds/generic-qualification/source.tar.gz
          git rev-parse HEAD > builds/generic-qualification/SOURCE_HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-qualified-${{ matrix.dictionary }}
          path: builds/generic-qualification
          retention-days: 30
          if-no-files-found: error
