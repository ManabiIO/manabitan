name: Import screening ef009

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: import-screen-ef009-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  screen:
    if: github.head_ref == 'codex/import-qualification-20261125-ef009' && github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.candidate }} ${{ matrix.dictionary }} host ${{ matrix.replica }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        candidate: [integer-fields, structured-metadata-keys, single-image-projection]
        dictionary: [jmdict, jitendex, vndb]
        replica: [0]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fetch frozen candidate
        env:
          CANDIDATE_NAME: ${{ matrix.candidate }}
        run: |
          set -euo pipefail
          candidate_sha=$(python3 -c 'import json, os, re; sha = json.load(open("dev/perf/import-qualification-ef009.json"))["candidates"][os.environ["CANDIDATE_NAME"]]["commit"]; assert isinstance(sha, str) and re.fullmatch("[0-9a-f]{40}", sha), "Unfrozen candidate"; print(sha)')
          git fetch origin "$candidate_sha"
      - name: Execute fixed complete-import screen
        run: python3 dev/perf/qualify-import-ef009.py '${{ matrix.candidate }}' '${{ matrix.dictionary }}' '${{ matrix.replica }}'
      - name: Retain compact evidence summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-screen-summary-ef009-${{ matrix.candidate }}-${{ matrix.dictionary }}-${{ matrix.replica }}
          path: builds/qualification-summary
          if-no-files-found: error
          retention-days: 14
      - name: Retain exact packages, all observations, and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-screen-ef009-${{ matrix.candidate }}-${{ matrix.dictionary }}-${{ matrix.replica }}
          path: builds/qualification
          if-no-files-found: error
          retention-days: 14
