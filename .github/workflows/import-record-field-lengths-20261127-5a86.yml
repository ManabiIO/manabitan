name: Record field lengths screen 20261127 5a86

on:
  push:
    branches: ['perf/record-field-lengths-20261127-5a86']
    paths:
      - 'ext/js/dictionary/term-record-opfs-store.js'
      - 'test/term-record-direct-field-columns.test.js'
      - 'dev/perf/import-record-field-screen-20261127-5a86.py'
      - '.github/workflows/import-record-field-lengths-20261127-5a86.yml'

permissions:
  contents: read

concurrency:
  group: record-field-lengths-5a86-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Source and observer validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check source, complete unit suite, build, and receipt observers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/perf/record-field-lengths-validation
          python -m py_compile dev/perf/import-record-field-screen-20261127-5a86.py 2>&1 | tee builds/perf/record-field-lengths-validation/python.log
          npx eslint ext/js/dictionary/term-record-opfs-store.js test/term-record-direct-field-columns.test.js 2>&1 | tee builds/perf/record-field-lengths-validation/lint.log
          npm run test:ts:main 2>&1 | tee builds/perf/record-field-lengths-validation/types-main.log
          npm run test:ts:test 2>&1 | tee builds/perf/record-field-lengths-validation/types-test.log
          npm run test:unit 2>&1 | tee builds/perf/record-field-lengths-validation/unit.log
          npm run test:build 2>&1 | tee builds/perf/record-field-lengths-validation/build.log
          python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py' 2>&1 | tee builds/perf/record-field-lengths-validation/observers.log
      - name: Retain source validation output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: record-field-lengths-validation-5a86
          path: builds/perf/record-field-lengths-validation
          if-no-files-found: warn
          retention-days: 14

  screen:
    needs: validate
    name: JMdict complete import (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        order: [AB, BA]
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_CANDIDATE: ${{ github.sha }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify frozen harness equality
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$PERF_BASELINE" "$PERF_CANDIDATE" -- \
            dev/perf/import-qualification-20261125-a7f7.py \
            dev/perf/import-memory-20261125-a7f7 \
            .github/actions/setup/action.yml \
            test/perf/dictionaries.lock.json package-lock.json
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Run frozen default full import pairs, identical controls, media, and memory
        shell: bash
        run: |
          set -euo pipefail
          python dev/perf/import-record-field-screen-20261127-5a86.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary jmdict \
            --initial-order "$PERF_ORDER" \
            --pairs 6 \
            --expected-package-entry js/dictionary/term-record-opfs-store.js \
            --evidence builds/perf/record-field-lengths-jmdict
      - name: Preserve every observation, package, and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: record-field-lengths-jmdict-${{ matrix.order }}-5a86
          path: |
            builds/perf/record-field-lengths-jmdict
            builds/perf/record-field-lengths-jmdict-runner.log
            builds/perf/record-field-lengths-jmdict-console-summary.json
          if-no-files-found: error
          retention-days: 14
