name: Import native checksum experiment - manifest correction

on:
  push:
    branches: [experiment/native-import-checksum-20261128-4d9f]
    paths: [.github/workflows/import-native-checksum-experiment-4d9f.yml]

permissions:
  contents: read

jobs:
  qualify:
    # Only this corrected-manifest fast-forward acquires the new cohort.
    if: github.event.before == 'b0b68543990bf9ecfa8782171f15c1b30e4410a8' && github.run_attempt == 1
    name: ${{ matrix.dictionary }} (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_CANDIDATE: 7cda9a3a39f3c2626873d414a741433058f9ff16
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify qualification receipt checks
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Compare complete imports and verify memory and persisted results
        shell: bash
        run: |
          allocation_args=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            allocation_args=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 12 \
            --expected-package-entry lib/zstd-wasm.js \
            --expected-package-entry lib/zstd-wasm.js.map \
            --expected-package-entry js/dictionary/term-record-opfs-store.js \
            "${allocation_args[@]}" \
            --evidence "builds/perf/import-native-checksum-$PERF_DICTIONARY-$PERF_ORDER-manifest2-4d9f"
      - name: Retain every observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-native-checksum-${{ matrix.dictionary }}-${{ matrix.order }}-manifest2-4d9f
          path: builds/perf/import-native-checksum-${{ matrix.dictionary }}-${{ matrix.order }}-manifest2-4d9f
          if-no-files-found: error
          retention-days: 14
