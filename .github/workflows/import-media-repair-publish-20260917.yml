name: Qualify native media key repair
on:
  push:
    branches: [verify/import-transport-compression-20260917]
    paths: [.github/workflows/import-media-repair-publish-20260917.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      THREE_OUTPUT: builds/media-repair
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f407e86fae0d3e39f506e6b1ce30886697698ea
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Retrieve immutable reproducer and two-line correction
        run: |
          mkdir -p "$RUNNER_TEMP/media-tools" builds/media-repair
          git fetch --depth=1 origin a6d8bd4d22978b1d1794c69cc2293aec78470248
          for file in test-media-keys.js fix-media.py compare-test-types.py; do
            git show "FETCH_HEAD:dev/perf/import-transport-20260917/$file" > "$RUNNER_TEMP/media-tools/$file"
          done
          git show FETCH_HEAD:.github/workflows/import-compression-screen2-20260917.yml > "$RUNNER_TEMP/media-tools/screen.yml"
          python3 - <<'PY'
          import os,yaml
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'media-tools'
          steps=yaml.safe_load((p/'screen.yml').read_text())['jobs']['screen']['steps']
          script=next(s['run'] for s in steps if s.get('name')=='Immutable full fixtures and actual Chrome package')
          (p/'fixtures.sh').write_text(script.replace('builds/compression-screen','builds/media-repair'))
          PY
          cp "$RUNNER_TEMP/media-tools/test-media-keys.js" test/dictionary-importer-media-keys.test.js
      - run: npm ci
      - name: Native reproducer RED then GREEN
        run: |
          npm run build:libs > builds/media-repair/libs.log 2>&1
          set +e
          node node_modules/vitest/vitest.mjs run test/dictionary-importer-media-keys.test.js --reporter=json --outputFile=builds/media-repair/red.json > builds/media-repair/red.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('builds/media-repair/red.json').read_text())
          assert r['numTotalTests']==6 and r['numFailedTests']==5
          failed=[a for t in r['testResults'] for a in t['assertionResults'] if a['status']=='failed']
          assert len(failed)==5 and all('buffer' in '\n'.join(a['failureMessages']) for a in failed)
          PY
          python3 "$RUNNER_TEMP/media-tools/fix-media.py"
          node node_modules/vitest/vitest.mjs run test/dictionary-importer-media-keys.test.js > builds/media-repair/green.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/dictionary-importer.js test/dictionary-importer-media-keys.test.js > builds/media-repair/lint.log 2>&1
          npm run test:unit > builds/media-repair/unit.log 2>&1
          npm run test:unit:options > builds/media-repair/options.log 2>&1
          npm run test:ts:main > builds/media-repair/types-main.log 2>&1
          npm run test:ts:dev > builds/media-repair/types-dev.log 2>&1
          npm run test:ts:bench > builds/media-repair/types-bench.log 2>&1
          python3 "$RUNNER_TEMP/media-tools/compare-test-types.py" > builds/media-repair/type-parity.log 2>&1
          npm run test:build > builds/media-repair/build-plans.log 2>&1
          sha256sum ext/js/dictionary/dictionary-importer.js test/dictionary-importer-media-keys.test.js ext/lib/term-bank-parser.wasm > builds/media-repair/qualified.sha256
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Build actual browser packages and complete fixtures
        run: |
          bash -e -o pipefail "$RUNNER_TEMP/media-tools/fixtures.sh"
          node dev/bin/build.js --target firefox-dev > builds/media-repair/firefox-build.log 2>&1
      - name: Full strict Chromium import and recovery lifecycle with all experiments off
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/media-repair/lifecycle.html
        run: |
          node test/chromium/extension-two-dictionary-import.e2e.js > builds/media-repair/lifecycle.log 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('builds/media-repair/lifecycle.json').read_text())
          assert r['status']=='success' and r['skippedVerification'] is False and len(r['phases'])>=80
          PY
          sha256sum -c builds/media-repair/qualified.sha256
      - name: Publish only the repair and regression test on a new branch
        run: |
          git add ext/js/dictionary/dictionary-importer.js test/dictionary-importer-media-keys.test.js
          python3 - <<'PY'
          import subprocess
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())=={'ext/js/dictionary/dictionary-importer.js','test/dictionary-importer-media-keys.test.js'}
          PY
          git diff --cached --check
          git -c user.name='Manabitan contributors' -c user.email='contributors@manabi.io' commit -m 'fix: preserve media headwords when native key columns are omitted'
          git push origin HEAD:refs/heads/fix/native-media-row-key-bytes-20260917
          git rev-parse HEAD 'HEAD^{tree}' > builds/media-repair/published.txt
          git show --format= --binary HEAD > builds/media-repair/product.patch
          echo QUALIFIED > builds/media-repair/complete.txt
      - name: Retain every gate and exact product source
        if: always()
        run: |
          mkdir -p builds/media-repair/source
          cp test/dictionary-importer-media-keys.test.js ext/js/dictionary/dictionary-importer.js builds/media-repair/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-media-key-repair
          path: builds/media-repair
          retention-days: 30
