name: Same-settings compression transport screen
on:
  push:
    branches: [verify/import-transport-compression-20260917]
    paths: [.github/workflows/import-message-batch-screen-20260917.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/packet-screen
      WORKER_CHECK_OUT: builds/packet-screen/worker-check.json
      RECIPE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6f85c1fb8fec871eef76363ac0ba3c59aff78f7
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Isolate same-settings algorithms on current develop
        run: |
          mkdir -p builds/packet-screen "$RUNNER_TEMP/packet-tools"
          git fetch --depth=1 origin "$RECIPE_SHA"
          for file in candidates.patch.gz.b64 select-balanced.py abba.mjs prepare-message-batch.py finalize-message-batch.py test-message-batches.js packet-worker-check.mjs compare-test-types.py; do
            git show "FETCH_HEAD:dev/perf/import-transport-20260917/$file" > "$RUNNER_TEMP/packet-tools/$file"
          done
          python3 "$RUNNER_TEMP/packet-tools/prepare-message-batch.py"
          python3 "$RUNNER_TEMP/packet-tools/finalize-message-batch.py"
          git diff --check
      - run: npm ci
      - name: Build and qualify exact source before timing
        run: |
          npm run build:libs > builds/packet-screen/libs.log 2>&1
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          import {spawnSync} from 'node:child_process'
          import * as espree from 'espree'
          const files=['ext/js/dictionary/dictionary-database.js','ext/js/dictionary/dictionary-importer.js','ext/js/dictionary/term-bank-experiments.js','ext/js/dictionary/term-content-block-store.js','ext/js/dictionary/zstd-term-content.js','ext/js/dictionary/zstd-term-content-compression-worker.js','test/term-bank-experiments.test.js','test/term-content-block-store.test.js','test/zstd-term-content-pool.test.js']
          const ast=p=>JSON.stringify(espree.parse(fs.readFileSync(p,'utf8'),{ecmaVersion:'latest',sourceType:'module'}),(key,value)=>key==='start'||key==='end'?undefined:value)
          const before=files.map(ast)
          const result=spawnSync(process.execPath,['node_modules/eslint/bin/eslint.js','--fix',...files],{encoding:'utf8'})
          fs.writeFileSync('builds/packet-screen/changed-lint.log',result.stdout+result.stderr)
          assert.equal(result.status,0)
          assert.deepEqual(files.map(ast),before)
          fs.writeFileSync('builds/packet-screen/format-equality.txt','Complete syntax trees unchanged by formatting\n')
          JS
          node "$RUNNER_TEMP/packet-tools/packet-worker-check.mjs" > builds/packet-screen/worker-check.log 2>&1
          node node_modules/vitest/vitest.mjs run test/zstd-wasm.test.js test/zstd-term-content-pool.test.js test/term-content-block-store.test.js test/term-bank-experiments.test.js test/dictionary-importer.test.js > builds/packet-screen/focused.log 2>&1
          npm run test:ts:main > builds/packet-screen/types-main.log 2>&1
          npm run test:ts:dev > builds/packet-screen/types-dev.log 2>&1
          npm run test:ts:bench > builds/packet-screen/types-bench.log 2>&1
          python3 "$RUNNER_TEMP/packet-tools/compare-test-types.py" > builds/packet-screen/type-parity.log 2>&1
          git diff --name-only | xargs sha256sum > builds/packet-screen/qualified-source.sha256
          sha256sum ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js >> builds/packet-screen/qualified-source.sha256
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Immutable full fixtures and unchanged production packages
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          h=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=h.read_text(); assert s.count('maxBuffer: 32 * 1024 * 1024')==2
          h.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/packet-screen/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/packet-screen/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
          sha256sum -c builds/packet-screen/qualified-source.sha256
      - name: Serial two-block ABBA and interleaved same-binary controls
        run: |
          node "$RUNNER_TEMP/packet-tools/packet-abba.mjs" control,generic,packets,both 2 | tee builds/packet-screen/abba.log
          sha256sum -c builds/packet-screen/qualified-source.sha256
          echo SCREENED > builds/packet-screen/complete.txt
      - name: Preserve all observations and failures
        if: always()
        run: |
          mkdir -p builds/packet-screen/source
          git diff -- ext/js types/ext test/term-bank-experiments.test.js test/term-content-block-store.test.js test/zstd-term-content-pool.test.js > builds/packet-screen/product.patch
          cp "$RUNNER_TEMP/packet-tools/"*.mjs "$RUNNER_TEMP/packet-tools/"*.py builds/packet-screen/source/
          tar -czf builds/packet-screen/source.tar.gz ext/js/dictionary/dictionary-database.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/term-content-block-store.js ext/js/dictionary/zstd-term-content.js ext/js/dictionary/zstd-term-content-compression-worker.js types/ext/dictionary-importer.d.ts test/term-bank-experiments.test.js test/term-content-block-store.test.js test/zstd-term-content-pool.test.js ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js test/chromium/extension-two-dictionary-import.e2e.js test/perf/dictionaries.lock.json 2>/dev/null || true
          git rev-parse HEAD > builds/packet-screen/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packet-screen-${{ matrix.dictionary }}
          path: builds/packet-screen
          retention-days: 30
