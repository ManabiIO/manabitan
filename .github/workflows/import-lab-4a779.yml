name: Import experiments 4a779

on:
  push:
    branches: [perf/import-lab-20261127-4a779]

permissions:
  contents: read

concurrency:
  group: import-lab-4a779-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: Current baseline (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Measure complete baseline imports
        run: |
          node dev/perf/import-benchmark.js "$PERF_DICTIONARY" \
            --build-target chrome --runs 4 --media-check sample \
            --output "builds/perf/lab-baseline/$PERF_DICTIONARY/timing"
      - name: Capture independent diagnostic trace
        run: |
          node dev/perf/import-benchmark.js "$PERF_DICTIONARY" \
            --build-target chrome --no-build --trace --runs 1 --media-check sample \
            --output "builds/perf/lab-baseline/$PERF_DICTIONARY/trace"
      - name: Preserve all observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-lab-baseline-${{ matrix.dictionary }}
          path: builds/perf/lab-baseline
          if-no-files-found: error
          retention-days: 14
