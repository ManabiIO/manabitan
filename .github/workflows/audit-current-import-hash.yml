name: Pinned import review workspace
on:
  push:
    branches: [audit/current-import-hash-20260926]
    paths: [.github/workflows/audit-current-import-hash.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 384d1c97dae6bd17555973b77ad415e038438499
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Archive pinned source and dependencies
        run: |
          git rev-parse HEAD > /tmp/source-head.txt
          git ls-files -s > /tmp/source-files.txt
          tar --exclude='./.git' --exclude='./node_modules/.cache' -czf /tmp/manabitan-current-workspace.tgz .
          sha256sum /tmp/manabitan-current-workspace.tgz > /tmp/workspace-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: manabitan-current-workspace-384d1c9
          path: |
            /tmp/manabitan-current-workspace.tgz
            /tmp/source-head.txt
            /tmp/source-files.txt
            /tmp/workspace-sha256.txt
          retention-days: 7
          compression-level: 0
