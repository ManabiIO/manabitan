name: Pinned complete-import hash qualification
on:
  push:
    branches: [audit/current-import-hash-20260926]
    paths: [.github/workflows/audit-current-import-hash.yml]
permissions:
  contents: read
jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        corpus: [jmdict, jmnedict, jitendex]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d9a2d723cb7403afea81803566c999e0b0ecc262
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 384d1c97dae6bd17555973b77ad415e038438499
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci && npm run build:libs && npm run license-report:html
        working-directory: source
      - run: npx playwright install --with-deps chromium
        working-directory: source
      - name: Counterbalanced complete imports and separate hash-traffic diagnostic
        env:
          CORPUS: ${{ matrix.corpus }}
        run: python3 audit/dev/perf/audit-hash-qualification.py source "$CORPUS" "results/$CORPUS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hash-qualification-${{ matrix.corpus }}-384d1c9
          path: results/${{ matrix.corpus }}
          retention-days: 30
          compression-level: 6
          if-no-files-found: error
