name: Import critical-path diagnostics (2026-11-24)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    name: Frozen baseline profile (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      SOURCE_BASE: 698d685c21618a8e8dbdab7a49a8dcf0d30680eb
      DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify frozen product source
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process'
          import {mkdirSync, writeFileSync} from 'node:fs'
          const base = process.env.SOURCE_BASE
          const diff = execFileSync('git', ['diff', '--name-only', base, 'HEAD'], {encoding: 'utf8'}).trim()
          const allowed = (path) => path === '.github/workflows/import-critical-path-20261124.yml' || path === '.github/workflows/import-screen-20261124.yml' || path === 'dev/perf/import-screen-20261124.py' || path.startsWith('dev/perf/import-critical-path-20261124/')
          if (diff.split('\n').some((path) => !allowed(path))) throw new Error(`Unexpected product change: ${diff}`)
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim()
          mkdirSync('builds/critical-path-profile', {recursive: true})
          writeFileSync('builds/critical-path-profile/source.json', JSON.stringify({base, commit, dictionary: process.env.DICTIONARY, diagnosticOnly: true, note: 'Tracing perturbs execution. Do not compare these elapsed times as performance evidence.'}, null, 2))
          JS
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        id: chromium
        run: npx playwright install --with-deps chromium
      - name: Restore locked archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: import-critical-path-20261124-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Profile complete production import
        run: |
          node -e 'if (process.version !== "v22.22.0") throw new Error("Unexpected Node: " + process.version)'
          node dev/perf/import-benchmark.js "$DICTIONARY" --build-target chrome --runs 1 --trace --media-check sample --output builds/critical-path-profile
      - name: Retain reports and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-path-${{ matrix.dictionary }}-${{ github.run_id }}
          path: builds/critical-path-profile
          if-no-files-found: error
          retention-days: 30
      - name: Package matching browser runtime
        id: runtime
        if: always() && matrix.dictionary == 'jmdict' && steps.chromium.outcome == 'success'
        run: |
          tar -czf builds/playwright-runtime.tar.gz -C "$HOME/.cache" ms-playwright
          sha256sum builds/playwright-runtime.tar.gz > builds/playwright-runtime.sha256
      - name: Retain matching browser runtime
        if: always() && matrix.dictionary == 'jmdict' && steps.runtime.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-path-runtime-${{ github.run_id }}
          path: |
            builds/playwright-runtime.tar.gz
            builds/playwright-runtime.sha256
          compression-level: 0
          retention-days: 7
