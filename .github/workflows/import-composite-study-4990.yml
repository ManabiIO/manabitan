name: Import composite delimiter study (4990)

on:
  push:
    branches: [test/import-composite-study-20261128-4990]

permissions:
  contents: read

jobs:
  correctness:
    if: contains(github.event.head_commit.message, '[run-composite-study]')
    name: Frozen candidate correctness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 9917c9d424914d7ed5824e1ad8c009bb6d6fe850
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Complete unit suite
        run: npm run test:unit
      - name: Main and test types
        run: npm run test:ts:main && npm run test:ts:test
      - name: All dry build targets
        run: npm run test:build
  compare:
    if: contains(github.event.head_commit.message, '[run-composite-study]')
    name: ${{ matrix.dictionary }} / host ${{ matrix.replication }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        replication: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore locked archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}-${{ matrix.dictionary }}
      - name: Validate the acquisition plan
        run: python3 -m unittest discover -s dev/perf/import-composite-study-20261128-4990 -p 'test_*.py' -v
      - name: Acquire the frozen cohort and separate diagnostics
        env:
          STUDY_DICTIONARY: ${{ matrix.dictionary }}
          STUDY_REPLICATION: ${{ matrix.replication }}
          STUDY_EVIDENCE: ${{ runner.temp }}/composite-evidence
        run: >-
          python3 dev/perf/import-composite-study-20261128-4990/run.py
          --dictionary "$STUDY_DICTIONARY" --replication "$STUDY_REPLICATION"
          --evidence "$STUDY_EVIDENCE"
      - name: Retain complete evidence and failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: composite-${{ matrix.dictionary }}-host-${{ matrix.replication }}
          path: ${{ runner.temp }}/composite-evidence
          if-no-files-found: warn
          retention-days: 14
