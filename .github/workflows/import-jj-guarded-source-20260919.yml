name: Guarded glossary source controls
on:
  push:
    branches: [research/import-jitendex-jmdict-20260919]
    paths: [.github/workflows/import-jj-guarded-source-20260919.yml]
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jitendex, jmdict]
    env:
      MANABITAN_CLANG: clang-18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python dev/perf/apply-guarded-glossary.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('builds/e2e-dictionary-cache');"
      - name: Same-path source, production-default and prior-experiment comparisons
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: python dev/perf/guarded-source-cohort.py --dictionary "$DICTIONARY" --out "$RUNNER_TEMP/guarded-source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarded-source-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/guarded-source
          retention-days: 30
          if-no-files-found: error
