name: Prepared score component screen

on:
  push:
    branches: ['perf/prepared-score-screen-20261128-da6c4']
    paths:
      - 'dev/perf/prepared-score-screen.mjs'
      - '.github/workflows/import-score-screen-da6c4.yml'

permissions:
  contents: read

jobs:
  screen:
    name: JMdict score screen (${{ matrix.replication }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replication: [1, 2]
    env:
      SCORE_BLOCKS: '15'
      SCORE_REPEATS: '8'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Restore pinned dictionary archive
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fetch and verify the complete pinned JMdict corpus
        run: node dev/perf/prepare-dictionaries.js jmdict
      - name: Measure score preparation and exact record encoding on untouched product source
        env:
          SCORE_REPLICATION: ${{ matrix.replication }}
        run: |
          mkdir -p builds/prepared-score-screen
          node --expose-gc dev/perf/prepared-score-screen.mjs \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/builds/e2e-dictionary-cache/JMdict.zip" \
            "$GITHUB_WORKSPACE/builds/prepared-score-screen/jmdict-$SCORE_REPLICATION.json" \
            2>&1 | tee "builds/prepared-score-screen/jmdict-$SCORE_REPLICATION.log"
      - name: Retain all observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prepared-score-screen-${{ matrix.replication }}-${{ github.sha }}
          path: builds/prepared-score-screen
          if-no-files-found: error
          retention-days: 30
