name: SWAR empty-prefix verification
on:
  push:
    branches: [verify/swar-prefix-empty-20260909]
    paths:
      - .github/workflows/swar-prefix-verify.yml
      - dev/perf/swar-prefix-empty-source.patch
      - dev/perf/swar-prefix-verify.py
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Reconstruct and verify the exact production source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git worktree add --detach "$RUNNER_TEMP/source" 03478be25506176610b2133be658ee697d9bb3f1
          git -C "$RUNNER_TEMP/source" apply --index "$GITHUB_WORKSPACE/dev/perf/swar-prefix-empty-source.patch"
          test "$(git -C "$RUNNER_TEMP/source" write-tree)" = cf9342901c86caa1be7ae85f6b94a3483d2dedfd
          git -C "$RUNNER_TEMP/source" -c user.name='Manabitan verification' -c user.email='verification@localhost' commit -m 'Verify exact SWAR empty-prefix source'
          printf '\n/node_modules\n' >> "$(git rev-parse --git-common-dir)/info/exclude"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/source/node_modules"
          git -C "$RUNNER_TEMP/source" rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/evidence/source.txt"
          cp dev/perf/swar-prefix-empty-source.patch "$RUNNER_TEMP/evidence/source.patch"
          clang --version > "$RUNNER_TEMP/evidence/compiler.txt"
          node --version > "$RUNNER_TEMP/evidence/node.txt"
      - name: Full units, options, strict types, repository lint and builds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          node dev/bin/build-libs.js > "$RUNNER_TEMP/evidence/build-libs.log" 2>&1
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
          npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
          npm run test:js > "$RUNNER_TEMP/evidence/lint.log" 2>&1
          node dev/bin/build.js --dryRun --all > "$RUNNER_TEMP/evidence/dry-build.log" 2>&1
          node dev/bin/build.js --target chrome-dev > "$RUNNER_TEMP/evidence/build.log" 2>&1
          node dev/perf/prepare-dictionaries.js > "$RUNNER_TEMP/evidence/fixtures.log" 2>&1
          test -z "$(git status --porcelain)"
      - name: Strict complete Chromium integration
        shell: bash
        env:
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: ${{ runner.temp }}/evidence/integration.html
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          node test/chromium/extension-two-dictionary-import.e2e.js > "$RUNNER_TEMP/evidence/integration.log" 2>&1
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swar-empty-correctness
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmnedict, jmdict, jitendex]
        trial: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build frozen source arms and record native runtime policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/arms"
          git worktree add --detach "$RUNNER_TEMP/arms/A" 03478be25506176610b2133be658ee697d9bb3f1
          git worktree add --detach "$RUNNER_TEMP/arms/B" 03478be25506176610b2133be658ee697d9bb3f1
          git -C "$RUNNER_TEMP/arms/B" apply --index "$GITHUB_WORKSPACE/dev/perf/swar-prefix-empty-source.patch"
          test "$(git -C "$RUNNER_TEMP/arms/B" write-tree)" = cf9342901c86caa1be7ae85f6b94a3483d2dedfd
          git -C "$RUNNER_TEMP/arms/B" -c user.name='Manabitan verification' -c user.email='verification@localhost' commit -m 'Verify exact SWAR empty-prefix source'
          printf '\n/node_modules\n' >> "$(git rev-parse --git-common-dir)/info/exclude"
          for arm in A B; do
            ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/arms/$arm/node_modules"
            (cd "$RUNNER_TEMP/arms/$arm" && node dev/bin/build-libs.js && node dev/bin/build.js --target chrome-dev) > "$RUNNER_TEMP/evidence/build-$arm.log" 2>&1
            test -z "$(git -C "$RUNNER_TEMP/arms/$arm" status --porcelain)"
          done
          (cd "$RUNNER_TEMP/arms/A" && node dev/perf/prepare-dictionaries.js) > "$RUNNER_TEMP/evidence/fixtures.log" 2>&1
          ln -s "$RUNNER_TEMP/arms/A/builds/e2e-dictionary-cache" "$RUNNER_TEMP/arms/B/builds/e2e-dictionary-cache"
          node --input-type=module <<'JS' > "$RUNNER_TEMP/evidence/native-runtime.json"
          import {createServer} from 'node:http';
          import {chromium} from 'playwright';
          import os from 'node:os';
          const server = createServer((req, res) => res.end('<!doctype html>'));
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          const browser = await chromium.launch({headless: true, executablePath: chromium.executablePath()});
          try {
            const page = await browser.newPage();
            await page.goto(`http://127.0.0.1:${server.address().port}`);
            const policy = await page.evaluate(async () => {
              const url = URL.createObjectURL(new Blob(['postMessage({deviceMemory:navigator.deviceMemory,hardwareConcurrency:navigator.hardwareConcurrency})'], {type: 'text/javascript'}));
              const worker = new Worker(url);
              const value = await new Promise((resolve, reject) => {worker.onmessage = event => resolve(event.data); worker.onerror = reject;});
              worker.terminate(); URL.revokeObjectURL(url);
              return {page: {deviceMemory: navigator.deviceMemory, hardwareConcurrency: navigator.hardwareConcurrency}, worker: value};
            });
            console.log(JSON.stringify({browserVersion: browser.version(), node: process.version, cpu: os.cpus()[0].model, ...policy}, null, 2));
          } finally {await browser.close(); server.close();}
          JS
          clang --version > "$RUNNER_TEMP/evidence/compiler.txt"
          lscpu > "$RUNNER_TEMP/evidence/cpu.txt"
          free -b > "$RUNNER_TEMP/evidence/memory.txt"
          cp dev/perf/swar-prefix-empty-source.patch "$RUNNER_TEMP/evidence/source.patch"
          sed 's/68a31e0ec29969000adbd3ba7435a71d7ebdb966/cf9342901c86caa1be7ae85f6b94a3483d2dedfd/g' dev/perf/swar-prefix-verify.py > "$RUNNER_TEMP/evidence/driver.py"
      - name: Six fixed adjacent pairs, same-build controls, excluded warmup, no retries
        shell: bash
        env:
          DICTIONARY: ${{ matrix.dictionary }}
          TRIAL: ${{ matrix.trial }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$TRIAL" = 2 ]; then extra+=(reverse); fi
          python3 "$RUNNER_TEMP/evidence/driver.py" "$RUNNER_TEMP/arms/A" "$RUNNER_TEMP/arms/B" "$RUNNER_TEMP/evidence/paired" "$DICTIONARY" "${extra[@]}" 2>&1 | tee "$RUNNER_TEMP/evidence/driver.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: swar-empty-${{ matrix.dictionary }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
