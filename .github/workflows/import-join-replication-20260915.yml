name: Native join independent replication 20260915
on:
  push:
    branches: [verify/import-screen-20260915]
    paths:
      - .github/workflows/import-join-replication-20260915.yml
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare fixed twelve-pair reversed-order replication
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "repos/$REPOSITORY/contents/dev/perf/review-native-source-screen-20260915.py?ref=f113d0dbbbb0d5be78d9ac0178a260d94def64e4" --jq .content | base64 --decode > "$RUNNER_TEMP/native-screen.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'native-screen.py'
          s = p.read_text()
          for old, new in [
              ('range(1, 7)', 'range(1, 13)'),
              ("('AB' if pair % 2 else 'BA')", "('BA' if pair % 2 else 'AB')"),
              ("('BA' if pair == 4 else 'AB')", "('BA' if pair % 4 == 0 else 'AB')"),
              ('Exploratory six-pair source screening, not release qualification',
               'Independent twelve-pair reversed-order replication; six interleaved AA pairs')
          ]:
              assert s.count(old) == 1
              s = s.replace(old, new)
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/native-screen.py"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Build the exact baseline
        run: node dev/bin/build.js --target chrome-dev
      - name: Fixed source-revision comparisons
        env:
          CANDIDATE: join-bulk
          DICTIONARY: ${{ matrix.dictionary }}
        run: python3 "$RUNNER_TEMP/native-screen.py"
      - name: Preserve exact driver
        if: always()
        run: |
          mkdir -p builds/source-screen
          cp "$RUNNER_TEMP/native-screen.py" builds/source-screen/driver.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: join-replication-${{ matrix.dictionary }}
          path: builds/source-screen
          retention-days: 30
