name: Research Parser Workers3 Current

on:
  push:
    branches:
      - research/parser-workers3-current-20260930

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          node-version: '24.20.0'

      - name: Install Chromium and prepare fixtures
        run: |
          npx playwright install chromium
          node ./dev/perf/prepare-dictionaries.js
          node ./dev/bin/build.js --target chrome-dev

      - name: Run current two-vs-three-worker A/B with aggregate memory sampling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/perf/workers3-current

          run_arm() {
            local dictionary="$1"
            local pair="$2"
            local arm="$3"
            local flags="$4"
            local output="builds/perf/workers3-current/${dictionary}-pair${pair}-${arm}"
            local memory="${output}-memory.tsv"
            mkdir -p "${output}"
            : > "${memory}"

            args=(node ./dev/perf/import-benchmark.js "${dictionary}" --runs 1 --no-build --output "${output}")
            if [[ -n "${flags}" ]]; then
              args+=(--flags "${flags}")
            fi

            "${args[@]}" &
            local child=$!

            (
              while kill -0 "${child}" 2>/dev/null; do
                now_ns="$(date +%s%N)"
                chrome_kb="$(ps -axo comm=,rss= | awk 'tolower($1) ~ /chrome|chromium/ {s += $2} END {print s + 0}')"
                chrome_count="$(ps -axo comm= | awk 'tolower($1) ~ /chrome|chromium/ {n += 1} END {print n + 0}')"
                if [[ -r /sys/fs/cgroup/memory.current ]]; then
                  cgroup_bytes="$(cat /sys/fs/cgroup/memory.current)"
                else
                  cgroup_bytes="0"
                fi
                printf '%s\t%s\t%s\t%s\n' "${now_ns}" "${chrome_kb}" "${chrome_count}" "${cgroup_bytes}" >> "${memory}"
                sleep 0.1
              done
            ) &
            local sampler=$!

            set +e
            wait "${child}"
            local status=$?
            set -e
            wait "${sampler}" || true
            if [[ "${status}" -ne 0 ]]; then
              return "${status}"
            fi
          }

          workers3='{"experimentalParserWorkers3":true}'
          for dictionary in jmdict jitendex; do
            for pair in 1 2 3 4 5 6; do
              if (( pair % 2 == 1 )); then
                run_arm "${dictionary}" "${pair}" baseline ''
                run_arm "${dictionary}" "${pair}" workers3 "${workers3}"
              else
                run_arm "${dictionary}" "${pair}" workers3 "${workers3}"
                run_arm "${dictionary}" "${pair}" baseline ''
              fi
            done
          done

      - name: Summarize timing and memory
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs'
          import path from 'node:path'

          const root = 'builds/perf/workers3-current'
          const median = (values) => {
            const sorted = [...values].sort((a, b) => a - b)
            const mid = Math.floor(sorted.length / 2)
            return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2
          }
          const percentile = (values, p) => {
            if (values.length === 0) return 0
            const sorted = [...values].sort((a, b) => a - b)
            return sorted[Math.min(sorted.length - 1, Math.max(0, Math.ceil(sorted.length * p) - 1))]
          }
          const readArm = (dictionary, pair, arm) => {
            const dir = path.join(root, `${dictionary}-pair${pair}-${arm}`)
            const summary = JSON.parse(readFileSync(path.join(dir, 'summary.json'), 'utf8'))
            const rows = readFileSync(`${dir}-memory.tsv`, 'utf8').trim().split('\n').filter(Boolean).map((line) => {
              const [, chromeKb, chromeCount, cgroupBytes] = line.split('\t').map(Number)
              return {chromeKb, chromeCount, cgroupBytes}
            })
            const chrome = rows.map((x) => x.chromeKb / 1024)
            const cgroup = rows.map((x) => x.cgroupBytes / 1024 / 1024)
            return {
              totalMs: summary.timing.medianMs,
              workerMs: summary.workerTiming?.medianMs ?? null,
              chromePeakMb: Math.max(0, ...chrome),
              chromeP95Mb: percentile(chrome, 0.95),
              chromeProcessPeak: Math.max(0, ...rows.map((x) => x.chromeCount)),
              cgroupPeakMb: Math.max(0, ...cgroup),
              sampleCount: rows.length,
            }
          }

          const out = {
            schemaVersion: 1,
            source: process.env.GITHUB_SHA,
            baselineFlags: {},
            variantFlags: {experimentalParserWorkers3: true},
            dictionaries: {},
          }
          for (const dictionary of ['jmdict', 'jitendex']) {
            const pairs = []
            for (let pair = 1; pair <= 6; ++pair) {
              const baseline = readArm(dictionary, pair, 'baseline')
              const variant = readArm(dictionary, pair, 'workers3')
              pairs.push({
                pair,
                baseline,
                variant,
                totalChangePct: (variant.totalMs / baseline.totalMs - 1) * 100,
                workerChangePct: baseline.workerMs && variant.workerMs ? (variant.workerMs / baseline.workerMs - 1) * 100 : null,
                chromePeakDeltaMb: variant.chromePeakMb - baseline.chromePeakMb,
                chromePeakChangePct: baseline.chromePeakMb > 0 ? (variant.chromePeakMb / baseline.chromePeakMb - 1) * 100 : null,
                cgroupPeakDeltaMb: variant.cgroupPeakMb - baseline.cgroupPeakMb,
              })
            }
            out.dictionaries[dictionary] = {
              pairs,
              pairedMedianTotalChangePct: median(pairs.map((x) => x.totalChangePct)),
              pairedMedianWorkerChangePct: median(pairs.flatMap((x) => x.workerChangePct === null ? [] : [x.workerChangePct])),
              fasterPairs: pairs.filter((x) => x.variant.totalMs < x.baseline.totalMs).length,
              medianChromePeakDeltaMb: median(pairs.map((x) => x.chromePeakDeltaMb)),
              medianChromePeakChangePct: median(pairs.flatMap((x) => x.chromePeakChangePct === null ? [] : [x.chromePeakChangePct])),
              medianCgroupPeakDeltaMb: median(pairs.map((x) => x.cgroupPeakDeltaMb)),
            }
          }
          writeFileSync(path.join(root, 'summary.json'), JSON.stringify(out, null, 2))
          console.log(JSON.stringify(out, null, 2))
          NODE

      - uses: actions/upload-artifact@v6
        with:
          name: parser-workers3-current-ab
          path: builds/perf/workers3-current
          retention-days: 7
