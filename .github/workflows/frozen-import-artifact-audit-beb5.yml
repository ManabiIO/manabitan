name: Audit frozen import artifacts 20261128 beb5

on:
  push:
    branches: ['test/frozen-import-artifact-audit-20261128-beb5']
    paths:
      - '.github/workflows/frozen-import-artifact-audit-beb5.yml'
      - 'dev/perf/frozen-import-audit-20261128-beb5/**'

permissions:
  actions: read
  contents: write

jobs:
  audit-originals:
    name: Audit six frozen corpora and preserve the registered CRC screen
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 47f3c3262931d0a92728c72fcd5cfb9b0ccc49a0
          path: original-source
          persist-credentials: false
          sparse-checkout: |
            ext/js
            dev/data/dictionary-wasm
            dev/perf/whole-glossary-prefix-20261128
            test/perf
            .github/workflows
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
          path: baseline
          persist-credentials: false
          sparse-checkout: |
            ext/js
            dev/data/dictionary-wasm
            test/perf
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: a355146b6c511f8ccdea3fd7fa60af9c450d904f
          path: original-evidence
          persist-credentials: false
          sparse-checkout: dev/perf/import-round-20261128-beb5/prefix-component
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 55113f0d9f85faf4a867a311d1d78dd9d2e80609
          path: canonical-source
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 633761548509a77b43b414b83a80033e17ed7399
          path: recent-source
          persist-credentials: false
          sparse-checkout: |
            ext/js
            dev/data/dictionary-wasm
            dev/perf/whole-glossary-prefix-20261128
            test/perf
            .github/workflows
      - name: Check audit syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python -m py_compile audit/dev/perf/frozen-import-audit-20261128-beb5/*.py
      - name: Reconstruct the independently retained prefix known answer
        id: known_answer
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python audit/dev/perf/frozen-import-audit-20261128-beb5/verify-prefix-known-answer.py \
            --source-root original-source --baseline-root baseline \
            --evidence-root original-evidence --out evidence/prefix-known-answer
      - name: Acquire, audit and retain every registered original artifact
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python audit/dev/perf/frozen-import-audit-20261128-beb5/acquire-and-audit.py \
            batch --canonical-root canonical-source --prefix-root recent-source \
            --baseline-root baseline --reference-source-root original-source \
            --known-answer-root evidence/prefix-known-answer --out evidence
      - name: Retain full original ZIPs, reports and every failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frozen-import-audit-beb5-combined
          path: evidence
          if-no-files-found: error
          retention-days: 14
