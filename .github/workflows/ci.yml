  test-firefox-android-extension-e2e:
    name: Full Extension E2E (Firefox Android)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build Firefox Android package
        run: npm run build -- --target firefox-android

      - name: Run Firefox Android extension E2E
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MANABITAN_ANDROID_AUTO_INSTALL_FIREFOX: '1'
          MANABITAN_ANDROID_FIREFOX_PACKAGE: org.mozilla.firefox
          MANABITAN_ANDROID_WEB_EXT_TIMEOUT_MS: '45000'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb wait-for-device
            adb devices
            npm run test:e2e:firefox-android-extension

      - name: Enforce Firefox Android extension E2E success
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'builds/firefox-android-e2e-report.json';
          if (!fs.existsSync(path)) {
            console.error('Firefox Android extension E2E report JSON not found.');
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (report.status !== 'success') {
            console.error(`Firefox Android extension E2E status is not success: ${String(report.status)} failure=${String(report.failureReason || '')}`);
            process.exit(1);
          }
          NODE

      - name: Summarize Firefox Android extension E2E
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'builds/firefox-android-e2e-report.json';
          if (!fs.existsSync(path)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Firefox Android Extension E2E\nReport JSON not found.\n');
            process.exit(0);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          const phases = Array.isArray(report.phases) ? report.phases : [];
          const top = [...phases].sort((a, b) => Number(b.durationMs || 0) - Number(a.durationMs || 0)).slice(0, 5);
          const lines = [
            '## Firefox Android Extension E2E',
            `- Status: \`${String(report.status || 'unknown')}\``,
            `- Failure: ${report.failureReason ? `\`${String(report.failureReason)}\`` : 'none'}`,
            `- ADB device: \`${String(report.adbDevice || 'unknown')}\``,
            `- Firefox package: \`${String(report.firefoxPackage || 'unknown')}\``,
            `- Source dir: \`${String(report.sourceDir || 'unknown')}\``,
            `- Firefox APK URL: ${report.firefoxApkUrl ? `\`${String(report.firefoxApkUrl)}\`` : 'not-used'}`,
            `- Phase count: ${String(phases.length)}`,
            '- Slowest phases:',
            ...top.map((phase) => `  - ${String(phase.name)} (${Number(phase.durationMs || 0).toFixed(1)} ms)`),
            '',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Upload Firefox Android extension E2E report
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: firefox-android-extension-e2e-report
          path: |
            builds/firefox-android-e2e-report.html
            builds/firefox-android-e2e-report.json
          if-no-files-found: ignore

  pr290-real-import-ab:
    name: PR 290 real JMdict import A/B
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 290
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: a3925549826671bc1026035f43f0fde2e407077c
      HEAD_SHA: 83b4f1a7bebe8c3fce6919b7c600ebe7862822c4
    steps:
      - name: Checkout base
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.HEAD_SHA }}
          path: candidate
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: |
            base/package-lock.json
            candidate/package-lock.json

      - name: Install dependencies
        run: |
          (cd base && npm ci)
          (cd candidate && npm ci)

      - name: Build libraries and extensions
        run: |
          (cd base && npm run build:libs && npm run build -- --target chrome-dev)
          (cd candidate && npm run build:libs && npm run build -- --target chrome-dev)

      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install --with-deps chromium

      - name: Run counterbalanced real-import measurements
        shell: bash
        run: |
          set -euo pipefail
          base_n=0
          candidate_n=0
          for side in base candidate candidate base base candidate candidate base base candidate; do
            if [[ "$side" == "base" ]]; then
              base_n=$((base_n + 1))
              n="$base_n"
            else
              candidate_n=$((candidate_n + 1))
              n="$candidate_n"
            fi
            echo "::group::${side} run ${n}"
            (
              cd "$side"
              xvfb-run -a node dev/perf/import-benchmark.js jmdict \
                --runs 1 \
                --no-build \
                --output "builds/perf/pr290/${side}-${n}"
            )
            echo "::endgroup::"
          done

      - name: Summarize A/B
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          function read(side) {
            const root = path.join(side, 'builds', 'perf', 'pr290')
            return fs.readdirSync(root)
              .filter((name) => name.startsWith(`${side}-`))
              .sort((a, b) => Number(a.split('-').at(-1)) - Number(b.split('-').at(-1)))
              .map((name) => {
                const summary = JSON.parse(fs.readFileSync(path.join(root, name, 'summary.json'), 'utf8'))
                const run = summary.runs[0]
                return {
                  totalImportMs: run.totalImportMs,
                  workerImportMs: run.workerImportMs,
                  validation: run.validation,
                }
              })
          }

          function median(values) {
            const sorted = [...values].sort((a, b) => a - b)
            const i = Math.floor(sorted.length / 2)
            return sorted.length % 2 ? sorted[i] : (sorted[i - 1] + sorted[i]) / 2
          }

          const base = read('base')
          const candidate = read('candidate')
          const baseTimes = base.map((x) => x.totalImportMs)
          const candidateTimes = candidate.map((x) => x.totalImportMs)
          const baseMedian = median(baseTimes)
          const candidateMedian = median(candidateTimes)
          const deltaPercent = ((candidateMedian - baseMedian) / baseMedian) * 100
          const baseWorker = base.map((x) => x.workerImportMs)
          const candidateWorker = candidate.map((x) => x.workerImportMs)
          const workerComparable = [...baseWorker, ...candidateWorker].every(Number.isFinite)
          const result = {
            baseSha: process.env.BASE_SHA,
            candidateSha: process.env.HEAD_SHA,
            baseTimes,
            candidateTimes,
            baseMedian,
            candidateMedian,
            deltaPercent,
            baseWorkerMedian: workerComparable ? median(baseWorker) : null,
            candidateWorkerMedian: workerComparable ? median(candidateWorker) : null,
            allValidated: [...base, ...candidate].every((x) =>
              x.validation &&
              x.validation.contentReadable === true &&
              Number.isFinite(x.validation.termRows)
            ),
          }
          fs.writeFileSync('pr290-ab.json', JSON.stringify(result, null, 2))
          console.log(JSON.stringify(result, null, 2))
          const lines = [
            '## PR #290 real JMdict import A/B',
            '',
            `- Base: \`${result.baseSha}\``,
            `- Candidate: \`${result.candidateSha}\``,
            `- Base total-import runs: ${result.baseTimes.map((x) => x.toFixed(1)).join(', ')} ms`,
            `- Candidate total-import runs: ${result.candidateTimes.map((x) => x.toFixed(1)).join(', ')} ms`,
            `- Base median: **${result.baseMedian.toFixed(1)} ms**`,
            `- Candidate median: **${result.candidateMedian.toFixed(1)} ms**`,
            `- Median delta: **${result.deltaPercent.toFixed(2)}%**`,
            `- Post-import validation passed for every run: **${String(result.allValidated)}**`,
          ]
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n')
          NODE

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr290-real-import-ab
          path: |
            pr290-ab.json
            base/builds/perf/pr290/**/summary.json
            candidate/builds/perf/pr290/**/summary.json
          retention-days: 7

