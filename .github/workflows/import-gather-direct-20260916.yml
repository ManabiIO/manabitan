name: Direct shared-gather design comparison
on:
  push:
    branches: [verify/import-pipeline-research-20260916]
    paths: [.github/workflows/import-gather-direct-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 96764973fe07f60358747dfb4d61ed3630e86964
          persist-credentials: false
      - name: Pin both candidate designs and fixed-plan driver
        run: |
          mkdir -p "$RUNNER_TEMP/pipeline-inputs"
          cp dev/perf/pipeline-research-20260916/apply.py "$RUNNER_TEMP/pipeline-inputs/apply-first.py"
          cp dev/perf/pipeline-research-20260916/apply-next.py "$RUNNER_TEMP/pipeline-inputs/apply-next.py"
          cp dev/perf/pipeline-research-20260916/screen.py "$RUNNER_TEMP/pipeline-inputs/screen.py"
          git fetch --depth=1 origin c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          git checkout --detach c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          python3 "$RUNNER_TEMP/pipeline-inputs/apply-first.py" gather64
          git add dev/lib/zstd-wasm.js
          git -c core.hooksPath=/dev/null -c user.name='Manabitan contributors' -c user.email='contributors@manabi.io' commit -m 'Direct comparison control: exact gather64 source'
          python3 - <<'PY'
          import hashlib,os,subprocess
          from pathlib import Path
          source=Path('dev/lib/zstd-wasm.js')
          assert hashlib.sha256(source.read_bytes()).hexdigest()=='e0d637333ce3a6714955960de5f4cd3df48b1da3ab7a8cadacbf3df4c749dad9'
          assert subprocess.check_output(['git','diff','c0a1b7ee6fa1383a0a422361d2a8b7f826499fff','--name-only'],text=True).splitlines()==['dev/lib/zstd-wasm.js']
          inputs=Path(os.environ['RUNNER_TEMP'])/'pipeline-inputs'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          p=inputs/'screen.py'
          s=p.read_text().replace('c0a1b7ee6fa1383a0a422361d2a8b7f826499fff',head).replace('a48da18d4244b00661d0c6518b2ce77b9f2f9b55',tree)
          s=s.replace("'baseline': BASE, 'candidate': variant", "'baseline': BASE, 'comparison': 'gather64-versus-aligned', 'productionAncestor': 'c0a1b7ee6fa1383a0a422361d2a8b7f826499fff', 'candidate': variant")
          p.write_text(s)
          (inputs/'apply.py').write_text("from pathlib import Path\nimport hashlib,subprocess,sys\np=Path('dev/lib/zstd-wasm.js')\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='e0d637333ce3a6714955960de5f4cd3df48b1da3ab7a8cadacbf3df4c749dad9'\np.write_bytes(subprocess.check_output(['git','show','c0a1b7ee6fa1383a0a422361d2a8b7f826499fff:dev/lib/zstd-wasm.js']))\nsubprocess.run(['python3',str(Path(__file__).with_name('apply-next.py')),sys.argv[1]],check=True)\n")
          PY
          python3 -m py_compile "$RUNNER_TEMP/pipeline-inputs/"*.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify complete pinned fixtures
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Six direct alternating pairs; A is gather64, B is alignment-only
        env:
          CANDIDATE: gather-aligned
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: BA
        run: |
          mkdir -p builds/pipeline-review
          python3 "$RUNNER_TEMP/pipeline-inputs/screen.py" 2>&1 | tee builds/pipeline-review/driver.log
      - name: Preserve executed comparison inputs
        if: always()
        run: |
          mkdir -p builds/pipeline-review/executed-inputs
          cp "$RUNNER_TEMP/pipeline-inputs/"*.py builds/pipeline-review/executed-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-direct-gather64-versus-aligned-${{ matrix.dictionary }}
          path: builds/pipeline-review
          retention-days: 30
