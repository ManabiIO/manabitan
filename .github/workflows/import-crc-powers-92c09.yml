name: Import CRC powers qualification 92c09

on:
  push:
    branches: ['perf/vndb-crc-powers-20261128-92c09']
    paths:
      - 'ext/js/dictionary/wasm/term-bank-parser.c'
      - 'test/term-bank-crc.test.js'
      - 'dev/data/dictionary-wasm/manifest.json'
      - 'dev/data/dictionary-wasm/term-bank-parser.wasm'
      - '.github/workflows/import-crc-powers-92c09.yml'

permissions:
  contents: read

concurrency:
  group: import-crc-powers-92c09-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
    name: Verify candidate source
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned dictionary WASM toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21
      - name: Unit, type, lint, and build verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/perf/crc-powers-verification
          npm run build:dictionary-wasm -- --check 2>&1 | tee builds/perf/crc-powers-verification/native-rebuild.log
          npm run test:unit 2>&1 | tee builds/perf/crc-powers-verification/unit.log
          npm run test:build 2>&1 | tee builds/perf/crc-powers-verification/build.log
          npm run test:ts:main 2>&1 | tee builds/perf/crc-powers-verification/types-main.log
          npm run test:ts:test 2>&1 | tee builds/perf/crc-powers-verification/types-test.log
          mapfile -t changed_js < <(git diff --name-only --diff-filter=AM "$PERF_BASELINE" "$GITHUB_SHA" -- "*.js")
          test "${#changed_js[@]}" -gt 0
          npx eslint "${changed_js[@]}" 2>&1 | tee builds/perf/crc-powers-verification/lint.log
          git diff --exit-code
      - name: Preserve source verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crc-powers-verification-92c09
          path: builds/perf/crc-powers-verification
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: verify
    name: Complete import (${{ matrix.dictionary }}, ${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_CANDIDATE: ${{ github.sha }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify qualification observers
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Run exact-source balanced timing and separate memory cohorts
        shell: bash
        run: |
          set -euo pipefail
          storage_args=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            storage_args+=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 12 \
            --expected-package-entry js/dictionary/wasm/term-bank-parser.c \
            --expected-package-entry lib/term-bank-parser.wasm \
            "${storage_args[@]}" \
            --evidence builds/perf/crc-powers-qualification
      - name: Preserve every observation, source identity, and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crc-powers-92c09-${{ matrix.dictionary }}-${{ matrix.order }}
          path: builds/perf/crc-powers-qualification
          if-no-files-found: error
          retention-days: 14

