name: Three dictionary shared import screen
on:
  push:
    branches: [verify/three-dictionary-import-20260917]
    paths: [.github/workflows/three-dictionary-screen-20260917.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/three-screen
      THREE_CHECK_OUTPUT: builds/three-screen/check.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Apply checksum-verified experiments and immutable decoder sources
        run: |
          mkdir -p builds/three-screen
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          text=Path('dev/perf/three-dictionary-20260917/candidates.patch.gz.b64').read_text()
          text=text.replace('h2Obf6Hf6H+', 'h2Obf6H+')
          patch=gzip.decompress(base64.b64decode(text,validate=False))
          assert hashlib.sha256(patch).hexdigest()=='c2f362dbe7512af4723c73a499a8a6c0548c8d8ba98750abead38cd711ddba0f'
          Path('builds/three-screen/experiments.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','builds/three-screen/experiments.patch'],check=True)
          subprocess.run(['git','apply','builds/three-screen/experiments.patch'],check=True)
          # The generated browser wrapper cannot fetch a filesystem path in Node.
          # Supply the identical compiled Zstd bytes as a data URL, with no runtime
          # source alteration or changed assertion.
          p=Path('dev/perf/three-dictionary-20260917/check.mjs')
          text=p.read_text()
          old="await zstd.init(path.join(root, 'ext/lib/zstd.wasm'))"
          assert text.count(old)==1
          p.write_text(text.replace(old,"await zstd.init('data:application/wasm;base64,' + readFileSync('dev/data/zstd-simd.wasm').toString('base64'))"))
          PY
          git fetch --depth=1 origin 726c5b7444a1b3c131c90de356f8261ac2fe65a2
          git restore --source=FETCH_HEAD -- ext/js/dictionary/wasm/term-bank-inflate.c ext/js/dictionary/wasm/vendor/libdeflate
          git diff --check
          git rev-parse HEAD > builds/three-screen/research-head.txt
      - run: npm ci
      - name: Build and verify real native outputs before timing
        run: |
          npm run build:libs > builds/three-screen/libs.log 2>&1
          node dev/perf/three-dictionary-20260917/check.mjs > builds/three-screen/check.log 2>&1
          node node_modules/vitest/vitest.mjs run test/zstd-wasm.test.js test/term-content-block-store.test.js test/term-bank-experiments.test.js test/dictionary-database-content-dedup.test.js > builds/three-screen/focused.log 2>&1
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare identical full-fixture harness and actual Chromium extension
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          path=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          source=path.read_text()
          assert source.count('maxBuffer: 32 * 1024 * 1024')==2
          path.write_text(source.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/three-screen/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/three-screen/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Complete imports in fixed ABBA order
        run: node dev/perf/three-dictionary-20260917/abba.mjs control,inflate,copies,both 2 | tee builds/three-screen/abba.log
      - name: Preserve every observation and exact input source on success or failure
        if: always()
        run: |
          mkdir -p builds/three-screen/source
          git diff HEAD -- dev/build-libs.js dev/lib/zstd-wasm.js ext/js types/ext > builds/three-screen/source.patch
          cp dev/perf/three-dictionary-20260917/abba.mjs dev/perf/three-dictionary-20260917/check.mjs builds/three-screen/source/
          tar -czf builds/three-screen/source.tar.gz dev/build-libs.js dev/lib/zstd-wasm.js ext/js/core/import-byte-copy.js ext/js/dictionary types/ext/dictionary-importer.d.ts ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js test/chromium/extension-two-dictionary-import.e2e.js test/perf/dictionaries.lock.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-screen-${{ matrix.dictionary }}
          path: builds/three-screen
          retention-days: 30
