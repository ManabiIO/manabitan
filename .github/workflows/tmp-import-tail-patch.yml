              count = text.count(old)
              assert count == 1, f'{label}: expected one exact match, found {count}'
              path.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement, label):
              text = path.read_text()
              text2, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              assert count == 1, f'{label}: expected one regex match, found {count}'
              path.write_text(text2)

