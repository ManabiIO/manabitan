name: Shared parser group import screen
on:
  push:
    branches: [verify/import-shared-more-20260917]
    paths: [.github/workflows/import-more-screen-20260917.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      MORE_DICTIONARY: ${{ matrix.dictionary }}
      MORE_OUTPUT: builds/more-screen
      RECIPE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6896f54d13be0ba17fcf9345a9b6f29a04f88860
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Prepare isolated candidates on the current baseline
        run: |
          mkdir -p "$RUNNER_TEMP/more-tools" builds/more-screen
          git fetch --depth=1 origin "$RECIPE_SHA"
          for file in prepare.py term-bank-group-policy.js test-group-policy.js abba.mjs corpus.mjs; do
            git show "FETCH_HEAD:dev/perf/import-more-20260917/$file" > "$RUNNER_TEMP/more-tools/$file"
          done
          python3 "$RUNNER_TEMP/more-tools/prepare.py"
          git add -N ext/js/dictionary/term-bank-group-policy.js test/term-bank-group-policy.test.js
          git diff --check
      - run: npm ci
      - name: Build native code and qualify new policy and existing importer
        run: |
          npm run build:libs > builds/more-screen/libs.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/term-bank-group-policy.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/term-bank-wasm-parser.js test/term-bank-group-policy.test.js > builds/more-screen/lint.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-group-policy.test.js test/term-bank-wasm-parser.test.js test/term-bank-experiments.test.js test/term-bank-composite-state.test.js test/dictionary-importer.test.js > builds/more-screen/focused.log 2>&1
          npm run test:unit > builds/more-screen/unit.log 2>&1
          npm run test:ts > builds/more-screen/types.log 2>&1
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare full immutable fixtures and the same harness for both arms
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948e0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          h=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          text=h.read_text()
          assert text.count('maxBuffer: 32 * 1024 * 1024')==2
          h.write_text(text.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/more-screen/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/more-screen/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Serial fixed-plan ABBA against flags-off Manabitan
        run: node "$RUNNER_TEMP/more-tools/abba.mjs" control,g16,g32,g48 2 | tee builds/more-screen/abba.log
      - name: Every ordered row through real production parallel workers
        run: |
          node "$RUNNER_TEMP/more-tools/corpus.mjs" "$MORE_DICTIONARY" builds/group-corpus > builds/more-screen/corpus.log 2>&1
          cp builds/group-corpus/parity.json builds/more-screen/corpus-parity.json
      - name: Retain every observation and exact candidate source
        if: always()
        run: |
          mkdir -p builds/more-screen/source
          git diff -- ext/js types/ext test/term-bank-group-policy.test.js > builds/more-screen/candidate.patch
          cp "$RUNNER_TEMP/more-tools/abba.mjs" "$RUNNER_TEMP/more-tools/prepare.py" "$RUNNER_TEMP/more-tools/corpus.mjs" builds/more-screen/source/
          cp builds/group-corpus/parity.json builds/more-screen/corpus-parity.json 2>/dev/null || true
          tar -czf builds/more-screen/source.tar.gz ext/js/dictionary/term-bank-group-policy.js ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js types/ext/dictionary-importer.d.ts test/term-bank-group-policy.test.js ext/lib/term-bank-parser.wasm test/chromium/extension-two-dictionary-import.e2e.js test/perf/dictionaries.lock.json
          git rev-parse HEAD > builds/more-screen/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-screen-${{ matrix.dictionary }}
          path: builds/more-screen
          retention-days: 30
