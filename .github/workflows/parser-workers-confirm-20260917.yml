name: Confirm shared parser worker winner
on:
  push:
    branches: [verify/import-transport-compression-20260917]
    paths:
      - dev/perf/parser-worker-confirm-20260917/trigger.txt
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RECIPE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6f85c1fb8fec871eef76363ac0ba3c59aff78f7
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Apply exact selected-source recipe
        run: |
          mkdir -p "$RUNNER_TEMP/worker-tools" builds/parser-worker-qualification
          git fetch --depth=1 origin "$RECIPE_SHA"
          for file in prepare.py make-driver.py; do
            git show "FETCH_HEAD:dev/perf/parser-workers-20260917/$file" > "$RUNNER_TEMP/worker-tools/$file"
          done
          git show "FETCH_HEAD:dev/perf/parser-worker-confirm-20260917/isolate.py" > "$RUNNER_TEMP/worker-tools/isolate.py"
          git show "FETCH_HEAD:dev/perf/parser-worker-confirm-20260917/trigger.txt" > "$RUNNER_TEMP/worker-tools/trigger.txt"
          candidate=$(tr -d '[:space:]' < "$RUNNER_TEMP/worker-tools/trigger.txt")
          case "$candidate" in w3|w4) ;; *) echo "invalid candidate: $candidate" >&2; exit 1;; esac
          printf '%s\n' "$candidate" > builds/parser-worker-qualification/candidate.txt
          python3 "$RUNNER_TEMP/worker-tools/prepare.py"
          python3 "$RUNNER_TEMP/worker-tools/isolate.py" "$candidate"
          git add -N test/term-bank-parser-worker-policy.test.js
          git diff --check
      - run: npm ci
      - name: Full source qualification
        run: |
          npm run build:libs > builds/parser-worker-qualification/libs.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/dictionary-importer.js test/term-bank-parser-worker-policy.test.js > builds/parser-worker-qualification/lint.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/term-bank-wasm-parser.js --rule '@typescript-eslint/no-unused-vars: off' > builds/parser-worker-qualification/parser-lint.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          s=Path('ext/js/dictionary/term-bank-wasm-parser.js').read_text()
          assert s.count('function decodeUtf8(bytes)') == 1 and s.count('decodeUtf8(') == 1
          PY
          node node_modules/vitest/vitest.mjs run test/term-bank-parser-worker-policy.test.js test/term-bank-experiments.test.js test/term-bank-composite-state.test.js > builds/parser-worker-qualification/focused.log 2>&1
          npm run test:unit > builds/parser-worker-qualification/unit.log 2>&1
          npm run test:unit:options > builds/parser-worker-qualification/options.log 2>&1
          npm run test:ts:main > builds/parser-worker-qualification/types-main.log 2>&1
          npm run test:ts:dev > builds/parser-worker-qualification/types-dev.log 2>&1
          set +e
          npm run test:ts:test > builds/parser-worker-qualification/types-test.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          text=Path('builds/parser-worker-qualification/types-test.log').read_text()
          errors=[line for line in text.splitlines() if 'error TS' in line]
          assert errors == [
              "test/dictionary-importer-shared-buffer.test.js(22,20): error TS7006: Parameter 'bytes' implicitly has an 'any' type.",
              "test/dictionary-importer-shared-buffer.test.js(39,45): error TS2502: 'row' is referenced directly or indirectly in its own type annotation.",
          ]
          assert 'term-bank-parser-worker-policy.test.js' not in text
          PY
          npm run test:ts:bench > builds/parser-worker-qualification/types-bench.log 2>&1
          npm run test:build > builds/parser-worker-qualification/build-plans.log 2>&1
          node dev/bin/build.js --target chrome-dev > builds/parser-worker-qualification/chrome-build.log 2>&1
          node dev/bin/build.js --target firefox-dev > builds/parser-worker-qualification/firefox-build.log 2>&1
          git diff --name-only | xargs sha256sum > builds/parser-worker-qualification/source.sha256
          sha256sum ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js >> builds/parser-worker-qualification/source.sha256
          git diff -- ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/dictionary-importer.js types/ext/dictionary-importer.d.ts test/term-bank-parser-worker-policy.test.js > builds/parser-worker-qualification/product.patch
          echo QUALIFIED > builds/parser-worker-qualification/complete.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-worker-qualification
          path: builds/parser-worker-qualification
          retention-days: 30
  benchmark:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/parser-worker-confirm
      RECIPE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6f85c1fb8fec871eef76363ac0ba3c59aff78f7
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Apply exact selected source and fixed driver
        run: |
          mkdir -p "$RUNNER_TEMP/worker-tools" builds/parser-worker-confirm
          git fetch --depth=1 origin "$RECIPE_SHA"
          for file in prepare.py make-driver.py; do
            git show "FETCH_HEAD:dev/perf/parser-workers-20260917/$file" > "$RUNNER_TEMP/worker-tools/$file"
          done
          git show "FETCH_HEAD:dev/perf/parser-worker-confirm-20260917/isolate.py" > "$RUNNER_TEMP/worker-tools/isolate.py"
          git show "FETCH_HEAD:dev/perf/parser-worker-confirm-20260917/trigger.txt" > "$RUNNER_TEMP/worker-tools/trigger.txt"
          git show "FETCH_HEAD:dev/perf/import-transport-20260917/abba.mjs" > "$RUNNER_TEMP/worker-tools/base-abba.mjs"
          candidate=$(tr -d '[:space:]' < "$RUNNER_TEMP/worker-tools/trigger.txt")
          case "$candidate" in w3|w4) ;; *) exit 1;; esac
          printf '%s\n' "$candidate" > builds/parser-worker-confirm/candidate.txt
          python3 "$RUNNER_TEMP/worker-tools/prepare.py"
          python3 "$RUNNER_TEMP/worker-tools/isolate.py" "$candidate"
          python3 "$RUNNER_TEMP/worker-tools/make-driver.py" "$RUNNER_TEMP/worker-tools/base-abba.mjs" "$RUNNER_TEMP/worker-tools/worker-abba.mjs"
          git add -N test/term-bank-parser-worker-policy.test.js
          git diff --check
      - run: npm ci
      - name: Build exact executable
        run: |
          npm run build:libs > builds/parser-worker-confirm/libs.log 2>&1
          git diff --name-only | xargs sha256sum > builds/parser-worker-confirm/source.sha256
          sha256sum ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js >> builds/parser-worker-confirm/source.sha256
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare immutable fixtures and browser package
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          h=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=h.read_text(); assert s.count('maxBuffer: 32 * 1024 * 1024') == 2
          h.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/parser-worker-confirm/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/parser-worker-confirm/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
          sha256sum -c builds/parser-worker-confirm/source.sha256
      - name: Independent six-block ABBA
        run: |
          candidate=$(cat builds/parser-worker-confirm/candidate.txt)
          node "$RUNNER_TEMP/worker-tools/worker-abba.mjs" "$candidate,control" 6 | tee builds/parser-worker-confirm/abba.log
          sha256sum -c builds/parser-worker-confirm/source.sha256
          CANDIDATE="$candidate" python3 - <<'PY'
          import json, os
          from pathlib import Path
          s=json.loads(Path('builds/parser-worker-confirm/summary.json').read_text())
          candidate=os.environ['CANDIDATE']
          expected=3 if candidate=='w3' else 4
          assert s['status']=='success' and s['blocks']==6 and len(s['observations'])==52
          for o in s['observations']:
              workers=o['parser']['parserParallelWorkerCount']
              if o['variant']==candidate and o['arm']=='B': assert workers==expected
              else: assert workers==2
          assert s['results'][candidate]['equalWorkPercent'] < 0
          Path('builds/parser-worker-confirm/audit.json').write_text(json.dumps({'status':'success','candidate':candidate,'expectedWorkers':expected,'result':s['results'][candidate],'control':s['results']['control']},indent=2)+'\n')
          PY
          echo CONFIRMED > builds/parser-worker-confirm/complete.txt
      - name: Preserve all evidence
        if: always()
        run: |
          mkdir -p builds/parser-worker-confirm/source
          git diff -- ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/dictionary-importer.js types/ext/dictionary-importer.d.ts test/term-bank-parser-worker-policy.test.js > builds/parser-worker-confirm/product.patch
          cp "$RUNNER_TEMP/worker-tools/"* builds/parser-worker-confirm/source/ 2>/dev/null || true
          git rev-parse HEAD > builds/parser-worker-confirm/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-worker-confirm-${{ matrix.dictionary }}
          path: builds/parser-worker-confirm
          retention-days: 30
