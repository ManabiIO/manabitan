name: Research Current Import Profile

on:
  push:
    branches:
      - research/import-profile-20260930

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          node-version: '24.20.0'

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Prepare verified dictionaries
        run: node ./dev/perf/prepare-dictionaries.js

      - name: Build once
        run: node ./dev/bin/build.js --target chrome-dev

      - name: Profile real imports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/current-import-profile
          for dictionary in jmdict jmnedict jitendex; do
            node ./dev/perf/import-benchmark.js "$dictionary" --runs 3 --no-build --output "builds/current-import-profile/$dictionary"
          done

      - name: Rank phase metrics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs'
          import path from 'node:path'

          const root = 'builds/current-import-profile'
          const median = (values) => {
            const sorted = [...values].sort((a, b) => a - b)
            const mid = Math.floor(sorted.length / 2)
            return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2
          }

          const collect = (value, prefix, out) => {
            if (typeof value === 'number' && Number.isFinite(value)) {
              let list = out.get(prefix)
              if (!list) { list = []; out.set(prefix, list) }
              list.push(value)
              return
            }
            if (Array.isArray(value)) {
              for (let index = 0; index < value.length; ++index) {
                const item = value[index]
                let label = String(index)
                if (item && typeof item === 'object') {
                  const named = item.phase ?? item.name ?? item.step
                  if (typeof named === 'string' && named.length > 0) { label = named }
                }
                collect(item, `${prefix}[${label}]`, out)
              }
              return
            }
            if (value && typeof value === 'object') {
              for (const [key, child] of Object.entries(value)) {
                collect(child, prefix ? `${prefix}.${key}` : key, out)
              }
            }
          }

          const final = {schemaVersion: 1, source: process.env.GITHUB_SHA, dictionaries: {}}
          for (const dictionary of ['jmdict', 'jmnedict', 'jitendex']) {
            const summary = JSON.parse(readFileSync(path.join(root, dictionary, 'summary.json'), 'utf8'))
            const totals = summary.runs.map((run) => run.totalImportMs)
            const workerTotals = summary.runs.map((run) => run.workerImportMs).filter((v) => typeof v === 'number')
            const metrics = new Map()
            for (const run of summary.runs) {
              collect(run.stepTimingSummary, 'stepTimingSummary', metrics)
              collect(run.step4Breakdown, 'step4Breakdown', metrics)
              collect(run.importDebug, 'importDebug', metrics)
            }
            const medianTotal = median(totals)
            const rankedTimes = [...metrics.entries()]
              .filter(([key, values]) => values.length === summary.runs.length && /(Ms|ms|duration|elapsed|timing)$/u.test(key))
              .map(([key, values]) => ({key, median: median(values), values, pctOfTotal: median(values) / medianTotal * 100}))
              .filter(({median: value}) => value >= 0.1)
              .sort((a, b) => b.median - a.median)
              .slice(0, 120)
            const rankedCounts = [...metrics.entries()]
              .filter(([key, values]) => values.length === summary.runs.length && /(Count|Bytes|Rows|Length)$/u.test(key))
              .map(([key, values]) => ({key, median: median(values), values}))
              .sort((a, b) => b.median - a.median)
              .slice(0, 100)
            final.dictionaries[dictionary] = {
              totalImportMs: {values: totals, median: medianTotal},
              workerImportMs: {values: workerTotals, median: workerTotals.length ? median(workerTotals) : null},
              rankedTimes,
              rankedCounts,
            }
          }
          const output = JSON.stringify(final, null, 2)
          writeFileSync(path.join(root, 'profile-summary.json'), output)
          console.log(output)
          NODE

      - uses: actions/upload-artifact@v6
        with:
          name: current-import-profile
          path: builds/current-import-profile
          compression-level: 6
          retention-days: 7
