name: JMdict CRC scheduling component screen 20261128 beb5

on:
  push:
    branches: ['test/crc-no-unroll-screen-20261128-beb5']
    paths:
      - '.github/workflows/crc-no-unroll-screen-beb5.yml'
      - 'dev/perf/crc-no-unroll-20261128-beb5/**'

permissions:
  contents: read

env:
  MANABITAN_CLANG: /usr/bin/clang-21
  MANABITAN_WASM_LD: /usr/bin/wasm-ld-21
  NODE_OPTIONS: ''
  NODE_COMPILE_CACHE: ''

jobs:
  screen:
    name: Single fixed CRC candidate (JMdict)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preserve the prospective registration
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/builds/perf/crc-no-unroll-screen-beb5/jmdict"
          mkdir -p "$evidence"
          cp dev/perf/crc-no-unroll-20261128-beb5/registration.json "$evidence/registration.json"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/source-tree.txt"
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install LLVM and LLD 21
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Check syntax and require the exact frozen native outputs
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/builds/perf/crc-no-unroll-screen-beb5/jmdict"
          node dev/perf/host-environment.js > "$evidence/host-before.json"
          for script in dev/perf/crc-no-unroll-20261128-beb5/*.mjs; do node --check "$script"; done
          python dev/perf/crc-no-unroll-20261128-beb5/build.py "$evidence" \
            2>&1 | tee "$evidence/build.log"
      - name: Capture all pinned JMdict banks with an independent decoded oracle
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/builds/perf/crc-no-unroll-screen-beb5/jmdict"
          node --input-type=module -e 'import {ensureSelectedPinnedDictionaryCache} from "./dev/perf/dictionary-fixtures.js"; await ensureSelectedPinnedDictionaryCache("builds/e2e-dictionary-cache", ["jmdict"])'
          node dev/perf/crc-no-unroll-20261128-beb5/capture.mjs \
            "$GITHUB_WORKSPACE/builds/e2e-dictionary-cache" "$RUNNER_TEMP/crc-no-unroll-inputs" \
            2>&1 | tee "$evidence/capture.log"
          mkdir "$evidence/capture"
          cp "$RUNNER_TEMP/crc-no-unroll-inputs/manifest.json" "$evidence/capture/manifest.json"
          cp "$RUNNER_TEMP/crc-no-unroll-inputs/conformance.json" "$evidence/capture/conformance.json"
          cp "$RUNNER_TEMP"/crc-no-unroll-inputs/conformance-*.bin "$evidence/capture/"
      - name: Require CRC vectors, malformed-source parity and complete JMdict output
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/builds/perf/crc-no-unroll-screen-beb5/jmdict"
          node dev/perf/crc-no-unroll-20261128-beb5/verify.mjs \
            "$RUNNER_TEMP/crc-no-unroll-inputs" "$evidence" \
            2>&1 | tee "$evidence/verify.log"
      - name: Run the one fixed default-engine cohort
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/builds/perf/crc-no-unroll-screen-beb5/jmdict"
          node dev/perf/crc-no-unroll-20261128-beb5/campaign.mjs \
            "$RUNNER_TEMP/crc-no-unroll-inputs" "$evidence" \
            2>&1 | tee "$evidence/campaign.log"
          node dev/perf/host-environment.js > "$evidence/host-after.json"
      - name: Preserve all available evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crc-no-unroll-screen-beb5-jmdict
          path: builds/perf/crc-no-unroll-screen-beb5
          if-no-files-found: error
          retention-days: 14
