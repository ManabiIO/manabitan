name: WTY corrected baseline and profile
on:
  push:
    branches: [verify/wty-import-abba-20260916]
    paths: [.github/workflows/wty-corrected-profile-20260916.yml]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-en-en-21b1b22-c0a1b7ee-v1
      - name: Pin and inspect full workload
        run: |
          python3 dev/perf/wty-abba-20260916/prepare.py
          printf '%s\n' 'b9603db16dee82afd811386302ccd78bab591a6513b0d3194d937dc9110dd4a5  builds/e2e-dictionary-cache/wty-en-en.zip' | sha256sum -c -
          python3 dev/perf/wty-abba-20260916/apply-decoder-fix.py
          git diff -- ext/js/dictionary/term-bank-wasm-parser.js > builds/wty-profile/decoder-fix.patch
      - run: npm ci
      - name: Build corrected production code
        run: |
          npm run build:libs
          node dev/bin/build.js --target chrome-dev
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - uses: actions/cache/save@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-en-en-21b1b22-c0a1b7ee-v1
      - name: Corrected baseline qualification and diagnostic run
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_IMPORT_BENCH_QUICK: '1'
          MANABITAN_E2E_IMPORT_BENCH_DICTIONARY: wty-en-en
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
        run: |
          MANABITAN_CHROMIUM_E2E_REPORT=builds/wty-profile/baseline.html node test/chromium/extension-two-dictionary-import.e2e.js > builds/wty-profile/baseline.log 2>&1
          MANABITAN_CHROMIUM_E2E_REPORT=builds/wty-profile/profile.html MANABITAN_E2E_IMPORT_TRACE_PATH=builds/wty-profile/trace.json node test/chromium/extension-two-dictionary-import.e2e.js > builds/wty-profile/profile.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wty-corrected-profile
          path: builds/wty-profile
          retention-days: 30
