name: Three dictionary isolated CRC16 confirmation
on:
  push:
    branches: [verify/three-crc-20260917]
    paths: [.github/workflows/three-crc16-confirm-20260917.yml]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
        backend: [miniz, libdeflate]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/crc-confirm
      BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 51c06f03da22a416d331a9c72bf76f8435666f50
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35175334044
          name: three-inflate-confirm-jitendex
          path: ${{ runner.temp }}/prior
      - name: Isolate CRC16 and fix the test documentation before qualification
        run: |
          mkdir -p "$RUNNER_TEMP/crc-tools" builds/crc-confirm
          git fetch --depth=1 origin 6d398150af8615284bef5ef10a0470b39a0e80d4
          for file in prepare.py qualify.py test-crc.js setup-harness.py; do
            git show "FETCH_HEAD:dev/perf/crc-round-20260917/$file" > "$RUNNER_TEMP/crc-tools/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'crc-tools/test-crc.js'
          s=p.read_text(); old='/** @param {number} length @returns {Uint8Array} */'
          assert s.count(old)==1
          p.write_text(s.replace(old,'/**\n * @param {number} length\n * @returns {Uint8Array}\n */'))
          PY
          python3 "$RUNNER_TEMP/crc-tools/prepare.py" slice16
          python3 "$RUNNER_TEMP/crc-tools/qualify.py" slice16
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 builds/crc-qualification/crc-sanitizer > builds/crc-confirm/sanitizer.log 2>&1
          python3 "$RUNNER_TEMP/crc-tools/setup-harness.py" "$RUNNER_TEMP/prior/source/inflate-abba.mjs"
      - run: npm ci
      - name: Qualify source before timing
        run: |
          npm run build:libs > builds/crc-confirm/libs.log 2>&1
          node node_modules/eslint/bin/eslint.js --fix ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js test/term-bank-crc.test.js > builds/crc-confirm/changed-lint.log 2>&1
          npm run build:libs > builds/crc-confirm/libs-final.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-crc.test.js test/term-bank-experiments.test.js test/term-bank-inflater.test.js test/term-bank-inflate-matches.test.js test/term-bank-join-boundaries.test.js > builds/crc-confirm/focused.log 2>&1
          npm run test:unit > builds/crc-confirm/unit.log 2>&1
          npm run test:unit:options > builds/crc-confirm/options.log 2>&1
          npm run test:ts > builds/crc-confirm/types.log 2>&1
          npm run test:build > builds/crc-confirm/build-plans.log 2>&1
          sha256sum ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/wasm/term-bank-parser.c types/ext/dictionary-importer.d.ts test/term-bank-crc.test.js ext/lib/term-bank-parser.wasm > builds/crc-confirm/qualified-inputs.sha256
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare common pinned fixture harness and actual browser packages
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          p=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=p.read_text(); assert s.count('maxBuffer: 32 * 1024 * 1024')==2
          p.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/crc-confirm/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/crc-confirm/chrome-build.log 2>&1
          node dev/bin/build.js --target firefox-dev > builds/crc-confirm/firefox-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Six-block same-build ABBA with explicit common backend and A/A controls
        run: |
          if [ "$BACKEND" = libdeflate ]; then export CRC_WITH_LIBDEFLATE=1; fi
          node "$RUNNER_TEMP/prior/source/crc-abba.mjs" slice16,control 6 | tee builds/crc-confirm/abba.log
          sha256sum -c builds/crc-confirm/qualified-inputs.sha256
          echo COMPLETE > builds/crc-confirm/complete.txt
      - name: Retain all observations and exact isolated source
        if: always()
        run: |
          mkdir -p builds/crc-confirm/source
          git add -N test/term-bank-crc.test.js
          git diff HEAD -- ext/js types/ext test/term-bank-crc.test.js > builds/crc-confirm/product.patch
          cp "$RUNNER_TEMP/prior/source/crc-abba.mjs" builds/crc-confirm/source/ 2>/dev/null || true
          cp builds/crc-qualification/helper-provenance.json builds/crc-confirm/ 2>/dev/null || true
          tar -czf builds/crc-confirm/source.tar.gz ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/wasm/term-bank-parser.c types/ext/dictionary-importer.d.ts test/term-bank-crc.test.js ext/lib/term-bank-parser.wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crc16-confirm-${{ matrix.dictionary }}-${{ matrix.backend }}
          path: builds/crc-confirm
          retention-days: 30
