name: Research Current Import Composition

on:
  push:
    branches:
      - research/current-import-composition-20260930

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          node-version: '24.20.0'

      - name: Install Chromium, fixtures, and build
        run: |
          npx playwright install chromium
          node ./dev/perf/prepare-dictionaries.js
          node ./dev/bin/build.js --target chrome-dev

      - name: Screen libdeflate and combined policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/perf/current-composition

          run_arm() {
            local dictionary="$1"
            local comparison="$2"
            local pair="$3"
            local arm="$4"
            local flags="$5"
            local out="builds/perf/current-composition/${dictionary}-${comparison}-pair${pair}-${arm}"
            mkdir -p "${out}"
            args=(node ./dev/perf/import-benchmark.js "${dictionary}" --runs 1 --no-build --output "${out}")
            if [[ -n "${flags}" ]]; then args+=(--flags "${flags}"); fi
            "${args[@]}"
          }

          libdeflate='{"experimentalLibdeflate":true}'
          combined='{"experimentalLibdeflate":true,"experimentalParserWorkers3":true}'

          for dictionary in jmdict jitendex; do
            for comparison in libdeflate combined; do
              if [[ "${comparison}" == "libdeflate" ]]; then flags="${libdeflate}"; else flags="${combined}"; fi
              for pair in 1 2 3 4; do
                if (( pair % 2 == 1 )); then
                  run_arm "${dictionary}" "${comparison}" "${pair}" baseline ''
                  run_arm "${dictionary}" "${comparison}" "${pair}" candidate "${flags}"
                else
                  run_arm "${dictionary}" "${comparison}" "${pair}" candidate "${flags}"
                  run_arm "${dictionary}" "${comparison}" "${pair}" baseline ''
                fi
              done
            done
          done

      - name: Summarize
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs'
          import path from 'node:path'
          const root='builds/perf/current-composition'
          const median=(values)=>{const s=[...values].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
          const read=(d,c,p,a)=>{
            const x=JSON.parse(readFileSync(path.join(root,`${d}-${c}-pair${p}-${a}`,'summary.json'),'utf8'))
            return {total:x.timing.medianMs,worker:x.workerTiming?.medianMs??null}
          }
          const out={schemaVersion:1,source:process.env.GITHUB_SHA,results:{}}
          for(const d of ['jmdict','jitendex']){
            out.results[d]={}
            for(const c of ['libdeflate','combined']){
              const pairs=[]
              for(let p=1;p<=4;p++){
                const b=read(d,c,p,'baseline'), v=read(d,c,p,'candidate')
                pairs.push({
                  pair:p,baseline:b,candidate:v,
                  totalChangePct:(v.total/b.total-1)*100,
                  workerChangePct:b.worker&&v.worker?(v.worker/b.worker-1)*100:null,
                })
              }
              out.results[d][c]={
                pairs,
                pairedMedianTotalChangePct:median(pairs.map(x=>x.totalChangePct)),
                pairedMedianWorkerChangePct:median(pairs.flatMap(x=>x.workerChangePct===null?[]:[x.workerChangePct])),
                fasterPairs:pairs.filter(x=>x.candidate.total<x.baseline.total).length,
              }
            }
          }
          writeFileSync(path.join(root,'summary.json'),JSON.stringify(out,null,2))
          console.log(JSON.stringify(out,null,2))
          NODE

      - uses: actions/upload-artifact@v6
        with:
          name: current-import-composition
          path: builds/perf/current-composition
          retention-days: 7
