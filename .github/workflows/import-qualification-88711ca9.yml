name: Import qualification 88711ca9

on:
  push:
    branches: [perf/import-qualification-20261127-88711ca9]
    paths:
      - .github/workflows/import-qualification-88711ca9.yml
      - dev/perf/import-qualification-20261127-88711ca9.py

permissions:
  contents: read

concurrency:
  group: import-qualification-88711ca9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'ManabiIO/manabitan'
    name: ${{ matrix.dictionary }} / ${{ matrix.order }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_CANDIDATE: 10ae63bf6dcfff30766dccf4edf8a1e6089a2cd4
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify the unchanged memory observer and receipt gates
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Restore locked dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Fetch the frozen product revisions
        run: git fetch --no-tags origin "$PERF_BASELINE" "$PERF_CANDIDATE"
      - name: Acquire complete imports, exhaustive media, and separate memory observations
        shell: bash
        run: |
          set -euo pipefail
          allocation=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            allocation=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261127-88711ca9.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 12 \
            --expected-workers 3 \
            --expected-source-entry eslint.config.js \
            --expected-source-entry ext/js/dictionary/term-content-block-store.js \
            --expected-source-entry ext/js/dictionary/term-content-compression-spans.js \
            --expected-source-entry test/term-content-block-store.test.js \
            --expected-source-entry test/term-content-compression-spans.test.js \
            --expected-package-entry js/dictionary/term-content-block-store.js \
            --expected-package-addition js/dictionary/term-content-compression-spans.js \
            "${allocation[@]}" \
            --evidence "builds/perf/import-qualification-88711ca9/$PERF_DICTIONARY-$PERF_ORDER"
      - name: Preserve every prescribed observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-qualification-88711ca9-${{ matrix.dictionary }}-${{ matrix.order }}
          path: builds/perf/import-qualification-88711ca9
          if-no-files-found: error
          retention-days: 14
