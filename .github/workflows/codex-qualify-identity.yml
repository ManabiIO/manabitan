name: Qualify identity repairs with strict command status
on:
  push:
    branches: [codex/delivery-identity-qualification-20260921]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    if: github.repository == 'ManabiIO/manabitan'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 136
            head: d2c5121956a758f3b0cb18545e2a402334d6cecb
          - pr: 137
            head: 99bd442f27b5960ccd95bd02512ff5b05ebe4c35
    env:
      HUSKY: '0'
      NO_COLOR: '1'
      REVIEW_PR: ${{ matrix.pr }}
      REVIEW_HEAD: ${{ matrix.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Repair only test documentation and layout
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/strict-identity"
          if test "$REVIEW_PR" = 137; then
            python - <<'PY'
          from pathlib import Path
          p = Path('test/term-record-opfs-store.test.js')
          s = p.read_text()
          a = '/** @param {string[]} dictionaryNames */'
          b = '/** @param {Map<string, Uint8Array>} files */'
          assert s.count(a) == 1 and s.count(b) == 1
          s = s.replace(a, "/**\n     * @param {string[]} dictionaryNames\n     * @returns {Parameters<TermRecordOpfsStore['appendBatch']>[0]}\n     */")
          s = s.replace(b, '/**\n     * @param {Map<string, Uint8Array>} files\n     * @returns {Promise<TermRecordOpfsStore>}\n     */')
          p.write_text(s)
          PY
          fi
          npx eslint --fix --fix-type layout test/term-record-opfs-store.test.js test/dictionary-database-import-cleanup.test.js test/dictionary-worker-handler-cleanup.test.js test/dictionary-import-controller-update-profile.test.js 2>&1 | tee "$RUNNER_TEMP/strict-identity/layout.log"
          git diff --check
          git diff > "$RUNNER_TEMP/strict-identity/correction.patch"
          test -z "$(git diff --name-only -- ext/)"
      - name: Strict lint, types and affected suites
        run: |
          set -euo pipefail
          npm run test:js 2>&1 | tee "$RUNNER_TEMP/strict-identity/lint.log"
          npm run test:ts:main 2>&1 | tee "$RUNNER_TEMP/strict-identity/main-types.log"
          npm run test:ts:test 2>&1 | tee "$RUNNER_TEMP/strict-identity/test-types.log"
          npx vitest run test/term-record-opfs-store.test.js test/dictionary-database-import-cleanup.test.js test/dictionary-worker-handler-cleanup.test.js test/dictionary-import-controller-update-profile.test.js 2>&1 | tee "$RUNNER_TEMP/strict-identity/tests.log"
      - name: Publish guarded staging head for connector promotion
        run: |
          set -euo pipefail
          git config user.name 'ManabiTan correctness preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/term-record-opfs-store.test.js test/dictionary-database-import-cleanup.test.js test/dictionary-worker-handler-cleanup.test.js test/dictionary-import-controller-update-profile.test.js
          git commit -m "test: qualify PR #$REVIEW_PR without masked lint failures"
          target="codex/qualified-identity-style-$REVIEW_PR-20260921"
          test -z "$(git ls-remote --heads origin "refs/heads/$target")"
          git log -1 --format='%H %s' | tee "$RUNNER_TEMP/strict-identity/commit.txt"
          git push origin "HEAD:refs/heads/$target"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-identity-${{ matrix.pr }}
          path: ${{ runner.temp }}/strict-identity
          retention-days: 14
