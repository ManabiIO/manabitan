name: Frozen import baseline profile eef4

on:
  push:
    branches: [experiment/import-baseline-profile-20261128-eef4]
    paths: [.github/workflows/import-baseline-profile-eef4.yml]

permissions:
  contents: read

concurrency:
  group: import-baseline-profile-eef4
  cancel-in-progress: false

jobs:
  profile:
    if: github.repository == 'ManabiIO/manabitan'
    name: Frozen baseline (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore frozen dictionaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Record exact baseline and host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PERF_BASELINE"
          test "$(node --version)" = v22.22.0
          mkdir -p builds/baseline-profile
          git rev-parse HEAD HEAD^{tree} > builds/baseline-profile/source.txt
          sha256sum test/perf/dictionaries.lock.json package-lock.json > builds/baseline-profile/inputs.sha256
          node dev/perf/host-environment.js > builds/baseline-profile/host-before.json
      - name: Profile one complete production import
        run: node dev/perf/import-benchmark.js "$PERF_DICTIONARY" --runs 1 --trace --build-target chrome --output builds/baseline-profile/trace
      - name: Preserve host and compact raw trace
        if: always()
        shell: bash
        run: |
          mkdir -p builds/baseline-profile
          node dev/perf/host-environment.js > builds/baseline-profile/host-after.json
          python3 - <<'PY'
          import gzip, pathlib, shutil
          for source in pathlib.Path('builds/baseline-profile').rglob('*.trace.json'):
              with source.open('rb') as src, gzip.open(str(source) + '.gz', 'wb') as dst:
                  shutil.copyfileobj(src, dst)
              source.unlink()
          PY
      - name: Retain every diagnostic and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-profile-eef4-${{ matrix.dictionary }}
          path: builds/baseline-profile
          if-no-files-found: error
          retention-days: 30
