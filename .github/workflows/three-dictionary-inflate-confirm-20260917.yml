name: Three dictionary isolated decoder confirmation
on:
  push:
    branches: [verify/three-dictionary-import-20260917]
    paths: [.github/workflows/three-dictionary-inflate-confirm-20260917.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/three-confirm
      THREE_CHECK_OUTPUT: builds/three-confirm/check.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Isolate the decoder and its explicit native-backend tests
        run: |
          mkdir -p builds/three-confirm
          git fetch --depth=1 origin 726c5b7444a1b3c131c90de356f8261ac2fe65a2
          git restore --source=FETCH_HEAD -- ext/js/dictionary/wasm/term-bank-inflate.c ext/js/dictionary/wasm/vendor/libdeflate test/term-bank-inflater.test.js test/native/term-bank-inflater-sanitizer.c
          python3 dev/perf/three-dictionary-20260917/prepare-inflate.py
          git add -N ext/js/dictionary/wasm/term-bank-inflate.c ext/js/dictionary/wasm/vendor/libdeflate test/term-bank-inflater.test.js test/native/term-bank-inflater-sanitizer.c
          git diff HEAD -- dev/build-libs.js ext/js types/ext test/term-bank-experiments.test.js test/term-bank-inflater.test.js test/native > builds/three-confirm/isolated.patch
      - run: npm ci
      - name: Qualify exact source before timing
        run: |
          npm run build:libs > builds/three-confirm/libs.log 2>&1
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          import {spawnSync} from 'node:child_process'
          import * as espree from 'espree'
          const files=['dev/build-libs.js','ext/js/dictionary/term-bank-wasm-parser.js','ext/js/dictionary/term-bank-experiments.js','test/term-bank-experiments.test.js','test/term-bank-inflater.test.js']
          const ast=p=>JSON.stringify(espree.parse(fs.readFileSync(p,'utf8'),{ecmaVersion:'latest',sourceType:'module'}),(key,value)=>key==='start'||key==='end'?undefined:value)
          const before=files.map(ast)
          const result=spawnSync(process.execPath,['node_modules/eslint/bin/eslint.js','--fix',...files],{encoding:'utf8'})
          fs.writeFileSync('builds/three-confirm/changed-lint.log',result.stdout+result.stderr)
          assert.equal(result.status,0)
          assert.deepEqual(files.map(ast),before)
          fs.writeFileSync('builds/three-confirm/ast-equality.txt','Complete syntax trees unchanged by formatting\n')
          JS
          npm run build:libs > builds/three-confirm/libs-final.log 2>&1
          node dev/perf/three-dictionary-20260917/inflate-check.mjs > builds/three-confirm/check.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-inflater.test.js test/term-bank-experiments.test.js test/term-bank-inflate-matches.test.js test/term-bank-join-boundaries.test.js > builds/three-confirm/focused.log 2>&1
          npm run test:unit > builds/three-confirm/unit.log 2>&1
          npm run test:unit:options > builds/three-confirm/options.log 2>&1
          npm run test:ts > builds/three-confirm/types.log 2>&1
          npm run test:build > builds/three-confirm/build-plans.log 2>&1
          clang -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffunction-sections -fdata-sections -I. test/native/term-bank-inflater-sanitizer.c -Wl,--gc-sections -lz -o builds/three-confirm/inflater-sanitizer
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 builds/three-confirm/inflater-sanitizer > builds/three-confirm/sanitizer.log 2>&1
          sha256sum ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/wasm/term-bank-parser.c ext/js/dictionary/wasm/term-bank-inflate.c types/ext/dictionary-importer.d.ts test/term-bank-experiments.test.js test/term-bank-inflater.test.js ext/lib/term-bank-parser.wasm > builds/three-confirm/qualified-inputs.sha256
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Build exact browser packages and common fixture-only harness
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          path=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=path.read_text(); assert s.count('maxBuffer: 32 * 1024 * 1024')==2
          path.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/three-confirm/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/three-confirm/chrome-build.log 2>&1
          node dev/bin/build.js --target firefox-dev > builds/three-confirm/firefox-build.log 2>&1
          npx playwright install --with-deps chromium
          sha256sum -c builds/three-confirm/qualified-inputs.sha256
      - name: Independent six-block ABBA with interleaved same-binary controls
        run: node dev/perf/three-dictionary-20260917/inflate-abba.mjs control,inflate 6 | tee builds/three-confirm/abba.log
      - name: Full WTY encoded output, key and hint equality
        if: matrix.dictionary == 'wty-en-en'
        run: |
          git fetch --depth=1 origin 1654d15dc4b27ddc75f27ec3168b30a891ce5725
          git show FETCH_HEAD:dev/perf/wty-next-20260917/corpus-parity.mjs > "$RUNNER_TEMP/corpus-parity.mjs"
          node "$RUNNER_TEMP/corpus-parity.mjs" '{"experimentalLibdeflate":true}' builds/three-corpus > builds/three-confirm/corpus.log 2>&1
          cp builds/three-corpus/parity.json builds/three-confirm/corpus-parity.json
      - name: Full strict Chromium import, update, restart and recovery lifecycle
        if: matrix.dictionary == 'jmdict'
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{"experimentalLibdeflate":true}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/three-confirm/lifecycle.html
        run: |
          node test/chromium/extension-two-dictionary-import.e2e.js > builds/three-confirm/lifecycle.log 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('builds/three-confirm/lifecycle.json').read_text())
          assert r['status']=='success' and r['skippedVerification'] is False and len(r['phases'])>=80
          PY
      - name: Check immutable source after every qualification gate
        run: |
          sha256sum -c builds/three-confirm/qualified-inputs.sha256
          echo QUALIFIED > builds/three-confirm/complete.txt
      - name: Retain all observations, exact isolated source and any failure
        if: always()
        run: |
          mkdir -p builds/three-confirm/source
          git diff HEAD -- dev/build-libs.js ext/js types/ext test/term-bank-experiments.test.js test/term-bank-inflater.test.js test/native > builds/three-confirm/product.patch
          cp dev/perf/three-dictionary-20260917/inflate-abba.mjs dev/perf/three-dictionary-20260917/inflate-check.mjs dev/perf/three-dictionary-20260917/prepare-inflate.py builds/three-confirm/source/ 2>/dev/null || true
          tar -czf builds/three-confirm/source.tar.gz dev/build-libs.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/wasm types/ext/dictionary-importer.d.ts test/term-bank-experiments.test.js test/term-bank-inflater.test.js test/native/term-bank-inflater-sanitizer.c ext/lib/term-bank-parser.wasm 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-inflate-confirm-${{ matrix.dictionary }}
          path: builds/three-confirm
          retention-days: 30
