name: Dual-hash vectorization independent confirmation
on:
  push:
    branches: [verify/import-round7-20260916]
    paths: [.github/workflows/import-round7-hash-confirm-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        baseline: [production, first-special]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7ba3b0c221b1dc913064012f10b6d579bfd6eb5
          persist-credentials: false
      - name: Fix the comparison before observing results
        env:
          BASELINE: ${{ matrix.baseline }}
        run: |
          cp -a dev/perf/round7-20260916 "$RUNNER_TEMP/round7-review"
          git fetch --depth=1 origin 23524cf48cb08482ebd271406fe48da773bb516c
          git show FETCH_HEAD:dev/perf/round6-20260916/screen.py > "$RUNNER_TEMP/round7-review/screen.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round7-review/screen.py'
          s = p.read_text().replace("('word-jump', 'simd-jump', 'inflight-bounds')", "('hash-vector',)")
          s = s.replace('round6', 'round7').replace('round-six', 'round-seven')
          if os.environ['BASELINE'] == 'first-special':
              s = s.replace('b4094a423c20bb0ed424d944238f922c1b36559c', '78837c89c3d251fcedebc8ecaf14a4c2c2c1f6cb')
              s = s.replace('604c5c2b64b8d217e87895dbd981aa3a30579bcb', 'de6e56e27ebb5503cdd36a07e0e1eba475b2eb33')
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round7-review/"*.py
          if test "$BASELINE" = first-special; then
            git fetch --depth=1 origin 78837c89c3d251fcedebc8ecaf14a4c2c2c1f6cb
            git checkout --detach 78837c89c3d251fcedebc8ecaf14a4c2c2c1f6cb
          else
            git fetch --depth=1 origin b4094a423c20bb0ed424d944238f922c1b36559c
            git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify full locked dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Full corpus output checks and twelve reversed-order pairs
        env:
          CANDIDATE: hash-vector
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: |
          mkdir -p builds/round7
          python3 "$RUNNER_TEMP/round7-review/screen.py" 2>&1 | tee builds/round7/driver.log
      - name: Preserve exact driver even on failure
        if: always()
        run: |
          mkdir -p builds/round7/driver-inputs
          cp "$RUNNER_TEMP/round7-review/"*.py builds/round7/driver-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round7-hash-confirm-${{ matrix.baseline }}-${{ matrix.dictionary }}
          path: builds/round7
          retention-days: 30
