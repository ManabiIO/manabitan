name: Import registration provenance validation d2d1

on:
  push:
    branches: [lab/import-registration-proof-20261128-d2d1]
    paths:
      - .github/workflows/import-registration-proof-d2d1.yml

permissions:
  contents: read

concurrency:
  group: import-registration-proof-d2d1-${{ github.ref }}
  cancel-in-progress: false

env:
  PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
  PERF_CANDIDATE: 8b4f502cdc26541c542b7473fae4e51c0713ef98

jobs:
  validation:
    name: Provenance-corrected registration validation
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MANABITAN_CLANG: /usr/bin/clang-21
      MANABITAN_WASM_LD: /usr/bin/wasm-ld-21
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PERF_CANDIDATE }}
          persist-credentials: false
      - name: Install pinned native test compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Lint changed source and tests
        run: node node_modules/eslint/bin/eslint.js ext/js/dictionary/dictionary-database.js test/dictionary-in-flight-source-validation.test.js
      - name: Type-check product and tests
        run: npm run test:ts:main && npm run test:ts:test
      - name: Run complete unit suite
        run: npm run test:unit
      - name: Verify all build targets
        run: npm run test:build
