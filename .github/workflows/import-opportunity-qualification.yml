name: Import opportunity qualification
on:
  push:
    branches: [verify/import-opportunities-20260914]
    paths: [.github/workflows/import-opportunity-qualification.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct routing repair on qualified parser source
        run: |
          set -euo pipefail
          gzip -dc .github/import-opportunity-routing.patch.gz > "$RUNNER_TEMP/routing.patch"
          echo 'bec31797793fb89d89307876a290d32bf05ef40c1578bf5a372d4479b86721d3  '"$RUNNER_TEMP/routing.patch" | sha256sum -c -
          git checkout --detach 662aeebd6b5ebc2aac83e0270b8bee686ac1ee4a
          git apply --index --whitespace=error-all "$RUNNER_TEMP/routing.patch"
          test "$(git write-tree)" = b5f7b420afe60c02cba305b384a4a6b32716700a
          git diff --cached --check
          git -c user.name='Manabitan contributors' -c user.email=contributors@manabi.io commit -m 'Preserve import experiment flags through settings and reject inactive benchmark arms'
          git rev-parse HEAD HEAD^{tree} HEAD^ > "$RUNNER_TEMP/source-identity.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm ci && npm run build:libs
      - name: Unit and static qualification
        run: |
          set -euo pipefail
          npm run test:ts
          npm run test:unit
          npm run test:unit:options
          node node_modules/eslint/bin/eslint.js ext/js/pages/settings/dictionary-import-controller.js dev/perf/benchmark-support.js test/import-experiment-routing.test.js test/perf-benchmark-support.test.js test/chromium/extension-two-dictionary-import.e2e.js
          npm run test:build
      - name: Publish verified source-only staging commit
        run: |
          test "$(git rev-parse HEAD^{tree})" = b5f7b420afe60c02cba305b384a4a6b32716700a
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/stage/import-opportunities-routed-20260914
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Chromium functional coverage with effective-option validation
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{"experimentalTermBankSpans":true,"experimentalNativeEscapedKeys":true,"experimentalValidatedGlossaryReuse":true,"experimentalFusedSingleBank":true,"experimentalGlobalExactContentReuse":true,"experimentalFastGlossaryNormalization":true,"experimentalKnownGlossaryKeys":true,"experimentalSchemaRowParser":true}'
        run: xvfb-run -a npm run test:e2e:chromium-extension
      - name: Verified end-to-end screening and same-binary control
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
        run: |
          xvfb-run -a node dev/perf/import-ab.js jitendex --pairs 4 --flags '{}' --label same-binary-aa
          xvfb-run -a node dev/perf/import-ab.js jitendex --pairs 4 --flags '{"experimentalKnownGlossaryKeys":true}' --label known-keys
          xvfb-run -a node dev/perf/import-ab.js jmnedict --pairs 4 --flags '{"experimentalSchemaRowParser":true}' --label schema-rows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-opportunity-qualification
          path: |
            ${{ runner.temp }}/source-identity.txt
            builds/*report*.json
            builds/*ab*/*.json
          retention-days: 14
