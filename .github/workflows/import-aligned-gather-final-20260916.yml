name: Final selected aligned gather qualification
on:
  push:
    branches: [verify/import-pipeline-research-20260916]
    paths: [.github/workflows/import-aligned-gather-final-20260916.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7ecc2b133636fd35716cffa2b6d428e8cd7484a4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Retrieve and build exactly the measured smaller candidate
        run: |
          mkdir -p builds/aligned-final "$RUNNER_TEMP/aligned-final"
          git fetch --depth=1 origin 96764973fe07f60358747dfb4d61ed3630e86964
          git show FETCH_HEAD:dev/perf/pipeline-research-20260916/apply-next.py > "$RUNNER_TEMP/aligned-final/apply.py"
          git fetch --depth=1 origin c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          git show FETCH_HEAD:dev/lib/zstd-wasm.js > dev/lib/zstd-wasm.js
          python3 "$RUNNER_TEMP/aligned-final/apply.py" gather-aligned | tee builds/aligned-final/measured-source.json
          printf '%s\n' '88c127aa4a4339f193ae68d21b675bcd47a676328e178c31a58eb1ea009314e3  dev/lib/zstd-wasm.js' | sha256sum -c -
          cp dev/lib/zstd-wasm.js builds/aligned-final/measured-source.js
          npm run build:libs > builds/aligned-final/measured-build.log 2>&1
          cp ext/lib/zstd-wasm.js builds/aligned-final/measured-executable.js
          cp ext/lib/term-bank-parser.wasm builds/aligned-final/measured-parser.wasm
      - name: Correct only ternary line breaks and assert identical syntax tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('dev/lib/zstd-wasm.js')
          s=p.read_text()
          old=') ? (heap.byteOffset + destinationOffset - source.byteOffset - runOffset) & 7 : 0;'
          new=') ?\n            (heap.byteOffset + destinationOffset - source.byteOffset - runOffset) & 7 :\n            0;'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='ffced26811bf43ae5b8ee3fd41390c3f55dde24abbde754ce9ca2a9b1b059bf6'
          PY
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          import * as espree from 'espree'
          const ast = p => JSON.stringify(espree.parse(fs.readFileSync(p, 'utf8'), {ecmaVersion:'latest', sourceType:'module'}), (key,value)=>key==='start'||key==='end'?undefined:value)
          assert.equal(ast('builds/aligned-final/measured-source.js'), ast('dev/lib/zstd-wasm.js'))
          fs.writeFileSync('builds/aligned-final/ast-equality.txt','Complete AST unchanged; only source positions excluded\n')
          JS
          npm run build:libs > builds/aligned-final/formatted-build.log 2>&1
          cmp builds/aligned-final/measured-executable.js ext/lib/zstd-wasm.js
          cmp builds/aligned-final/measured-parser.wasm ext/lib/term-bank-parser.wasm
          sha256sum dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js ext/lib/zstd-wasm.js ext/lib/term-bank-parser.wasm test/perf/dictionaries.lock.json > builds/aligned-final/qualified-inputs.sha256
          node node_modules/eslint/bin/eslint.js dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js > builds/aligned-final/changed-lint.log 2>&1
      - name: Full correctness and build qualification without source rewriting
        run: |
          node node_modules/vitest/vitest.mjs run test/zstd-shared-gather.test.js test/zstd-wasm.test.js test/dictionary-database-content-dedup.test.js test/term-content-block-store.test.js 2>&1 | tee builds/aligned-final/focused.log
          npm run test:unit 2>&1 | tee builds/aligned-final/unit.log
          npm run test:unit:options 2>&1 | tee builds/aligned-final/options.log
          npm run test:ts 2>&1 | tee builds/aligned-final/types.log
          npm run test:build 2>&1 | tee builds/aligned-final/build-plans.log
          node dev/bin/build.js --target chrome-dev 2>&1 | tee builds/aligned-final/chrome-build.log
          node dev/bin/build.js --target firefox-dev 2>&1 | tee builds/aligned-final/firefox-build.log
      - name: Full lint has only the known baseline file diagnostics
        run: |
          set +e
          node node_modules/eslint/bin/eslint.js . --ignore-pattern '**/*.json' -f json > builds/aligned-final/lint.json 2> builds/aligned-final/lint-stderr.log
          status=$?
          set -e
          test "$status" -eq 1
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('test/term-bank-composite-state.test.js')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='9384dca84f8e29bc0cc728c19d50bc946191ce25a6ce48566c75480dc99edd17'
          issues=[r for r in json.loads(Path('builds/aligned-final/lint.json').read_text()) if r['errorCount'] or r['warningCount']]
          assert len(issues)==1 and issues[0]['filePath'].endswith('/test/term-bank-composite-state.test.js')
          assert issues[0]['errorCount']==38 and issues[0]['warningCount']==0
          PY
      - name: Install browser and locked dictionaries
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Full strict Chromium lifecycle
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/aligned-final/browser.html
        run: |
          npm run test:e2e:chromium-extension 2>&1 | tee builds/aligned-final/browser.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('builds/aligned-final/browser.json').read_text())
          assert report['status']=='success' and report['skippedVerification'] is False and len(report['phases'])>=80
          PY
      - name: Advance only the existing optimization PR, without rewriting its history
        run: |
          git diff --check
          sha256sum -c builds/aligned-final/qualified-inputs.sha256
          cmp builds/aligned-final/measured-executable.js ext/lib/zstd-wasm.js
          git add dev/lib/zstd-wasm.js
          python3 - <<'PY'
          import subprocess
          assert subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()==['dev/lib/zstd-wasm.js']
          PY
          git -c core.hooksPath=/dev/null -c user.name='Manabitan contributors' -c user.email='contributors@manabi.io' commit -m 'perf: retain the smaller qualified alignment-only gather'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/perf/import-shared-gather-20260916
          git rev-parse HEAD 'HEAD^{tree}' > builds/aligned-final/qualified.txt
      - name: Retain evidence even on failure
        if: always()
        run: |
          mkdir -p builds/aligned-final
          git diff c0a1b7ee6fa1383a0a422361d2a8b7f826499fff -- dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js > builds/aligned-final/source.patch
          cp dev/lib/zstd-wasm.js test/zstd-shared-gather.test.js builds/aligned-final/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-aligned-gather-final-qualification
          path: builds/aligned-final
          retention-days: 30
