name: Direct shared-word copy verification
on:
  push:
    branches: [verify/stable-word-copy2-20260910]
    paths:
      - .github/workflows/stable-word-copy2.yml
      - dev/perf/stable-word-copy/**
permissions:
  contents: read
env:
  BASELINE: d5dd9cb0072059b326f333ef425018ce1227a756
  CANDIDATE_TREE: f454f14e19162a7c4784e8045d3f18ba46824af4
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Reconstruct source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          echo '8bfd1bb8a85c0ae988cf828412564eb7ccdbe57e5a3d8971f4cdf7d7cd14a23b  dev/perf/stable-word-copy/source.patch' | sha256sum -c -
          echo 'b98afadfc06d762ef86af3caf33e2e35570853efb1bcaf48a77eaabf867b919e  dev/perf/stable-word-copy/refinement.patch' | sha256sum -c -
          cp dev/perf/stable-word-copy/*.patch "$evidence/"
          git worktree add --detach "$RUNNER_TEMP/candidate" "$BASELINE"
          cd "$RUNNER_TEMP/candidate"
          git apply --index "$evidence/source.patch"
          git apply --index "$evidence/refinement.patch"
          test "$(git write-tree)" = "$CANDIDATE_TREE"
          git -c core.hooksPath=/dev/null -c user.name='Manabitan verification' -c user.email='verification@users.noreply.github.com' commit -m 'perf(import): use aligned integer loads for stable shared-byte copies'
          cp -al "$GITHUB_WORKSPACE/node_modules" node_modules
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/source.txt"
          git cat-file commit HEAD > "$evidence/commit.txt"
          node dev/bin/build-libs.js > "$evidence/build-libs.log" 2>&1
      - name: Full unit, options, strict types, lint and builds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
          npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
          npm run test:js > "$RUNNER_TEMP/evidence/lint.log" 2>&1
          node dev/bin/build.js --dryRun --all > "$RUNNER_TEMP/evidence/dry-build.log" 2>&1
          test -z "$(git status --porcelain)"
      - name: Publish qualified source to verification branch only
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate"
          git push origin HEAD:refs/heads/verify/stable-word-copy2-source-20260910
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-word-copy-correctness
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jmnedict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build exact frozen source arms and identify native browser policy
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          arms="$RUNNER_TEMP/arms"
          mkdir -p "$evidence" "$arms"
          echo '8bfd1bb8a85c0ae988cf828412564eb7ccdbe57e5a3d8971f4cdf7d7cd14a23b  dev/perf/stable-word-copy/source.patch' | sha256sum -c -
          echo 'b98afadfc06d762ef86af3caf33e2e35570853efb1bcaf48a77eaabf867b919e  dev/perf/stable-word-copy/refinement.patch' | sha256sum -c -
          cp dev/perf/stable-word-copy/*.patch "$evidence/"
          # Instantiate only the candidate-tree parameter; product benchmark code stays byte-identical.
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('dev/perf/stable-word-copy/paired.py').read_text()
          old = '8385544b3e978ea4c3140d78a27c1e31118392f4'
          assert text.count(old) == 1
          Path(os.environ['RUNNER_TEMP'], 'evidence', 'paired.py').write_text(text.replace(old, os.environ['CANDIDATE_TREE']))
          PY
          git worktree add --detach "$arms/A" "$BASELINE"
          git worktree add --detach "$arms/B" "$BASELINE"
          git -C "$arms/B" apply --index "$evidence/source.patch"
          git -C "$arms/B" apply --index "$evidence/refinement.patch"
          test "$(git -C "$arms/B" write-tree)" = "$CANDIDATE_TREE"
          git -C "$arms/B" -c core.hooksPath=/dev/null -c user.name='Manabitan verification' -c user.email='verification@users.noreply.github.com' commit -m 'perf(import): use aligned integer loads for stable shared-byte copies'
          for arm in A B; do
            cp -al "$GITHUB_WORKSPACE/node_modules" "$arms/$arm/node_modules"
            (cd "$arms/$arm" && node dev/bin/build-libs.js && node dev/bin/build.js --target chrome-dev) > "$evidence/build-$arm.log" 2>&1
            test -z "$(git -C "$arms/$arm" status --porcelain)"
          done
          (cd "$arms/A" && node dev/perf/prepare-dictionaries.js) > "$evidence/fixtures.log" 2>&1
          ln -s "$arms/A/builds/e2e-dictionary-cache" "$arms/B/builds/e2e-dictionary-cache"
          node --input-type=module <<'NODE' > "$evidence/native-memory.json"
          import {createServer} from 'node:http';
          import {chromium} from 'playwright';
          const server = createServer((req, res) => res.end('<!doctype html><title>memory preflight</title>'));
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          const browser = await chromium.launch({headless: true});
          try {
            const page = await browser.newPage();
            await page.goto(`http://127.0.0.1:${server.address().port}`);
            const policy = await page.evaluate(async () => {
              const url = URL.createObjectURL(new Blob(['postMessage({deviceMemory: navigator.deviceMemory, hardwareConcurrency: navigator.hardwareConcurrency})'], {type: 'text/javascript'}));
              const worker = new Worker(url);
              const value = await new Promise(resolve => worker.onmessage = event => resolve(event.data));
              worker.terminate();
              URL.revokeObjectURL(url);
              return {page: {deviceMemory: navigator.deviceMemory, hardwareConcurrency: navigator.hardwareConcurrency}, worker: value};
            });
            console.log(JSON.stringify({browserVersion: browser.version(), ...policy}, null, 2));
          } finally { await browser.close(); server.close(); }
          NODE
          clang --version > "$evidence/compiler.txt"
          node --version > "$evidence/node.txt"
          lscpu > "$evidence/cpu.txt"
          free -b > "$evidence/memory.txt"
      - name: Complete six-pair plan, reversed initial order, no retries
        shell: bash
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/evidence/paired.py" --baseline "$RUNNER_TEMP/arms/A" --candidate "$RUNNER_TEMP/arms/B" --dictionary "$DICTIONARY" --pairs 6 --reverse --output "$RUNNER_TEMP/evidence/paired" 2>&1 | tee "$RUNNER_TEMP/evidence/driver.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-word-copy-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
