name: Current import pipeline profiles
on:
  push:
    branches: [verify/import-pipeline-research-20260916]
    paths: [.github/workflows/import-pipeline-profile-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node dev/bin/build.js --target chrome-dev
      - name: Verify complete fixtures
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Diagnostic full-import trace; not authoritative timing
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: node dev/perf/import-benchmark.js "$DICTIONARY" --runs 1 --trace --no-build --flags '{}' --output builds/pipeline-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-pipeline-profile-${{ matrix.dictionary }}
          path: builds/pipeline-profile
          retention-days: 30
