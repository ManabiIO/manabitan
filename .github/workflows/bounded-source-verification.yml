name: Verify bounded compressed-source imports

on:
  push:
    branches: [perf-bounded-source-verify-20260908]
    paths:
      - .github/workflows/bounded-source-verification.yml
      - dev/perf/bounded-source-experiment/**

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.lane }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: standard
            runner: ubuntu-24.04
            dataset: jmdict,jmnedict,jitendex
            pairs: 8
            warmups: 1
            timeout: 35
          - lane: slim-jmdict
            runner: ubuntu-slim
            dataset: jmdict
            pairs: 2
            warmups: 0
            timeout: 15
          - lane: slim-jmnedict
            runner: ubuntu-slim
            dataset: jmnedict
            pairs: 2
            warmups: 0
            timeout: 15
          - lane: slim-jitendex
            runner: ubuntu-slim
            dataset: jitendex
            pairs: 2
            warmups: 0
            timeout: 15
    env:
      DATASETS: ${{ matrix.dataset }}
      PAIRS: ${{ matrix.pairs }}
      WARMUPS: ${{ matrix.warmups }}
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Install compiler when absent and the pinned browser
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang lld
          fi
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Prepare exact baseline and bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          arms="$RUNNER_TEMP/arms"
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$arms" "$evidence"
          for arm in baseline candidate; do
            git worktree add --detach "$arms/$arm" b8d68458cde8788b5d5301ceaf36beae7a1363f9
            ln -s "$GITHUB_WORKSPACE/node_modules" "$arms/$arm/node_modules"
          done
          git -C "$arms/candidate" apply --index "$GITHUB_WORKSPACE/dev/perf/bounded-source-experiment/product.patch"
          cp dev/perf/bounded-source-experiment/term-bank-bounded-compressed.test.js "$arms/candidate/test/"
          git -C "$arms/candidate" add test/term-bank-bounded-compressed.test.js
          test "$(git -C "$arms/candidate" write-tree)" = b87991b7e840752f68132cc14e8437b3cf123056
          for arm in baseline candidate; do
            (cd "$arms/$arm" && node dev/bin/build.js --target chrome-dev) > "$evidence/build-$arm.log" 2>&1
          done
          for file in term-bank-parser.wasm zstd.wasm zip.js z-worker.js; do
            cmp "$arms/baseline/ext/lib/$file" "$arms/candidate/ext/lib/$file"
          done
          git -C "$arms/candidate" diff HEAD --binary > "$evidence/source.patch"
          (cd "$arms/baseline" && node dev/perf/prepare-dictionaries.js) > "$evidence/fixtures.log" 2>&1
          ln -s "$arms/baseline/builds/e2e-dictionary-cache" "$arms/candidate/builds/e2e-dictionary-cache"
          cp dev/perf/bounded-source-experiment/run-paired.py "$evidence/"
          clang --version > "$evidence/compiler.txt"
          lscpu > "$evidence/cpu.txt"
          free -b > "$evidence/memory.txt"
      - name: Correctness before timing
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          if [ "$LANE" = standard ]; then
            node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
            npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
            node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
            node dev/bin/build.js --dryRun --all > "$RUNNER_TEMP/evidence/build-dry-run.log" 2>&1
          else
            node node_modules/vitest/vitest.mjs run test/term-bank-bounded-compressed.test.js test/dictionary-import-ownership.test.js > "$RUNNER_TEMP/evidence/focused.log" 2>&1
          fi
      - name: Fixed-count paired imports with production-selected paths
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/perf/bounded-source-experiment/run-paired.py \
            --baseline "$RUNNER_TEMP/arms/baseline" \
            --candidate "$RUNNER_TEMP/arms/candidate" \
            --datasets "$DATASETS" --pairs "$PAIRS" --warmups "$WARMUPS" \
            --output "$RUNNER_TEMP/evidence/paired" \
            --label "PR23 vs bounded raw-ZIP source plans: $LANE; no forced device-memory values" \
            | tee "$RUNNER_TEMP/evidence/driver.log"
      - name: Strict full Chromium integration after timing
        if: matrix.lane == 'standard'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          MANABITAN_E2E_STRICT_RUNTIME=1 MANABITAN_CHROMIUM_HEADLESS=1 MANABITAN_E2E_SKIP_BUILD=1 MANABITAN_CHROMIUM_E2E_REPORT="$RUNNER_TEMP/evidence/full-chromium.html" node test/chromium/extension-two-dictionary-import.e2e.js > "$RUNNER_TEMP/evidence/full-chromium.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-source-${{ matrix.lane }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: warn

  preserve-source:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve only the verified source and tests for review
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/source" b8d68458cde8788b5d5301ceaf36beae7a1363f9
          git -C "$RUNNER_TEMP/source" apply --index "$GITHUB_WORKSPACE/dev/perf/bounded-source-experiment/product.patch"
          cp dev/perf/bounded-source-experiment/term-bank-bounded-compressed.test.js "$RUNNER_TEMP/source/test/"
          cd "$RUNNER_TEMP/source"
          git add test/term-bank-bounded-compressed.test.js
          test "$(git write-tree)" = b87991b7e840752f68132cc14e8437b3cf123056
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c core.hooksPath=/dev/null commit -m 'Use bounded compressed source batches on constrained devices'
          git push origin HEAD:refs/heads/perf-import-bounded-compressed-20260908
          git rev-parse HEAD > "$RUNNER_TEMP/source-sha.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: bounded-source-reference
          path: ${{ runner.temp }}/source-sha.txt
          retention-days: 14
          if-no-files-found: error
