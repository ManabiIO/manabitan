name: Three dictionary compression screen corrected
on:
  push:
    branches: [verify/import-transport-compression-20260917]
    paths: [.github/workflows/import-compression-screen2-20260917.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/compression-screen
      CHECK_OUT: builds/compression-screen/check.json
      WORKER_CHECK_OUT: builds/compression-screen/worker-check.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Apply exact candidates and restore unchanged decompression signature
        run: |
          mkdir -p builds/compression-screen
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          patch=gzip.decompress(base64.b64decode(Path('dev/perf/import-transport-20260917/candidates.patch.gz.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest()=='d07dcc888e5af0f164dfbe1417eec7a7655e826017248cd7e757db726598cb7c'
          subprocess.run(['git','apply','-'],input=patch,check=True)
          p=Path('ext/js/dictionary/zstd-term-content.js')
          s=p.read_text(); old='export function decompressTermContentZstd(content, dictName, options) {'
          assert s.count(old)==1
          p.write_text(s.replace(old,'export function decompressTermContentZstd(content, dictName) {'))
          PY
          git diff --check
      - run: npm ci
      - name: Actual codec, focused suites, types and syntax-preserving formatting
        run: |
          npm run build:libs > builds/compression-screen/libs.log 2>&1
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          import {spawnSync} from 'node:child_process'
          import * as espree from 'espree'
          const files=['ext/js/dictionary/dictionary-database.js','ext/js/dictionary/dictionary-importer.js','ext/js/dictionary/term-bank-experiments.js','ext/js/dictionary/term-content-block-store.js','ext/js/dictionary/zstd-term-content.js','ext/js/dictionary/zstd-term-content-compression-worker.js','test/term-bank-experiments.test.js','test/term-content-block-store.test.js','test/zstd-term-content-pool.test.js']
          const ast=p=>JSON.stringify(espree.parse(fs.readFileSync(p,'utf8'),{ecmaVersion:'latest',sourceType:'module'}),(key,value)=>key==='start'||key==='end'?undefined:value)
          const before=files.map(ast)
          const result=spawnSync(process.execPath,['node_modules/eslint/bin/eslint.js','--fix',...files],{encoding:'utf8'})
          fs.writeFileSync('builds/compression-screen/changed-lint.log',result.stdout+result.stderr)
          assert.equal(result.status,0)
          assert.deepEqual(files.map(ast),before)
          fs.writeFileSync('builds/compression-screen/format-equality.txt','Entire syntax tree unchanged\n')
          JS
          node dev/perf/import-transport-20260917/check.mjs > builds/compression-screen/check.log 2>&1
          node dev/perf/import-transport-20260917/worker-check.mjs > builds/compression-screen/worker-check.log 2>&1
          node node_modules/vitest/vitest.mjs run test/zstd-wasm.test.js test/zstd-term-content-pool.test.js test/term-content-block-store.test.js test/term-bank-experiments.test.js test/dictionary-importer.test.js > builds/compression-screen/focused.log 2>&1
          npm run test:ts:main > builds/compression-screen/types-main.log 2>&1
          npm run test:ts:dev > builds/compression-screen/types-dev.log 2>&1
          npm run test:ts:bench > builds/compression-screen/types-bench.log 2>&1
          python3 dev/perf/import-transport-20260917/compare-test-types.py > builds/compression-screen/test-types-parity.log 2>&1
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Immutable full fixtures and actual Chrome package
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          h=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          text=h.read_text(); assert text.count('maxBuffer: 32 * 1024 * 1024')==2
          h.write_text(text.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/compression-screen/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/compression-screen/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Fixed ABBA and storage-cost measurement
        run: node dev/perf/import-transport-20260917/abba.mjs control,fast2,workers2,generic,both 2 | tee builds/compression-screen/abba.log
      - name: Retain exact source and every result or failure
        if: always()
        run: |
          mkdir -p builds/compression-screen/source
          git diff -- ext/js types/ext test/term-bank-experiments.test.js test/term-content-block-store.test.js test/zstd-term-content-pool.test.js > builds/compression-screen/candidate.patch
          cp dev/perf/import-transport-20260917/abba.mjs dev/perf/import-transport-20260917/check.mjs dev/perf/import-transport-20260917/worker-check.mjs dev/perf/import-transport-20260917/compare-test-types.py builds/compression-screen/source/
          tar -czf builds/compression-screen/source.tar.gz ext/js/dictionary/dictionary-database.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/term-content-block-store.js ext/js/dictionary/zstd-term-content.js ext/js/dictionary/zstd-term-content-compression-worker.js types/ext/dictionary-importer.d.ts test/term-bank-experiments.test.js test/term-content-block-store.test.js test/zstd-term-content-pool.test.js ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js test/chromium/extension-two-dictionary-import.e2e.js test/perf/dictionaries.lock.json 2>/dev/null || true
          git rev-parse HEAD > builds/compression-screen/research-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compression-screen-${{ matrix.dictionary }}
          path: builds/compression-screen
          retention-days: 30
