name: Import memory qualification 7762

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: import-memory-7762-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  memory:
    if: github.head_ref == 'diagnostic/import-memory-20261124-7762' && github.event.pull_request.head.repo.full_name == github.repository
    name: Import memory ${{ matrix.dictionary }} host ${{ matrix.replication }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        replication: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify observer coverage and clock rules
        run: |
          python3 dev/perf/import-memory-7762/test_chromium_memory.py
          python3 dev/perf/import-memory-7762/test_import_window.py
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fetch frozen candidate
        run: |
          set -euo pipefail
          candidate_sha=$(python3 -c 'import json; print(json.load(open("dev/perf/import-qualification-7762.json"))["candidates"]["bounded-shared-content"]["commit"])')
          git fetch origin "$candidate_sha"
      - name: Execute all four predetermined memory observations
        run: python3 dev/perf/import-memory-7762/run_memory.py bounded-shared-content '${{ matrix.dictionary }}' '${{ matrix.replication }}'
      - name: Retain exact packages, raw scans, and every failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-memory-7762-${{ matrix.dictionary }}-${{ matrix.replication }}
          path: builds/memory-qualification
          if-no-files-found: error
          retention-days: 14
