name: Structured type import screen

on:
  pull_request:
    # One prospective acquisition. Evidence-only updates must not replace it.
    types: [opened]

permissions:
  contents: read

jobs:
  screen:
    if: github.head_ref == 'perf/structured-type-field-20261126-513d' && github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.dictionary }} (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    env:
      PERF_BASELINE: 0143e9596cd8f790d5e166d4ba6a2425fbc57f14
      PERF_CANDIDATE: ${{ github.event.pull_request.head.sha }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify qualification receipt checks
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Screen complete imports and verify memory and persisted results
        run: |
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 6 \
            --expected-package-entry lib/term-bank-parser.wasm \
            --expected-package-entry js/dictionary/wasm/term-bank-parser.c \
            --evidence "builds/perf/import-structured-type-$PERF_DICTIONARY-$PERF_ORDER"
      - name: Retain every observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-structured-type-${{ matrix.dictionary }}-${{ matrix.order }}-513d
          path: builds/perf/import-structured-type-${{ matrix.dictionary }}-${{ matrix.order }}
          if-no-files-found: error
          retention-days: 14
