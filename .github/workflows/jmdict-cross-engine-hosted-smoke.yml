name: JMdict Cross-Engine Hosted Smoke

on:
  push:
    branches:
      - codex/qualify-jmdict-hosted-20261128

permissions:
  contents: read

jobs:
  semantic-smoke:
    name: Pinned JMdict import and first lookup
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out frozen Manabitan source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify product tree matches the frozen Manabitan source
        run: git diff --exit-code f28c2801fcfd9416f220b46b9cbafeee901c1cb2 -- ext dev test/chromium test/e2e package.json package-lock.json

      - name: Set up Manabitan build and Node dependencies
        uses: ./.github/actions/setup

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Check out frozen Hoshidicts source
        uses: actions/checkout@v6
        with:
          repository: Manhhao/hoshidicts
          ref: c77b36201de0e86c8950dd1d3d88cbee36472fb1
          path: hoshidicts
          submodules: recursive
          persist-credentials: false

      - name: Download and verify pinned JMdict
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/jmdict-smoke"
          curl --fail --location --retry 3 \
            https://github.com/yomidevs/jmdict-yomitan/releases/download/2026-11-22/JMdict_english.zip \
            --output "${RUNNER_TEMP}/jmdict-smoke/JMdict_2026-11-22.zip"
          echo "3a614c92cfa747946de8422fc408d6d93926ba76541df66e434b24976a10160f  ${RUNNER_TEMP}/jmdict-smoke/JMdict_2026-11-22.zip" | sha256sum --check

      - name: Build Hoshidicts semantic driver
        run: >-
          cmake -S test/qualification/hoshidicts-jmdict
          -B "${RUNNER_TEMP}/jmdict-smoke/hoshi-build"
          -DCMAKE_BUILD_TYPE=Release
          -DHOSHIDICTS_SOURCE_DIR="${GITHUB_WORKSPACE}/hoshidicts"
          && cmake --build "${RUNNER_TEMP}/jmdict-smoke/hoshi-build"
          --target hoshidicts-import-lookup-bench --parallel 2

      - name: Verify portable digest parity
        shell: bash
        run: |
          set -euo pipefail
          digest="$(printf abc | sha256sum | cut -d' ' -f1)"
          test "${digest}" = ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad
          native_digest="$("${RUNNER_TEMP}/jmdict-smoke/hoshi-build/hoshidicts-import-lookup-bench" --verify-sha256)"
          test "${native_digest}" = "${digest}"
          echo "OpenSSL SHA-256 parity vector passed: ${native_digest}"

      - name: Build Manabitan extension
        run: node ./dev/bin/build.js --target chrome-dev

      - name: Attest benchmark runner and glossary oracle
        shell: bash
        run: |
          set -euo pipefail
          runner_hash="$(sha256sum test/qualification/hoshidicts-jmdict/run-glossary.mjs | cut -d' ' -f1)"
          echo "BENCH_RUNNER_SHA256=${runner_hash}" >> "${GITHUB_ENV}"
          sha256sum test/qualification/hoshidicts-jmdict/run-glossary.mjs test/qualification/hoshidicts-jmdict/glossary-fields.mjs test/qualification/hoshidicts-jmdict/glossary-validation.mjs test/qualification/hoshidicts-jmdict/expected-glossaries.json test/qualification/hoshidicts-jmdict/glossary-attestations.json test/qualification/hoshidicts-jmdict/fixtures/source-oracle.json > "${RUNNER_TEMP}/jmdict-smoke/qualification-manifest.sha256"

      - name: Run Hoshidicts import and first-lookup smoke
        shell: bash
        env:
          BENCH_RUN_DIR: ${{ runner.temp }}/jmdict-smoke/evidence
          BENCH_ARM: hoshidicts
          BENCH_POSITION: '1'
          BENCH_HOSHIDICTS_DRIVER: ${{ runner.temp }}/jmdict-smoke/hoshi-build/hoshidicts-import-lookup-bench
          BENCH_ARCHIVE: ${{ runner.temp }}/jmdict-smoke/JMdict_2026-11-22.zip
        run: node test/qualification/hoshidicts-jmdict/run-glossary.mjs hoshidicts jmdict 1 test/qualification/hoshidicts-jmdict/fixtures/source-oracle.json

      - name: Run Manabitan settings import and first hydrated lookup smoke
        shell: bash
        env:
          BENCH_RUN_DIR: ${{ runner.temp }}/jmdict-smoke/evidence
          BENCH_ARM: candidate
          BENCH_POSITION: '1'
          BENCH_EXTENSION_DIR: ${{ runner.temp }}/jmdict-smoke/manabitan-extension
          BENCH_COMMIT: f28c2801fcfd9416f220b46b9cbafeee901c1cb2
          BENCH_HOSHIDICTS_DRIVER: ${{ runner.temp }}/jmdict-smoke/hoshi-build/hoshidicts-import-lookup-bench
          BENCH_ARCHIVE: ${{ runner.temp }}/jmdict-smoke/JMdict_2026-11-22.zip
        run: |
          set -euo pipefail
          package="builds/manabitan-chrome-dev.zip"
          test -f "${package}"
          BENCH_PACKAGE_SHA256="$(sha256sum "${package}" | cut -d' ' -f1)"
          export BENCH_PACKAGE_SHA256
          mkdir -p "${BENCH_EXTENSION_DIR}"
          unzip -q "${package}" -d "${BENCH_EXTENSION_DIR}"
          node test/qualification/hoshidicts-jmdict/run-glossary.mjs manabitan jmdict 1 test/qualification/hoshidicts-jmdict/fixtures/source-oracle.json

      - name: Create compact hosted receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/jmdict-smoke/upload"
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const root = process.env.RUNNER_TEMP + '/jmdict-smoke/evidence/runs';
          const arms = ['jmdict-1-hoshidicts', 'jmdict-1-candidate'];
          const selected = [];
          for (const arm of arms) {
            try {
              const receipt = JSON.parse(readFileSync(join(root, arm, 'receipt.json'), 'utf8'));
              selected.push(Object.fromEntries(['engine', 'dataset', 'pair', 'runnerSha256', 'archiveSha256', 'query', 'title', 'termCount', 'resultCount', 'configuredMaxResults', 'configuredScanLength', 'headwordPairs', 'orderedHeadwordPairs', 'sourcePairCoverage', 'resultSha256', 'importMs', 'completionMs', 'lookupStageMs', 'dispatchToResponseMs', 'totalMs', 'warm', 'afterRestart', 'packageSha256', 'commit', 'validation', 'status'].filter(key => key in receipt).map(key => [key, receipt[key]])));
            } catch {}
          }
          if (selected.length !== 2 || !selected.every(receipt => receipt.status === 'passed')) throw new Error('Both pinned engine receipts must pass semantic validation');
          writeFileSync(process.env.RUNNER_TEMP + '/jmdict-smoke/upload/summary.json', JSON.stringify({manabitanHarnessCommit:process.env.GITHUB_SHA, manabitanProductCommit:'f28c2801fcfd9416f220b46b9cbafeee901c1cb2', manabitanCommit:'f28c2801fcfd9416f220b46b9cbafeee901c1cb2', hoshidictsCommit:'c77b36201de0e86c8950dd1d3d88cbee36472fb1', archiveUrl:'https://github.com/yomidevs/jmdict-yomitan/releases/download/2026-11-22/JMdict_english.zip', archiveSha256:'3a614c92cfa747946de8422fc408d6d93926ba76541df66e434b24976a10160f', receipts:selected}, null, 2) + '\n');
          NODE
          cp "${RUNNER_TEMP}/jmdict-smoke/qualification-manifest.sha256" "${RUNNER_TEMP}/jmdict-smoke/upload/qualification-manifest.sha256"

      - name: Upload smoke receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jmdict-cross-engine-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/jmdict-smoke/upload
          if-no-files-found: warn
          retention-days: 30
