name: Screen generic content pipeline overlap
on:
  push:
    branches: [research/import-structural-20260918]
    paths: [.github/workflows/import-generic-overlap-screen-20260918.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmnedict, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/generic-overlap
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb7241deb70950dc113089cd774c9489ede48f8a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact generic span patch and isolated overlap candidate
        run: |
          set -euo pipefail
          mkdir -p builds/generic-overlap/source "$RUNNER_TEMP/generic-tools"
          git fetch --depth=2 origin 6c75ae517f8a4d74a27e1b7d0f69c1dcdb01e243
          git show --format= --binary 6c75ae517f8a4d74a27e1b7d0f69c1dcdb01e243 > builds/generic-overlap/generic.patch
          git apply --exclude=ext/js/dictionary/term-bank-experiments.js --exclude=types/ext/dictionary-importer.d.ts builds/generic-overlap/generic.patch
          git fetch --depth=1 origin f00b61bb2d851024f4124f1d854502ba602b506d
          git show FETCH_HEAD:dev/perf/import-transport-20260917/abba.mjs > "$RUNNER_TEMP/generic-tools/abba-original.mjs"
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/generic-tools/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          def replace(path, old, new):
              p=Path(path); s=p.read_text(); assert s.count(old)==1,(path,old); p.write_text(s.replace(old,new))
          replace('ext/js/dictionary/term-bank-experiments.js','return Object.freeze({','return Object.freeze({\n        experimentalGenericSpanCompression: options.experimentalGenericSpanCompression === true,\n        experimentalGenericSpanOverlap: options.experimentalGenericSpanOverlap === true,')
          replace('types/ext/dictionary-importer.d.ts','experimentalLibdeflate?: boolean;','experimentalLibdeflate?: boolean;\n    experimentalGenericSpanCompression?: boolean;\n    experimentalGenericSpanOverlap?: boolean;')
          replace('ext/js/dictionary/term-content-block-store.js',"            compressionDictName !== 'jmdict' ||", "            (compressionDictName !== 'jmdict' && !(this._compressionExperiments.experimentalGenericSpanCompression && this._compressionExperiments.experimentalGenericSpanOverlap)) ||")
          p=Path('ext/js/dictionary/term-content-block-store.js');s=p.read_text();start=s.index('    _beginAppendSharedSpans(');before=s.rfind('     * @param {string} compressionDictName',0,start);assert before>=0;s=s[:before]+s[before:].replace('     * @param {string} compressionDictName','     * @param {string|null} compressionDictName',1);p.write_text(s)
          tools=Path(os.environ['RUNNER_TEMP'])/'generic-tools'
          s=(tools/'abba-original.mjs').read_text()
          start=s.index('const variants=');end=s.index('\n',start)
          s=s[:start]+"const variants={control:{},generic:{experimentalGenericSpanCompression:true},overlap:{experimentalGenericSpanCompression:true,experimentalGenericSpanOverlap:true}}"+s[end:]
          s=s.replace("base:'2f407e86fae0d3e39f506e6b1ce30886697698ea'","base:'fb7241deb70950dc113089cd774c9489ede48f8a'")
          (tools/'abba.mjs').write_text(s)
          (tools/'fixture.py').write_text((tools/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          h=Path('test/chromium/extension-two-dictionary-import.e2e.js');s=h.read_text();assert s.count('maxBuffer: 32 * 1024 * 1024')==2;h.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/generic-tools/fixture.py" > builds/generic-overlap/fixture.log
          git diff > builds/generic-overlap/source.patch
      - run: npm ci
      - name: Build and focused codec validation
        run: |
          set -euo pipefail
          npm run build:libs > builds/generic-overlap/libs.log 2>&1
          node node_modules/vitest/vitest.mjs run test/zstd-wasm.test.js test/zstd-term-content-pool.test.js test/term-content-block-store.test.js > builds/generic-overlap/focused.log 2>&1
          npm run test:ts:main > builds/generic-overlap/types-main.log 2>&1
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/generic-overlap/build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Fixed exploratory cohort including all observations
        run: node "$RUNNER_TEMP/generic-tools/abba.mjs" control,generic,overlap 2 | tee builds/generic-overlap/abba.log
      - name: Preserve exact candidate and driver
        if: always()
        run: |
          find "$RUNNER_TEMP/generic-tools" -maxdepth 1 -type f -exec cp '{}' builds/generic-overlap/source/ ';'
          git diff > builds/generic-overlap/source.patch
          git diff --name-only | xargs -r tar -czf builds/generic-overlap/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generic-overlap-${{ matrix.dictionary }}
          path: builds/generic-overlap
          retention-days: 14
          if-no-files-found: error
