name: SQL constraints and counts exact-source qualification
on:
  push:
    branches: [verify/import-round9-sql-20260916]
    paths: [.github/workflows/import-round9-sql-qualify-20260916.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0fec19b86bdfcf6d848cb456af68943162dd1517
      - name: Preserve exact reviewed inputs and select current production baseline
        run: |
          mkdir -p "$RUNNER_TEMP/round9-review"
          cp dev/perf/round9-sql-20260916/combined.patch "$RUNNER_TEMP/round9-review/"
          cp test/dictionary-terms-vtab.test.js test/dictionary-counts-batched.test.js "$RUNNER_TEMP/round9-review/"
          test "$(sha256sum "$RUNNER_TEMP/round9-review/combined.patch" | cut -d ' ' -f 1)" = 601bfa182d0be90b83dd6f01b7bdb6793de79d614a3fea148ae4a440d8cc4bda
          git fetch --depth=1 origin 895b2adf6c8cf2eec3d45602173ec48e1f3cfb4a
          git switch --detach 895b2adf6c8cf2eec3d45602173ec48e1f3cfb4a
          git switch -c fix/sql-constraints-and-counts-20260916
          cp "$RUNNER_TEMP/round9-review/"*.test.js test/
          test "$(git hash-object test/dictionary-terms-vtab.test.js)" = bb6b7cbce7344bc4b40e46b42b199df61ca97ba8
          test "$(git hash-object test/dictionary-counts-batched.test.js)" = 4c62d7c207bc4dce1c0f3c60ae4adb2be73a65b4
          mkdir -p builds/round9-qualification
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Reproduce the actual parent failures with real SQLite WASM
        run: |
          npm run build:libs > builds/round9-qualification/parent-build.log 2>&1
          set +e
          node node_modules/vitest/vitest.mjs run test/dictionary-terms-vtab.test.js test/dictionary-counts-batched.test.js --reporter=json --outputFile=builds/round9-qualification/parent-red.json > builds/round9-qualification/parent-red.log 2>&1
          status=$?
          set -e
          test "$status" = 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('builds/round9-qualification/parent-red.json').read_text())
          assert r['numFailedTests'] == 19 and r['numPassedTests'] == 10 and r['numPendingTests'] == 0, r
          failures = [a['title'] for f in r['testResults'] for a in f['assertionResults'] if a['status'] == 'failed']
          assert 'all 120 condition orders bind to the same columns' in failures
          assert 'never interprets a NULL filter as an empty-string or missing-sequence sentinel' in failures
          assert 'uses one conditional-count query per table while retaining duplicate result slots' in failures
          PY
      - name: Apply only the exact tested SQL source patch
        run: |
          git apply --check "$RUNNER_TEMP/round9-review/combined.patch"
          git apply "$RUNNER_TEMP/round9-review/combined.patch"
          test "$(sha256sum ext/js/dictionary/dictionary-database.js | cut -d ' ' -f 1)" = bb4cf5bfa66f7a33a6535335533a8f8b75f10e1a37287717dd79808bb06e41c0
          test "$(sha256sum ext/js/dictionary/term-record-opfs-store.js | cut -d ' ' -f 1)" = 789c302d3bb5a40637090f59185b0ec868a5bcf3b34655988d4849fe280b68f8
          node --version > builds/round9-qualification/node.txt
          clang --version > builds/round9-qualification/compiler.txt
      - name: SQL and adjacent storage regressions
        id: focused
        continue-on-error: true
        run: node node_modules/vitest/vitest.mjs run test/dictionary-terms-vtab.test.js test/dictionary-counts-batched.test.js test/dictionary-database-counts.test.js test/dictionary-database-content-dedup.test.js test/term-record-opfs-store.test.js test/term-content-block-store.test.js --reporter=json --outputFile=builds/round9-qualification/focused.json 2>&1 | tee builds/round9-qualification/focused.log
      - name: Complete unit suite
        id: unit
        continue-on-error: true
        run: npm run test:unit 2>&1 | tee builds/round9-qualification/unit.log
      - name: Options suite
        id: options
        continue-on-error: true
        run: npm run test:unit:options 2>&1 | tee builds/round9-qualification/options.log
      - name: All strict JavaScript typecheck projects
        id: types
        continue-on-error: true
        run: npm run test:ts 2>&1 | tee builds/round9-qualification/types.log
      - name: Changed-source and new-test lint without rewriting
        id: lint
        continue-on-error: true
        run: node node_modules/eslint/bin/eslint.js ext/js/dictionary/dictionary-database.js ext/js/dictionary/term-record-opfs-store.js test/dictionary-terms-vtab.test.js test/dictionary-counts-batched.test.js 2>&1 | tee builds/round9-qualification/lint.log
      - name: Build plans and actual Chrome and Firefox packages
        id: build
        continue-on-error: true
        run: |
          npm run test:build 2>&1 | tee builds/round9-qualification/build-plans.log
          node dev/bin/build.js --target chrome-dev 2>&1 | tee builds/round9-qualification/chrome-build.log
          node dev/bin/build.js --target firefox-dev 2>&1 | tee builds/round9-qualification/firefox-build.log
      - name: Install pinned browser and complete dictionary fixtures
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Full strict Chromium import and persistence lifecycle
        id: browser
        continue-on-error: true
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/round9-qualification/browser.html
        run: |
          npm run test:e2e:chromium-extension 2>&1 | tee builds/round9-qualification/browser.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('builds/round9-qualification/browser.json').read_text())
          assert r['status'] == 'success' and r['skippedVerification'] is False
          assert len(r['phases']) >= 80
          PY
      - name: Publish only the exact qualified source and tests
        if: steps.focused.outcome == 'success' && steps.unit.outcome == 'success' && steps.options.outcome == 'success' && steps.types.outcome == 'success' && steps.lint.outcome == 'success' && steps.build.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          git diff --check
          test "$(sha256sum ext/js/dictionary/dictionary-database.js | cut -d ' ' -f 1)" = bb4cf5bfa66f7a33a6535335533a8f8b75f10e1a37287717dd79808bb06e41c0
          test "$(sha256sum ext/js/dictionary/term-record-opfs-store.js | cut -d ' ' -f 1)" = 789c302d3bb5a40637090f59185b0ec868a5bcf3b34655988d4849fe280b68f8
          test "$(git hash-object test/dictionary-terms-vtab.test.js)" = bb6b7cbce7344bc4b40e46b42b199df61ca97ba8
          test "$(git hash-object test/dictionary-counts-batched.test.js)" = 4c62d7c207bc4dce1c0f3c60ae4adb2be73a65b4
          git add ext/js/dictionary/dictionary-database.js ext/js/dictionary/term-record-opfs-store.js test/dictionary-terms-vtab.test.js test/dictionary-counts-batched.test.js
          git -c user.name='Manabitan contributors' -c user.email='contributors@manabi.io' commit -m 'fix: make SQL filters order independent and reduce dictionary count scans'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/fix/sql-constraints-and-counts-20260916
          git rev-parse HEAD 'HEAD^{tree}' > builds/round9-qualification/published.txt
      - name: Record evidence and fail closed
        if: always()
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          mkdir -p builds/round9-qualification
          printf '%s\n' "focused=$FOCUSED unit=$UNIT options=$OPTIONS types=$TYPES lint=$LINT build=$BUILD browser=$BROWSER" > builds/round9-qualification/outcomes.txt
          cp "$RUNNER_TEMP/round9-review/"* builds/round9-qualification/
          test "$FOCUSED/$UNIT/$OPTIONS/$TYPES/$LINT/$BUILD/$BROWSER" = 'success/success/success/success/success/success/success'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round9-sql-qualification-corrected
          path: builds/round9-qualification
          retention-days: 30
