name: WTY storage and ZIP ABBA screen
on:
  push:
    branches: [verify/wty-import-abba-20260916]
    paths: [.github/workflows/wty-storage-io-screen-20260916.yml]
permissions:
  contents: read
jobs:
  screen:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - id: block-256k
            label: Content blocks 256 KiB
            flags: '{"termContentBlockTargetBytes":262144}'
          - id: block-512k
            label: Content blocks 512 KiB
            flags: '{"termContentBlockTargetBytes":524288}'
          - id: block-2m
            label: Content blocks 2 MiB
            flags: '{"termContentBlockTargetBytes":2097152}'
          - id: block-4m
            label: Content blocks 4 MiB
            flags: '{"termContentBlockTargetBytes":4194304}'
          - id: zip-workers-2
            label: ZIP workers 2
            flags: '{"zipMaxWorkers":2}'
          - id: zip-workers-8
            label: ZIP workers 8
            flags: '{"zipMaxWorkers":8}'
          - id: zip-no-workers
            label: ZIP synchronous inflate
            flags: '{"zipUseWebWorkers":false}'
          - id: no-row-prealloc
            label: Disable row preallocation
            flags: '{"wasmPreallocateChunkRows":false}'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-en-en-21b1b22-c0a1b7ee-v1
      - name: Prepare pinned WTY and common correctness baseline
        shell: bash
        run: |
          python3 dev/perf/wty-abba-20260916/prepare.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s = p.read_text()
          old = "const {stdout} = await execFileAsync('unzip', ['-p', zipPath, banks[bankIndex]], {maxBuffer: 32 * 1024 * 1024});"
          assert s.count(old) == 1
          p.write_text(s.replace(old, old.replace('32 * 1024', '128 * 1024')))
          PY
      - run: npm ci
      - name: Build one package for baseline and candidate
        run: |
          npm run build:libs
          node dev/bin/build.js --target chrome-dev
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Two-pair ABBA screen
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_AB_BULKADD_BYTES_METRICS: '0'
          MANABITAN_AB_QUICK_MODE: '1'
        run: |
          mkdir -p "builds/wty-storage-io/${{ matrix.id }}"
          node test/chromium/import-flags-ab-benchmark.js wty-en-en --pairs 2 --flags '${{ matrix.flags }}' --label '${{ matrix.label }}' 2>&1 | tee "builds/wty-storage-io/${{ matrix.id }}/screen.log"
          cp builds/chromium-e2e-import-flags-isolated-summary-*.json "builds/wty-storage-io/${{ matrix.id }}/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wty-storage-io-${{ matrix.id }}
          path: builds/wty-storage-io/${{ matrix.id }}
          retention-days: 30
