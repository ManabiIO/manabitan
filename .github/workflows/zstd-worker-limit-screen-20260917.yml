name: Zstd worker-limit screen
on:
  push:
    branches: [verify/zstd-worker-limit-20260917]
    paths:
      - .github/workflows/zstd-worker-limit-screen-20260917.yml
      - dev/perf/zstd-worker-limit-20260917/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      ZSTD_WORKERS_DICTIONARY: ${{ matrix.dictionary }}
      ZSTD_WORKERS_OUTPUT: builds/zstd-workers
      RECIPE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f407e86fae0d3e39f506e6b1ce30886697698ea
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Apply worker-limit candidates and common decoder correction
        run: |
          mkdir -p "$RUNNER_TEMP/zstd-workers" builds/zstd-workers
          git fetch --depth=1 origin "$RECIPE_SHA"
          git show "FETCH_HEAD:dev/perf/zstd-worker-limit-20260917/prepare.py" > "$RUNNER_TEMP/zstd-workers/prepare.py"
          git show "FETCH_HEAD:dev/perf/zstd-worker-limit-20260917/abba.mjs" > "$RUNNER_TEMP/zstd-workers/abba.mjs"
          python3 "$RUNNER_TEMP/zstd-workers/prepare.py"
          git diff --check
          git diff -- ext/js types/ext test/zstd-term-content-pool.test.js > builds/zstd-workers/candidate.patch
      - run: npm ci
      - name: Qualify dispatch isolation and candidate source
        run: |
          npm run build:libs > builds/zstd-workers/libs.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/dictionary-database.js ext/js/dictionary/term-content-block-store.js ext/js/dictionary/zstd-term-content.js ext/js/dictionary/term-bank-experiments.js test/zstd-term-content-pool.test.js > builds/zstd-workers/lint.log 2>&1
          node node_modules/vitest/vitest.mjs run test/zstd-term-content-pool.test.js test/term-content-block-store.test.js test/term-bank-experiments.test.js test/dictionary-database-content-dedup.test.js > builds/zstd-workers/focused.log 2>&1
          npm run test:ts:main > builds/zstd-workers/types-main.log 2>&1
          npm run test:ts:dev > builds/zstd-workers/types-dev.log 2>&1
          npm run test:ts:bench > builds/zstd-workers/types-bench.log 2>&1
          set +e
          npm run test:ts:test > builds/zstd-workers/types-test.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          git diff --exit-code 2f407e86fae0d3e39f506e6b1ce30886697698ea -- test/dictionary-importer-shared-buffer.test.js
          python3 - <<'PY'
          from pathlib import Path
          errors=[line for line in Path('builds/zstd-workers/types-test.log').read_text().splitlines() if 'error TS' in line]
          assert len(errors)==2, errors
          assert any('dictionary-importer-shared-buffer.test.js(22,20): error TS7006' in x for x in errors)
          assert any('dictionary-importer-shared-buffer.test.js(39,45): error TS2502' in x for x in errors)
          PY
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare pinned fixtures and one browser package for every arm
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          h=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          text=h.read_text(); assert text.count('maxBuffer: 32 * 1024 * 1024')==2
          h.write_text(text.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/zstd-workers/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/zstd-workers/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Fixed complete-import ABBA against four-worker baseline
        run: node "$RUNNER_TEMP/zstd-workers/abba.mjs" control,workers2,workers3 2 | tee builds/zstd-workers/abba.log
      - name: Retain all observations and exact source
        if: always()
        run: |
          mkdir -p builds/zstd-workers/source
          cp "$RUNNER_TEMP/zstd-workers/abba.mjs" "$RUNNER_TEMP/zstd-workers/prepare.py" builds/zstd-workers/source/ 2>/dev/null || true
          git diff -- ext/js types/ext test/zstd-term-content-pool.test.js > builds/zstd-workers/final.patch
          tar -czf builds/zstd-workers/source.tar.gz ext/js/dictionary/dictionary-importer.js ext/js/dictionary/dictionary-database.js ext/js/dictionary/term-content-block-store.js ext/js/dictionary/zstd-term-content.js ext/js/dictionary/term-bank-experiments.js types/ext/dictionary-importer.d.ts test/zstd-term-content-pool.test.js ext/lib/term-bank-parser.wasm test/chromium/extension-two-dictionary-import.e2e.js test/perf/dictionaries.lock.json
          git rev-parse HEAD 'HEAD^{tree}' > builds/zstd-workers/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zstd-workers-${{ matrix.dictionary }}
          path: builds/zstd-workers
          retention-days: 30
