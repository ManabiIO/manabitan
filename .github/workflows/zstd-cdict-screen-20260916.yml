name: Prepared Zstd CDict import screen 20260916
on:
  push:
    branches: [verify/zstd-cdict-20260916]
    paths: [.github/workflows/zstd-cdict-screen-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve candidate patch and pin baseline
        run: |
          base64 --decode dev/perf/zstd-cdict-20260916.patch.gz.b64 | gzip -dc > "$RUNNER_TEMP/candidate.patch"
          test "$(sha256sum "$RUNNER_TEMP/candidate.patch" | cut -d ' ' -f 1)" = 5ac5a56dae86a29c7c77a7f803fb286869c4f24d2b0dcab7d2eb1d04823442ef
          git fetch --depth=1 origin 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          test "$(git rev-parse 'HEAD^{tree}')" = c069f4ca92d8e6902a1a182281a06b2579610c05
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install pinned Emscripten 5.0.1
        run: |
          git clone --quiet --depth=1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 5.0.1
          "$RUNNER_TEMP/emsdk/emsdk" activate 5.0.1
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcc --version | tee "$RUNNER_TEMP/emcc-version.txt"
      - name: Fetch checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Build exact baseline package
        run: |
          node dev/bin/build.js --target chrome-dev
          cp builds/manabitan-chrome-dev.zip "$RUNNER_TEMP/base.zip"
          sha256sum "$RUNNER_TEMP/base.zip" > "$RUNNER_TEMP/base-package.sha256"
          sha256sum dev/data/zstd-simd.wasm > "$RUNNER_TEMP/base-wasm.sha256"
      - name: Apply candidate and rebuild pinned Zstd WASM
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          git apply --check "$RUNNER_TEMP/candidate.patch"
          git apply "$RUNNER_TEMP/candidate.patch"
          git diff --check
          npm run build:zstd-wasm -- --write
          npm run build:libs
          node node_modules/vitest/vitest.mjs run test/zstd-wasm.test.js test/zstd-term-content-initialization.test.js test/zstd-term-content-pool.test.js test/term-content-block-store.test.js test/zstd-block-envelope-wasm.test.js
          node node_modules/eslint/bin/eslint.js dev/bin/build-zstd-wasm.js dev/lib/zstd-wasm.js ext/js/dictionary/zstd-term-content.js test/zstd-wasm.test.js test/zstd-term-content-initialization.test.js
          npm run test:ts
      - name: Actual generated-WASM CDict conformance
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises'
          import assert from 'node:assert/strict'
          import createZstdModule from './dev/lib/zstd-simd-module.js'
          const wasmBinary = await fs.readFile('./dev/data/zstd-simd.wasm')
          const dictionary = await fs.readFile('./dev/data/zstd-dicts/jmdict.zdict')
          const m = await createZstdModule({wasmBinary})
          const dictPtr = m._malloc(dictionary.byteLength)
          assert.ok(dictPtr > 0)
          m.HEAPU8.set(dictionary, dictPtr)
          const cdict = m._ZSTD_createCDict(dictPtr, dictionary.byteLength, -1)
          assert.ok(cdict > 0)
          const cctx = m._ZSTD_createCCtx()
          const dctx = m._ZSTD_createDCtx()
          assert.ok(cctx > 0 && dctx > 0)
          let state = 0x51f15eed
          const random = () => (state = (Math.imul(state, 1664525) + 1013904223) >>> 0)
          for (let trial = 0; trial < 400; ++trial) {
              const length = trial < 20 ? trial : 1 + (random() % 131072)
              const source = new Uint8Array(length)
              for (let i = 0; i < length; ++i) source[i] = (random() >>> 16) & 0xff
              const srcPtr = m._malloc(Math.max(1, length))
              const bound = m._ZSTD_compressBound(length)
              const rawPtr = m._malloc(bound)
              const preparedPtr = m._malloc(bound)
              const decodedPtr = m._malloc(Math.max(1, length))
              assert.ok(srcPtr && rawPtr && preparedPtr && decodedPtr)
              m.HEAPU8.set(source, srcPtr)
              const rawSize = m._ZSTD_compress_usingDict(cctx, rawPtr, bound, srcPtr, length, dictPtr, dictionary.byteLength, -1)
              assert.equal(m._ZSTD_isError(rawSize), 0)
              const preparedSize = m._ZSTD_compress_usingCDict(cctx, preparedPtr, bound, srcPtr, length, cdict)
              assert.equal(m._ZSTD_isError(preparedSize), 0)
              const decodedSize = m._ZSTD_decompress_usingDict(dctx, decodedPtr, length, preparedPtr, preparedSize, dictPtr, dictionary.byteLength)
              assert.equal(m._ZSTD_isError(decodedSize), 0)
              assert.equal(decodedSize, length)
              assert.deepEqual(m.HEAPU8.slice(decodedPtr, decodedPtr + length), source)
              m._free(decodedPtr); m._free(preparedPtr); m._free(rawPtr); m._free(srcPtr)
          }
          assert.equal(m._ZSTD_freeCDict(cdict), 0)
          assert.equal(m._ZSTD_freeCCtx(cctx), 0)
          assert.equal(m._ZSTD_freeDCtx(dctx), 0)
          m._free(dictPtr)
          console.log('400 generated-WASM CDict cases passed')
          NODE
      - name: Commit exact candidate and build package
        run: |
          git add dev/bin/build-zstd-wasm.js dev/lib/zstd-simd-module.d.ts dev/lib/zstd-wasm.js ext/js/dictionary/zstd-term-content.js test/zstd-term-content-initialization.test.js test/zstd-wasm.test.js dev/lib/zstd-simd-module.js dev/data/zstd-simd.wasm
          git -c core.hooksPath=/dev/null -c user.name='Manabitan contributors' -c user.email=contributors@manabi.io commit -m 'perf: prepare term-content Zstd compression dictionary once'
          git rev-parse HEAD 'HEAD^{tree}' | tee "$RUNNER_TEMP/candidate-source.txt"
          test -z "$(git status --porcelain)"
          node dev/bin/build.js --target chrome-dev
          cp builds/manabitan-chrome-dev.zip "$RUNNER_TEMP/candidate.zip"
          sha256sum "$RUNNER_TEMP/candidate.zip" > "$RUNNER_TEMP/candidate-package.sha256"
          sha256sum dev/data/zstd-simd.wasm > "$RUNNER_TEMP/candidate-wasm.sha256"
          python3 - <<'PY'
          import zipfile, os, json
          base = os.environ['RUNNER_TEMP'] + '/base.zip'
          candidate = os.environ['RUNNER_TEMP'] + '/candidate.zip'
          with zipfile.ZipFile(base) as a, zipfile.ZipFile(candidate) as b:
              assert a.namelist() == b.namelist()
              changed = [name for name in a.namelist() if a.read(name) != b.read(name)]
          print(json.dumps(changed, indent=2))
          open(os.environ['RUNNER_TEMP'] + '/changed-package-members.json', 'w').write(json.dumps(changed, indent=2))
          PY
      - name: Fixed six-pair browser source comparison
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, shutil, subprocess, time
          root = pathlib.Path.cwd(); tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          baseline = '30ffb604e0a87f0aa252bd4331bc54668062b1e1'
          candidate = (tmp / 'candidate-source.txt').read_text().splitlines()[0].strip()
          dictionary = os.environ['DICTIONARY']
          out = root / 'builds/zstd-cdict-screen'; out.mkdir(parents=True, exist_ok=True)
          identities = {
              'A': {'commit': baseline, 'package': subprocess.check_output(['sha256sum', str(tmp/'base.zip')], text=True).split()[0]},
              'B': {'commit': candidate, 'package': subprocess.check_output(['sha256sum', str(tmp/'candidate.zip')], text=True).split()[0]},
          }
          plan = [{'kind':'warmup','pair':0,'arm':'A','binary':'A'}, {'kind':'warmup','pair':0,'arm':'B','binary':'B'}]
          for pair in range(1, 7):
              order = 'AB' if pair % 2 else 'BA'
              plan += [{'kind':'measured','pair':pair,'arm':arm,'binary':arm} for arm in order]
              if pair % 2 == 0:
                  aa = 'AB' if pair != 4 else 'BA'
                  plan += [{'kind':'aa','pair':pair//2,'arm':arm,'binary':'A'} for arm in aa]
          (out/'plan.json').write_text(json.dumps({'baseline':baseline,'candidate':candidate,'dictionary':dictionary,'identities':identities,'plan':plan,'noRetries':True,'noOutlierRemoval':True}, indent=2))
          observations=[]
          for ordinal,item in enumerate(plan,1):
              commit=identities[item['binary']]['commit']
              subprocess.run(['git','checkout','--detach',commit],check=True,stdout=subprocess.DEVNULL)
              if subprocess.check_output(['git','status','--porcelain'],text=True).strip(): raise RuntimeError('dirty source')
              shutil.copy2(tmp/('base.zip' if item['binary']=='A' else 'candidate.zip'), root/'builds/manabitan-chrome-dev.zip')
              dest=out/f"{ordinal:02d}-{item['kind']}-{item['pair']}-{item['arm']}"; started=time.monotonic()
              with open(str(dest)+'.log','w') as log:
                  subprocess.run(['node','dev/perf/import-benchmark.js',dictionary,'--runs','1','--no-build','--flags','{}','--output',str(dest)],check=True,stdout=log,stderr=subprocess.STDOUT,timeout=240)
              summary=json.loads((dest/'summary.json').read_text()); report=json.loads((dest/'run-1.json').read_text())
              if report.get('status')!='success' or report.get('skippedVerification') is not False: raise RuntimeError(f'invalid report {ordinal}')
              run=summary['runs'][0]
              row={**item,'ordinal':ordinal,'ms':run['totalImportMs'],'workerMs':run['workerImportMs'],'validation':run['validation'],'browser':summary['browserVersion'],'wallSeconds':time.monotonic()-started,'sourceCommit':summary['source']['gitSha'],'package':summary['source']['sha256']['builds/manabitan-chrome-dev.zip']}
              if row['sourceCommit']!=commit or row['package']!=identities[item['binary']]['package']: raise RuntimeError(f'identity mismatch {ordinal}')
              observations.append(row); (out/'observations.json').write_text(json.dumps(observations,indent=2)); print(json.dumps(row),flush=True)
          (out/'complete.json').write_text(json.dumps({'completed':len(observations),'planned':len(plan)},indent=2))
          PY
      - name: Preserve exact evidence
        if: always()
        run: |
          mkdir -p builds/zstd-cdict-screen
          cp "$RUNNER_TEMP/candidate.patch" builds/zstd-cdict-screen/candidate.patch || true
          cp "$RUNNER_TEMP/emcc-version.txt" builds/zstd-cdict-screen/emcc-version.txt || true
          cp "$RUNNER_TEMP/candidate-source.txt" builds/zstd-cdict-screen/candidate-source.txt || true
          cp "$RUNNER_TEMP/base-package.sha256" builds/zstd-cdict-screen/base-package.sha256 || true
          cp "$RUNNER_TEMP/candidate-package.sha256" builds/zstd-cdict-screen/candidate-package.sha256 || true
          cp "$RUNNER_TEMP/base-wasm.sha256" builds/zstd-cdict-screen/base-wasm.sha256 || true
          cp "$RUNNER_TEMP/candidate-wasm.sha256" builds/zstd-cdict-screen/candidate-wasm.sha256 || true
          cp "$RUNNER_TEMP/changed-package-members.json" builds/zstd-cdict-screen/changed-package-members.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zstd-cdict-${{ matrix.dictionary }}
          path: builds/zstd-cdict-screen
          retention-days: 30
