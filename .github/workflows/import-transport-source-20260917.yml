name: Import transport baseline source
on:
  push:
    branches: [verify/import-transport-compression-20260917]
    paths: [.github/workflows/import-transport-source-20260917.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2f407e86fae0d3e39f506e6b1ce30886697698ea
          persist-credentials: false
      - run: |
          mkdir -p /tmp/import-transport-source
          git archive --format=tar.gz HEAD > /tmp/import-transport-source/baseline.tar.gz
          git rev-parse HEAD 'HEAD^{tree}' > /tmp/import-transport-source/identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: import-transport-source
          path: /tmp/import-transport-source
          retention-days: 30
