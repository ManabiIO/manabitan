name: Import missing cells current policy fe114

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "dev/perf/benchmark-support.js"
      - "dev/perf/import-qualification-20261125-a7f7.py"
      - "dev/perf/import-memory-20261125-a7f7/qualification_overlay.py"
      - "dev/perf/import-memory-20261125-a7f7/qualification_receipts.py"
      - "dev/perf/import-memory-20261125-a7f7/chromium_memory.py"
      - "dev/perf/import-memory-20261125-a7f7/protocol.py"
      - "dev/perf/import-memory-20261125-a7f7/audit_memory.py"
      - ".github/workflows/import-qualification-current-policy-fe114.yml"

permissions:
  contents: read

concurrency:
  group: import-qualification-current-policy-fe114-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  select:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'fix/import-qualification-current-policy-20261126-fe114'
    runs-on: ubuntu-latest
    outputs:
      acquire: ${{ steps.changed.outputs.acquire }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: changed
        name: Skip evidence and test-only follow-ups
        shell: bash
        env:
          PERF_ACTION: ${{ github.event.action }}
          PERF_BEFORE: ${{ github.event.before }}
          PERF_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 439a1c9b6d40452061cda094b0727005553c1d1d "$PERF_HEAD"
          acquire=true
          if [[ "$PERF_ACTION" == synchronize && "$PERF_BEFORE" =~ ^[a-f0-9]{40}$ ]] &&
             git cat-file -e "${PERF_BEFORE}^{commit}" &&
             git diff --quiet "$PERF_BEFORE" "$PERF_HEAD" -- \
               dev/perf/benchmark-support.js \
               dev/perf/import-qualification-20261125-a7f7.py \
               dev/perf/import-memory-20261125-a7f7/qualification_overlay.py \
               dev/perf/import-memory-20261125-a7f7/qualification_receipts.py \
               dev/perf/import-memory-20261125-a7f7/chromium_memory.py \
               dev/perf/import-memory-20261125-a7f7/protocol.py \
               dev/perf/import-memory-20261125-a7f7/audit_memory.py \
               .github/workflows/import-qualification-current-policy-fe114.yml; then
            acquire=false
          fi
          echo "acquire=$acquire" >> "$GITHUB_OUTPUT"

  missing-cells:
    needs: select
    if: needs.select.outputs.acquire == 'true'
    name: Missing import (${{ matrix.candidate }} / ${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        candidate: [zstd, glossary]
        dictionary: [jitendex, vndb]
    env:
      PERF_BASELINE: 0143e9596cd8f790d5e166d4ba6a2425fbc57f14
      PERF_CANDIDATE_NAME: ${{ matrix.candidate }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify exact policies and original rejected receipts
        run: |
          python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_qualification*.py'
          python dev/perf/import-qualification-current-policy-20261126-fe114/revalidate-original-baselines.py
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fill only the missing frozen-source cells
        shell: bash
        run: |
          set -euo pipefail
          entries=()
          case "$PERF_CANDIDATE_NAME" in
            zstd)
              candidate=c6835c1bc1ddcc07ac5c9bc10ac0558e1f3cc7de
              entries+=(--expected-package-entry js/dictionary/zstd-term-content.js)
              ;;
            glossary)
              candidate=e197c714ac7738097b6cf005f178b075eaf2ab80
              entries+=(--expected-package-entry js/dictionary/wasm/term-bank-parser.c)
              entries+=(--expected-package-entry lib/term-bank-parser.wasm)
              ;;
            *) exit 1 ;;
          esac
          git fetch --no-tags origin "$PERF_BASELINE" "$candidate" 439a1c9b6d40452061cda094b0727005553c1d1d
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$candidate" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order AB \
            --pairs 6 \
            --measurement-overlay native-image-policy-439a1c9b \
            --storage-policy baseline-0143e959-vndb-sah-37 \
            "${entries[@]}" \
            --evidence builds/perf/import-missing-current-policy
      - name: Preserve every new observation, package, and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-missing-fe114-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/perf/import-missing-current-policy
          if-no-files-found: error
          retention-days: 14
