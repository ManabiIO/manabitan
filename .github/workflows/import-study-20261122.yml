name: Three-dictionary import study

on:
  push:
    branches: [perf/three-dictionary-imports-20261122-0f5c]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-validation:
    if: "!contains(github.event.head_commit.message, '[study-report]')"
    name: Validate ${{ matrix.arm }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: reservations
            ref: 335d2385e9d202edcd046cd653674ffad9c1be13
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned native toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21
      - name: Validate native artifacts, JavaScript, and types
        run: |
          npm run build:dictionary-wasm -- --check
          npm run test:js
          npm run test:ts
      - name: Run full unit suite and all-target build
        run: |
          npm run test:unit
          npm run test:build

  imports:
    if: "!contains(github.event.head_commit.message, '[study-report]')"
    name: Complete import (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore verified dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: import-study-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Run fixed source comparisons and media verification
        env:
          STUDY_DICTIONARY: ${{ matrix.dictionary }}
        run: >-
          python3 dev/perf/import-source-study.py
          --baseline 5e1f8c12f7ff798ba407323aff675cb23b22af02
          --candidate 335d2385e9d202edcd046cd653674ffad9c1be13
          --dictionary "$STUDY_DICTIONARY"
          --output "builds/perf/import-study-$STUDY_DICTIONARY"
      - name: Retain every report and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-study-${{ matrix.dictionary }}
          path: |
            builds/perf/import-study-${{ matrix.dictionary }}
            !builds/perf/import-study-${{ matrix.dictionary }}/worktrees/**
          retention-days: 14
          if-no-files-found: error
