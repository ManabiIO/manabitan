name: Frozen import baseline diagnosis

on:
  push:
    branches: ['perf/import-profile-20261123-72c24']

permissions:
  contents: read

concurrency:
  group: import-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore locked dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: import-study-20261123-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Diagnose baseline once, then capture a separate trace
        run: python3 dev/perf/import-profile-20261123-72c24.py --dictionary '${{ matrix.dictionary }}'
      - name: Retain every report and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-profile-${{ matrix.dictionary }}-attempt-${{ github.run_attempt }}
          path: builds/import-profile-20261123-72c24
          if-no-files-found: error
          retention-days: 30
