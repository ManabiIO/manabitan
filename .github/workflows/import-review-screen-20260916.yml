name: Current-base native import candidate screens
on:
  push:
    branches: [verify/import-review-20260916-1705]
    paths: [.github/workflows/import-review-screen-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [integer-guard, escape-words, equality-tail, signature-words]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f46ae95a2cae78ccb09894ce40eca076f31464ef
          persist-credentials: false
      - name: Pin exact source, independent candidate and fixed-plan driver
        run: |
          mkdir -p "$RUNNER_TEMP/native-review"
          cp dev/perf/import-review-20260916/apply.py "$RUNNER_TEMP/native-review/apply.py"
          git fetch --depth=1 origin 23524cf48cb08482ebd271406fe48da773bb516c
          git show FETCH_HEAD:dev/perf/round6-20260916/screen.py > "$RUNNER_TEMP/native-review/screen.py"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'native-review/screen.py'
          s = p.read_text()
          replacements = {
              'b4094a423c20bb0ed424d944238f922c1b36559c': 'c0a1b7ee6fa1383a0a422361d2a8b7f826499fff',
              '604c5c2b64b8d217e87895dbd981aa3a30579bcb': 'a48da18d4244b00661d0c6518b2ce77b9f2f9b55',
              "('word-jump', 'simd-jump', 'inflight-bounds')": "('integer-guard', 'escape-words', 'equality-tail', 'signature-words')",
              'round6': 'native-review',
              'round-six': 'native-review',
              "'test/term-bank-join-boundaries.test.js']": "'test/term-bank-join-boundaries.test.js', 'test/term-bank-first-special-byte.test.js', 'test/term-bank-adjacent-delimiters.test.js']",
          }
          for old, new in replacements.items():
              assert old in s, old
              s = s.replace(old, new)
          old = 'identities = {arm: identity(directory) for arm, directory in roots.items()}'
          assert s.count(old) == 1
          s = s.replace(old, old + "\n(output / 'sizes.json').write_text(json.dumps({arm: {'wasmBytes': (directory / 'ext/lib/term-bank-parser.wasm').stat().st_size, 'packageBytes': (directory / package).stat().st_size} for arm, directory in roots.items()}, indent=2))")
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/native-review/"*.py
          git fetch --depth=1 origin c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          git checkout --detach c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check complete pinned fixtures
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Compare complete outputs and six alternating browser pairs
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: |
          mkdir -p builds/native-review
          python3 "$RUNNER_TEMP/native-review/screen.py" 2>&1 | tee builds/native-review/driver.log
      - name: Retain exact executable drivers on success or failure
        if: always()
        run: |
          mkdir -p builds/native-review/executed-inputs
          cp "$RUNNER_TEMP/native-review/"*.py builds/native-review/executed-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-review-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/native-review
          retention-days: 30
