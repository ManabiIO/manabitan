name: Import paired screen bda85f3c7e15

on:
  push:
    branches:
      - perf/import-lab-bda85f3c7e15
    paths:
      - .github/workflows/import-lab-bda85f3c7e15.yml
      - dev/perf/import-lab-bda85f3c7e15.py
      - dev/perf/bda85f3c7e15/**
      - ext/js/dictionary/**
      - dev/data/dictionary-wasm/**
      - dev/data/zstd*
      - dev/lib/zstd*
      - dev/bin/build-zstd-wasm.js

permissions:
  contents: read

concurrency:
  group: import-lab-bda85f3c7e15-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Validate batching implementation and native worker behavior
        run: |
          npx eslint ext/js/dictionary/zstd-term-content.js ext/js/dictionary/zstd-term-content-compression-worker.js test/zstd-term-content-pool.test.js test/zstd-term-content-pool-drain.test.js test/zstd-compression-worker-context.test.js
          npm run test:ts:main
          npm run test:ts:test
          npx vitest run test/zstd-term-content-pool.test.js test/zstd-term-content-pool-drain.test.js test/zstd-compression-worker-context.test.js test/zstd-term-content-packed-dispatch.test.js test/zstd-prepared-lifetime.test.js --maxWorkers=2
          npm run test:build
      - name: Full unit coverage
        run: npm run test:unit -- --maxWorkers=2
  comparison:
    needs: validation
    if: github.repository == 'ManabiIO/manabitan' && github.ref == 'refs/heads/perf/import-lab-bda85f3c7e15'
    name: Paired screen / ${{ matrix.dictionary }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - dictionary: jmdict
            mode: control
          - dictionary: jmdict
            mode: candidate
          - dictionary: jitendex
            mode: candidate
          - dictionary: vndb
            mode: candidate
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install pinned Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Restore pinned archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Prepare release package and complete fixtures
        env:
          IMPORT_LAB_DICTIONARY: ${{ matrix.dictionary }}
        run: |
          set -euo pipefail
          node dev/perf/prepare-dictionaries.js jmdict jmnedict jitendex "$IMPORT_LAB_DICTIONARY"
          import_baseline="$RUNNER_TEMP/import-lab-bda85f3c7e15-baseline"
          git fetch --no-tags --depth=1 origin 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
          git worktree add --detach "$import_baseline" 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
          cmp package-lock.json "$import_baseline/package-lock.json"
          cmp test/perf/dictionaries.lock.json "$import_baseline/test/perf/dictionaries.lock.json"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$import_baseline/node_modules"
          mkdir -p "$import_baseline/builds"
          ln -s "$GITHUB_WORKSPACE/builds/e2e-dictionary-cache" "$import_baseline/builds/e2e-dictionary-cache"
          (
            cd "$import_baseline"
            npm run build:libs
            npm run license-report:html
            npm run build -- --target chrome
          )
          npm run build -- --target chrome
      - name: Run fixed paired schedule and separate correctness checks
        env:
          IMPORT_LAB_DICTIONARY: ${{ matrix.dictionary }}
          IMPORT_LAB_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          import_baseline="$RUNNER_TEMP/import-lab-bda85f3c7e15-baseline"
          import_candidate="$GITHUB_WORKSPACE"
          extra_args=()
          if [ "$IMPORT_LAB_MODE" = control ]; then
            import_candidate="$import_baseline"
          else
            extra_args+=(--expected-package-path js/dictionary/zstd-term-content.js)
            extra_args+=(--expected-package-path js/dictionary/zstd-term-content-compression-worker.js)
          fi
          python3 dev/perf/import-lab-bda85f3c7e15.py "$IMPORT_LAB_DICTIONARY" \
            --baseline-root "$import_baseline" \
            --candidate-root "$import_candidate" \
            "${extra_args[@]}" \
            --output "builds/perf/import-lab-bda85f3c7e15/$IMPORT_LAB_DICTIONARY-$IMPORT_LAB_MODE"
      - name: Retain raw evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-lab-bda85f3c7e15-${{ matrix.dictionary }}-${{ matrix.mode }}
          path: builds/perf/import-lab-bda85f3c7e15
          if-no-files-found: error
          retention-days: 14
  native_zstd:
    if: github.repository == 'ManabiIO/manabitan' && github.ref == 'refs/heads/perf/import-lab-bda85f3c7e15'
    name: Prepared Zstd context / native component
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Restore pinned archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Capture complete canonical JMdict blocks from frozen baseline
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/builds/perf/native-zstd-bda85f3c7e15"
          baseline="$RUNNER_TEMP/native-zstd-bda85f3c7e15-baseline"
          mkdir -p "$evidence"
          git fetch --no-tags --depth=1 origin 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
          git worktree add --detach "$baseline" 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
          cmp package-lock.json "$baseline/package-lock.json"
          cmp test/perf/dictionaries.lock.json "$baseline/test/perf/dictionaries.lock.json"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          git -C "$baseline" rev-parse HEAD > "$evidence/baseline.sha"
          node dev/perf/prepare-dictionaries.js jmdict
          (
            cd "$baseline"
            npm run build:libs
          ) > "$evidence/baseline-build.log" 2>&1
          cp dev/perf/bda85f3c7e15/* "$evidence/"
          node --expose-gc --max-old-space-size=256 \
            dev/perf/bda85f3c7e15/capture-content-blocks.mjs \
            --source-root "$baseline" \
            --cache-dir "$GITHUB_WORKSPACE/builds/e2e-dictionary-cache" \
            --dictionary jmdict \
            --output "$evidence/jmdict-blocks" \
            2>&1 | tee "$evidence/capture.log"
      - name: Build exact pinned native Zstd and diagnostic wrapper
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/builds/perf/native-zstd-bda85f3c7e15"
          zstd_source="$RUNNER_TEMP/native-zstd-bda85f3c7e15-source"
          git init --quiet "$zstd_source"
          git -C "$zstd_source" remote add origin https://github.com/meta/zstd.git
          git -C "$zstd_source" fetch --quiet --depth=1 origin 82d322c4973d9e2968d94047a40892bc6d9a9bdf
          git -C "$zstd_source" checkout --quiet FETCH_HEAD
          git -C "$zstd_source" rev-parse HEAD > "$evidence/zstd.sha"
          cc --version > "$evidence/compiler.txt"
          uname -a > "$evidence/host.txt"
          lscpu >> "$evidence/host.txt"
          make -C "$zstd_source/lib" -j2 libzstd > "$evidence/native-build.log" 2>&1
          cc -O3 -shared -fPIC -I "$zstd_source/lib" \
            dev/perf/bda85f3c7e15/zstd-prepared-screen.c \
            -L "$zstd_source/lib" -Wl,-rpath,"$zstd_source/lib" -lzstd \
            -o "$evidence/prepared-screen.so" \
            > "$evidence/wrapper-build.log" 2>&1
          cp "$zstd_source/lib/libzstd.so.1.6.0" "$evidence/libzstd.so.1.6.0"
          sha256sum "$zstd_source/lib/zstd.h" "$zstd_source/lib/compress/zstd_compress.c" \
            "$evidence/libzstd.so.1.6.0" "$evidence/prepared-screen.so" \
            > "$evidence/native-hashes.txt"
      - name: Run fixed ABBA native comparison with identical-code controls
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/builds/perf/native-zstd-bda85f3c7e15"
          baseline="$RUNNER_TEMP/native-zstd-bda85f3c7e15-baseline"
          python3 dev/perf/bda85f3c7e15/zstd-prepared-screen.py \
            --library "$evidence/libzstd.so.1.6.0" \
            --wrapper "$evidence/prepared-screen.so" \
            --blocks "$evidence/jmdict-blocks" \
            --dictionary "$baseline/dev/data/zstd-dicts/jmdict.zdict" \
            --output "$evidence/native-results.json" \
            2>&1 | tee "$evidence/native-screen.log"
      - name: Retain native component evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-zstd-bda85f3c7e15
          path: builds/perf/native-zstd-bda85f3c7e15
          if-no-files-found: error
          retention-days: 14
