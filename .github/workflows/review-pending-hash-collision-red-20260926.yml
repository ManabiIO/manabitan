name: Pending hash collision reproduction
on:
  push:
    branches: [review/pending-hash-collision-red-20260926]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          node-version: '22'
      - name: Run focused collision regression
        run: npx vitest run test/dictionary-database-pending-hash-collision.test.js
