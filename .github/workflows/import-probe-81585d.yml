name: Import baseline profile 81585d

on:
  push:
    branches: [perf/import-probe-20261127-81585d]
    paths: [.github/workflows/import-probe-81585d.yml]

permissions:
  contents: read

jobs:
  profile:
    if: github.sha == 'd9951a9ed793c0b776068fe4d6215428a70b54c9'
    name: Current baseline (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      FROZEN_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      EVIDENCE: builds/perf/import-probe-20261127-81585d
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git diff --exit-code "$FROZEN_BASELINE" -- ext dev/lib dev/data dev/build-libs.js package.json package-lock.json test/perf/dictionaries.lock.json
          git rev-parse HEAD 'HEAD^{tree}' > "$EVIDENCE/tooling-identity.txt"
          git rev-parse "$FROZEN_BASELINE" "$FROZEN_BASELINE^{tree}" > "$EVIDENCE/product-identity.txt"
          sha256sum package-lock.json test/perf/dictionaries.lock.json dev/perf/import-benchmark.js dev/perf/benchmark-support.js test/chromium/extension-two-dictionary-import.e2e.js > "$EVIDENCE/input-sha256.txt"

      - uses: ./.github/actions/setup

      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore locked archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}

      - name: Prepare release package and pinned fixture
        shell: bash
        run: |
          set -euo pipefail
          node dev/perf/prepare-dictionaries.js "$PERF_DICTIONARY"
          npm run build -- --target chrome
          sha256sum builds/manabitan-chrome.zip ext/lib/*.wasm > "$EVIDENCE/binary-sha256.txt"
          node dev/perf/host-environment.js > "$EVIDENCE/host.json"

      - name: Ordinary full import and restart validation
        shell: bash
        run: |
          set -euo pipefail
          node dev/perf/import-benchmark.js "$PERF_DICTIONARY" --build-target chrome --no-build --runs 1 --media-check all --output "$EVIDENCE/ordinary" 2>&1 | tee "$EVIDENCE/ordinary.log"

      - name: Separate diagnostic trace
        shell: bash
        run: |
          set -euo pipefail
          node dev/perf/import-benchmark.js "$PERF_DICTIONARY" --build-target chrome --no-build --trace --media-check sample --output "$EVIDENCE/trace" 2>&1 | tee "$EVIDENCE/trace.log"

      - name: Preserve every observation and failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: import-baseline-81585d-${{ matrix.dictionary }}
          path: builds/perf/import-probe-20261127-81585d
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
