name: Term plan copy-run verification
on:
  push:
    branches: [verify/term-plan-copy-runs-20260909]
    paths:
      - .github/workflows/term-plan-copy-runs-verify.yml
      - dev/perf/copy-runs-verification/**
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3ef73a422410d2f0ac0be00fb8e618a4c7949416
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exact source tests, options, types, lint and builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/source.txt"
          node dev/bin/build-libs.js > "$RUNNER_TEMP/evidence/build-libs.log" 2>&1
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
          npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
          node node_modules/eslint/bin/eslint.js test/term-plan-copy-runs.test.js > "$RUNNER_TEMP/evidence/new-test-lint.log" 2>&1
          node dev/bin/build.js --dryRun --all > "$RUNNER_TEMP/evidence/dry-build.log" 2>&1
          node dev/bin/build.js --target chrome-dev > "$RUNNER_TEMP/evidence/build.log" 2>&1
          node dev/perf/prepare-dictionaries.js > "$RUNNER_TEMP/evidence/fixtures.log" 2>&1
      - name: Strict complete Chromium integration
        shell: bash
        env:
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: ${{ runner.temp }}/evidence/integration.html
        run: |
          set -euo pipefail
          node test/chromium/extension-two-dictionary-import.e2e.js > "$RUNNER_TEMP/evidence/integration.log" 2>&1
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copy-runs-correctness
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
  comparison:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmnedict, jmdict, jitendex]
        runner: [ubuntu-24.04, ubuntu-slim]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Install compiler and browser
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang lld
          fi
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Record native browser policy and build immutable source arms
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          arms="$RUNNER_TEMP/arms"
          mkdir -p "$evidence" "$arms"
          node --input-type=module <<'NODE' > "$evidence/native-memory.json"
          import {createServer} from 'node:http';
          import {chromium} from 'playwright';
          const server = createServer((req, res) => res.end('<!doctype html><title>memory preflight</title>'));
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          const browser = await chromium.launch({headless: true});
          try {
            const page = await browser.newPage();
            await page.goto(`http://127.0.0.1:${server.address().port}`);
            const policy = await page.evaluate(async () => {
              const worker = new Worker(URL.createObjectURL(new Blob(['postMessage({deviceMemory: navigator.deviceMemory, hardwareConcurrency: navigator.hardwareConcurrency})'], {type: 'text/javascript'})));
              const value = await new Promise(resolve => worker.onmessage = event => resolve(event.data));
              worker.terminate();
              return {page: {deviceMemory: navigator.deviceMemory, hardwareConcurrency: navigator.hardwareConcurrency}, worker: value};
            });
            console.log(JSON.stringify({browserVersion: browser.version(), ...policy}, null, 2));
          } finally { await browser.close(); server.close(); }
          NODE
          git worktree add --detach "$arms/A" ff9cbf2e848a86d6bbfd281179a6d753349e52f4
          git worktree add --detach "$arms/B" 3ef73a422410d2f0ac0be00fb8e618a4c7949416
          # Real ignored directories, not symlinks: retain strict clean-tree checks.
          # Both receive the exact same npm-ci-installed locked dependency files.
          for arm in A B; do
            mkdir "$arms/$arm/node_modules"
            cp -a "$GITHUB_WORKSPACE/node_modules/." "$arms/$arm/node_modules/"
            (cd "$arms/$arm" && node dev/bin/build-libs.js && node dev/bin/build.js --target chrome-dev) > "$evidence/build-$arm.log" 2>&1
            git -C "$arms/$arm" status --porcelain > "$evidence/status-$arm.txt"
            test ! -s "$evidence/status-$arm.txt"
          done
          (cd "$arms/A" && node dev/perf/prepare-dictionaries.js) > "$evidence/fixtures.log" 2>&1
          ln -s "$arms/A/builds/e2e-dictionary-cache" "$arms/B/builds/e2e-dictionary-cache"
          clang --version > "$evidence/compiler.txt"
          node --version > "$evidence/node.txt"
          lscpu > "$evidence/cpu.txt"
          free -b > "$evidence/memory.txt"
          git diff ff9cbf2e848a86d6bbfd281179a6d753349e52f4 3ef73a422410d2f0ac0be00fb8e618a4c7949416 --binary > "$evidence/source.patch"
          cp dev/perf/copy-runs-verification/paired.py "$evidence/paired.py"
      - name: Fixed four pairs, two same-binary controls, excluded warmup, no retries
        shell: bash
        env:
          DICTIONARY: ${{ matrix.dictionary }}
          RUNNER_KIND: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$RUNNER_KIND" = ubuntu-slim ]; then extra+=(--reverse); fi
          python3 dev/perf/copy-runs-verification/paired.py \
            --baseline "$RUNNER_TEMP/arms/A" --candidate "$RUNNER_TEMP/arms/B" \
            --dictionary "$DICTIONARY" --output "$RUNNER_TEMP/evidence/paired" \
            "${extra[@]}" 2>&1 | tee "$RUNNER_TEMP/evidence/driver.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: copy-runs-${{ matrix.dictionary }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
