name: Isolated 16 MiB all-dictionary confirmation
on:
  push:
    branches: [verify/import-shared-more-20260917]
    paths: [.github/workflows/import-more-confirm16-20260917.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      MORE_DICTIONARY: ${{ matrix.dictionary }}
      MORE_OUTPUT: builds/group-confirm
      RECIPE_SHA: ${{ github.sha }}
      FIXTURE_RECIPE_SHA: 9c843c8a0e06190948ae0d52c29094a45a2555f1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6896f54d13be0ba17fcf9345a9b6f29a04f88860
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Isolate final g16 source, no allocator or other experiment change
        run: |
          mkdir -p "$RUNNER_TEMP/group-tools" builds/group-confirm
          git fetch --depth=1 origin "$RECIPE_SHA"
          for file in prepare.py isolate16.py term-bank-group-policy.js test-group-policy.js abba.mjs corpus.mjs; do
            git show "FETCH_HEAD:dev/perf/import-more-20260917/$file" > "$RUNNER_TEMP/group-tools/$file"
          done
          python3 "$RUNNER_TEMP/group-tools/isolate16.py"
          git add -N ext/js/dictionary/term-bank-group-policy.js test/term-bank-group-policy.test.js
          git diff --check
      - run: npm ci
      - name: Qualify exact final code before collecting timings
        run: |
          npm run build:libs > builds/group-confirm/libs.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/term-bank-group-policy.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/term-bank-wasm-parser.js test/term-bank-group-policy.test.js > builds/group-confirm/lint.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-group-policy.test.js test/term-bank-wasm-parser.test.js test/term-bank-experiments.test.js test/term-bank-composite-state.test.js test/dictionary-importer.test.js > builds/group-confirm/focused.log 2>&1
          npm run test:unit > builds/group-confirm/unit.log 2>&1
          npm run test:unit:options > builds/group-confirm/options.log 2>&1
          npm run test:ts > builds/group-confirm/types.log 2>&1
          npm run test:build > builds/group-confirm/build-plans.log 2>&1
          sha256sum ext/js/dictionary/term-bank-group-policy.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/term-bank-wasm-parser.js types/ext/dictionary-importer.d.ts test/term-bank-group-policy.test.js ext/lib/term-bank-parser.wasm > builds/group-confirm/qualified.sha256
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Set up identical complete-fixture harness and actual browser packages
        run: |
          git fetch --depth=1 origin "$FIXTURE_RECIPE_SHA"
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          h=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          text=h.read_text(); assert text.count('maxBuffer: 32 * 1024 * 1024')==2
          h.write_text(text.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/group-confirm/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/group-confirm/chrome-build.log 2>&1
          node dev/bin/build.js --target firefox-dev > builds/group-confirm/firefox-build.log 2>&1
          npx playwright install --with-deps chromium
          sha256sum -c builds/group-confirm/qualified.sha256
      - name: Six serial ABBA blocks with complete warmups and A/A controls
        run: node "$RUNNER_TEMP/group-tools/abba.mjs" g16,control 6 | tee builds/group-confirm/abba.log
      - name: Every ordered row through actual parallel workers
        run: |
          node "$RUNNER_TEMP/group-tools/corpus.mjs" "$MORE_DICTIONARY" builds/group-corpus 16 > builds/group-confirm/corpus.log 2>&1
          cp builds/group-corpus/parity.json builds/group-confirm/corpus-parity.json
      - name: Full strict Chromium lifecycle with the isolated flag
        if: matrix.dictionary == 'jmdict'
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{"experimentalParserGroups16MiB":true}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/group-confirm/lifecycle.html
        run: node test/chromium/extension-two-dictionary-import.e2e.js > builds/group-confirm/lifecycle.log 2>&1
      - name: Check unchanged qualified inputs
        run: |
          sha256sum -c builds/group-confirm/qualified.sha256
          echo QUALIFIED > builds/group-confirm/complete.txt
      - name: Retain all source, observations and failed gates
        if: always()
        run: |
          mkdir -p builds/group-confirm/source
          git diff -- ext/js types/ext test/term-bank-group-policy.test.js > builds/group-confirm/candidate.patch
          cp "$RUNNER_TEMP/group-tools/abba.mjs" "$RUNNER_TEMP/group-tools/corpus.mjs" "$RUNNER_TEMP/group-tools/isolate16.py" builds/group-confirm/source/
          cp builds/group-corpus/parity.json builds/group-confirm/corpus-parity.json 2>/dev/null || true
          tar -czf builds/group-confirm/source.tar.gz ext/js/dictionary/term-bank-group-policy.js ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js types/ext/dictionary-importer.d.ts test/term-bank-group-policy.test.js ext/lib/term-bank-parser.wasm test/chromium/extension-two-dictionary-import.e2e.js test/perf/dictionaries.lock.json
          git rev-parse HEAD > builds/group-confirm/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group-confirm-${{ matrix.dictionary }}
          path: builds/group-confirm
          retention-days: 30
