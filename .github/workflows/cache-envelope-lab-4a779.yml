name: Publication cache envelope formatting quality 4a779

on:
  push:
    branches: [perf/jmdict-cache-envelope-format-quality-20261128]
    paths:
      - 'ext/js/dictionary/dictionary-database.js'
      - 'test/dictionary-content-publication-range.test.js'
      - '.github/workflows/cache-envelope-lab-4a779.yml'

permissions:
  contents: read

concurrency:
  group: cache-envelope-quality-4a779-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Publication cache validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate source and regression coverage
        run: |
          set -euo pipefail
          mkdir -p builds/perf/cache-envelope-quality
          npx eslint ext/js/dictionary/dictionary-database.js test/dictionary-content-publication-range.test.js 2>&1 | tee builds/perf/cache-envelope-quality/lint.log
          npm run test:ts 2>&1 | tee builds/perf/cache-envelope-quality/types.log
          npm run test:unit -- --maxWorkers=2 2>&1 | tee builds/perf/cache-envelope-quality/unit.log
          npm run test:build 2>&1 | tee builds/perf/cache-envelope-quality/build.log
      - name: Preserve validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-envelope-quality
          path: builds/perf/cache-envelope-quality
          if-no-files-found: error
          retention-days: 14
