name: Publication cache envelope experiment 4a779

on:
  push:
    branches: [perf/jmdict-cache-envelope-20261128]
    paths:
      - 'ext/js/dictionary/dictionary-database.js'
      - 'test/dictionary-content-publication-range.test.js'
      - '.github/workflows/cache-envelope-lab-4a779.yml'

permissions:
  contents: read

concurrency:
  group: cache-envelope-lab-4a779-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Publication cache validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate source and regression coverage
        run: |
          mkdir -p builds/perf/cache-envelope-quality
          npx eslint ext/js/dictionary/dictionary-database.js test/dictionary-content-publication-range.test.js 2>&1 | tee builds/perf/cache-envelope-quality/lint.log
          npm run test:ts 2>&1 | tee builds/perf/cache-envelope-quality/types.log
          npm run test:unit -- --maxWorkers=2 2>&1 | tee builds/perf/cache-envelope-quality/unit.log
          npm run test:build 2>&1 | tee builds/perf/cache-envelope-quality/build.log
      - name: Preserve validation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-envelope-quality
          path: builds/perf/cache-envelope-quality
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: quality
    name: Publication cache envelope (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_CANDIDATE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Compare complete imports with identical-code controls
        run: |
          args=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            args+=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" --initial-order AB --pairs 6 \
            "${args[@]}" \
            --expected-package-entry js/dictionary/dictionary-database.js \
            --evidence "builds/perf/lab-cache-envelope/$PERF_DICTIONARY"
      - name: Preserve all observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-lab-cache-envelope-${{ matrix.dictionary }}
          path: builds/perf/lab-cache-envelope/${{ matrix.dictionary }}
          if-no-files-found: error
          retention-days: 14
