name: Referenced-media overlap independent confirmation
on:
  push:
    branches: [verify/import-crc-lifetime-20260916]
    paths: [.github/workflows/import-media-overlap-confirm-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d5fc181a17efc80e282c3dc0dc62067cc514f6b
          persist-credentials: false
      - name: Preserve exact candidate and derive checked driver
        run: |
          mkdir -p "$RUNNER_TEMP/deep-inputs"
          cp dev/perf/deep-import-20260916/prefetch.py "$RUNNER_TEMP/deep-inputs/apply.py"
          git fetch --depth=1 origin 17c8fb5f98bd5314fb93750eade2b451fa4c62fb
          git show 17c8fb5f98bd5314fb93750eade2b451fa4c62fb:dev/perf/pipeline-research-20260916/screen.py > "$RUNNER_TEMP/deep-inputs/screen.py"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'deep-inputs/screen.py'
          s = p.read_text()
          changes = {
              "assert variant in ('gather32', 'gather64', 'cache64', 'scalar-pending', 'gather-aligned', 'typed-pending')": "assert variant == 'media-prefetch4m'",
              "assert str(source) in ('dev/lib/zstd-wasm.js', 'ext/js/dictionary/dictionary-database.js')": "assert str(source) == 'ext/js/dictionary/dictionary-importer.js'",
              "tests = ['test/zstd-wasm.test.js'] if variant.startswith('gather') else ['test/dictionary-database-content-dedup.test.js', 'test/term-content-block-store.test.js']": "tests = ['test/dictionary-importer-artifact.test.js', 'test/dictionary-importer-media-loader.test.js', 'test/dictionary-importer-zip-filename-alias.test.js']",
              "roots = {'A': root, 'B': candidate}": "logrun(['npm', 'run', 'test:ts'], 'types.log', candidate)\nroots = {'A': root, 'B': candidate}",
          }
          for old, new in changes.items():
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/deep-inputs/"*.py
          git fetch --depth=1 origin c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          git checkout --detach c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned complete dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Twelve serial reversed-order pairs with same-binary controls
        env:
          CANDIDATE: media-prefetch4m
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: |
          mkdir -p builds/pipeline-review
          python3 "$RUNNER_TEMP/deep-inputs/screen.py" 2>&1 | tee builds/pipeline-review/driver.log
      - name: Preserve exact executed inputs
        if: always()
        run: |
          mkdir -p builds/pipeline-review/executed-inputs
          cp "$RUNNER_TEMP/deep-inputs/"*.py builds/pipeline-review/executed-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-overlap-confirm-${{ matrix.dictionary }}
          path: builds/pipeline-review
          retention-days: 30
