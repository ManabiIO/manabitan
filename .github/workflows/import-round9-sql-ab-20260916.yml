name: SQL query and complete import A/B comparison
on:
  push:
    branches: [verify/import-round9-sql-20260916]
    paths: [.github/workflows/import-round9-sql-ab-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: import-jmdict
            lane: import
            dictionary: jmdict
            pairs: '6'
            order: AB
          - name: import-jitendex
            lane: import
            dictionary: jitendex
            pairs: '6'
            order: AB
          - name: query-screen
            lane: sql
            dictionary: ''
            pairs: '12'
            order: AB
          - name: query-confirm
            lane: sql
            dictionary: ''
            pairs: '12'
            order: BA
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 089079228ceb327ab0fc337dbbbd07cc9a5c2477
          persist-credentials: false
      - name: Preserve immutable measurement inputs and select the production baseline
        run: |
          cp -a dev/perf/round9-sql-20260916 "$RUNNER_TEMP/round9-review"
          python3 -m py_compile "$RUNNER_TEMP/round9-review/screen.py"
          git fetch --depth=1 origin 895b2adf6c8cf2eec3d45602173ec48e1f3cfb4a
          git checkout --detach 895b2adf6c8cf2eec3d45602173ec48e1f3cfb4a
          mkdir -p builds/round9-screen
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Install pinned Chromium for browser imports
        if: matrix.lane == 'import'
        run: npx playwright install --with-deps chromium
      - name: Verify complete checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Execute fixed source and workload comparison
        env:
          LANE: ${{ matrix.lane }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: ${{ matrix.pairs }}
          INITIAL_ORDER: ${{ matrix.order }}
        run: python3 "$RUNNER_TEMP/round9-review/screen.py" 2>&1 | tee builds/round9-screen/driver.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round9-${{ matrix.name }}
          path: builds/round9-screen
          retention-days: 30
