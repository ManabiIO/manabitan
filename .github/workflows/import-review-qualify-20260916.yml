name: Exact shortlisted import source qualification
on:
  push:
    branches: [verify/import-review-20260916-1705]
    paths: [.github/workflows/import-review-qualify-20260916.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        candidate: [cache-copy-set, primitive-stack]
    env:
      CANDIDATE: ${{ matrix.candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
      - name: Retrieve immutable candidate and applicable tests
        run: |
          mkdir -p "$RUNNER_TEMP/qualify-review" builds/qualify-review
          git fetch --depth=1 origin 7dd327391faf890e6a93751a545a6ef6e1a5fb1f
          git show FETCH_HEAD:dev/perf/import-review-20260916/apply.py > "$RUNNER_TEMP/qualify-review/apply-native.py"
          git show FETCH_HEAD:dev/perf/import-review-20260916/apply-sinks.py > "$RUNNER_TEMP/qualify-review/apply.py"
          if test "$CANDIDATE" = primitive-stack; then
            for name in term-bank-integer-boundaries.test.js term-bank-token-boundaries.test.js; do
              git show "FETCH_HEAD:dev/perf/import-review-20260916/tests/$name" > "test/$name"
            done
            printf '%s\n' 'bd3edaaa5a5c6b5cfe353abf492ba696a020d45a1165c5f8bba86cc66870c3e2  test/term-bank-integer-boundaries.test.js' 'e99621dcf9689e09edc6e7c430275acc9c954a42d801acf7e730511cdf66a180  test/term-bank-token-boundaries.test.js' > builds/qualify-review/tests.sha256
            sha256sum -c builds/qualify-review/tests.sha256
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Parent regression coverage before source modification
        run: |
          npm run build:libs > builds/qualify-review/parent-build.log 2>&1
          if test "$CANDIDATE" = primitive-stack; then
            node node_modules/vitest/vitest.mjs run test/term-bank-integer-boundaries.test.js test/term-bank-token-boundaries.test.js 2>&1 | tee builds/qualify-review/parent-tests.log
          else
            node node_modules/vitest/vitest.mjs run test/dictionary-database-content-dedup.test.js test/term-content-block-store.test.js 2>&1 | tee builds/qualify-review/parent-tests.log
          fi
      - name: Apply exactly the measured candidate and build libraries
        run: |
          python3 "$RUNNER_TEMP/qualify-review/apply.py" "$CANDIDATE" | tail -n 1 > builds/qualify-review/source-change.json
          clang --version > builds/qualify-review/compiler.txt
          node --version > builds/qualify-review/node.txt
          npm run build:libs 2>&1 | tee builds/qualify-review/candidate-build.log
          sha256sum ext/js/dictionary/wasm/term-bank-parser.c ext/js/dictionary/dictionary-database.js ext/lib/term-bank-parser.wasm test/perf/dictionaries.lock.json > builds/qualify-review/qualified-inputs.sha256
      - name: Full unit suite
        id: unit
        continue-on-error: true
        run: npm run test:unit 2>&1 | tee builds/qualify-review/unit.log
      - name: Options suite
        id: options
        continue-on-error: true
        run: npm run test:unit:options 2>&1 | tee builds/qualify-review/options.log
      - name: All strict JavaScript typecheck projects
        id: types
        continue-on-error: true
        run: npm run test:ts 2>&1 | tee builds/qualify-review/types.log
      - name: Full JavaScript lint without rewriting
        id: lint
        continue-on-error: true
        run: npm run test:js 2>&1 | tee builds/qualify-review/lint.log
      - name: All build plans and actual Chrome and Firefox packages
        id: build
        continue-on-error: true
        run: |
          npm run test:build 2>&1 | tee builds/qualify-review/build-plans.log
          node dev/bin/build.js --target chrome-dev 2>&1 | tee builds/qualify-review/chrome-build.log
          node dev/bin/build.js --target firefox-dev 2>&1 | tee builds/qualify-review/firefox-build.log
      - name: Install pinned browser and full fixtures
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Full strict Chromium lifecycle qualification
        id: browser
        continue-on-error: true
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/qualify-review/browser.html
        run: |
          npm run test:e2e:chromium-extension 2>&1 | tee builds/qualify-review/browser.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('builds/qualify-review/browser.json').read_text())
          assert report['status'] == 'success' and report['skippedVerification'] is False
          assert len(report['phases']) >= 80
          PY
      - name: Preserve qualified code on a new verification ref only
        if: steps.unit.outcome == 'success' && steps.options.outcome == 'success' && steps.types.outcome == 'success' && steps.lint.outcome == 'success' && steps.build.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          git diff --check
          sha256sum -c builds/qualify-review/qualified-inputs.sha256
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          changed = json.loads(Path('builds/qualify-review/source-change.json').read_text())
          expected = {'primitive-stack': '8cce949a1a60fd036fecda44be68e74f18ef3e7e56f05916748049106ab50592', 'cache-copy-set': '9402a6fd5075924839ae64c961ad3fcdedbba3223bfbea3cff9a299173305189'}[os.environ['CANDIDATE']]
          assert changed['sha256'] == expected == hashlib.sha256(Path(changed['source']).read_bytes()).hexdigest()
          files = [changed['source']]
          if os.environ['CANDIDATE'] == 'primitive-stack':
              subprocess.run(['sha256sum','-c','builds/qualify-review/tests.sha256'],check=True)
              files += ['test/term-bank-integer-boundaries.test.js','test/term-bank-token-boundaries.test.js']
          subprocess.run(['git','add','--',*files],check=True)
          actual = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(actual) == set(files), actual
          PY
          git -c core.hooksPath=/dev/null -c user.name='Manabitan contributors' -c user.email='contributors@manabi.io' commit -m "perf: qualify isolated import $CANDIDATE"
          test -z "$(git status --porcelain)"
          branch="verify/qualified-import-review-$CANDIDATE-20260916"
          test -z "$(git ls-remote --heads origin "$branch")"
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD 'HEAD^{tree}' > builds/qualify-review/qualified.txt
      - name: Record outcomes and fail closed
        if: always()
        env:
          UNIT: ${{ steps.unit.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          mkdir -p builds/qualify-review
          printf '%s\n' "unit=$UNIT options=$OPTIONS types=$TYPES lint=$LINT build=$BUILD browser=$BROWSER" > builds/qualify-review/outcomes.txt
          git diff c0a1b7ee6fa1383a0a422361d2a8b7f826499fff -- ext/js/dictionary/wasm/term-bank-parser.c ext/js/dictionary/dictionary-database.js test/term-bank-integer-boundaries.test.js test/term-bank-token-boundaries.test.js > builds/qualify-review/source.patch
          cp "$RUNNER_TEMP/qualify-review/"*.py builds/qualify-review/
          printf '%s\n' 'Correctness qualification is not a performance promotion. No production or release ref is changed.' > builds/qualify-review/disposition.txt
          test "$UNIT/$OPTIONS/$TYPES/$LINT/$BUILD/$BROWSER" = 'success/success/success/success/success/success'
          test -s builds/qualify-review/qualified.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: import-review-qualification-${{ matrix.candidate }}
          path: builds/qualify-review
          retention-days: 30
