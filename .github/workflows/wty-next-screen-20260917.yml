name: WTY next complete-import screen
on:
  push:
    branches: [verify/wty-next-20260917]
    paths: [.github/workflows/wty-next-screen-20260917.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify-and-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Prepare exact candidate sources
        run: |
          mkdir -p builds/wty-next-screen
          git fetch --depth=1 origin f8f868903c4733f6017d479f65b9600a583bedb2
          git show FETCH_HEAD:ext/js/dictionary/term-bank-wasm-parser.js > ext/js/dictionary/term-bank-wasm-parser.js
          python3 dev/perf/wty-next-20260917/prepare-candidates.py
          git diff --check
          git diff -- ext/js types/ext test/term-bank-experiments.test.js > builds/wty-next-screen/candidates.patch
      - run: npm ci
      - name: Build native modules and qualify runtime and tests
        run: |
          npm run build:libs > builds/wty-next-screen/libs.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-experiments.test.js test/term-bank-composite-state.test.js > builds/wty-next-screen/focused.log 2>&1
          npm run test:unit > builds/wty-next-screen/unit.log 2>&1
          npm run test:unit:options > builds/wty-next-screen/options.log 2>&1
          npm run test:ts > builds/wty-next-screen/types.log 2>&1
          npm run test:build > builds/wty-next-screen/build-plans.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/term-bank-wasm-parser.js test/term-bank-experiments.test.js > builds/wty-next-screen/changed-lint.log 2>&1
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare immutable fixture and common benchmark-only harness
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/wty-prepare-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          text=(p/'wty-prepare-original.py').read_text()
          (p/'wty-prepare.py').write_text(text.split('# Common correctness prerequisite')[0])
          PY
          python3 "$RUNNER_TEMP/wty-prepare.py" > builds/wty-next-screen/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/wty-next-screen/chrome-build.log 2>&1
          node dev/bin/build.js --target firefox-dev > builds/wty-next-screen/firefox-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Serial ABBA on complete WTY imports
        run: node dev/perf/wty-next-20260917/abba.mjs control,keys,skip,retain,keysRetain 2 | tee builds/wty-next-screen/abba.log
      - name: Retain source and all evidence, including failures
        if: always()
        run: |
          mkdir -p builds/wty-next-screen/source
          cp ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/wasm/term-bank-parser.c test/term-bank-experiments.test.js builds/wty-next-screen/source/
          cp dev/perf/wty-next-20260917/abba.mjs dev/perf/wty-next-20260917/prepare-candidates.py builds/wty-next-screen/source/
          cp ext/lib/term-bank-parser.wasm builds/wty-next-screen/source/ 2>/dev/null || true
          git diff -- ext/js types/ext test/term-bank-experiments.test.js > builds/wty-next-screen/candidates.patch
          git rev-parse HEAD > builds/wty-next-screen/research-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wty-next-screen
          path: builds/wty-next-screen
          retention-days: 30
