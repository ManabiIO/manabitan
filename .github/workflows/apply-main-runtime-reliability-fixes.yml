name: Apply main runtime reliability fixes

on:
  push:
    branches:
      - fix/runtime-reliability-main-20260914
    paths:
      - .github/workflows/apply-main-runtime-reliability-fixes.yml
      - dev/apply-main-runtime-reliability-fixes.py
      - dev/apply-main-offscreen-diagnostics-fix.py

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-reliability-main-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Confirm regression tests fail before fixes
        run: |
          set +e
          npx vitest run test/runtime-reliability-regressions.test.js 2>&1 | tee /tmp/runtime-reliability-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Regression suite unexpectedly passed before fixes.'
            exit 1
          fi
          grep -q 'dictionary mutation admission is atomic and preserves serialization' /tmp/runtime-reliability-red.log
          grep -q 'failed search-popup creation does not poison later attempts' /tmp/runtime-reliability-red.log
          grep -q 'backend prepare can retry after a transient initialization failure' /tmp/runtime-reliability-red.log
          grep -q 'ordinary offscreen messages ensure the document exists before sending' /tmp/runtime-reliability-red.log
      - name: Confirm existing unmatched-response test is red
        run: |
          set +e
          npx vitest run test/offscreen-proxy.test.js 2>&1 | tee /tmp/offscreen-proxy-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Offscreen proxy suite unexpectedly passed before diagnostics fix.'
            exit 1
          fi
          grep -q 'emits unmatched-response diagnostics for unknown reply ids' /tmp/offscreen-proxy-red.log
      - name: Apply reliability fixes
        run: |
          python dev/apply-main-runtime-reliability-fixes.py
          python dev/apply-main-offscreen-diagnostics-fix.py
      - name: Confirm regression tests pass after fixes
        run: npx vitest run test/runtime-reliability-regressions.test.js
      - name: Run focused existing runtime tests
        run: npx vitest run test/offscreen-proxy.test.js test/backend-lookup-refresh.test.js
      - name: Syntax-check changed runtime sources
        run: node --check ext/js/background/backend.js && node --check ext/js/background/offscreen-proxy.js
      - name: Build Chromium development extension
        run: node ./dev/bin/build.js --target chrome-dev
      - name: Commit fixes and remove one-shot files
        run: |
          rm .github/workflows/apply-main-runtime-reliability-fixes.yml
          rm dev/apply-main-runtime-reliability-fixes.py
          rm dev/apply-main-offscreen-diagnostics-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ext/js/background/backend.js ext/js/background/offscreen-proxy.js test/runtime-reliability-regressions.test.js .github/workflows/apply-main-runtime-reliability-fixes.yml dev/apply-main-runtime-reliability-fixes.py dev/apply-main-offscreen-diagnostics-fix.py
          git commit -m 'Fix main runtime reliability recovery paths'
          git push origin HEAD:fix/runtime-reliability-main-20260914
