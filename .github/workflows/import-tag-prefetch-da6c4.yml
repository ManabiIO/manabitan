name: Bounded tag text prefetch qualification

on:
  push:
    branches: ['perf/bounded-tag-prefetch-20261128-da6c4']
    # Evidence-only updates do not replace a completed cohort.
    paths:
      - 'ext/js/dictionary/**'
      - 'eslint.config.js'
      - 'types/dictionary*.d.ts'
      - 'test/*artifact-term-chunk*.test.js'
      - 'test/*term-bank*.test.js'
      - 'test/*term-content*.test.js'
      - 'test/*dictionary-import*.test.js'
      - 'test/dictionary-database-chunk-pipeline.test.js'
      - 'test/term-bank-pipeline-completion.test.js'
      - 'dev/perf/import-qualification-20261125-a7f7.py'
      - 'dev/perf/import-memory-20261125-a7f7/*.py'
      - '.github/workflows/import-tag-prefetch-da6c4.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Verify bounded tag import and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check JavaScript
        run: npm run test:js
      - name: Check runtime and test types
        run: |
          npm run test:ts:main
          npm run test:ts:test
      - name: Run the complete unit suite
        run: npm run test:unit
      - name: Verify every build target
        run: npm run test:build
      - name: Verify qualification identity and receipt gates
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'

  qualify:
    name: ${{ matrix.dictionary }} (${{ matrix.order }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_CANDIDATE: ${{ github.sha }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Compare ordinary imports and separately verify memory and persisted output
        run: |
          sah_args=()
          if [ "$PERF_DICTIONARY" = vndb ]; then
            sah_args=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 12 \
            --expected-workers 3 \
            --expected-package-entry js/dictionary/dictionary-importer.js \
            --expected-added-package-entry js/dictionary/bounded-zip-text-writer.js \
            "${sah_args[@]}" \
            --evidence "builds/perf/tag-prefetch-$PERF_DICTIONARY-$PERF_ORDER"
      - name: Report auditable comparisons and failure details
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          root = pathlib.Path("builds/perf") / f"tag-prefetch-{os.environ['PERF_DICTIONARY']}-{os.environ['PERF_ORDER']}"
          names = [
              "registered-plan.json", "browser-identity.json", "observations.json", "analysis.json",
              "memory/memory-comparison.json", "memory/memory-audit.json",
              "memory/memory-audit-failure.json", "memory/semantic-failures.json",
          ]
          for name in names:
              path = root / name
              if path.is_file():
                  raw = path.read_bytes()
                  print("QUALIFICATION_JSON " + json.dumps({
                      "path": name, "sha256": hashlib.sha256(raw).hexdigest(), "data": json.loads(raw),
                  }, sort_keys=True))
          path = root / "source-identities.json"
          if path.is_file():
              data = json.loads(path.read_text())
              for arm in data["arms"].values():
                  entries = arm.pop("entries")
                  arm["packageMemberCount"] = len(entries)
                  arm["packageEntriesSha256"] = hashlib.sha256(
                      json.dumps(entries, sort_keys=True, separators=(",", ":")).encode()
                  ).hexdigest()
              print("QUALIFICATION_IDENTITY " + json.dumps(data, sort_keys=True))
          for pattern in ("warmup-*/canonical-receipt.json", "exhaustive-media-A/canonical-receipt.json"):
              paths = sorted(root.glob(pattern))
              if paths:
                  path = paths[0]
                  print("QUALIFICATION_CANONICAL " + json.dumps({
                      "path": str(path.relative_to(root)), "data": json.loads(path.read_text()),
                  }, sort_keys=True))
          if not (root / "analysis.json").is_file():
              for path in sorted(root.rglob("*.log")):
                  if path.name == "run.log" and (path.parent / "canonical-receipt.json").is_file():
                      continue
                  print("QUALIFICATION_LOG " + str(path.relative_to(root)))
                  print("\n".join(path.read_text(errors="replace").splitlines()[-60:]))
          PY
      - name: Retain every prescribed observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tag-prefetch-${{ matrix.dictionary }}-${{ matrix.order }}-${{ github.sha }}
          path: builds/perf/tag-prefetch-${{ matrix.dictionary }}-${{ matrix.order }}
          if-no-files-found: error
          retention-days: 30
