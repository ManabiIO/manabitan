name: Carry-on raw decoder qualification
on:
  push:
    branches: [review/carry-on-raw-decoder-20260926]
    paths: [.github/workflows/carry-on-raw-decoder-20260926.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 384d1c97dae6bd17555973b77ad415e038438499
      - uses: ./.github/actions/setup
        with:
          node-version: 22.16.0
      - name: Retain exact current source and generated libraries for review
        run: |
          mkdir -p /tmp/carry-on-evidence
          git rev-parse HEAD > /tmp/carry-on-evidence/base.txt
          tar --exclude=.git --exclude=node_modules --exclude=builds -czf /tmp/carry-on-evidence/current-source.tgz .
      - name: Decode and verify reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          data=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == 'ffe1bec5bb077c8ed6aed1a712ca6dc311743a40dc8004a9b5c81c0e48261a4b'
          pathlib.Path('/tmp/carry-on-evidence/repair.patch').write_bytes(data)
          PY
          test "$(git hash-object ext/js/dictionary/raw-term-content.js)" = 4426169d6c8d25f739bcd16f621c338594d7a9b1
          git apply --include=test/raw-term-content-shared.test.js /tmp/carry-on-evidence/repair.patch
      - name: Reproduce original failures
        shell: bash
        run: |
          set +e
          npx vitest run test/raw-term-content-shared.test.js --maxWorkers=1 --minWorkers=1 --reporter=json --outputFile=/tmp/carry-on-evidence/red.json > /tmp/carry-on-evidence/red.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/carry-on-evidence/red.json'))
          assert j['numFailedTests']==36 and j['numPassedTests']==38, j
          PY
      - name: Apply and qualify repair
        shell: bash
        run: |
          git apply --include=ext/js/dictionary/raw-term-content.js /tmp/carry-on-evidence/repair.patch
          test "$(git hash-object ext/js/dictionary/raw-term-content.js)" = 3c9c6112437146f702352ffafeada98186d573b3
          test "$(git hash-object test/raw-term-content-shared.test.js)" = c3da7d14153525de73dd363c80447f17aa59330b
          npx eslint ext/js/dictionary/raw-term-content.js test/raw-term-content-shared.test.js
          npm run test:ts
          npm run test:unit -- --reporter=json --outputFile=/tmp/carry-on-evidence/unit.json > /tmp/carry-on-evidence/unit.log 2>&1
          npm run test:unit:options
          npm run test:build
          git diff --check
      - name: Publish clean product branch
        shell: bash
        run: |
          git switch -c fix/raw-term-shared-decode-20260926
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ext/js/dictionary/raw-term-content.js test/raw-term-content-shared.test.js
          git commit -m 'fix(import): decode shared raw term-content views safely'
          git diff HEAD^ --name-only > /tmp/carry-on-evidence/changed-files.txt
          test "$(wc -l < /tmp/carry-on-evidence/changed-files.txt)" = 2
          git rev-parse HEAD > /tmp/carry-on-evidence/head.txt
          git push origin HEAD:refs/heads/fix/raw-term-shared-decode-20260926
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carry-on-raw-decoder-qualification
          path: /tmp/carry-on-evidence
          retention-days: 14
