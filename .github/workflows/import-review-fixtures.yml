name: Prepare locked import fixtures
on:
  push:
    branches: [bench/import-review-20260924-1558]
    paths: [.github/workflows/import-review-fixtures.yml]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2185eeaac05efa0fd60eea49e3f00ce3e048aabe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch verified dictionaries and Chromium
        run: |
          node dev/perf/prepare-dictionaries.js
          npx playwright install chromium
          tar -czf "$RUNNER_TEMP/import-review-fixtures.tar.gz" builds/e2e-dictionary-cache
          tar -czf "$RUNNER_TEMP/import-review-browser.tar.gz" -C "$HOME/.cache" ms-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: import-review-fixtures
          path: ${{ runner.temp }}/import-review-fixtures.tar.gz
          retention-days: 2
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: import-review-browser
          path: ${{ runner.temp }}/import-review-browser.tar.gz
          retention-days: 2
          compression-level: 0
