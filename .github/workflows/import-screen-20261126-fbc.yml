name: Exploratory import screen 20261126 fbc

on:
  push:
    branches: ['test/import-qualification-20261126-fbc']
    # Publishing evidence must never reacquire replacement observations.
    paths:
      - '.github/workflows/import-screen-20261126-fbc.yml'
      - 'dev/perf/import-screen-20261126-fbc.py'

permissions:
  contents: read

jobs:
  screen:
    name: ${{ matrix.study }} / ${{ matrix.dictionary }} (single-host screen)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        study: [utf8, borrowed-content]
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_STUDY: ${{ matrix.study }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Configure the shared pinned browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/manabitan-import-screen-browsers\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Validate the frozen schedule and receipt guards
        run: python3 dev/perf/import-screen-20261126-fbc.py --self-test
      - name: Install lockfile Chromium 153.0.8010.12
        run: npx playwright install --with-deps chromium
      - name: Run every registered complete-import observation
        run: |
          python3 dev/perf/import-screen-20261126-fbc.py \
            --study "$PERF_STUDY" \
            --dictionary "$PERF_DICTIONARY" \
            --evidence "builds/perf/import-screen-$PERF_STUDY-$PERF_DICTIONARY"
      - name: Preserve all attempted reports and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-screen-${{ matrix.study }}-${{ matrix.dictionary }}-fbc
          path: builds/perf/import-screen-${{ matrix.study }}-${{ matrix.dictionary }}
          if-no-files-found: error
          retention-days: 14
