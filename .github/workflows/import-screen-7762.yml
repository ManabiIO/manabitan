name: Import optimization screen 7762

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: import-screen-7762-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.event.pull_request.head.repo.full_name == github.repository && endsWith(github.head_ref, '-7762')
    name: Compare complete ${{ matrix.dictionary }} imports
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_BASELINE_SHA: 3d65e403c644b9a5a6be3128d72f9d30050b70e0
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Prepare frozen sources and packages
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/import-baseline"
          evidence="$GITHUB_WORKSPACE/builds/import-screen-7762"
          mkdir -p "$evidence"
          git worktree add --detach "$baseline" "$PERF_BASELINE_SHA"
          cmp package-lock.json "$baseline/package-lock.json"
          cmp test/perf/dictionaries.lock.json "$baseline/test/perf/dictionaries.lock.json"
          cmp test/chromium/extension-two-dictionary-import.e2e.js "$baseline/test/chromium/extension-two-dictionary-import.e2e.js"
          cmp dev/perf/import-benchmark.js "$baseline/dev/perf/import-benchmark.js"
          cmp dev/perf/benchmark-support.js "$baseline/dev/perf/benchmark-support.js"
          cmp dev/perf/dictionary-fixtures.js "$baseline/dev/perf/dictionary-fixtures.js"
          cmp test/e2e/import-timing.js "$baseline/test/e2e/import-timing.js"
          git diff --exit-code "$PERF_BASELINE_SHA" HEAD -- dev ext/data ext/lib package.json package-lock.json
          node dev/perf/prepare-dictionaries.js
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          mkdir -p "$baseline/builds"
          ln -s "$GITHUB_WORKSPACE/builds/e2e-dictionary-cache" "$baseline/builds/e2e-dictionary-cache"
          (
            cd "$baseline"
            npm run license-report:html
          )
          # A single unchanged dependency bundle prevents esbuild path comments
          # from introducing unrelated differences through linked dependencies.
          mkdir -p "$baseline/ext/lib"
          cp -a ext/lib/. "$baseline/ext/lib/"
          # The CLI rebuilds libraries. Use its unchanged exported packager so
          # both release archives retain the identical shared library bytes.
          node --input-type=module - "$baseline" "$GITHUB_WORKSPACE" <<'JS'
          import fs from 'node:fs'
          import path from 'node:path'
          import {pathToFileURL} from 'node:url'
          for (const root of process.argv.slice(2)) {
            const {build, getBuildPlan} = await import(pathToFileURL(path.join(root, 'dev/bin/build.js')))
            const {ManifestUtil} = await import(pathToFileURL(path.join(root, 'dev/manifest-util.js')))
            const manifestUtil = new ManifestUtil()
            const plan = getBuildPlan(['--target', 'chrome'], manifestUtil)
            const ext = path.join(root, 'ext')
            const manifestPath = path.join(ext, 'manifest.json')
            try {
              await build(path.join(root, 'builds'), ext, manifestUtil, plan.variantNames,
                manifestPath, plan.dryRun, plan.dryRunBuildZip, plan.yomitanVersion)
            } finally {
              fs.writeFileSync(manifestPath, ManifestUtil.createManifestString(manifestUtil.getManifest(plan.manifestName))
                .replace('$YOMITAN_VERSION', plan.yomitanVersion))
            }
          }
          JS
          printf 'PERF_BASELINE_ROOT=%s\nPERF_EVIDENCE_ROOT=%s\n' "$baseline" "$evidence" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$evidence/candidate-sha.txt"
          printf '%s\n' "$PERF_BASELINE_SHA" > "$evidence/baseline-sha.txt"
          sha256sum builds/manabitan-chrome.zip "$baseline/builds/manabitan-chrome.zip" > "$evidence/package-sha256.txt"
          cp builds/manabitan-chrome.zip "$evidence/candidate-package.zip"
          cp "$baseline/builds/manabitan-chrome.zip" "$evidence/baseline-package.zip"
          cp .github/workflows/import-screen-7762.yml "$evidence/executed-workflow.yml"
          python3 - "$GITHUB_WORKSPACE" "$baseline" "$evidence" <<'PY'
          import hashlib, json, pathlib, subprocess, sys, zipfile
          inventories = {}
          for label, root in zip(('candidate', 'baseline'), sys.argv[1:3]):
              with zipfile.ZipFile(root + '/builds/manabitan-chrome.zip') as archive:
                  hashes = {entry.filename: hashlib.sha256(archive.read(entry)).hexdigest()
                            for entry in archive.infolist() if not entry.is_dir()}
              pathlib.Path(sys.argv[3], label + '-package-entries.json').write_text(json.dumps(hashes, sort_keys=True, indent=2))
              inventories[label] = hashes
          names = inventories['candidate'].keys() | inventories['baseline'].keys()
          actual = sorted(name for name in names if inventories['candidate'].get(name) != inventories['baseline'].get(name))
          source_paths = subprocess.check_output(['git', 'diff', '--name-only', '3d65e403c644b9a5a6be3128d72f9d30050b70e0', 'HEAD', '--', 'ext/js'], text=True).splitlines()
          expected = sorted(name.removeprefix('ext/') for name in source_paths)
          pathlib.Path(sys.argv[3], 'package-differences.json').write_text(json.dumps({'expected': expected, 'actual': actual}, indent=2))
          if actual != expected:
              raise RuntimeError(f'Unrelated package differences: expected={expected}, actual={actual}')
          PY
      - name: Run fixed paired imports and unchanged controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          evidence = pathlib.Path(os.environ['PERF_EVIDENCE_ROOT'])
          candidate = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          baseline = pathlib.Path(os.environ['PERF_BASELINE_ROOT'])
          dictionary = os.environ['PERF_DICTIONARY']
          expected = {}
          for arm, root in [('A', baseline), ('B', candidate), ('C', baseline)]:
              expected[arm] = {
                  'sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip(),
                  'package': hashlib.sha256((root / 'builds/manabitan-chrome.zip').read_bytes()).hexdigest(),
              }
          (evidence / 'expected-sources.json').write_text(json.dumps(expected, indent=2))
          schedule = [('warmup-A', 'A', 'all'), ('warmup-B', 'B', 'all')]
          for pair in range(8):
              for arm in ('AB' if pair % 2 == 0 else 'BA'):
                  schedule.append((f'pair-{pair}-{arm}', arm, 'sample'))
              if pair % 2 == 1:
                  for arm in ('AC' if pair % 4 == 1 else 'CA'):
                      schedule.append((f'control-{pair // 2}-{arm}', arm, 'sample'))
          (evidence / 'schedule.json').write_text(json.dumps(schedule, indent=2))
          for name, arm, media in schedule:
              root = candidate if arm == 'B' else baseline
              output = evidence / name
              output.mkdir()
              before = subprocess.check_output(['node', str(candidate / 'dev/perf/host-environment.js')], text=True)
              (output / 'host-before.json').write_text(before)
              command = ['node', str(root / 'dev/perf/import-benchmark.js'), dictionary,
                         '--runs', '1', '--no-build', '--build-target', 'chrome',
                         '--media-check', media, '--output', str(output)]
              print(f'Observation {name}: {dictionary} {arm} media={media}', flush=True)
              with (output / 'run.log').open('w') as log:
                  completed = subprocess.run(command, cwd=root, stdout=log, stderr=subprocess.STDOUT)
              if completed.returncode:
                  print((output / 'run.log').read_text()[-16000:], flush=True)
                  raise SystemExit(completed.returncode)
              report = json.loads((output / 'summary.json').read_text())
              if report['gitSha'] != expected[arm]['sha'] or report['runs'][0]['packageSha256'] != expected[arm]['package']:
                  raise RuntimeError(f'Source/package identity mismatch for {name}')
              print(json.dumps({'observation': name, 'time': report.get('timing'), 'source': report.get('gitSha')}), flush=True)
              after = subprocess.check_output(['node', str(candidate / 'dev/perf/host-environment.js')], text=True)
              (output / 'host-after.json').write_text(after)
          PY
      - name: Retain observations including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-screen-7762-${{ matrix.dictionary }}
          path: builds/import-screen-7762
          if-no-files-found: error
          retention-days: 14
