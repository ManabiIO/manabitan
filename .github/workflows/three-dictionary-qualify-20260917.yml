name: Three dictionary candidate qualification
on:
  push:
    branches: [verify/three-dictionary-import-20260917]
    paths: [.github/workflows/three-dictionary-qualify-20260917.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Prepare and record exact candidate source
        run: |
          mkdir -p builds/three-qual
          python3 - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          text=Path('dev/perf/three-dictionary-20260917/candidates.patch.gz.b64').read_text().replace('h2Obf6Hf6H+','h2Obf6H+')
          patch=gzip.decompress(base64.b64decode(text))
          assert hashlib.sha256(patch).hexdigest()=='c2f362dbe7512af4723c73a499a8a6c0548c8d8ba98750abead38cd711ddba0f'
          subprocess.run(['git','apply','-'],input=patch,check=True)
          p=Path('dev/perf/three-dictionary-20260917/check.mjs')
          s=p.read_text(); old="await zstd.init(path.join(root, 'ext/lib/zstd.wasm'))"
          assert s.count(old)==1
          p.write_text(s.replace(old,"await zstd.init('data:application/wasm;base64,' + readFileSync('dev/data/zstd-simd.wasm').toString('base64'))"))
          PY
          git fetch --depth=1 origin 726c5b7444a1b3c131c90de356f8261ac2fe65a2
          git restore --source=FETCH_HEAD -- ext/js/dictionary/wasm/term-bank-inflate.c ext/js/dictionary/wasm/vendor/libdeflate
          python3 dev/perf/three-dictionary-20260917/add-tests.py
          git diff --check
      - run: npm ci
      - name: Check formatting without semantic source changes
        run: |
          npm run build:libs > builds/three-qual/libs-before.log 2>&1
          cp ext/lib/term-bank-parser.wasm builds/three-qual/measured-parser.wasm
          cp ext/lib/zstd-wasm.js builds/three-qual/measured-zstd.js
          node --input-type=module - <<'JS'
          import fs from 'node:fs'
          import assert from 'node:assert/strict'
          import {spawnSync} from 'node:child_process'
          import * as espree from 'espree'
          const files=['dev/lib/zstd-wasm.js','ext/js/core/import-byte-copy.js','ext/js/dictionary/dictionary-database.js','ext/js/dictionary/dictionary-importer.js','ext/js/dictionary/term-bank-experiments.js','ext/js/dictionary/term-bank-wasm-parser.js','ext/js/dictionary/term-content-block-store.js','ext/js/dictionary/zstd-term-content.js','ext/js/dictionary/zstd-term-content-compression-worker.js','test/import-byte-copy.test.js','test/term-bank-experiments.test.js','test/term-content-block-store.test.js','test/zstd-term-content-pool.test.js']
          const ast=p=>JSON.stringify(espree.parse(fs.readFileSync(p,'utf8'),{ecmaVersion:'latest',sourceType:'module'}),(key,value)=>key==='start'||key==='end'?undefined:value)
          const before=files.map(ast)
          const result=spawnSync(process.execPath,['node_modules/eslint/bin/eslint.js','--fix',...files],{encoding:'utf8'})
          fs.writeFileSync('builds/three-qual/changed-lint.log',result.stdout+result.stderr)
          assert.equal(result.status,0)
          assert.deepEqual(files.map(ast),before,'Formatting must preserve the entire syntax tree')
          fs.writeFileSync('builds/three-qual/ast-equality.txt','Complete syntax trees unchanged\n')
          JS
          npm run build:libs > builds/three-qual/libs-after.log 2>&1
          cmp builds/three-qual/measured-parser.wasm ext/lib/term-bank-parser.wasm
          cmp builds/three-qual/measured-zstd.js ext/lib/zstd-wasm.js
      - name: Native integrity, focused and full unit suites, types and builds
        env:
          THREE_CHECK_OUTPUT: builds/three-qual/check.json
        run: |
          node dev/perf/three-dictionary-20260917/check.mjs > builds/three-qual/check.log 2>&1
          node node_modules/vitest/vitest.mjs run test/import-byte-copy.test.js test/zstd-wasm.test.js test/zstd-term-content-pool.test.js test/term-content-block-store.test.js test/term-bank-experiments.test.js test/dictionary-database-content-dedup.test.js test/term-bank-inflate-matches.test.js test/term-bank-join-boundaries.test.js > builds/three-qual/focused.log 2>&1
          npm run test:unit > builds/three-qual/unit.log 2>&1
          npm run test:unit:options > builds/three-qual/options.log 2>&1
          npm run test:ts > builds/three-qual/types.log 2>&1
          npm run test:build > builds/three-qual/build-plans.log 2>&1
          git diff --check
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare immutable complete fixtures and exact browser packages
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          path=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=path.read_text(); assert s.count('maxBuffer: 32 * 1024 * 1024')==2
          path.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/three-qual/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/three-qual/chrome-build.log 2>&1
          node dev/bin/build.js --target firefox-dev > builds/three-qual/firefox-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Full WTY corpus equality through both inflated source layouts
        run: |
          git fetch --depth=1 origin 1654d15dc4b27ddc75f27ec3168b30a891ce5725
          git show FETCH_HEAD:dev/perf/wty-next-20260917/corpus-parity.mjs > "$RUNNER_TEMP/corpus-parity.mjs"
          node "$RUNNER_TEMP/corpus-parity.mjs" '{"experimentalLibdeflate":true,"experimentalAlignedImportCopies":true}' builds/three-corpus > builds/three-qual/corpus.log 2>&1
          cp builds/three-corpus/parity.json builds/three-qual/corpus-parity.json
      - name: Full strict Chromium import and recovery lifecycle
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{"experimentalLibdeflate":true,"experimentalAlignedImportCopies":true}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/three-qual/lifecycle.html
        run: |
          node test/chromium/extension-two-dictionary-import.e2e.js > builds/three-qual/lifecycle.log 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('builds/three-qual/lifecycle.json').read_text())
          assert r['status']=='success' and r['skippedVerification'] is False and len(r['phases'])>=80
          PY
          echo QUALIFIED > builds/three-qual/complete.txt
      - name: Retain exact final source and failures
        if: always()
        run: |
          mkdir -p builds/three-qual/source
          git add -N ext/js/core/import-byte-copy.js ext/js/dictionary/wasm/term-bank-inflate.c ext/js/dictionary/wasm/vendor/libdeflate test/import-byte-copy.test.js
          git diff HEAD -- dev/build-libs.js dev/lib/zstd-wasm.js ext/js types/ext test > builds/three-qual/product.patch
          tar -czf builds/three-qual/source.tar.gz dev/build-libs.js dev/lib/zstd-wasm.js ext/js/core/import-byte-copy.js ext/js/dictionary types/ext/dictionary-importer.d.ts test/import-byte-copy.test.js test/term-bank-experiments.test.js test/zstd-term-content-pool.test.js test/term-content-block-store.test.js ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js
          sha256sum ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js > builds/three-qual/executables.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-qualification
          path: builds/three-qual
          retention-days: 30
