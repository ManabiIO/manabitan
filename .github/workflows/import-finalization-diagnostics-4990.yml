name: Import finalization diagnostics (4990)

on:
  push:
    branches: [test/import-finalization-diagnostics-20261128-4990]

permissions:
  contents: read

jobs:
  correctness:
    if: contains(github.event.head_commit.message, '[run-finalization-study]')
    name: Diagnostic instrumentation correctness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Unit suite, main types, and dry builds
        run: npm run test:unit && npm run test:ts:main && npm run test:build
  diagnose:
    if: contains(github.event.head_commit.message, '[run-finalization-study]')
    name: JMdict finalization / host ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore locked archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}-jmdict
      - name: Acquire ordinary context and diagnostic operation splits
        env:
          STUDY_HOST: ${{ matrix.host }}
          STUDY_EVIDENCE: ${{ runner.temp }}/finalization-evidence
        run: >-
          python3 dev/perf/import-finalization-diagnostics-20261128-4990/run.py
          --host "$STUDY_HOST" --evidence "$STUDY_EVIDENCE"
      - name: Retain complete evidence and failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: finalization-jmdict-host-${{ matrix.host }}
          path: ${{ runner.temp }}/finalization-evidence
          if-no-files-found: warn
          retention-days: 14
