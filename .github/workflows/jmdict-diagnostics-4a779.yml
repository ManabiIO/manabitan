name: JMdict diagnostic counters 4a779

on:
  push:
    branches: [perf/jmdict-diagnostics-20261127-4a779]

permissions:
  contents: read

concurrency:
  group: jmdict-diagnostics-4a779
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Record one diagnostic import
        run: |
          node dev/perf/import-benchmark.js jmdict --build-target chrome \
            --trace --runs 1 --media-check sample --output builds/perf/jmdict-diagnostics
      - name: Preserve diagnostic observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jmdict-diagnostics-4a779
          path: builds/perf/jmdict-diagnostics
          if-no-files-found: error
          retention-days: 14
