name: Verified native pipeline independent replication
on:
  push:
    branches: [verify/import-radical-20260915]
    paths: [.github/workflows/radical-pipeline-replicate-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [lookup-native, fused-minimal]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 00e0a9d6bbde666ece3e56140384bf00bc47431d
          persist-credentials: false
      - name: Freeze reviewed driver with correctly forwarded controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/radical-review"
          for file in source-ab.py install-libdeflate.py; do
            gh api "repos/ManabiIO/manabitan/contents/dev/perf/radical-20260915/$file?ref=e2e49757be70d11cce74a9e0b865936c2343dbe2" --jq .content | base64 --decode > "$RUNNER_TEMP/radical-review/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'radical-review/source-ab.py'
          s=p.read_text()
          s=s.replace('30ffb604e0a87f0aa252bd4331bc54668062b1e1','00e0a9d6bbde666ece3e56140384bf00bc47431d').replace('c069f4ca92d8e6902a1a182281a06b2579610c05','1c2b75e21de1c06527b8e107bfdeb47944cde29f')
          old='flags_by_variant = {'
          assert s.count(old)==1
          s=s.replace(old,"flags_by_variant = {\n    'fused-minimal': {'experimentalNativeSegmentedLookup': True, 'experimentalLookupScratchReuse': True, 'experimentalTermBankSpans': True, 'experimentalGlobalExactContentReuse': True},")
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - run: node dev/bin/build.js --target chrome-dev
      - name: Twelve reversed-order AB pairs with six AA controls
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: python3 "$RUNNER_TEMP/radical-review/source-ab.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-pipeline-replication-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/radical-screen
          retention-days: 30
