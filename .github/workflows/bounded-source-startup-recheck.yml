name: Repeat complete JMnedict comparison after pre-import startup timeout

on:
  push:
    branches: [perf-bounded-startup-recheck-20260909]
    paths: [.github/workflows/bounded-source-startup-recheck.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Prepare the same browser and compiler
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v clang >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang lld
          fi
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build frozen baseline and already published candidate
        shell: bash
        run: |
          set -euo pipefail
          arms="$RUNNER_TEMP/arms"
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$arms" "$evidence"
          git worktree add --detach "$arms/baseline" b8d68458cde8788b5d5301ceaf36beae7a1363f9
          git worktree add --detach "$arms/candidate" 5080693606e175286e3514e6dbe3d3eaf3a94708
          test "$(git -C "$arms/candidate" rev-parse 'HEAD^{tree}')" = b87991b7e840752f68132cc14e8437b3cf123056
          for arm in baseline candidate; do
            ln -s "$GITHUB_WORKSPACE/node_modules" "$arms/$arm/node_modules"
            (cd "$arms/$arm" && node dev/bin/build.js --target chrome-dev) > "$evidence/build-$arm.log" 2>&1
          done
          for file in term-bank-parser.wasm zstd.wasm zip.js z-worker.js; do
            cmp "$arms/baseline/ext/lib/$file" "$arms/candidate/ext/lib/$file"
          done
          git -C "$arms/candidate" diff b8d68458cde8788b5d5301ceaf36beae7a1363f9 HEAD --binary > "$evidence/source.patch"
          (cd "$arms/baseline" && node dev/perf/prepare-dictionaries.js) > "$evidence/fixtures.log" 2>&1
          ln -s "$arms/baseline/builds/e2e-dictionary-cache" "$arms/candidate/builds/e2e-dictionary-cache"
          cp dev/perf/bounded-source-experiment/run-paired.py "$evidence/"
          lscpu > "$evidence/cpu.txt"
          free -b > "$evidence/memory.txt"
          clang --version > "$evidence/compiler.txt"
          printf '%s\n' 'Separate full comparison after run 34308535463 failed to initialize settings before importing pair 4. Preserve its six measured imports and failed report separately; do not splice or pool the runs. Same source, browser, fixtures, 30-second startup timeout and acceptance checks.' > "$evidence/RECHECK-REASON.txt"
      - name: Focused correctness
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/candidate"
          node node_modules/vitest/vitest.mjs run test/term-bank-bounded-compressed.test.js test/dictionary-import-ownership.test.js > "$RUNNER_TEMP/evidence/focused.log" 2>&1
      - name: Four complete adjacent pairs with separately retained warmups
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/perf/bounded-source-experiment/run-paired.py \
            --baseline "$RUNNER_TEMP/arms/baseline" \
            --candidate "$RUNNER_TEMP/arms/candidate" \
            --datasets jmnedict --pairs 4 --warmups 1 \
            --output "$RUNNER_TEMP/evidence/paired" \
            --label 'Full JMnedict recheck after pre-import startup failure; frozen source; four new pairs' \
            | tee "$RUNNER_TEMP/evidence/driver.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-startup-recheck-jmnedict
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: warn
