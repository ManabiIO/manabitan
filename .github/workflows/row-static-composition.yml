name: Row materialization static composition check

on:
  push:
    branches: [review/importer-row-materialization-20260920]
    paths: ['.github/workflows/row-static-composition.yml']

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arm: [base, repaired, media-fixed]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select exact base or PR merge composition
        env:
          ARM: '${{ matrix.arm }}'
        run: |
          ref=131e51bc815a165bb79f774152b201554cb8827e
          if [ "$ARM" != base ]; then ref=b60baf4c09cd0075fc57661e4d588878fdbc9dc3; fi
          git fetch --depth=1 origin "$ref"
          git checkout --detach "$ref"
          mkdir -p builds/web-evidence
          git rev-parse HEAD > builds/web-evidence/base.txt
      - name: Apply isolated media publication candidate
        if: matrix.arm == 'media-fixed'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ext/js/dictionary/dictionary-importer.js')
          s = p.read_text()
          a = '                    const row = decodedRows[i];'
          assert s.count(a) == 1
          s = s.replace(a, a + '\n                    const requirementCount = requirementsForChunk?.length ?? 0;')
          a = '                            requirementsForChunk !== null &&\n                            (\n                                !hasPrecomputedTermEntryContent(entry)\n                            )'
          assert s.count(a) == 1
          s = s.replace(a, '                            requirementsForChunk !== null &&\n                            requirementsForChunk.length === requirementCount &&\n                            (\n                                !hasPrecomputedTermEntryContent(entry)\n                            )')
          p.write_text(s)
          PY
          git diff --binary > builds/web-evidence/media-candidate.patch
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm ci
      - run: npm run build:libs
      - run: node web/build.mjs
      - name: Preserve exact parser and importer source
        run: |
          tar -czf builds/web-evidence/source.tar.gz ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/wasm/term-bank-parser.c ext/lib/term-bank-parser.wasm
      - uses: actions/checkout@v4
        with:
          repository: ManabiIO/manabi-reader-web
          ref: bca91f6fff6300d10ba47d046dfb1a20a7c97e5e
          path: reader-fixtures
          sparse-checkout: test/reader/e2e
          persist-credentials: false
      - name: Prepare the unchanged official acceptance fixtures
        run: |
          python3 reader-fixtures/test/reader/e2e/prepare-jmdict.py "$RUNNER_TEMP/dictionaries"
          python3 web/make-fixtures.py "$RUNNER_TEMP/dictionaries"
          python3 web/prepare-fixtures.py "$RUNNER_TEMP/dictionaries"
          npx playwright install --with-deps chromium
          sha256sum "$RUNNER_TEMP/dictionaries/web-media.zip" ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-wasm-parser.js ext/lib/term-bank-parser.wasm > builds/web-evidence/sources.sha256
      - name: Add failure diagnostics without changing assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/extended-e2e.mjs')
          s = p.read_text()
          original = "        await expect.poll(() => page.locator('#result .gloss-image').evaluate((el) => el.complete && el.naturalWidth > 0)).toBe(true);"
          assert s.count(original) == 1
          diagnostic = '''        try {
          ORIGINAL
                  } catch (error) {
                      const diagnostic = await page.evaluate(async () => {
                          const image = document.querySelector('#result .gloss-image');
                          const data = {
                              markup: image?.outerHTML,
                              src: image?.src,
                              currentSrc: image?.currentSrc,
                              complete: image?.complete,
                              naturalWidth: image?.naturalWidth,
                              naturalHeight: image?.naturalHeight,
                              lookup: await runtime.lookup('画像検査'),
                          };
                          try {
                              const response = await fetch(image?.currentSrc || image?.src);
                              const bytes = new Uint8Array(await response.arrayBuffer());
                              data.blob = {status: response.status, type: response.headers.get('content-type'), length: bytes.length, prefix: Array.from(bytes.subarray(0, 96))};
                          } catch (fetchError) { data.blobError = String(fetchError); }
                          return data;
                      });
                      await fs.writeFile('builds/web-evidence/image-failure.json', JSON.stringify(diagnostic, null, 2));
                      throw error;
                  }'''.replace('          ORIGINAL', original)
          p.write_text(s.replace(original, diagnostic))
          PY
      - name: Run unchanged no-extension acceptance with diagnostic capture
        env:
          DICTIONARY_FIXTURES: '${{ runner.temp }}/dictionaries'
        run: |
          set -o pipefail
          node web/e2e.mjs 2>&1 | tee builds/web-evidence/run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'row-static-composition-${{ matrix.arm }}'
          path: builds/web-evidence/
          retention-days: 14
          if-no-files-found: error
