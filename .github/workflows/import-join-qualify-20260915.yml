name: Native join qualification 20260915
on:
  push:
    branches: [verify/import-screen-20260915]
    paths:
      - .github/workflows/import-join-qualify-20260915.yml
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e456fba18b7383ebbade745f2b41bfe2d8a3733f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Pin source identity
        run: |
          mkdir -p builds/join-qualification
          git rev-parse HEAD 'HEAD^{tree}' | tee builds/join-qualification/source.txt
          test "$(sha256sum ext/js/dictionary/wasm/term-bank-parser.c | cut -d ' ' -f 1)" = 9be72ee642106131ca57be11dc3131463bea4da1176548735ea2607d622f7920
          clang --version | tee builds/join-qualification/compiler.txt
      - run: npm ci
      - name: Build native assets
        run: npm run build:libs 2>&1 | tee builds/join-qualification/build.log
      - name: Check new test style without modifying it
        id: lint
        continue-on-error: true
        run: npx eslint test/term-bank-join-boundaries.test.js 2>&1 | tee builds/join-qualification/lint.log
      - name: Focused native and boundary tests
        id: focused
        continue-on-error: true
        run: node node_modules/vitest/vitest.mjs run test/term-bank-join-boundaries.test.js test/term-bank-wasm-parser.test.js test/term-bank-experiments.test.js test/lookup-construction-experiments.test.js test/term-bank-parser-string-scan.test.js 2>&1 | tee builds/join-qualification/focused.log
      - name: Complete unit suite
        id: unit
        continue-on-error: true
        run: npm run test:unit 2>&1 | tee builds/join-qualification/unit.log
      - name: Options suite
        id: options
        continue-on-error: true
        run: npm run test:unit:options 2>&1 | tee builds/join-qualification/options.log
      - name: All JavaScript typecheck projects
        id: types
        continue-on-error: true
        run: npm run test:ts 2>&1 | tee builds/join-qualification/types.log
      - name: All target build plans
        id: buildplans
        continue-on-error: true
        run: npm run test:build 2>&1 | tee builds/join-qualification/build-plans.log
      - name: Actual Chrome development build
        id: chrome
        continue-on-error: true
        run: node dev/bin/build.js --target chrome-dev 2>&1 | tee builds/join-qualification/chrome-build.log
      - name: Actual Firefox development build
        id: firefox
        continue-on-error: true
        run: node dev/bin/build.js --target firefox-dev 2>&1 | tee builds/join-qualification/firefox-build.log
      - name: Record exact outcomes and assert unchanged source
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          TYPES: ${{ steps.types.outcome }}
          BUILDPLANS: ${{ steps.buildplans.outcome }}
          CHROME: ${{ steps.chrome.outcome }}
          FIREFOX: ${{ steps.firefox.outcome }}
        run: |
          mkdir -p builds/join-qualification
          printf '%s\n' "lint=$LINT focused=$FOCUSED unit=$UNIT options=$OPTIONS types=$TYPES buildplans=$BUILDPLANS chrome=$CHROME firefox=$FIREFOX" > builds/join-qualification/outcomes.txt
          cp test/term-bank-join-boundaries.test.js builds/join-qualification/
          git diff --exit-code
          test -z "$(git status --porcelain)"
          test "$LINT/$FOCUSED/$UNIT/$OPTIONS/$TYPES/$BUILDPLANS/$CHROME/$FIREFOX" = 'success/success/success/success/success/success/success/success'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-join-qualification-corrected-20260915
          path: builds/join-qualification
          retention-days: 30
