name: Import optimization round two screen
on:
  push:
    branches: [verify/import-round2-20260915]
    paths: [.github/workflows/import-round2-screen-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [int-span, equal-simd, escape-word, cheap-guards]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preserve immutable review driver and patches, then check out baseline
        run: |
          cp -a dev/perf/round2-20260915 "$RUNNER_TEMP/round2-review"
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          python3 -m py_compile "$RUNNER_TEMP/round2-review/source-screen.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Checksum-pinned complete dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Build baseline
        run: node dev/bin/build.js --target chrome-dev
      - name: Fixed six-pair source comparisons with interleaved AA controls
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: python3 "$RUNNER_TEMP/round2-review/source-screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round2-screen-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/round2-screen
          retention-days: 30
