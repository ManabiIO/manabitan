name: Frozen import profiles 9d6

on:
  push:
    branches: ['perf/import-components-9d6-20261128']
    paths:
      - '.github/workflows/import-profile-9d6.yml'

permissions:
  contents: read

concurrency:
  group: import-profile-9d6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: Baseline / ${{ matrix.dictionary }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
      MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
      MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
      MANABITAN_E2E_PHASE_PROFILING: '0'
      MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
      MANABITAN_E2E_PROCESS_SAMPLING: '0'
      MANABITAN_CHROMIUM_HEADLESS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ matrix.dictionary }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Prepare immutable source and package receipts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$PERF_BASELINE" ]]
          node dev/perf/prepare-dictionaries.js "$PERF_DICTIONARY"
          npm run build -- --target chrome
          mkdir -p builds/perf/profile-9d6
          git rev-parse HEAD > builds/perf/profile-9d6/source-sha.txt
          sha256sum builds/manabitan-chrome.zip test/perf/dictionaries.lock.json package-lock.json > builds/perf/profile-9d6/input-sha256.txt
          node dev/perf/host-environment.js > builds/perf/profile-9d6/host.json
      - name: Record one ordinary diagnostic import
        shell: bash
        run: |
          set -euo pipefail
          node dev/perf/import-benchmark.js "$PERF_DICTIONARY" \
            --runs 1 --no-build --build-target chrome --media-check sample \
            --output builds/perf/profile-9d6/ordinary \
            2>&1 | tee builds/perf/profile-9d6/ordinary.log
      - name: Record a separate traced import
        shell: bash
        run: |
          set -euo pipefail
          node dev/perf/import-benchmark.js "$PERF_DICTIONARY" \
            --runs 1 --no-build --build-target chrome --media-check sample --trace \
            --output builds/perf/profile-9d6/trace \
            2>&1 | tee builds/perf/profile-9d6/trace.log
      - name: Retain profiles and any failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-profile-9d6-${{ matrix.dictionary }}
          path: builds/perf/profile-9d6
          if-no-files-found: warn
          retention-days: 14
