name: First-special scanner with libdeflate integration
on:
  push:
    branches: [verify/import-round6-20260916]
    paths: [.github/workflows/import-round6-libdeflate-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23524cf48cb08482ebd271406fe48da773bb516c
          persist-credentials: false
      - name: Prepare a fixed comparison with libdeflate present in both arms
        run: |
          cp -a dev/perf/round6-20260916 "$RUNNER_TEMP/round6-review"
          cp test/term-bank-first-special.test.js "$RUNNER_TEMP/scanner-test.js"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round6-review/screen.py'
          s = p.read_text()
          before = "logrun(['node', 'dev/bin/build.js', '--target', 'chrome-dev'], 'base-build.log')"
          insert = """# Both arms include the exact open libdeflate PR. No remote refs are changed.
          for directory in (root, candidate):
              run(['git', '-c', 'core.hooksPath=/dev/null', '-c', 'user.name=Qualification only', '-c',
                  'user.email=qualification@manabi.io', 'merge', '--no-ff', '--no-edit',
                  '726c5b7444a1b3c131c90de356f8261ac2fe65a2'], directory)
          change['sha256'] = sha(candidate / source)
          (output / 'composition.json').write_text(json.dumps({
              'libdeflateHead': '726c5b7444a1b3c131c90de356f8261ac2fe65a2',
              'baselineCommit': run(['git', 'rev-parse', 'HEAD']),
              'candidateCommit': run(['git', 'rev-parse', 'HEAD'], candidate),
              'candidateSource': change['sha256'], 'remoteWrites': False}, indent=2))
          """
          assert s.count(before) == 1
          s = s.replace(before, insert + before)
          s = s.replace("{'baseline': BASE, 'candidate': variant, 'dictionary': dictionary,", "{'baseline': BASE, 'candidate': variant, 'dictionary': dictionary, 'comparison': 'libdeflate A versus libdeflate plus scalar scanner B',")
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round6-review/"*.py
          git fetch --depth=4 origin b4094a423c20bb0ed424d944238f922c1b36559c 726c5b7444a1b3c131c90de356f8261ac2fe65a2
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Six paired full imports on the combined backend
        env:
          CANDIDATE: word-jump
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: BA
        run: |
          mkdir -p builds/round6
          python3 "$RUNNER_TEMP/round6-review/screen.py" 2>&1 | tee builds/round6/driver.log
      - name: Full combined unit suite, new scanner cases and typechecks after timing
        if: matrix.dictionary == 'jmdict'
        run: |
          cd "$RUNNER_TEMP/round6-candidate"
          cp "$RUNNER_TEMP/scanner-test.js" test/term-bank-first-special.test.js
          npm run test:unit 2>&1 | tee "$GITHUB_WORKSPACE/builds/round6/integration-unit.log"
          npm run test:unit:options 2>&1 | tee "$GITHUB_WORKSPACE/builds/round6/integration-options.log"
          npm run test:ts 2>&1 | tee "$GITHUB_WORKSPACE/builds/round6/integration-types.log"
          node node_modules/eslint/bin/eslint.js test/term-bank-first-special.test.js 2>&1 | tee "$GITHUB_WORKSPACE/builds/round6/integration-lint.log"
      - name: Full strict Chromium lifecycle on the combined candidate
        if: matrix.dictionary == 'jmdict'
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
        run: |
          cd "$RUNNER_TEMP/round6-candidate"
          export MANABITAN_CHROMIUM_E2E_REPORT="$GITHUB_WORKSPACE/builds/round6/integration-browser.html"
          npm run test:e2e:chromium-extension 2>&1 | tee "$GITHUB_WORKSPACE/builds/round6/integration-browser.log"
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          p = Path(os.environ['GITHUB_WORKSPACE']) / 'builds/round6/integration-browser.json'
          r = json.loads(p.read_text())
          assert r['status'] == 'success' and r['skippedVerification'] is False
          assert len(r['phases']) >= 80
          PY
          git diff --exit-code
          printf '%s\n' 'Combined lifecycle passed; no remote refs published or merged.' > "$GITHUB_WORKSPACE/builds/round6/integration-complete.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round6-libdeflate-${{ matrix.dictionary }}
          path: builds/round6
          retention-days: 30
