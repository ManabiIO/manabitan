name: Qualify import failure supervision

on:
  push:
    branches:
      - fix/import-failure-supervision-main-20260914
    paths:
      - .github/workflows/qualify-import-failure-supervision.yml
      - dev/apply-import-failure-supervision-fix.py

permissions:
  contents: write

concurrency:
  group: qualify-import-failure-supervision
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:libs

      - name: Apply import response relay supervision
        run: python dev/apply-import-failure-supervision-fix.py

      - name: Confirm exact import supervision regressions are green
        run: >-
          npx vitest run
          test/offscreen-import-supervision.test.js
          --reporter=json
          --outputFile=/tmp/import-supervision-focused.json

      - name: Run adjacent offscreen and runtime suites
        run: >-
          npx vitest run
          test/offscreen-proxy.test.js
          test/offscreen-proxy-bridge.test.js
          test/backend-lookup-refresh.test.js
          --reporter=json
          --outputFile=/tmp/import-supervision-adjacent.json

      - name: Run full unit and options suites
        run: |
          npm run test:unit -- --reporter=json --outputFile=/tmp/import-supervision-unit.json
          npm run test:unit:options -- --reporter=json --outputFile=/tmp/import-supervision-options.json

      - name: Lint changed code and reject new changed-file type diagnostics
        shell: bash
        run: |
          npx eslint ext/js/background/offscreen.js test/offscreen-import-supervision.test.js
          set +e
          npm run test:ts:main > /tmp/import-supervision-types-main.log 2>&1
          main_status=$?
          npm run test:ts:test > /tmp/import-supervision-types-test.log 2>&1
          test_status=$?
          set -e
          echo "Inherited main type status: $main_status"
          echo "Inherited test type status: $test_status"
          if grep -E 'ext/js/background/offscreen\.js|test/offscreen-import-supervision\.test\.js' /tmp/import-supervision-types-main.log /tmp/import-supervision-types-test.log; then
            echo 'New type diagnostics touch import supervision files.'
            exit 1
          fi
          git diff --check

      - name: Build all targets and Chromium development package
        run: |
          npm run license-report:html
          npm run test:build > /tmp/import-supervision-build-all.log 2>&1
          node ./dev/bin/build.js --target chrome-dev > /tmp/import-supervision-build-chromium.log 2>&1

      - name: Commit only qualified source and regression test
        shell: bash
        run: |
          git fetch origin fix/import-failure-supervision-main-20260914
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ext/js/background/offscreen.js test/offscreen-import-supervision.test.js
          git rm .github/workflows/qualify-import-failure-supervision.yml dev/apply-import-failure-supervision-fix.py
          git diff --cached --stat > /tmp/import-supervision-commit-stat.txt
          git commit -m 'Supervise dictionary import response ports across worker failure'
          git rev-parse HEAD > /tmp/import-supervision-verified-commit.txt
          git push origin HEAD:fix/import-failure-supervision-main-20260914

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-supervision-${{ github.run_id }}
          path: /tmp/import-supervision-*
          if-no-files-found: warn
