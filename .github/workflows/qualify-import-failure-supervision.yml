name: Qualify import failure supervision

on:
  push:
    branches:
      - fix/import-failure-supervision-main-20260914
    paths:
      - .github/workflows/qualify-import-failure-supervision.yml
      - ext/js/background/offscreen.js
      - test/offscreen-import-supervision.test.js

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Run import supervision regressions
        run: npx vitest run test/offscreen-import-supervision.test.js
      - name: Run adjacent worker and offscreen suites
        run: >-
          npx vitest run
          test/offscreen-proxy.test.js
          test/offscreen-proxy-bridge.test.js
          test/backend-lookup-refresh.test.js
      - name: Run full unit and options suites
        run: |
          npm run test:unit
          npm run test:unit:options
      - name: Static checks and Chromium build
        run: |
          npx eslint ext/js/background/offscreen.js test/offscreen-import-supervision.test.js
          npm run test:ts:main
          npm run test:ts:test
          node ./dev/bin/build.js --target chrome-dev
          git diff --check
