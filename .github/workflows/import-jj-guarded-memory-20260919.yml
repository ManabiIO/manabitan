name: Guarded glossary browser memory
on:
  push:
    branches: [research/import-jitendex-jmdict-20260919]
    paths: [.github/workflows/import-jj-guarded-memory-20260919.yml]
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jitendex, jmdict]
    env:
      MANABITAN_CLANG: clang-18
      BASE: 54ac62a39386459b7822fc644e5a1a6b1a619619
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reconstruct clean exact product sources
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recipes"
          cp dev/perf/apply-guarded-glossary.py dev/perf/guarded-glossary-20260919.patch dev/perf/jj-glossary-confirm.py dev/perf/guarded-glossary-memory.py "$RUNNER_TEMP/recipes/"
          git fetch --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          cp "$RUNNER_TEMP/recipes/"* dev/perf/
          python dev/perf/apply-guarded-glossary.py
      - run: npm ci
      - run: npm run build:libs
      - run: npx playwright install --with-deps chromium
      - run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('builds/e2e-dictionary-cache');"
      - name: Whole-browser PSS and RSS diagnostic cohort, never timing qualification
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: python dev/perf/guarded-glossary-memory.py --dictionary "$DICTIONARY" --blocks 2 --out "$RUNNER_TEMP/guarded-memory"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarded-memory-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/guarded-memory
          retention-days: 30
          if-no-files-found: error
