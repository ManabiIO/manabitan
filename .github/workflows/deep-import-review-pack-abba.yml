name: Deep import review packing ABBA

on:
  push:
    branches: [review/import-lookup-deep-20260920]
    paths: [.github/workflows/deep-import-review-pack-abba.yml]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:libs
      - run: npx playwright install --with-deps chromium
      - name: Build variants and measure independent full-import ABBA trials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, subprocess
          def run(args):
              subprocess.run(args, check=True)
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          target = Path('ext/js/dictionary/term-content-block-store.js')
          original = target.read_text()
          assert original == subprocess.check_output(['git', 'show', '78d8d0b118ca3e4e2d52694aefb11fe9ec43d2c5:' + str(target)], text=True)
          old = '''        let outputOffset = 0;
                  for (let i = startIndex; i < endIndex; ++i) {
                      const sourceOffset = sourceOffsets[i];
                      const length = sourceLengths[i];
                      sourceChunkIndices[i] = packedIndex;
                      sourceChunkLocalOffsets[i] = outputOffset;
                      output.set(sourceBytes.subarray(sourceOffset, sourceOffset + length), outputOffset);
                      outputOffset += length;
                  }'''
          # The YAML block contributes no indentation to Python string contents.
          old = old.replace('\n          ', '\n')
          new = '''        let outputOffset = 0;
                  let runStart = sourceOffsets[startIndex];
                  let runEnd = runStart;
                  let runOutputOffset = 0;
                  for (let i = startIndex; i < endIndex; ++i) {
                      const sourceOffset = sourceOffsets[i];
                      const length = sourceLengths[i];
                      sourceChunkIndices[i] = packedIndex;
                      sourceChunkLocalOffsets[i] = outputOffset;
                      if (sourceOffset !== runEnd) {
                          output.set(sourceBytes.subarray(runStart, runEnd), runOutputOffset);
                          runStart = sourceOffset;
                          runOutputOffset = outputOffset;
                      }
                      runEnd = sourceOffset + length;
                      outputOffset += length;
                  }
                  output.set(sourceBytes.subarray(runStart, runEnd), runOutputOffset);'''
          new = new.replace('\n          ', '\n')
          assert original.count(old) == 1
          candidate = original.replace(old, new)
          output = Path('builds/deep-pack-abba')
          output.mkdir(parents=True, exist_ok=True)
          variants = {'A': original, 'B': candidate}
          metadata = {}
          for variant, source in variants.items():
              target.write_text(source)
              run(['npx', 'vitest', 'run', 'test/term-content-block-store.test.js', '--maxWorkers=1', '--minWorkers=1'])
              run(['node', 'dev/bin/build.js', '--target', 'chrome-dev'])
              archive = Path('/tmp') / ('deep-pack-' + variant + '.zip')
              shutil.copyfile('builds/manabitan-chrome-dev.zip', archive)
              metadata[variant] = {'blockStoreSha256': sha(source.encode()), 'extensionZipSha256': sha(archive.read_bytes())}
              (output / (variant + '-block-store.js')).write_text(source)
          (output / 'variants.json').write_text(json.dumps(metadata, indent=2))
          records = []
          counter = 0
          def trial(dictionary, variant, kind, block, slot):
              global counter
              counter += 1
              target.write_text(variants[variant])
              shutil.copyfile('/tmp/deep-pack-' + variant + '.zip', 'builds/manabitan-chrome-dev.zip')
              destination = output / ('%03d-%s-%s-%s' % (counter, kind, dictionary, variant))
              run(['node', 'dev/perf/import-benchmark.js', dictionary, '--runs', '1', '--no-build', '--output', str(destination)])
              summary = json.loads((destination / 'summary.json').read_text())
              records.append({'counter': counter, 'dictionary': dictionary, 'variant': variant, 'kind': kind, 'block': block, 'slot': slot, 'totalImportMs': summary['runs'][0]['totalImportMs'], 'workerImportMs': summary['runs'][0]['workerImportMs'], 'summary': str(destination / 'summary.json'), 'source': metadata[variant]})
              (output / 'trials.json').write_text(json.dumps(records, indent=2))
          for dictionary in ['jmdict', 'jitendex', 'jmnedict']:
              for variant in ['A', 'B']:
                  trial(dictionary, variant, 'warmup', -1, -1)
          for block in range(2):
              dictionaries = ['jmdict', 'jitendex', 'jmnedict']
              dictionaries = dictionaries[block:] + dictionaries[:block]
              for dictionary in dictionaries:
                  for slot, variant in enumerate('ABBA'):
                      trial(dictionary, variant, 'abba', block, slot)
          for dictionary in ['jmnedict', 'jitendex', 'jmdict']:
              for slot in range(4):
                  trial(dictionary, 'A', 'aa', 0, slot)
          target.write_text(original)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-import-review-pack-abba
          path: builds/deep-pack-abba/
          retention-days: 7
