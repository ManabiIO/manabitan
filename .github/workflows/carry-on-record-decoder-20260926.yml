name: Carry-on record decoder qualification
on:
  push:
    branches: [review/carry-on-record-decoder-20260926]
    paths: [.github/workflows/carry-on-record-decoder-20260926.yml]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 384d1c97dae6bd17555973b77ad415e038438499
      - uses: ./.github/actions/setup
        with:
          node-version: 22.16.0
      - name: Verify and apply regression tests
        shell: bash
        run: |
          mkdir -p /tmp/record-evidence
          git rev-parse HEAD > /tmp/record-evidence/base.txt
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib
          data=gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == '9e9b1f1c378f3d0483e0a109d5686d3e2897b657dc919970e33e0eb9af5c19c1'
          pathlib.Path('/tmp/record-evidence/repair.patch').write_bytes(data)
          PY
          test "$(git hash-object ext/js/dictionary/term-record-opfs-store.js)" = 866c26b34b21f2a9d3397114fbe9d928cb55f284
          git apply --include=test/term-record-shared-decode.test.js /tmp/record-evidence/repair.patch
      - name: Reproduce unchanged implementation failures
        shell: bash
        run: |
          set +e
          npx vitest run test/term-record-shared-decode.test.js --maxWorkers=1 --minWorkers=1 --reporter=json --outputFile=/tmp/record-evidence/red.json > /tmp/record-evidence/red.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/record-evidence/red.json'))
          assert j['numFailedTests']==14 and j['numPassedTests']==13, j
          PY
      - name: Qualify repair on complete current checkout
        shell: bash
        run: |
          git apply --include=ext/js/dictionary/term-record-opfs-store.js /tmp/record-evidence/repair.patch
          test "$(git hash-object ext/js/dictionary/term-record-opfs-store.js)" = 232f8c6359afe43b616355c5938cd3591bd825b2
          test "$(git hash-object test/term-record-shared-decode.test.js)" = f4f2dc04c40d73adc85af7f7e51c58d59e80d16f
          npx eslint ext/js/dictionary/term-record-opfs-store.js test/term-record-shared-decode.test.js
          npm run test:ts
          npm run test:unit -- --reporter=json --outputFile=/tmp/record-evidence/unit.json > /tmp/record-evidence/unit.log 2>&1
          npm run test:unit:options
          npm run test:build
          git diff --check
      - name: Publish clean product branch
        shell: bash
        run: |
          git switch -c fix/record-shared-decoder-constructor-20260926
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ext/js/dictionary/term-record-opfs-store.js test/term-record-shared-decode.test.js
          git commit -m 'fix(storage): decode shared record views without global constructor'
          git diff HEAD^ --name-only > /tmp/record-evidence/changed-files.txt
          test "$(wc -l < /tmp/record-evidence/changed-files.txt)" = 2
          git rev-parse HEAD > /tmp/record-evidence/head.txt
          git push origin HEAD:refs/heads/fix/record-shared-decoder-constructor-20260926
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carry-on-record-decoder-qualification
          path: /tmp/record-evidence
          retention-days: 14
