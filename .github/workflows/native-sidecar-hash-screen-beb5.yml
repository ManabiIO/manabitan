name: Native sidecar hash component screen 20261128 beb5

on:
  push:
    branches: ['perf/native-sidecar-hash-20261128-beb5']
    paths:
      - '.github/workflows/native-sidecar-hash-screen-beb5.yml'
      - 'dev/perf/native-sidecar-hash-prototype/**'

permissions:
  contents: read

jobs:
  screen:
    name: Sidecar XXH32 (${{ matrix.dictionary }})
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      MANABITAN_CLANG: /usr/bin/clang-21
      MANABITAN_WASM_LD: /usr/bin/wasm-ld-21
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned native compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Reproduce all variants and check hash and admission invariants
        shell: bash
        run: |
          set -euo pipefail
          prototype="$GITHUB_WORKSPACE/dev/perf/native-sidecar-hash-prototype"
          evidence="$GITHUB_WORKSPACE/builds/perf/native-sidecar-hash-screen-beb5/$PERF_DICTIONARY"
          mkdir -p "$evidence" "$RUNNER_TEMP/hash-current"
          git rev-parse HEAD > "$evidence/source-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/source-tree.txt"
          node dev/perf/host-environment.js > "$evidence/host.json"
          cp "$prototype/build.mjs" "$prototype/xxh32-stream.c" "$RUNNER_TEMP/hash-current/"
          node "$RUNNER_TEMP/hash-current/build.mjs" > "$evidence/build-scalar.json"
          node "$RUNNER_TEMP/hash-current/build.mjs" --simd > "$evidence/build-simd.json"
          cmp "$prototype/xxh32-stream.wasm" "$RUNNER_TEMP/hash-current/xxh32-stream.wasm"
          cmp "$prototype/xxh32-stream-simd.wasm" "$RUNNER_TEMP/hash-current/xxh32-stream-simd.wasm"
          for variant in scalar-global scalar-local; do
            mkdir -p "$RUNNER_TEMP/hash-$variant"
            cp "$prototype/build.mjs" "$prototype/trials/$variant/xxh32-stream.c" "$RUNNER_TEMP/hash-$variant/"
            node "$RUNNER_TEMP/hash-$variant/build.mjs" > "$evidence/build-$variant.json"
            cmp "$prototype/trials/$variant/xxh32-stream.wasm" "$RUNNER_TEMP/hash-$variant/xxh32-stream.wasm"
            node "$prototype/verify-native.mjs" "$RUNNER_TEMP/hash-$variant/xxh32-stream.wasm" "$evidence/vectors-$variant.json"
          done
          node "$prototype/verify-native.mjs" "$prototype/xxh32-stream.wasm" "$evidence/vectors-scalar.json"
          node "$prototype/verify-native.mjs" "$prototype/xxh32-stream-simd.wasm" "$evidence/vectors-simd.json"
          node "$prototype/verify-admission.mjs" "$prototype/native-checksum.mjs" "$prototype/xxh32-stream-simd.wasm" "$evidence/admission-simd.json"
      - name: Capture all current-policy groups from the selected locked fixture
        shell: bash
        run: |
          set -euo pipefail
          prototype="$GITHUB_WORKSPACE/dev/perf/native-sidecar-hash-prototype"
          evidence="$GITHUB_WORKSPACE/builds/perf/native-sidecar-hash-screen-beb5/$PERF_DICTIONARY"
          node --input-type=module -e 'import {ensureSelectedPinnedDictionaryCache} from "./dev/perf/dictionary-fixtures.js"; await ensureSelectedPinnedDictionaryCache("builds/e2e-dictionary-cache", [process.env.PERF_DICTIONARY])'
          node --max-old-space-size=2048 "$prototype/capture-first-bank.mjs" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/builds/e2e-dictionary-cache" \
            "$RUNNER_TEMP/hash-captures" --all-groups "$PERF_DICTIONARY" \
            2>&1 | tee "$evidence/capture.log"
          cp "$RUNNER_TEMP/hash-captures/manifest.json" "$evidence/capture-manifest.json"
      - name: Screen three fresh-process cohorts with copy-inclusive controls
        shell: bash
        run: |
          set -euo pipefail
          prototype="$GITHUB_WORKSPACE/dev/perf/native-sidecar-hash-prototype"
          evidence="$GITHUB_WORKSPACE/builds/perf/native-sidecar-hash-screen-beb5/$PERF_DICTIONARY"
          for cohort in 1 2 3; do
            node --max-old-space-size=2048 "$prototype/screen.mjs" \
              "$RUNNER_TEMP/hash-captures" "$evidence/simd-cohort-$cohort.json" \
              7 4 xxh32-stream-simd.wasm \
              2>&1 | tee "$evidence/simd-cohort-$cohort.log"
          done
      - name: Retain every observation, source identity and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-sidecar-hash-screen-beb5-${{ matrix.dictionary }}
          path: builds/perf/native-sidecar-hash-screen-beb5
          if-no-files-found: error
          retention-days: 14
