name: Early native media VNDB oracle 20261128 63aba8

on:
  push:
    branches: [study/early-native-media-oracle-20261128-63aba8]
    paths:
      - .github/workflows/early-native-media-oracle-20261128-63aba8.yml
      - builds/perf/20261128-early-native-media/replay.mjs
      - builds/perf/20261128-early-native-media/worker.mjs
      - builds/perf/20261128-early-native-media/receipt.py
      - builds/perf/20261128-early-native-media/protocol.json
      - builds/perf/20261128-early-native-media/seed-vndb.json
      - ext/js/dictionary/term-bank-wasm-parser.js
      - ext/js/dictionary/term-bank-wasm-parser-worker.js

permissions:
  contents: read

concurrency:
  group: early-native-media-oracle-63aba8-${{ github.ref }}
  cancel-in-progress: false

jobs:
  oracle:
    name: VNDB actual workers with fixed 2-CPU navigator hint
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      NODE_OPTIONS: --max-old-space-size=2048
      ARCHIVE: builds/perf/20261128-early-native-media
      EVIDENCE: builds/perf/20261128-early-native-media/hosted
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Prepare the exact control checkout
        run: |
          mkdir -p "$EVIDENCE"
          git fetch --no-tags origin "$BASELINE"
          git worktree add --detach "$RUNNER_TEMP/manabitan-oracle-control" "$BASELINE"
      - name: Install locked dependencies and normal generated libraries
        run: |
          npm ci 2>&1 | tee "$EVIDENCE/npm-ci.log"
          npm run build:libs 2>&1 | tee "$EVIDENCE/build-libs.log"
      - name: Verify frozen source, native asset, retained control and seed
        run: |
          python "$ARCHIVE/receipt.py" preflight \
            --baseline "$RUNNER_TEMP/manabitan-oracle-control" \
            --candidate "$GITHUB_WORKSPACE" \
            --evidence "$EVIDENCE"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fetch and verify the locked VNDB archive
        run: node dev/perf/prepare-dictionaries.js vndb 2>&1 | tee "$EVIDENCE/fixture.log"
      - name: Compare every VNDB group against the retained exact control
        id: oracle
        run: |
          node "$ARCHIVE/replay.mjs" \
            "$RUNNER_TEMP/manabitan-oracle-control" \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/builds/e2e-dictionary-cache" \
            "$GITHUB_WORKSPACE/$EVIDENCE/vndb.json" \
            vndb candidate 2>&1 | tee "$EVIDENCE/replay.log"
      - name: Record the outcome without replacing any observation
        if: always()
        env:
          ORACLE_OUTCOME: ${{ steps.oracle.outcome }}
        run: |
          python "$ARCHIVE/receipt.py" outcome \
            --baseline "$RUNNER_TEMP/manabitan-oracle-control" \
            --candidate "$GITHUB_WORKSPACE" \
            --evidence "$EVIDENCE" \
            --oracle-outcome "$ORACLE_OUTCOME"
      - name: Retain the full oracle report, identities and every failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: early-native-media-vndb-oracle-63aba8-${{ github.run_id }}
          path: builds/perf/20261128-early-native-media
          if-no-files-found: error
          retention-days: 14
