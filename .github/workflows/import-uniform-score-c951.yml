name: Uniform score key qualification c951

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/import-uniform-score-c951.yml'

permissions:
  contents: read

concurrency:
  group: import-uniform-score-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  qualify:
    if: github.head_ref == 'diagnostic/import-private-span-20261126-c951' && github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.dictionary }} (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    env:
      PERF_BASELINE: 0143e9596cd8f790d5e166d4ba6a2425fbc57f14
      PERF_CANDIDATE: 97273b91c94a6385800bc5179afc684c818a786f
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check the existing qualification receipt and memory validators
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fetch frozen product revisions
        run: git fetch --no-tags origin "$PERF_BASELINE" "$PERF_CANDIDATE"
      - name: Compare complete imports and separate memory observations
        run: |
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 6 \
            --expected-package-entry js/dictionary/term-record-opfs-store.js \
            --evidence builds/perf/uniform-score-keys
      - name: Retain all observations, exact packages, and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uniform-score-keys-${{ matrix.dictionary }}-${{ matrix.order }}-c951
          path: builds/perf/uniform-score-keys
          if-no-files-found: error
          retention-days: 14


