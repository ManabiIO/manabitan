name: Same-settings transport full qualification
on:
  push:
    branches: [verify/import-transport-compression-20260917]
    paths: [.github/workflows/import-message-batch-qualify-20260917.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      THREE_OUTPUT: builds/packet-qualify
      WORKER_CHECK_OUT: builds/packet-qualify/worker-check.json
      RECIPE_SHA: 36b272c2055a6ce913f8101f2f46a7a55ae2deb1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6f85c1fb8fec871eef76363ac0ba3c59aff78f7
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Record unchanged parent native code and actual package
        run: |
          mkdir -p builds/packet-qualify "$RUNNER_TEMP/packet-tools"
          npm run build:libs > builds/packet-qualify/parent-libs.log 2>&1
          cp ext/lib/term-bank-parser.wasm "$RUNNER_TEMP/parent-parser.wasm"
          cp ext/lib/zstd-wasm.js "$RUNNER_TEMP/parent-zstd.js"
          node dev/bin/build.js --target chrome-dev > builds/packet-qualify/parent-chrome.log 2>&1
          cp builds/manabitan-chrome-dev.zip "$RUNNER_TEMP/parent-chrome.zip"
          git fetch --depth=1 origin "$RECIPE_SHA"
          for file in candidates.patch.gz.b64 select-balanced.py abba.mjs prepare-message-batch.py finalize-message-batch.py type-message-batch.py test-message-batches.js packet-worker-check.mjs compare-test-types.py; do
            git show "FETCH_HEAD:dev/perf/import-transport-20260917/$file" > "$RUNNER_TEMP/packet-tools/$file"
          done
          git show FETCH_HEAD:.github/workflows/import-message-batch-screen-20260917.yml > "$RUNNER_TEMP/packet-tools/screen.yml"
          python3 - <<'PY'
          import os,yaml
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'packet-tools'
          steps=yaml.safe_load((p/'screen.yml').read_text())['jobs']['screen']['steps']
          for name,filename in [('Build and qualify exact source before timing','qualify.sh'),('Immutable full fixtures and unchanged production packages','fixtures.sh')]:
              script=next(s['run'] for s in steps if s.get('name')==name)
              (p/filename).write_text(script.replace('builds/packet-screen','builds/packet-qualify'))
          PY
          python3 "$RUNNER_TEMP/packet-tools/prepare-message-batch.py"
          python3 "$RUNNER_TEMP/packet-tools/finalize-message-batch.py"
          python3 "$RUNNER_TEMP/packet-tools/type-message-batch.py"
      - name: Complete source, actual worker, type and unit qualification
        run: |
          bash -e -o pipefail "$RUNNER_TEMP/packet-tools/qualify.sh"
          cmp "$RUNNER_TEMP/parent-parser.wasm" ext/lib/term-bank-parser.wasm
          cmp "$RUNNER_TEMP/parent-zstd.js" ext/lib/zstd-wasm.js
          npm run test:unit > builds/packet-qualify/unit.log 2>&1
          npm run test:unit:options > builds/packet-qualify/options.log 2>&1
          npm run test:build > builds/packet-qualify/build-plans.log 2>&1
          git diff --check
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Build real packages and compare package-member contents
        run: |
          bash -e -o pipefail "$RUNNER_TEMP/packet-tools/fixtures.sh"
          node dev/bin/build.js --target firefox-dev > builds/packet-qualify/firefox-build.log 2>&1
          python3 - <<'PY'
          import os,hashlib,json,zipfile
          from pathlib import Path
          a=Path(os.environ['RUNNER_TEMP'])/'parent-chrome.zip'; b=Path('builds/manabitan-chrome-dev.zip')
          with zipfile.ZipFile(a) as za,zipfile.ZipFile(b) as zb:
              aa={n:hashlib.sha256(za.read(n)).hexdigest() for n in za.namelist() if not n.endswith('/')}
              bb={n:hashlib.sha256(zb.read(n)).hexdigest() for n in zb.namelist() if not n.endswith('/')}
          result={'parentZipBytes':a.stat().st_size,'candidateZipBytes':b.stat().st_size,'changedExistingMembers':sorted(n for n in aa.keys()&bb.keys() if aa[n]!=bb[n]),'addedMembers':sorted(bb.keys()-aa.keys()),'removedMembers':sorted(aa.keys()-bb.keys()),'nativeBinariesByteIdentical':True}
          Path('builds/packet-qualify/package-cost.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Full strict browser imports and recovery with both algorithms
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{"experimentalGenericSpanCompression":true,"experimentalCompressionBatchMessages":true}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/packet-qualify/lifecycle.html
        run: |
          node test/chromium/extension-two-dictionary-import.e2e.js > builds/packet-qualify/lifecycle.log 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('builds/packet-qualify/lifecycle.json').read_text())
          assert r['status']=='success' and r['skippedVerification'] is False and len(r['phases'])>=80
          PY
          sha256sum -c builds/packet-qualify/qualified-source.sha256
          echo QUALIFIED > builds/packet-qualify/complete.txt
      - name: Retain all gates and exact final source
        if: always()
        run: |
          mkdir -p builds/packet-qualify/source
          git diff -- ext/js types/ext test/term-bank-experiments.test.js test/term-content-block-store.test.js test/zstd-term-content-pool.test.js > builds/packet-qualify/product.patch
          cp "$RUNNER_TEMP/packet-tools/"*.mjs "$RUNNER_TEMP/packet-tools/"*.py builds/packet-qualify/source/
          tar -czf builds/packet-qualify/source.tar.gz ext/js/dictionary/dictionary-database.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/term-content-block-store.js ext/js/dictionary/zstd-term-content.js ext/js/dictionary/zstd-term-content-compression-worker.js types/ext/dictionary-importer.d.ts test/term-bank-experiments.test.js test/term-content-block-store.test.js test/zstd-term-content-pool.test.js ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js test/chromium/extension-two-dictionary-import.e2e.js test/perf/dictionaries.lock.json 2>/dev/null || true
          git rev-parse HEAD > builds/packet-qualify/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packet-full-qualification
          path: builds/packet-qualify
          retention-days: 30
