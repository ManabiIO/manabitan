name: MDict deeper qualification
on:
  push:
    branches: [research/mdict-deeper-qualification-20260924]
    paths:
      - .github/workflows/mdict-deeper-qualification.yml
permissions:
  contents: read
jobs:
  source-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2185eeaac05efa0fd60eea49e3f00ce3e048aabe
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package exact installed dependencies
        run: |
          tar -czf "$RUNNER_TEMP/mdict-node-modules.tar.gz" node_modules
          sha256sum "$RUNNER_TEMP/mdict-node-modules.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: mdict-node-modules
          path: ${{ runner.temp }}/mdict-node-modules.tar.gz
          retention-days: 1
