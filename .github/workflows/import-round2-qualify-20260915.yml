name: Empty-string import exact-source qualification
on:
  push:
    branches: [verify/import-round2-20260915]
    paths: [.github/workflows/import-round2-qualify-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e1c02168dc5416a23bce328378e28810a5921901
          persist-credentials: false
      - name: Pin the corrected test and rejected source experiment
        run: |
          cp test/term-bank-empty-strings.test.js "$RUNNER_TEMP/boundary-test.js"
          cp dev/perf/round2-20260915/empty-strings.patch "$RUNNER_TEMP/empty-strings.patch"
          git fetch --depth=1 origin 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          cp "$RUNNER_TEMP/boundary-test.js" test/term-bank-empty-strings.test.js
          test "$(git hash-object test/term-bank-empty-strings.test.js)" = 252b59676d8e58af558c210885cd7d5dfd475673
          mkdir -p builds/round2-qualification
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Build baseline and verify boundary tests against unchanged implementation
        run: |
          npm run build:libs > builds/round2-qualification/parent-build.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-empty-strings.test.js 2>&1 | tee builds/round2-qualification/parent-tests.log
      - name: Build the exact benchmarked candidate
        run: |
          git apply --check "$RUNNER_TEMP/empty-strings.patch"
          git apply "$RUNNER_TEMP/empty-strings.patch"
          test "$(sha256sum ext/js/dictionary/wasm/term-bank-parser.c | cut -d ' ' -f 1)" = e3ba0849015956aa97f668795457863b8277dd6936921166ec633e363bcfb970
          npm run build:libs 2>&1 | tee builds/round2-qualification/candidate-build.log
          node --version > builds/round2-qualification/node.txt
          clang --version > builds/round2-qualification/compiler.txt
      - name: Focused parser and boundary suites
        id: focused
        continue-on-error: true
        run: node node_modules/vitest/vitest.mjs run test/term-bank-empty-strings.test.js test/term-bank-wasm-parser.test.js test/term-bank-experiments.test.js test/term-bank-composite-state.test.js test/lookup-construction-experiments.test.js test/term-bank-parser-string-scan.test.js 2>&1 | tee builds/round2-qualification/focused.log
      - name: Full unit suite
        id: unit
        continue-on-error: true
        run: npm run test:unit 2>&1 | tee builds/round2-qualification/unit.log
      - name: Options suite
        id: options
        continue-on-error: true
        run: npm run test:unit:options 2>&1 | tee builds/round2-qualification/options.log
      - name: Strict typecheck projects
        id: types
        continue-on-error: true
        run: npm run test:ts 2>&1 | tee builds/round2-qualification/types.log
      - name: New test ESLint without rewriting
        id: lint
        continue-on-error: true
        run: node node_modules/eslint/bin/eslint.js test/term-bank-empty-strings.test.js 2>&1 | tee builds/round2-qualification/lint.log
      - name: All build plans and actual Chrome and Firefox development packages
        id: build
        continue-on-error: true
        run: |
          npm run test:build 2>&1 | tee builds/round2-qualification/build-plans.log
          node dev/bin/build.js --target chrome-dev 2>&1 | tee builds/round2-qualification/chrome-build.log
          node dev/bin/build.js --target firefox-dev 2>&1 | tee builds/round2-qualification/firefox-build.log
      - name: Record exact evidence and require all checks
        if: always()
        env:
          FOCUSED: ${{ steps.focused.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          OPTIONS: ${{ steps.options.outcome }}
          TYPES: ${{ steps.types.outcome }}
          LINT: ${{ steps.lint.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          mkdir -p builds/round2-qualification
          printf '%s\n' "focused=$FOCUSED unit=$UNIT options=$OPTIONS types=$TYPES lint=$LINT build=$BUILD" > builds/round2-qualification/outcomes.txt
          printf '%s\n' 'Performance replication failed; no publication or merge authorized by this workflow.' > builds/round2-qualification/decision.txt
          cp test/term-bank-empty-strings.test.js builds/round2-qualification/
          git diff 30ffb604e0a87f0aa252bd4331bc54668062b1e1 -- ext/js/dictionary/wasm/term-bank-parser.c > builds/round2-qualification/native.patch
          test "$(git hash-object test/term-bank-empty-strings.test.js)" = 252b59676d8e58af558c210885cd7d5dfd475673
          test "$FOCUSED/$UNIT/$OPTIONS/$TYPES/$LINT/$BUILD" = 'success/success/success/success/success/success'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round2-empty-string-qualification-final
          path: builds/round2-qualification
          retention-days: 30
