name: Import SAH-pool worker qualification

on:
  pull_request:
    # One prospective acquisition. Evidence follow-ups never replace the cohort.
    types: [opened]

permissions:
  contents: read

jobs:
  qualify:
    if: github.head_ref == 'perf/sqlite-sahpool-only-20261127' && github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.dictionary }} (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_CANDIDATE: ${{ github.event.pull_request.head.sha }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      PERF_EVIDENCE: builds/perf/sqlite-sahpool-only
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify receipt and observer checks
        run: |
          python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
          python -m unittest discover -s dev/perf -p 'test_sqlite_sahpool_diagnostics.py'
      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore locked dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Compare complete release imports with identical controls
        shell: bash
        run: |
          set -euo pipefail
          storage_policy=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            # Frozen run 45862169149 recorded 37 units on baseline0143 and #946.
            # See the Nov26 section of dev/perf/import-experiments-20260914.md.
            # Register exact37 prospectively here; older failed cohorts stay failed.
            # All file sizes must still match every A/B and control observation.
            storage_policy+=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" --initial-order "$PERF_ORDER" --pairs 12 \
            --expected-package-entry js/background/backend.js \
            --expected-package-entry js/background/offscreen.js \
            --expected-package-entry js/dictionary/dictionary-database.js \
            --expected-package-entry js/dictionary/dictionary-worker.js \
            "${storage_policy[@]}" --evidence "$PERF_EVIDENCE"
      - name: Check worker creation and first lookup separately
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python dev/perf/sqlite-sahpool-worker-diagnostics.py \
            --baseline-root "$PERF_EVIDENCE-sources/A" \
            --candidate-root "$PERF_EVIDENCE-sources/B" \
            --dictionary "$PERF_DICTIONARY" --order "$PERF_ORDER" \
            --output "$PERF_EVIDENCE/worker-diagnostics"
      - name: Preserve every observation, package, and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sqlite-sahpool-only-${{ matrix.dictionary }}-${{ matrix.order }}-779cf
          path: builds/perf/sqlite-sahpool-only
          if-no-files-found: error
          retention-days: 14
