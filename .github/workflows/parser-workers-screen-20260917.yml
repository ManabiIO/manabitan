name: Shared parser worker screen
on:
  push:
    branches: [verify/import-transport-compression-20260917]
    paths:
      - .github/workflows/parser-workers-screen-20260917.yml
      - dev/perf/parser-workers-20260917/**
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/parser-worker-screen
      RECIPE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e6f85c1fb8fec871eef76363ac0ba3c59aff78f7
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Apply only the bounded parser-worker experiments
        run: |
          mkdir -p "$RUNNER_TEMP/worker-tools" builds/parser-worker-screen
          git fetch --depth=1 origin "$RECIPE_SHA"
          for file in prepare.py make-driver.py; do
            git show "FETCH_HEAD:dev/perf/parser-workers-20260917/$file" > "$RUNNER_TEMP/worker-tools/$file"
          done
          git show "FETCH_HEAD:dev/perf/import-transport-20260917/abba.mjs" > "$RUNNER_TEMP/worker-tools/base-abba.mjs"
          python3 "$RUNNER_TEMP/worker-tools/prepare.py"
          python3 "$RUNNER_TEMP/worker-tools/make-driver.py" "$RUNNER_TEMP/worker-tools/base-abba.mjs" "$RUNNER_TEMP/worker-tools/worker-abba.mjs"
          git add -N test/term-bank-parser-worker-policy.test.js
          git diff --check
      - run: npm ci
      - name: Qualify policy and exact source before timing
        run: |
          npm run build:libs > builds/parser-worker-screen/libs.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/dictionary-importer.js test/term-bank-parser-worker-policy.test.js > builds/parser-worker-screen/lint.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/term-bank-wasm-parser.js --rule '@typescript-eslint/no-unused-vars: off' > builds/parser-worker-screen/parser-lint.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ext/js/dictionary/term-bank-wasm-parser.js')
          s=p.read_text()
          assert s.count('function decodeUtf8(bytes)') == 1
          assert s.count('decodeUtf8(') == 1
          Path('builds/parser-worker-screen/inherited-lint-note.txt').write_text('Current develop e6f85c1 already has one unused decodeUtf8 helper after #52; candidate lint disables only no-unused-vars for this already-existing helper.\n')
          PY
          node node_modules/vitest/vitest.mjs run test/term-bank-parser-worker-policy.test.js test/term-bank-experiments.test.js test/term-bank-composite-state.test.js > builds/parser-worker-screen/focused.log 2>&1
          npm run test:ts:main > builds/parser-worker-screen/types-main.log 2>&1
          npm run test:ts:dev > builds/parser-worker-screen/types-dev.log 2>&1
          set +e
          npm run test:ts:test > builds/parser-worker-screen/types-test.log 2>&1
          test_status=$?
          set -e
          test "$test_status" -ne 0
          python3 - <<'PY'
          from pathlib import Path
          text=Path('builds/parser-worker-screen/types-test.log').read_text()
          errors=[line for line in text.splitlines() if 'error TS' in line]
          expected=[
              "test/dictionary-importer-shared-buffer.test.js(22,20): error TS7006: Parameter 'bytes' implicitly has an 'any' type.",
              "test/dictionary-importer-shared-buffer.test.js(39,45): error TS2502: 'row' is referenced directly or indirectly in its own type annotation.",
          ]
          assert errors == expected, (errors, expected)
          assert 'term-bank-parser-worker-policy.test.js' not in text
          Path('builds/parser-worker-screen/inherited-type-note.txt').write_text('Candidate test typecheck has exactly the two known current-develop diagnostics and no parser-worker-policy diagnostics.\n')
          PY
          npm run test:ts:bench > builds/parser-worker-screen/types-bench.log 2>&1
          git diff --name-only | xargs sha256sum > builds/parser-worker-screen/qualified-source.sha256
          sha256sum ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js >> builds/parser-worker-screen/qualified-source.sha256
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare immutable full fixtures and exact browser package
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          h=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=h.read_text(); assert s.count('maxBuffer: 32 * 1024 * 1024')==2
          h.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/parser-worker-screen/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/parser-worker-screen/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
          sha256sum -c builds/parser-worker-screen/qualified-source.sha256
      - name: Serial two-block ABBA and interleaved same-binary controls
        run: |
          node "$RUNNER_TEMP/worker-tools/worker-abba.mjs" control,w3,w4 2 | tee builds/parser-worker-screen/abba.log
          sha256sum -c builds/parser-worker-screen/qualified-source.sha256
          echo SCREENED > builds/parser-worker-screen/complete.txt
      - name: Preserve all observations and exact source
        if: always()
        run: |
          mkdir -p builds/parser-worker-screen/source
          git diff -- ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/dictionary-importer.js types/ext/dictionary-importer.d.ts test/term-bank-parser-worker-policy.test.js > builds/parser-worker-screen/product.patch
          cp "$RUNNER_TEMP/worker-tools/"* builds/parser-worker-screen/source/ 2>/dev/null || true
          tar -czf builds/parser-worker-screen/source.tar.gz ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/dictionary-importer.js types/ext/dictionary-importer.d.ts test/term-bank-parser-worker-policy.test.js ext/lib/term-bank-parser.wasm ext/lib/zstd-wasm.js test/chromium/extension-two-dictionary-import.e2e.js test/perf/dictionaries.lock.json
          git rev-parse HEAD > builds/parser-worker-screen/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parser-worker-screen-${{ matrix.dictionary }}
          path: builds/parser-worker-screen
          retention-days: 30
