name: Full-buffer DEFLATE final read-only qualification
on:
  push:
    branches: [verify/import-radical-20260915]
    paths: [.github/workflows/radical-libdeflate-qualify-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 726c5b7444a1b3c131c90de356f8261ac2fe65a2
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Build the original baseline at the same path
        run: |
          mkdir -p builds/decoder-final
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          node dev/bin/build.js --target chrome-dev > builds/decoder-final/parent-build.log 2>&1
          cp builds/manabitan-chrome-dev.zip "$RUNNER_TEMP/parent.zip"
          cp ext/lib/term-bank-parser.wasm "$RUNNER_TEMP/parent.wasm"
      - name: Build the exact published candidate at the same path
        run: |
          git checkout --detach 726c5b7444a1b3c131c90de356f8261ac2fe65a2
          node dev/bin/build.js --target chrome-dev > builds/decoder-final/candidate-build.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import os,json,hashlib,zipfile
          root=Path.cwd();parent=Path(os.environ['RUNNER_TEMP'])/'parent.zip';candidate=root/'builds/manabitan-chrome-dev.zip'
          with zipfile.ZipFile(parent) as a,zipfile.ZipFile(candidate) as b:
              added=sorted(set(b.namelist())-set(a.namelist()))
              removed=sorted(set(a.namelist())-set(b.namelist()))
              changed=sorted(n for n in set(a.namelist())&set(b.namelist()) if a.read(n)!=b.read(n))
              assert removed==[]
              assert changed==['js/dictionary/wasm/term-bank-parser.c','lib/term-bank-parser.wasm'],changed
              assert all(n=='js/dictionary/wasm/term-bank-inflate.c' or n.startswith('js/dictionary/wasm/vendor/libdeflate/') for n in added),added
          wasm=root/'ext/lib/term-bank-parser.wasm';oldwasm=Path(os.environ['RUNNER_TEMP'])/'parent.wasm'
          result={'parentBytes':parent.stat().st_size,'candidateBytes':candidate.stat().st_size,'deltaBytes':candidate.stat().st_size-parent.stat().st_size,'parentWasmBytes':oldwasm.stat().st_size,'candidateWasmBytes':wasm.stat().st_size,'wasmDeltaBytes':wasm.stat().st_size-oldwasm.stat().st_size,'candidateWasmSha256':hashlib.sha256(wasm.read_bytes()).hexdigest(),'addedMembers':added,'changedMembers':changed,'removedMembers':removed,'sameBuildPath':True}
          Path('builds/decoder-final/package-comparison.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Exact-head tests and static checks
        run: |
          npm run test:unit 2>&1 | tee builds/decoder-final/unit.log
          npm run test:unit:options 2>&1 | tee builds/decoder-final/options.log
          npm run test:ts 2>&1 | tee builds/decoder-final/types.log
          node node_modules/eslint/bin/eslint.js dev/build-libs.js test/term-bank-inflater.test.js 2>&1 | tee builds/decoder-final/lint.log
          node node_modules/prettier/bin/prettier.cjs --check ext/js/dictionary/wasm/vendor/libdeflate/README.md 2>&1 | tee builds/decoder-final/docs.log
      - name: Recheck native portable decoder sanitizers
        run: |
          clang -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffunction-sections -fdata-sections -I. test/native/term-bank-inflater-sanitizer.c -Wl,--gc-sections -lz -o "$RUNNER_TEMP/inflater-test"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 "$RUNNER_TEMP/inflater-test" 2>&1 | tee builds/decoder-final/sanitizers.log
      - name: Assert unchanged source and record identity
        run: |
          git diff --check
          test -z "$(git status --porcelain)"
          git rev-parse HEAD 'HEAD^{tree}' > builds/decoder-final/source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libdeflate-final-readonly-qualification
          path: builds/decoder-final
          retention-days: 30
