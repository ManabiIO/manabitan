name: Frozen checksum import qualification 511a8

on:
  push:
    branches: ["perf/import-qualification-511a8-checksum-20261128"]
    paths:
      - ".github/workflows/import-qualification-511a8.yml"
      - "dev/perf/import-qualification-511a8.py"
      - "dev/perf/import-cohort-511a8.py"
      - "dev/perf/test_import_qualification_511a8.py"

permissions:
  contents: read

concurrency:
  group: import-qualification-511a8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      baseline: ${{ steps.plan.outputs.baseline }}
      candidate: ${{ steps.plan.outputs.candidate }}
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check prospective policy contracts
        run: python3 -m unittest discover -s dev/perf -p 'test_import_qualification_511a8.py'
      - id: plan
        name: Freeze source selection and cohort matrix
        run: python3 dev/perf/import-qualification-511a8.py plan >> "$GITHUB_OUTPUT"

  validate:
    needs: plan
    name: Candidate qualification (${{ matrix.suite }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, types, lint, build]
    env:
      PERF_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.candidate }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
      - name: Preserve candidate identity
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/qualification-gate-$PERF_SUITE"
          mkdir -p "$output"
          git rev-parse HEAD 'HEAD^{tree}' > "$output/source-identity.txt"
          sha256sum package-lock.json test/perf/dictionaries.lock.json > "$output/input-hashes.txt"
          node --version > "$output/node-version.txt"
      - name: Install locked dependencies and generated libraries
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/qualification-gate-$PERF_SUITE"
          npm ci 2>&1 | tee "$output/npm-ci.log"
          npm run build:libs 2>&1 | tee "$output/build-libs.log"
          npm run license-report:html 2>&1 | tee "$output/license-report.log"
      - name: Install the pinned native toolchain
        if: matrix.suite == 'build'
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/qualification-gate-$PERF_SUITE"
          sudo apt-get update 2>&1 | tee "$output/apt-update.log"
          sudo apt-get install -y --no-install-recommends clang-21 lld-21 2>&1 | tee "$output/apt-install.log"
      - name: Run the complete fixed validation lane
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/qualification-gate-$PERF_SUITE"
          case "$PERF_SUITE" in
            unit) npm run test:ci:unit 2>&1 | tee "$output/tests.log" ;;
            types) npm run test:ci:types 2>&1 | tee "$output/tests.log" ;;
            lint) npm run test:ci:lint 2>&1 | tee "$output/tests.log" ;;
            build)
              npm run build:dictionary-wasm -- --check 2>&1 | tee "$output/native-reproduction.log"
              npm run test:ci:build 2>&1 | tee "$output/build-plans.log"
              npm run build -- --target chrome 2>&1 | tee "$output/release-build.log"
              sha256sum builds/manabitan-chrome.zip > "$output/release-package.sha256"
              ;;
            *) exit 2 ;;
          esac
          git status --porcelain --untracked-files=normal > "$output/source-status.txt"
          test ! -s "$output/source-status.txt"
      - name: Preserve candidate validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-511a8-gate-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-gate-${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 14

  acquire:
    needs: [plan, validate]
    name: ${{ needs.plan.outputs.mode }} (${{ matrix.dictionary }}, ${{ matrix.initialOrder }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PERF_TOOLING_SHA: ${{ github.sha }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.initialOrder }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.baseline }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare setup evidence and exact measurement source
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/import-511a8-$PERF_DICTIONARY-$PERF_ORDER"
          echo "PERF_OUTPUT=$output" >> "$GITHUB_ENV"
          mkdir -p "$output-setup"
          git show "$PERF_TOOLING_SHA:dev/perf/import-qualification-511a8.py" > "$RUNNER_TEMP/import-qualification-511a8.py"
          git show "$PERF_TOOLING_SHA:dev/perf/import-cohort-511a8.py" > "$RUNNER_TEMP/import-cohort-511a8.py"
          git show "$PERF_TOOLING_SHA:.github/workflows/import-qualification-511a8.yml" > "$output-setup/workflow.yml"
          sha256sum "$RUNNER_TEMP/import-qualification-511a8.py" "$RUNNER_TEMP/import-cohort-511a8.py" > "$output-setup/driver.sha256"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
          cache: npm
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$PERF_OUTPUT-setup/npm-ci.log"
      - name: Install the dependency-pinned Chromium
        run: |
          set -euo pipefail
          node node_modules/playwright/cli.js install --with-deps chromium 2>&1 | tee "$PERF_OUTPUT-setup/chromium.log"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: import-511a8-${{ matrix.dictionary }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Acquire the fixed source-bound observations
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/import-qualification-511a8.py" run \
            --root "$GITHUB_WORKSPACE" --evidence "$PERF_OUTPUT" \
            --dictionary "$PERF_DICTIONARY" --initial-order "$PERF_ORDER" \
            --tooling-sha "$PERF_TOOLING_SHA" \
            2>&1 | tee "$PERF_OUTPUT-setup/acquisition.log"
      - name: Preserve raw results, manifests and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-511a8-${{ needs.plan.outputs.mode }}-${{ matrix.dictionary }}-${{ matrix.initialOrder }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PERF_OUTPUT }}-setup
            ${{ env.PERF_OUTPUT }}/*.json
            ${{ env.PERF_OUTPUT }}/*.log
            ${{ env.PERF_OUTPUT }}/measurement-source
            ${{ env.PERF_OUTPUT }}/baseline-policy
            ${{ env.PERF_OUTPUT }}/diagnostic
            ${{ env.PERF_OUTPUT }}/cohort
            !${{ env.PERF_OUTPUT }}/cohort/package-A.zip
            !${{ env.PERF_OUTPUT }}/cohort/package-B.zip
          if-no-files-found: error
          retention-days: 14
