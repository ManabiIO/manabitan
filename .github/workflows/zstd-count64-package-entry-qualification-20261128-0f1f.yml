name: Frozen Zstd count64 package-entry qualification 20261128 0f1f

on:
  push:
    branches: ['perf/zstd-count64-package-entry-qualification-20261128-0f1f']
    paths:
      - '.github/workflows/zstd-count64-package-entry-qualification-20261128-0f1f.yml'

permissions:
  contents: read

env:
  PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
  PERF_CANDIDATE: b150866ac6ce80e4b164f1b90ef2f03658791705

jobs:
  qualify:
    if: github.run_attempt == 1
    name: Zstd count64 package-entry / ${{ matrix.dictionary }} / ${{ matrix.order }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        order: [AB, BA]
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify unchanged qualification observer and receipts
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Install lockfile-pinned Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fetch both frozen product revisions
        run: git fetch --no-tags origin "$PERF_BASELINE" "$PERF_CANDIDATE"
      - name: Run complete imports, controls, and separate memory checks
        run: |
          qualification_extra=()
          if [ "$PERF_DICTIONARY" = 'vndb' ]; then
            qualification_extra+=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 12 \
            --expected-workers 3 \
            --expected-package-entry lib/zstd.wasm \
            "${qualification_extra[@]}" \
            --evidence builds/perf/zstd-count64-package-entry-20261128-0f1f
      - name: Retain every prescribed observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zstd-count64-package-entry-${{ matrix.dictionary }}-${{ matrix.order }}-20261128-0f1f
          path: builds/perf/zstd-count64-package-entry-20261128-0f1f
          if-no-files-found: error
          retention-days: 14
