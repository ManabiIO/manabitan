name: Import parser source dependency screen

on:
  push:
    branches: ['perf/parser-source-limits-20261127-b9cacc']
    paths:
      - '.github/workflows/import-parser-source-limits-b9cacc.yml'
      - 'ext/js/dictionary/term-bank-source-limits.js'
      - 'ext/js/dictionary/term-bank-source-pipeline.js'
      - 'ext/js/dictionary/term-bank-wasm-parser.js'
      - 'dev/perf/import-qualification-20261125-a7f7.py'
      - 'dev/perf/import-memory-20261125-a7f7/package_entries.py'
      - 'dev/perf/import-memory-20261125-a7f7/test_package_entries.py'

permissions:
  contents: read

jobs:
  validate:
    name: Validate parser source dependency extraction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test strict package deltas and observation protocol
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Lint the three product files
        run: npx eslint ext/js/dictionary/term-bank-source-limits.js ext/js/dictionary/term-bank-source-pipeline.js ext/js/dictionary/term-bank-wasm-parser.js
      - name: Run all unit tests
        run: npm run test:unit
      - name: Validate all extension build targets
        run: npm run test:build
      - name: Prove exact parser worker module graph reduction
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import posixpath
          import re
          import subprocess

          root = pathlib.Path.cwd()
          refs = {"baseline": "9e10d3b3fcf66d344ab31bc42c9b522fa5215da2", "candidate": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()}
          graphs = {}
          for label, ref in refs.items():
              files = {}
              def visit(name):
                  if name in files:
                      return
                  source = subprocess.check_output(["git", "show", f"{ref}:{name}"])
                  imports = [
                      posixpath.normpath(posixpath.join(posixpath.dirname(name), match.group(1)))
                      for match in re.finditer(r"^import\s[\s\S]*?\sfrom\s+['\"]([^'\"]+)['\"];", source.decode(), re.MULTILINE)
                      if match.group(1).startswith(".")
                  ]
                  files[name] = {"bytes": len(source), "sha256": hashlib.sha256(source).hexdigest(), "imports": imports}
                  for dependency in imports:
                      visit(dependency)
              visit("ext/js/dictionary/term-bank-wasm-parser-worker.js")
              graphs[label] = {"sha": ref, "fileCount": len(files), "sourceBytes": sum(item["bytes"] for item in files.values()), "files": files}
          removed = sorted(graphs["baseline"]["files"].keys() - graphs["candidate"]["files"].keys())
          added = sorted(graphs["candidate"]["files"].keys() - graphs["baseline"]["files"].keys())
          assert removed == ["ext/js/core/to-error.js", "ext/js/core/utilities.js", "ext/js/dictionary/term-bank-source-pipeline.js"], removed
          assert added == ["ext/js/dictionary/term-bank-source-limits.js"], added
          assert graphs["baseline"]["fileCount"] == 23 and graphs["candidate"]["fileCount"] == 21
          assert graphs["baseline"]["sourceBytes"] == 444650 and graphs["candidate"]["sourceBytes"] == 384516
          report = {"scope": "Static JavaScript dependency graph bytes; not elapsed-time or memory evidence", "graphs": graphs, "removed": removed, "added": added, "removedSourceBytes": graphs["baseline"]["sourceBytes"] - graphs["candidate"]["sourceBytes"]}
          output = root / "builds/perf/parser-source-limits-graph.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps({**{label: {key: value for key, value in graph.items() if key != "files"} for label, graph in graphs.items()}, "removed": removed, "added": added, "removedSourceBytes": report["removedSourceBytes"]}, indent=2))
          PY
      - name: Retain exact module graph evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-source-limits-graph-b9cacc
          path: builds/perf/parser-source-limits-graph.json
          if-no-files-found: warn
          retention-days: 90
  qualify:
    needs: validate
    name: ${{ matrix.dictionary }} (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_CANDIDATE: ${{ github.sha }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check the unchanged observation protocol
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Compare imports with independent order reversal and identical-code controls
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          allocation_policy=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            # Current develop produces a 37-unit active SAH file. Register that
            # source-specific expectation before acquiring this new cohort;
            # historical receipts keep their own 129-131-unit expectation.
            allocation_policy=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 6 \
            --expected-package-entry js/dictionary/term-bank-source-pipeline.js \
            --expected-package-entry js/dictionary/term-bank-wasm-parser.js \
            --expected-added-package-entry js/dictionary/term-bank-source-limits.js \
            "${allocation_policy[@]}" \
            --evidence "builds/perf/parser-source-limits-$PERF_DICTIONARY-$PERF_ORDER"
      - name: Print source identities, every observation, analysis, and failure context
        if: always()
        env:
          EVIDENCE_DIR: builds/perf/parser-source-limits-${{ matrix.dictionary }}-${{ matrix.order }}
          QUALIFICATION_OUTCOME: ${{ steps.compare.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          print(json.dumps({"baseline": os.environ["PERF_BASELINE"], "candidate": os.environ["PERF_CANDIDATE"], "dictionary": os.environ["PERF_DICTIONARY"], "order": os.environ["PERF_ORDER"], "outcome": os.environ["QUALIFICATION_OUTCOME"], "evidence": str(root)}, indent=2))
          for name in ("registered-plan.json", "source-identities.json", "analysis.json", "observations.json", "memory/memory-comparison.json", "memory/memory-audit.json", "memory/memory-audit-failure.json", "memory/semantic-failures.json"):
              path = root / name
              if not path.is_file():
                  print(f"{name}: unavailable")
                  continue
              try:
                  data = json.loads(path.read_text())
                  if name == "source-identities.json":
                      data = {**{key: value for key, value in data.items() if key != "arms"}, "arms": {arm: {key: value for key, value in identity.items() if key != "entries"} for arm, identity in data["arms"].items()}}
                  print(f"{name}:")
                  print(json.dumps(data, indent=2, sort_keys=True))
              except Exception as error:
                  print(f"{name}: {type(error).__name__}: {error}")
          if os.environ["QUALIFICATION_OUTCOME"] != "success":
              logs = sorted(root.rglob("*.log"), key=lambda path: path.stat().st_mtime) if root.exists() else []
              for path in logs[-5:]:
                  print(f"Failure context: {path.relative_to(root)} (last 40 lines)")
                  lines = path.read_text(errors="replace").splitlines()
                  print("\n".join(lines[-40:])[-12000:])
          PY
      - name: Retain all observations, separate memory runs, and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-source-limits-${{ matrix.dictionary }}-${{ matrix.order }}-b9cacc
          path: builds/perf/parser-source-limits-${{ matrix.dictionary }}-${{ matrix.order }}
          if-no-files-found: error
          retention-days: 90
