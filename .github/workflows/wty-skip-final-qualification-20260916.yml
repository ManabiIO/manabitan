name: WTY bypass final source qualification
on:
  push:
    branches: [verify/wty-import-abba-20260916]
    paths: [.github/workflows/wty-skip-final-qualification-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-en-en-21b1b22-c0a1b7ee-v1
      - name: Exact product tree and test annotation correction
        run: |
          mkdir -p "$RUNNER_TEMP/wty-tools" builds/wty-final
          cp dev/perf/wty-round2/apply-skip.py dev/perf/wty-round2/skip-tests.txt dev/perf/wty-abba-20260916/prepare.py dev/perf/wty-abba-20260916/corpus-parity.mjs "$RUNNER_TEMP/wty-tools/"
          git fetch --depth=1 origin f8f868903c4733f6017d479f65b9600a583bedb2
          git checkout --detach FETCH_HEAD
          python3 "$RUNNER_TEMP/wty-tools/apply-skip.py"
          cp "$RUNNER_TEMP/wty-tools/skip-tests.txt" test/term-bank-skip-fused-probe.test.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/term-bank-skip-fused-probe.test.js')
          s=p.read_text()
          s=s.replace('/** @param {number} index @returns {number[]} */','/**\n     * @param {number} index\n     * @returns {number[]}\n     */')
          s=s.replace('/** @param {string} expression @param {unknown[]} [glossary] @returns {unknown[]} */','/**\n * @param {string} expression\n * @param {unknown[]} [glossary]\n * @returns {unknown[]}\n */')
          p.write_text(s)
          PY
      - run: npm ci
      - name: Focused tests, full unit suite, types and actual packages
        run: |
          npm run build:libs > builds/wty-final/libs.log 2>&1
          node node_modules/eslint/bin/eslint.js --fix test/term-bank-skip-fused-probe.test.js > builds/wty-final/test-format.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js test/term-bank-skip-fused-probe.test.js > builds/wty-final/changed-lint.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-skip-fused-probe.test.js test/term-bank-experiments.test.js test/term-bank-wasm-parser.test.js 2>&1 | tee builds/wty-final/focused.log
          npm run test:unit 2>&1 | tee builds/wty-final/unit.log
          npm run test:unit:options 2>&1 | tee builds/wty-final/options.log
          npm run test:ts 2>&1 | tee builds/wty-final/types.log
          npm run test:build 2>&1 | tee builds/wty-final/build-plans.log
          node dev/bin/build.js --target chrome-dev > builds/wty-final/chrome.log 2>&1
          node dev/bin/build.js --target firefox-dev > builds/wty-final/firefox.log 2>&1
      - name: Freeze qualified product-only patch before modifying test harness
        run: |
          git add ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js types/ext/dictionary-importer.d.ts test/term-bank-skip-fused-probe.test.js
          git diff --cached --check
          git diff --cached --binary > builds/wty-final/product.patch
          sha256sum ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js types/ext/dictionary-importer.d.ts test/term-bank-skip-fused-probe.test.js ext/lib/term-bank-parser.wasm > builds/wty-final/product.sha256
          cp test/term-bank-skip-fused-probe.test.js builds/wty-final/
      - name: Full pinned WTY parity with an eligible fused probe in the reference arm
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          tools=Path(os.environ['RUNNER_TEMP'])/'wty-tools'
          p=tools/'prepare.py'
          p.write_text(p.read_text().split('# Common correctness prerequisite')[0])
          PY
          python3 "$RUNNER_TEMP/wty-tools/prepare.py"
          cp "$RUNNER_TEMP/wty-tools/corpus-parity.mjs" test/perf/wty-qualification-parity.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/perf/wty-qualification-parity.mjs')
          s=p.read_text().replace('parseTermBankWithWasmColumnChunks([bytes],','parseTermBankWithWasmColumnChunks([bytes, new Uint8Array([91,93])],')
          s=s.replace('emitContentSlab: true,','emitContentSlab: true, emitTermByteLists: false,')
          s=s.replace('assert.equal(candidate.rows, baseline.rows, filename)', "if (baseline.rows > 0) { assert.equal(baseline.profile.fusedParseAttempts, 1, filename) }\n        assert.equal(candidate.profile.fusedParseAttempts, 0, filename)\n        assert.equal(candidate.rows, baseline.rows, filename)")
          p.write_text(s)
          p=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=p.read_text()
          old="const {stdout} = await execFileAsync('unzip', ['-p', zipPath, banks[bankIndex]], {maxBuffer: 32 * 1024 * 1024});"
          assert s.count(old)==1
          p.write_text(s.replace(old,old.replace('32 * 1024','128 * 1024')))
          PY
          node test/perf/wty-qualification-parity.mjs '{"experimentalSkipFusedProbe":true}' builds/wty-final/parity 2>&1 | tee builds/wty-final/parity.log
      - name: Full strict Chromium lifecycle with the bypass enabled
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{"experimentalSkipFusedProbe":true}'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/wty-final/lifecycle.html
        run: |
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node test/chromium/extension-two-dictionary-import.e2e.js 2>&1 | tee builds/wty-final/lifecycle.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('builds/wty-final/lifecycle.json').read_text())
          assert r['status']=='success' and r['skippedVerification'] is False and len(r['phases'])>=80
          PY
          sha256sum -c builds/wty-final/product.sha256
          printf '%s\n' 'Qualification completed; product inputs unchanged' > builds/wty-final/COMPLETE
      - name: Retain sources and failure evidence
        if: always()
        run: |
          mkdir -p builds/wty-final
          cp test/term-bank-skip-fused-probe.test.js builds/wty-final/
          git diff --cached --binary > builds/wty-final/staged.patch
          if test -f test/perf/wty-qualification-parity.mjs; then cp test/perf/wty-qualification-parity.mjs builds/wty-final/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wty-skip-final-qualification
          path: builds/wty-final
          retention-days: 30
