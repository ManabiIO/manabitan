name: Guarded glossary exact parent comparison
on:
  push:
    branches: [research/import-jitendex-jmdict-20260919]
    paths: [.github/workflows/import-jj-guarded-source-fixed-20260919.yml]
permissions:
  contents: read
jobs:
  source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jitendex, jmdict]
    env:
      MANABITAN_CLANG: clang-18
      BASE: 54ac62a39386459b7822fc644e5a1a6b1a619619
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reconstruct clean source and correct the package-member expectation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recipes"
          cp dev/perf/apply-guarded-glossary.py dev/perf/guarded-glossary-20260919.patch dev/perf/guarded-source-cohort.py "$RUNNER_TEMP/recipes/"
          git fetch --depth=1 origin "$BASE"
          git checkout --detach "$BASE"
          cp "$RUNNER_TEMP/recipes/"* dev/perf/
          python dev/perf/apply-guarded-glossary.py
          python - <<'PY'
          from pathlib import Path
          p=Path('dev/perf/guarded-source-cohort.py');s=p.read_text()
          old="assert set(changed)=={'lib/term-bank-parser.wasm','js/dictionary/term-bank-experiments.js'},changed"
          new="assert set(changed)=={'lib/term-bank-parser.wasm','js/dictionary/term-bank-experiments.js','js/dictionary/wasm/term-bank-parser.c'},changed"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('builds/e2e-dictionary-cache');"
      - name: Fixed source controls with original full imports
        env:
          DICTIONARY: ${{ matrix.dictionary }}
        run: python dev/perf/guarded-source-cohort.py --dictionary "$DICTIONARY" --out "$RUNNER_TEMP/guarded-source"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarded-source-fixed-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/guarded-source
          retention-days: 30
          if-no-files-found: error
