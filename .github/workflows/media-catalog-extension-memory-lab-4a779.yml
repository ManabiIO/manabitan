name: Extension media worker memory experiment 4a779

on:
  push:
    branches: [perf/media-extension-memory-lab-20261128-4a779]

permissions:
  contents: read

concurrency:
  group: media-extension-memory-lab-4a779-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_PRODUCT_CANDIDATE: 931eff9fb194df34b67cb4f5f952f437aa8c084b
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the same full Chromium binary used by the qualifier
        run: npx playwright install --with-deps chromium
      - name: Restore pinned archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Build isolated unchanged production packages
        run: |
          set -euo pipefail
          mkdir -p builds/perf/media-catalog-extension-memory
          git diff --quiet "$PERF_PRODUCT_CANDIDATE" "$GITHUB_SHA" -- ext dev/data/dictionary-wasm test
          node dev/perf/prepare-dictionaries.js vndb
          git worktree add --detach "$RUNNER_TEMP/media-extension-baseline" "$PERF_BASELINE"
          python - <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'node_modules'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'media-extension-baseline' / 'node_modules'
          shutil.copytree(source, target, copy_function=os.link, symlinks=True)
          PY
          (
            cd "$RUNNER_TEMP/media-extension-baseline"
            npm run build:libs
            npm run license-report:html
            npm run build -- --target chrome
          ) 2>&1 | tee builds/perf/media-catalog-extension-memory/build-baseline.log
          npm run build -- --target chrome 2>&1 | tee builds/perf/media-catalog-extension-memory/build-candidate.log
      - name: Qualify every payload and measure retained extension-worker memory
        run: |
          set -euo pipefail
          node --expose-gc .github/scripts/media-catalog-parity.mjs \
            --baseline "$RUNNER_TEMP/media-extension-baseline" --candidate "$GITHUB_WORKSPACE" \
            --archive builds/e2e-dictionary-cache/vndb_characters_by_bee.zip \
            --out builds/perf/media-catalog-extension-memory/node \
            2>&1 | tee builds/perf/media-catalog-extension-memory/node.log
          node .github/scripts/media-catalog-extension-heap.mjs \
            --baseline "$RUNNER_TEMP/media-extension-baseline" --candidate "$GITHUB_WORKSPACE" \
            --baseline-package "$RUNNER_TEMP/media-extension-baseline/builds/manabitan-chrome.zip" \
            --candidate-package builds/manabitan-chrome.zip \
            --archive builds/e2e-dictionary-cache/vndb_characters_by_bee.zip \
            --parity builds/perf/media-catalog-extension-memory/node/results.json \
            --out builds/perf/media-catalog-extension-memory/chromium \
            2>&1 | tee builds/perf/media-catalog-extension-memory/chromium.log
      - name: Preserve all complete and partial observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: media-catalog-extension-memory
          path: builds/perf/media-catalog-extension-memory
          if-no-files-found: error
          retention-days: 14
