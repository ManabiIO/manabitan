name: JMdict raw ZIP component qualification

on:
  push:
    branches: ['perf/jmdict-qualification-20261119-34f1-raw-zip-components']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-zip-components:
    name: Raw ZIP payload copies (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install matching browser
        run: npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Restore pinned source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Prepare frozen source checkouts
        shell: bash
        run: |
          set -euo pipefail
          comparison_root=$(mktemp -d "$RUNNER_TEMP/raw-zip-comparison.XXXXXX")
          git worktree add --detach "$comparison_root/baseline" d829f5b6e6a75ee8859d38d537d224ec33c4930e
          git worktree add --detach "$comparison_root/candidate" 98b25cbce108b7c63ffe318f06186dadd26d476c
          cmp package-lock.json "$comparison_root/baseline/package-lock.json"
          cmp package-lock.json "$comparison_root/candidate/package-lock.json"
          cmp ext/js/dictionary/term-bank-source-pipeline.js "$comparison_root/candidate/ext/js/dictionary/term-bank-source-pipeline.js"
          node ./dev/perf/prepare-dictionaries.js
          printf 'PERF_COMPARISON_ROOT=%s\n' "$comparison_root" >> "$GITHUB_ENV"
      - name: Measure actual reader modules and verify all payloads
        run: >-
          node dev/perf/raw-zip-copy-screen.js
          --baseline "$PERF_COMPARISON_ROOT/baseline"
          --candidate "$PERF_COMPARISON_ROOT/candidate"
          --zip builds/e2e-dictionary-cache/JMdict.zip
          --browser "${{ matrix.browser }}"
          --output "builds/perf/raw-zip-component/${{ matrix.browser }}.json"
      - name: Preserve complete or failed observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: raw-zip-component-${{ matrix.browser }}
          path: builds/perf/raw-zip-component
          if-no-files-found: error
          retention-days: 30
