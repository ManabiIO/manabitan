# Research-only replacement for the existing dispatchable workflow on this branch.
# Install the adapters, sampler and cohort at dev/perf/research-midcore/ before dispatch.
name: Benchmarks (Manual)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Retained pilot only; no production qualification implied'
        required: true
        default: pilot
        type: choice
        options: [pilot]

permissions:
  contents: read

jobs:
  midcore-pilot:
    name: Midcore pilot (${{ matrix.browser }}, ${{ matrix.dictionary }}, ${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        dictionary: [jmdict, jitendex]
        mode: [timing, memory]
    env:
      MANABITAN_CLANG: /usr/bin/clang-18
      MIDCORE_BROWSER: ${{ matrix.browser }}
      MIDCORE_DICTIONARY: ${{ matrix.dictionary }}
      MIDCORE_MODE: ${{ matrix.mode }}
      MIDCORE_SOURCE_ROOT: ${{ github.workspace }}
      MIDCORE_EVIDENCE: ${{ github.workspace }}/builds/midcore-evidence
      MIDCORE_CACHE: ${{ github.workspace }}/builds/e2e-dictionary-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Initialize retained evidence and verify compiler
        run: |
          set -euo pipefail
          mkdir -p "$MIDCORE_EVIDENCE"
          test -x "$MANABITAN_CLANG"
          "$MANABITAN_CLANG" --version | tee "$MIDCORE_EVIDENCE/compiler-version.txt"
          git rev-parse HEAD > "$MIDCORE_EVIDENCE/source-head.txt"
          git rev-parse 'HEAD^{tree}' > "$MIDCORE_EVIDENCE/source-tree.txt"
          git rev-parse HEAD:ext > "$MIDCORE_EVIDENCE/product-source-tree.txt"
          task_root=$(mktemp -d "$RUNNER_TEMP/midcore-pilot.XXXXXX")
          mkdir "$task_root/adapter" "$task_root/extension"
          printf 'MIDCORE_TASK_ROOT=%s\nMIDCORE_PACKAGE_DIR=%s\n' "$task_root" "$task_root/extension" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Require real four-CPU Linux pilot host
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import os from 'node:os';
          import fs from 'node:fs';
          assert.equal(process.platform, 'linux');
          assert.equal(os.cpus().length, 4, 'Do not emulate navigator eligibility');
          assert.equal(Number(process.versions.node.split('.')[0]), 22);
          fs.writeFileSync(process.env.MIDCORE_EVIDENCE + '/host-preflight.json', JSON.stringify({node: process.version, cpuCount: os.cpus().length, availableParallelism: os.availableParallelism(), memoryBytes: os.totalmem(), load: os.loadavg()}, null, 2));
          NODE
      - name: Build one immutable product package for both arms
        run: |
          set -euo pipefail
          flock -x "$RUNNER_TEMP/manabitan-midcore.lock" bash <<'BASH'
          set -euo pipefail
          npm ci
          npm run build:libs
          target=chrome
          if [[ "$MIDCORE_BROWSER" == firefox ]]; then target=firefox-dev; fi
          npm run build -- --target "$target"
          sha256sum "builds/manabitan-$target.zip" ext/lib/term-bank-parser.wasm > "$MIDCORE_EVIDENCE/build-pins.txt"
          BASH
      - name: Verify sampler with synthetic tests and actual Linux process tree
        run: |
          set -euo pipefail
          flock -x "$RUNNER_TEMP/manabitan-midcore.lock" node --test dev/perf/research-midcore/process-tree-memory.test.mjs > "$MIDCORE_EVIDENCE/sampler-tests.log"
          MIDCORE_SMOKE_REPORT="$MIDCORE_EVIDENCE/sampler-linux-smoke.json" flock -x "$RUNNER_TEMP/manabitan-midcore.lock" node dev/perf/research-midcore/sampler-linux-smoke.mjs
      - name: Install pinned Playwright Chromium
        if: matrix.browser == 'chromium'
        run: npx playwright install --with-deps chromium
      - name: Install and identify Firefox Developer Edition
        if: matrix.browser == 'firefox'
        run: |
          set -euo pipefail
          firefox_root=$(mktemp -d "$RUNNER_TEMP/midcore-firefox.XXXXXX")
          curl -fL --retry 2 'https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=linux64&lang=en-US' -o "$firefox_root/download.archive"
          sha256sum "$firefox_root/download.archive" > "$MIDCORE_EVIDENCE/firefox-download-sha256.txt"
          tar -xf "$firefox_root/download.archive" -C "$firefox_root"
          "$firefox_root/firefox/firefox" --version > "$MIDCORE_EVIDENCE/firefox-version.txt"
          sha256sum "$firefox_root/firefox/firefox" > "$MIDCORE_EVIDENCE/firefox-executable-sha256.txt"
          printf 'MANABITAN_FIREFOX_BINARY=%s\n' "$firefox_root/firefox/firefox" >> "$GITHUB_ENV"
      - name: Restore locked dictionary archive cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: midcore-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Verify or fetch exact locked fixture bytes without cleanup
        run: MIDCORE_FIXTURE_RECEIPT="$MIDCORE_EVIDENCE/fixture-pins.json" node dev/perf/research-midcore/prepare-fixtures.mjs
      - name: Extract immutable package and generate isolated adapter
        shell: bash
        run: |
          set -euo pipefail
          target=chrome
          if [[ "$MIDCORE_BROWSER" == firefox ]]; then target=firefox-dev; fi
          export MIDCORE_PACKAGE="$GITHUB_WORKSPACE/builds/manabitan-$target.zip"
          printf 'MIDCORE_PACKAGE=%s\n' "$MIDCORE_PACKAGE" >> "$GITHUB_ENV"
          python3 - <<'PYTHON'
          import os, stat, zipfile
          from pathlib import Path
          root=Path(os.environ['MIDCORE_PACKAGE_DIR']).resolve(strict=True)
          with zipfile.ZipFile(os.environ['MIDCORE_PACKAGE']) as z:
            seen=set()
            for f in z.infolist():
              p=Path(f.filename)
              assert not p.is_absolute() and '..' not in p.parts and not stat.S_ISLNK(f.external_attr>>16)
              assert f.filename not in seen
              seen.add(f.filename)
            z.extractall(root)
          PYTHON
          if [[ "$MIDCORE_BROWSER" == chromium ]]; then
            adapter="$MIDCORE_TASK_ROOT/adapter/chromium.mjs"
            python3 dev/perf/research-midcore/generate_chromium_adapter.py "$GITHUB_WORKSPACE" "$adapter" --sampler "$GITHUB_WORKSPACE/dev/perf/research-midcore/process-tree-memory.mjs" > "$MIDCORE_EVIDENCE/adapter-generation.json"
          else
            adapter="$GITHUB_WORKSPACE/dev/perf/research-midcore/firefox-import-pilot.mjs"
          fi
          node --check "$adapter"
          printf 'MIDCORE_ADAPTER=%s\n' "$adapter" >> "$GITHUB_ENV"
      - name: Run serial paired pilot with fresh profiles
        env:
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_FIREFOX_HEADLESS: '1'
        run: |
          set -euo pipefail
          flock -x "$RUNNER_TEMP/manabitan-midcore.lock" node dev/perf/research-midcore/run-cohort.mjs
      - name: Preserve every observation including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: midcore-pilot-${{ matrix.browser }}-${{ matrix.dictionary }}-${{ matrix.mode }}
          path: builds/midcore-evidence
          if-no-files-found: error
          retention-days: 14
