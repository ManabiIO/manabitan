name: Independent Firefox unary radix guard
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firefox-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Ensure identical generated libraries
        run: npm run build:libs
      - name: Install Firefox Developer Edition
        run: |
          curl -fsSL "https://download.mozilla.org/?product=firefox-devedition-latest-ssl&os=linux64&lang=en-US" -o "$RUNNER_TEMP/firefox.tar.bz2"
          mkdir -p "$RUNNER_TEMP/firefox"
          tar -xf "$RUNNER_TEMP/firefox.tar.bz2" -C "$RUNNER_TEMP/firefox"
          echo "MANABITAN_FIREFOX_BINARY=$RUNNER_TEMP/firefox/firefox/firefox" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/prefix-firefox-dictionary-cache
          key: prefix-firefox-dictionaries-${{ matrix.dictionary }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - id: prepare
        run: python3 dev/perf/research-prefix-firefox/prepare.py '${{ matrix.dictionary }}'
      - name: Complete fixed guarded profiles
        run: python3 '${{ steps.prepare.outputs.tools }}/cohort.py'
      - name: Retain exact packages and all observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefix-firefox-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/prefix-firefox-guard-*/evidence/
          if-no-files-found: warn
          retention-days: 14
