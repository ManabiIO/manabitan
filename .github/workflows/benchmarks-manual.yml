name: Firefox JMdict source comparison

on:
  push:
    branches: ['perf/jmdict-qualification-20261119-34f1-firefox-raw-zip']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-import-comparison:
    name: Firefox complete JMdict imports
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Install pinned Firefox and geckodriver
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps firefox
          driver_dir=$(mktemp -d "$RUNNER_TEMP/geckodriver.XXXXXX")
          archive="$driver_dir/geckodriver.tar.gz"
          curl -fsSL https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz -o "$archive"
          printf '%s  %s\n' e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$driver_dir" geckodriver
          "$driver_dir/geckodriver" --version
          printf 'PERF_GECKODRIVER=%s\n' "$driver_dir/geckodriver" >> "$GITHUB_ENV"
      - name: Restore pinned source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Build both frozen release packages before timing
        shell: bash
        run: |
          set -euo pipefail
          comparison_root=$(mktemp -d "$RUNNER_TEMP/firefox-jmdict.XXXXXX")
          baseline="$comparison_root/baseline"
          candidate="$comparison_root/candidate"
          evidence="$comparison_root/evidence"
          mkdir -p "$evidence"
          git worktree add --detach "$baseline" d829f5b6e6a75ee8859d38d537d224ec33c4930e
          git worktree add --detach "$candidate" 98b25cbce108b7c63ffe318f06186dadd26d476c
          cmp package-lock.json "$baseline/package-lock.json"
          cmp package-lock.json "$candidate/package-lock.json"
          cmp test/perf/dictionaries.lock.json "$baseline/test/perf/dictionaries.lock.json"
          cmp test/perf/dictionaries.lock.json "$candidate/test/perf/dictionaries.lock.json"
          node dev/perf/prepare-dictionaries.js
          for source_root in "$baseline" "$candidate"; do
            (
              cd "$source_root"
              npm ci
              npm run build:libs
              npm run build -- --target firefox
            )
          done
          git -C "$baseline" rev-parse HEAD 'HEAD^{tree}' > "$evidence/baseline-source.txt"
          git -C "$candidate" rev-parse HEAD 'HEAD^{tree}' > "$evidence/candidate-source.txt"
          git rev-parse HEAD 'HEAD^{tree}' > "$evidence/harness-source.txt"
          sha256sum "$baseline/builds/manabitan-firefox.zip" "$candidate/builds/manabitan-firefox.zip" > "$evidence/package-sha256.txt"
          sha256sum test/firefox/jmdict-import-ab-benchmark.js test/e2e/import-timing.js package-lock.json test/perf/dictionaries.lock.json "$PERF_GECKODRIVER" > "$evidence/tooling-sha256.txt"
          printf 'PERF_BASELINE_ROOT=%s\nPERF_CANDIDATE_ROOT=%s\nPERF_EVIDENCE_ROOT=%s\n' "$baseline" "$candidate" "$evidence" >> "$GITHUB_ENV"
      - name: Verify Firefox capability and timing boundary
        run: >-
          node test/firefox/jmdict-import-ab-benchmark.js
          --baseline-package "$PERF_BASELINE_ROOT/builds/manabitan-firefox.zip"
          --candidate-package "$PERF_CANDIDATE_ROOT/builds/manabitan-firefox.zip"
          --zip builds/e2e-dictionary-cache/JMdict.zip
          --geckodriver "$PERF_GECKODRIVER"
          --output "$PERF_EVIDENCE_ROOT/smoke"
          --mode smoke
      - name: Run the fixed complete-import cohort
        run: >-
          node test/firefox/jmdict-import-ab-benchmark.js
          --baseline-package "$PERF_BASELINE_ROOT/builds/manabitan-firefox.zip"
          --candidate-package "$PERF_CANDIDATE_ROOT/builds/manabitan-firefox.zip"
          --zip builds/e2e-dictionary-cache/JMdict.zip
          --geckodriver "$PERF_GECKODRIVER"
          --output "$PERF_EVIDENCE_ROOT/cohort"
          --mode cohort
      - name: Preserve complete or failed observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firefox-jmdict-raw-zip-comparison
          path: ${{ env.PERF_EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30

  validate-driver:
    name: Validate Firefox benchmark driver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Driver syntax and lint
        run: |
          node --check test/firefox/jmdict-import-ab-benchmark.js
          node node_modules/eslint/bin/eslint.js test/firefox/jmdict-import-ab-benchmark.js
      - name: Existing test TypeScript contracts
        if: success() || failure()
        # The existing project excludes firefox/**/*.js; no new-driver type coverage is claimed.
        run: npm run test:ts:test
