name: JMdict experiment validation

on:
  push:
    branches: ['perf/jmdict-qualification-20261119-34f1-tooling']

permissions:
  contents: read

jobs:
  validate-candidate:
    name: Validate importer experiment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup
      - name: Unit regressions
        run: npm run test:unit -- --maxWorkers=2 --hookTimeout=60000
      - name: TypeScript contracts
        if: success() || failure()
        run: npm run test:ts
      - name: JavaScript lint
        if: success() || failure()
        run: npm run test:js
      - name: Build all targets
        if: success() || failure()
        run: npm run test:build
