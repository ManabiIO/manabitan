# Research only. Never merge this branch into develop.
name: Benchmarks (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-cold-owner:
    name: Cold canonical owner (${{ matrix.dictionary }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    env:
      MANABITAN_CLANG: /usr/bin/clang-18
      COLD_OWNER_DICTIONARY: ${{ matrix.dictionary }}
      COLD_OWNER_EVIDENCE: ${{ github.workspace }}/builds/canonical-cold-owner
      COLD_OWNER_CACHE: ${{ github.workspace }}/builds/e2e-dictionary-cache
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Initialize retained evidence and require actual four-CPU host
        run: |
          set -euo pipefail
          mkdir -p "$COLD_OWNER_EVIDENCE" "$COLD_OWNER_CACHE"
          test -x "$MANABITAN_CLANG"
          "$MANABITAN_CLANG" --version > "$COLD_OWNER_EVIDENCE/compiler-version.txt"
          git rev-parse HEAD > "$COLD_OWNER_EVIDENCE/research-head.txt"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import os from 'node:os';
          import fs from 'node:fs';
          assert.equal(process.platform, 'linux');
          assert.equal(os.cpus().length, 4);
          assert.equal(process.version, 'v22.22.0');
          fs.writeFileSync(process.env.COLD_OWNER_EVIDENCE + '/host.json', JSON.stringify({node:process.version,cpus:os.cpus(),availableParallelism:os.availableParallelism(),memoryBytes:os.totalmem(),load:os.loadavg()},null,2));
          NODE
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: canonical-cold-owner-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}-${{ matrix.dictionary }}-v1
          restore-keys: |
            midcore-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Verify helpers and execute the registered cold-process owner cohort
        run: |
          set -euo pipefail
          flock -x "$RUNNER_TEMP/manabitan-cold-owner.lock" bash <<'BASH'
          set -euo pipefail
          npm ci
          node --test dev/perf/research-canonical-cold/analysis.test.mjs
          node dev/perf/research-canonical-cold/cohort.mjs
          BASH
      - name: Summarize measured boundary and decision
        if: always()
        run: |
          node --input-type=module - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import fs from 'node:fs';
          const p=process.env.COLD_OWNER_EVIDENCE+'/cohort.json';
          console.log('Component only: fresh processes on actual four-CPU Linux; no browser/full-import acceptance.');
          if(fs.existsSync(p)){const r=JSON.parse(fs.readFileSync(p,'utf8'));console.log(JSON.stringify({status:r.status,completed:r.completed,observations:r.observations.length,analysis:r.analysis,error:r.error},null,2));}
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: canonical-cold-owner-${{ matrix.dictionary }}
          path: builds/canonical-cold-owner
          if-no-files-found: error
