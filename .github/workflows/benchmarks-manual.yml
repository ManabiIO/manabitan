name: Contained Fresh Phase Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase:
    name: ${{ matrix.variant }} / ${{ matrix.dictionary }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant: [wide, crc, colon]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/contained-dictionary-cache
          key: contained-dictionaries-${{ matrix.dictionary }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - run: npm ci
      - id: prepare
        run: python3 dev/perf/research-contained-fresh/prepare.py '${{ matrix.variant }}' '${{ matrix.dictionary }}'
      - name: Complete fixed cohorts
        run: python3 '${{ steps.prepare.outputs.tools }}/run.py'
      - name: Retain exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contained-fresh-${{ matrix.variant }}-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/contained-fresh-*/evidence/
          if-no-files-found: warn
          retention-days: 14
