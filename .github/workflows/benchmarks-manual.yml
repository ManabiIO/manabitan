name: Benchmarks (Manual)

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Manabitan develop commit to benchmark
        required: true
        type: string

permissions:
  contents: read

jobs:
  source-window:
    name: Source window (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [vndb, jmdict, jitendex]
    env:
      DICTIONARY: ${{ matrix.dictionary }}
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 4
      - uses: ./.github/actions/setup
      - run: npx playwright install chromium
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Build candidate and verify exact package difference
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASELINE_SHA" == "$(git rev-parse HEAD~3)" ]]
          candidate="$(git rev-parse HEAD^)"
          git diff --quiet "$candidate" HEAD -- ext test dev
          node ./dev/perf/prepare-dictionaries.js "$DICTIONARY"
          npm run build -- --target chrome
          evidence="$RUNNER_TEMP/source-window-evidence"
          mkdir -p "$evidence"
          printf '%s\n' "$candidate" > "$evidence/candidate-sha.txt"
          printf '%s\n' "$BASELINE_SHA" > "$evidence/baseline-sha.txt"
          entry=js/dictionary/term-bank-wasm-parser.js
          git show "$BASELINE_SHA:ext/$entry" > "$evidence/baseline-parser.js"
          git show "$candidate:ext/$entry" > "$evidence/candidate-parser.js"
          cp builds/manabitan-chrome.zip "$RUNNER_TEMP/candidate.zip"
          python3 - "$RUNNER_TEMP" "$evidence" "$entry" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          temp, evidence = map(pathlib.Path, sys.argv[1:3])
          entry = sys.argv[3]
          with zipfile.ZipFile(temp / 'candidate.zip') as candidate:
              assert candidate.read(entry) == (evidence / 'candidate-parser.js').read_bytes()
              with zipfile.ZipFile(temp / 'baseline.zip', 'w') as baseline:
                  for info in candidate.infolist():
                      data = (evidence / 'baseline-parser.js').read_bytes() if info.filename == entry else candidate.read(info)
                      baseline.writestr(info, data)
          hashes = {}
          for arm in ('baseline', 'candidate'):
              with zipfile.ZipFile(temp / f'{arm}.zip') as package:
                  hashes[arm] = {item.filename: hashlib.sha256(package.read(item)).hexdigest()
                                 for item in package.infolist() if not item.is_dir()}
          assert hashes['baseline'].keys() == hashes['candidate'].keys()
          assert [key for key in hashes['baseline'] if hashes['baseline'][key] != hashes['candidate'][key]] == [entry]
          (evidence / 'package-entries.json').write_text(json.dumps(hashes, indent=2))
          PY
          sha256sum "$RUNNER_TEMP/baseline.zip" "$RUNNER_TEMP/candidate.zip" > "$evidence/packages.sha256"
          printf 'PERF_EVIDENCE_ROOT=%s\n' "$evidence" >> "$GITHUB_ENV"
      - name: Compare on one host in both orders
        shell: bash
        run: |
          set -euo pipefail
          for observation in B1 A1 A5 C1 A2 B2 C2 A6 B3 A3 A4 B4; do
            case "$observation" in
              A*|C*) package=baseline ;;
              B*) package=candidate ;;
            esac
            media=sample
            if [[ "$observation" == A1 || "$observation" == B1 ]]; then media=all; fi
            cp "$RUNNER_TEMP/$package.zip" builds/manabitan-chrome.zip
            output="$PERF_EVIDENCE_ROOT/$observation"
            mkdir -p "$output"
            node dev/perf/host-environment.js > "$output/host-before.json"
            node dev/perf/import-benchmark.js "$DICTIONARY" --runs 1 --no-build --build-target chrome --media-check "$media" --output "$output"
          done
      - name: Preserve timing and correctness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-window-${{ matrix.dictionary }}
          path: ${{ env.PERF_EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 14
