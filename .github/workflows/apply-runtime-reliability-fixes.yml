# One-shot workflow; deletes itself and its patch script after validation.
name: Apply runtime reliability fixes

on:
  push:
    branches:
      - fix/runtime-reliability-20260914
    paths:
      - .github/workflows/apply-runtime-reliability-fixes.yml
      - dev/apply-runtime-reliability-fixes.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-reliability-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Apply reliability fixes
        run: python dev/apply-runtime-reliability-fixes.py
      - name: Run focused reliability tests
        run: npx vitest run test/runtime-reliability-regressions.test.js test/dictionary-worker-client.test.js test/offscreen-worker-recovery.test.js test/backend-lookup-refresh.test.js test/offscreen-proxy.test.js test/offscreen-import-response-port.test.js
      - name: Typecheck tests
        run: npm run test:ts:test
      - name: Typecheck main sources
        run: npm run test:ts:main
      - name: Commit fixes and remove one-shot files
        run: |
          rm .github/workflows/apply-runtime-reliability-fixes.yml
          rm dev/apply-runtime-reliability-fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ext/js/background/backend.js ext/js/background/offscreen-proxy.js ext/js/background/offscreen-dictionary-worker.js test/runtime-reliability-regressions.test.js .github/workflows/apply-runtime-reliability-fixes.yml dev/apply-runtime-reliability-fixes.py
          git commit -m 'Fix runtime reliability recovery paths'
          git push origin HEAD:fix/runtime-reliability-20260914
