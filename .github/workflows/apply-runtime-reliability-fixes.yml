name: Apply runtime reliability fixes

on:
  push:
    branches:
      - fix/runtime-reliability-20260914
    paths:
      - .github/workflows/apply-runtime-reliability-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/runtime-reliability-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Apply reliability fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1))

          backend = 'ext/js/background/backend.js'
          replace_once(
              backend,
              """        /** @type {?Promise<void>} */
              this._preparePromise = null;
              /** @type {import('core').DeferredPromiseDetails<void>} */
              const {promise, resolve, reject} = deferPromise();
""",
              """        /** @type {?Promise<void>} */
              this._preparePromise = null;
              /** @type {boolean} */
              this._prepareInternalSyncComplete = false;
              /** @type {import('core').DeferredPromiseDetails<void>} */
              const {promise, resolve, reject} = deferPromise();
""",
          )
          replace_once(
              backend,
              """    prepare() {
              if (this._preparePromise === null) {
                  const promise = this._prepareInternal();
                  promise.then(
                      () => {
                          this._isPrepared = true;
                          this._prepareCompleteResolve();
                      },
                      (error) => {
                          this._prepareError = true;
                          this._prepareCompleteReject(error);
                      },
                  );
                  void promise.finally(() => this._updateBadge());
                  this._preparePromise = promise;
              }
              return this._prepareCompletePromise;
          }
""",
              """    prepare() {
              if (this._preparePromise === null) {
                  if (this._prepareError) {
                      const {promise: completePromise, resolve, reject} = deferPromise();
                      this._prepareCompletePromise = completePromise;
                      this._prepareCompleteResolve = resolve;
                      this._prepareCompleteReject = reject;
                      this._prepareError = false;
                  }
                  const promise = this._prepareInternal();
                  this._preparePromise = promise;
                  void promise.then(
                      () => {
                          this._isPrepared = true;
                          this._prepareCompleteResolve();
                          this._updateBadge();
                      },
                      (error) => {
                          if (this._preparePromise === promise) {
                              this._preparePromise = null;
                          }
                          this._prepareError = true;
                          this._prepareCompleteReject(error);
                          this._updateBadge();
                      },
                  );
              }
              return this._prepareCompletePromise;
          }
""",
          )
          replace_once(
              backend,
              """            {
                  const startedAt = safePerformance.now();
                  this._prepareInternalSync();
                  recordPhase('_prepareInternalSync', startedAt);
              }
""",
              """            if (!this._prepareInternalSyncComplete) {
                  const startedAt = safePerformance.now();
                  this._prepareInternalSync();
                  this._prepareInternalSyncComplete = true;
                  recordPhase('_prepareInternalSync', startedAt);
              }
""",
          )
          replace_once(
              backend,
              """    _getOrCreateSearchPopupWrapper() {
              if (this._searchPopupTabCreatePromise === null) {
                  const promise = this._getOrCreateSearchPopup();
                  this._searchPopupTabCreatePromise = promise;
                  void promise.then(() => { this._searchPopupTabCreatePromise = null; });
              }
              return this._searchPopupTabCreatePromise;
          }
""",
              """    _getOrCreateSearchPopupWrapper() {
              if (this._searchPopupTabCreatePromise === null) {
                  const promise = this._getOrCreateSearchPopup();
                  this._searchPopupTabCreatePromise = promise;
                  const clearPromise = () => {
                      if (this._searchPopupTabCreatePromise === promise) {
                          this._searchPopupTabCreatePromise = null;
                      }
                  };
                  void promise.then(clearPromise, clearPromise);
              }
              return this._searchPopupTabCreatePromise;
          }
""",
          )
          replace_once(
              backend,
              """    async _runDictionaryMutation(task) {
              await this._awaitDictionaryMutationSettled();
              this._dictionaryMutationPromise = (async () => {
                  await task();
              })();
              try {
                  await this._dictionaryMutationPromise;
              } finally {
                  this._dictionaryMutationPromise = null;
              }
          }
""",
              """    async _runDictionaryMutation(task) {
              const previousPromise = this._dictionaryMutationPromise;
              const mutationPromise = (async () => {
                  if (previousPromise !== null) {
                      try {
                          await previousPromise;
                      } catch (_) {
                          // A prior failed mutation must not poison later queued mutations.
                      }
                  }
                  await task();
              })();
              this._dictionaryMutationPromise = mutationPromise;
              try {
                  await mutationPromise;
              } finally {
                  if (this._dictionaryMutationPromise === mutationPromise) {
                      this._dictionaryMutationPromise = null;
                  }
              }
          }
""",
          )

          proxy = 'ext/js/background/offscreen-proxy.js'
          replace_once(
              proxy,
              """    async sendMessagePromise(message) {
              const response = await this._webExtension.sendMessagePromise(message);
              return this._getMessageResponseResult(/** @type {import('core').Response<import('offscreen').ApiReturn<TMessageType>>} */ (response));
          }
""",
              """    async sendMessagePromise(message) {
              await this._ensureOffscreenDocument();
              const response = await this._webExtension.sendMessagePromise(message);
              return this._getMessageResponseResult(/** @type {import('core').Response<import('offscreen').ApiReturn<TMessageType>>} */ (response));
          }
""",
          )

          worker = 'ext/js/background/offscreen-dictionary-worker.js'
          replace_once(
              worker,
              """        if (policy.concurrency === 'streamed-import') {
              ++this._queuedImportRequestCount;
          }
          if (
              policy.concurrency === 'lookup' &&
              this._queuedExclusiveRequestCount === 0 &&
              this._activeImportAbortController === null
          ) {
""",
              """        if (policy.concurrency === 'streamed-import') {
              ++this._queuedImportRequestCount;
          }
          if (
              policy.concurrency === 'lookup' &&
              (this._queuedImportRequestCount > 0 || this._activeImportAbortController !== null)
          ) {
              const id = event.data.id;
              self.postMessage({
                  id,
                  error: ExtensionError.serialize(new Error(`Cannot execute ${action}: dictionary import is in progress`)),
              });
              return;
          }
          if (
              policy.concurrency === 'lookup' &&
              this._queuedExclusiveRequestCount === 0 &&
              this._activeImportAbortController === null
          ) {
""",
          )
      - name: Run focused reliability tests
        run: npx vitest run test/runtime-reliability-regressions.test.js test/dictionary-worker-client.test.js test/offscreen-worker-recovery.test.js test/backend-lookup-refresh.test.js test/offscreen-proxy.test.js test/offscreen-import-response-port.test.js
      - name: Typecheck tests
        run: npm run test:ts:test
      - name: Typecheck main sources
        run: npm run test:ts:main
      - name: Commit fixes and remove one-shot workflow
        run: |
          rm .github/workflows/apply-runtime-reliability-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ext/js/background/backend.js ext/js/background/offscreen-proxy.js ext/js/background/offscreen-dictionary-worker.js test/runtime-reliability-regressions.test.js .github/workflows/apply-runtime-reliability-fixes.yml
          git commit -m 'Fix runtime reliability recovery paths'
          git push origin HEAD:fix/runtime-reliability-20260914
