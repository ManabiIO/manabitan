name: Structural import ownership screen
on:
  push:
    branches: [research/import-structural-20260918]
    paths: [.github/workflows/import-ownership-screen-20260918.yml]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, jmnedict]
        candidate: [owned-shared, owned-private, native-lookup]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb7241deb70950dc113089cd774c9489ede48f8a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build isolated source arms at the same path
        env:
          CANDIDATE: ${{ matrix.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/ownership-screen/A builds/ownership-screen/B
          npm run build:libs
          node dev/bin/build.js chrome-dev
          cp builds/manabitan-chrome-dev.zip builds/ownership-screen/A/package.zip
          cp ext/lib/term-bank-parser.wasm builds/ownership-screen/A/parser.wasm
          cp dev/build-libs.js builds/ownership-screen/A/build-libs.js
          cp ext/js/dictionary/term-bank-wasm-parser-worker.js builds/ownership-screen/A/worker.js
          python3 - <<'PY'
          import os, pathlib
          candidate=os.environ['CANDIDATE']
          if candidate.startswith('owned-'):
              p=pathlib.Path('ext/js/dictionary/term-bank-wasm-parser-worker.js'); s=p.read_text()
              old='copyWasmBackedColumnChunk(chunk, true)'; assert s.count(old)==1
              p.write_text(s.replace(old,'copyWasmBackedColumnChunk(chunk, false)'))
          if candidate=='owned-private':
              p=pathlib.Path('dev/build-libs.js'); s=p.read_text()
              old="            '-Wl,--shared-memory',\n"; assert s.count(old)==1
              p.write_text(s.replace(old,''))
          PY
          npm run build:libs
          node dev/bin/build.js chrome-dev
          cp builds/manabitan-chrome-dev.zip builds/ownership-screen/B/package.zip
          cp ext/lib/term-bank-parser.wasm builds/ownership-screen/B/parser.wasm
          cp dev/build-libs.js builds/ownership-screen/B/build-libs.js
          cp ext/js/dictionary/term-bank-wasm-parser-worker.js builds/ownership-screen/B/worker.js
          git diff --binary > builds/ownership-screen/candidate.patch
          python3 - <<'PY'
          import zipfile, pathlib, json, hashlib, os
          root=pathlib.Path('builds/ownership-screen')
          a=zipfile.ZipFile(root/'A/package.zip'); b=zipfile.ZipFile(root/'B/package.zip')
          assert a.namelist()==b.namelist()
          changed=[n for n in a.namelist() if a.read(n)!=b.read(n)]
          expected={'js/dictionary/term-bank-wasm-parser-worker.js'} if os.environ['CANDIDATE'].startswith('owned-') else set()
          if os.environ['CANDIDATE']=='owned-private': expected.add('lib/term-bank-parser.wasm')
          assert set(changed)==expected,(changed,expected)
          data={'base':'fb7241deb70950dc113089cd774c9489ede48f8a','candidate':os.environ['CANDIDATE'],'changedMembers':changed,'sha256':{str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}}
          (root/'identities.json').write_text(json.dumps(data,indent=2))
          PY
      - name: Fixed complete-import ABBA and same-binary controls
        env:
          DICTIONARY: ${{ matrix.dictionary }}
          CANDIDATE: ${{ matrix.candidate }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ownership-screen.py <<'PY'
          import os,json,pathlib,subprocess,shutil,statistics,hashlib
          out=pathlib.Path('builds/ownership-screen'); dictionary=os.environ['DICTIONARY']; candidate=os.environ['CANDIDATE']
          plan=[{'label':'warm-'+x,'arm':x,'warmup':True,'kind':'warmup','block':-1} for x in ['A','B','A','A']]
          for block in range(2):
              kinds=['candidate','control'] if block%2==0 else ['control','candidate']
              for kind in kinds:
                  for label in ['A','B','B','A']:
                      plan.append({'label':label,'arm':label if kind=='candidate' else 'A','warmup':False,'kind':kind,'block':block})
          (out/'plan.json').write_text(json.dumps(plan,indent=2)); observations=[]
          for i,item in enumerate(plan):
              arm=item['arm']; files={'package.zip':'builds/manabitan-chrome-dev.zip','parser.wasm':'ext/lib/term-bank-parser.wasm','worker.js':'ext/js/dictionary/term-bank-wasm-parser-worker.js','build-libs.js':'dev/build-libs.js'}
              for name,dst in files.items(): shutil.copyfile(out/arm/name,dst)
              flags={'experimentalNativeSegmentedLookup':True,'experimentalLookupScratchReuse':True} if candidate=='native-lookup' and arm=='B' else {}
              target=out/f'{i:03d}-{item["kind"]}-{item["label"]}'
              command=['node','dev/perf/import-benchmark.js',dictionary,'--runs','1','--no-build','--flags',json.dumps(flags),'--output',str(target)]
              with open(out/f'{i:03d}.log','w') as log: subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,check=True,timeout=240)
              summary=json.loads((target/'summary.json').read_text()); run=summary['runs'][0]
              assert summary['authoritativeTiming'] and not summary['traceEnabled']
              assert run['importDebug']['errorCount']==0
              phases=[p['details'] for p in run['importDebug']['importerPhaseTimings'] if p['phase'].startswith('term-file-fast-path:')]
              assert phases
              if candidate.startswith('owned-') and arm=='B': assert sum(p['parserBorrowedContentResultCount'] for p in phases)==0
              if candidate=='native-lookup' and arm=='B' and dictionary!='jitendex': assert sum(p['parserNativeSegmentedLookupSegments'] for p in phases)>0
              obs={**item,'index':i,'ms':run['totalImportMs'],'report':str(target/'run-1.json'),'flags':flags,'packageSha256':hashlib.sha256(pathlib.Path('builds/manabitan-chrome-dev.zip').read_bytes()).hexdigest(),'details':phases}
              observations.append(obs); (out/'observations.json').write_text(json.dumps(observations,indent=2))
              print(i, item['kind'], item['label'],round(obs['ms'],2),flush=True)
          result={}
          for kind in ['candidate','control']:
              rows=[x for x in observations if x['kind']==kind]; ratios=[]; a=[]; b=[]
              for j in range(0,len(rows),4):
                  block=rows[j:j+4]
                  assert [x['label'] for x in block]==['A','B','B','A']
                  for ai,bi in [(0,1),(3,2)]:
                      aa,bb=block[ai]['ms'],block[bi]['ms']; a.append(aa);b.append(bb);ratios.append(100*(bb/aa-1))
              result[kind]={'pairChangesPct':ratios,'medianPairedPct':statistics.median(ratios),'medianAbsolutePct':statistics.median(map(abs,ratios)),'equalWorkPct':100*(sum(b)/sum(a)-1),'fasterPairs':sum(x<0 for x in ratios),'aMedianMs':statistics.median(a),'bMedianMs':statistics.median(b)}
          (out/'result.json').write_text(json.dumps(result,indent=2)); print(json.dumps(result,indent=2))
          PY
          python3 /tmp/ownership-screen.py
          cp /tmp/ownership-screen.py builds/ownership-screen/driver.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ownership-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/ownership-screen
          retention-days: 14
          if-no-files-found: error
