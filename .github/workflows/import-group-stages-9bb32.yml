name: JMdict coordinator dependency diagnostic 9bb32

on:
  push:
    branches: [diagnostic/import-group-stages-20261128-9bb32]
    paths: ['.github/workflows/import-group-stages-9bb32.yml']

permissions:
  contents: read

jobs:
  diagnostic:
    name: Three sequential fresh-profile JMdict observations
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install lockfile-pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore locked dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Run the frozen diagnostic plan
        run: python dev/perf/import-group-stages-9bb32.py
      - name: Retain every prescribed observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jmdict-group-stages-9bb32
          path: builds/perf/group-stages-9bb32
          if-no-files-found: error
          retention-days: 14
