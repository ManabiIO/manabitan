# Research branch only. Do not merge this workflow into a product branch.
name: JMdict qualification (2026-11-19 research)

on:
  push:
    branches: [perf/jmdict-qualification-20261119]

permissions:
  contents: read

concurrency:
  group: jmdict-qualification-20261119
  cancel-in-progress: false

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        dictionary: [jmdict]
    env:
      PERF_BASELINE_SHA: d829f5b6e6a75ee8859d38d537d224ec33c4930e
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_CANDIDATE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Initialize evidence before preparation
        run: |
          evidence="$RUNNER_TEMP/jmdict-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          baseline="$RUNNER_TEMP/jmdict-baseline-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$evidence"
          printf 'PERF_BASELINE_ROOT=%s\nPERF_EVIDENCE_ROOT=%s\n' "$baseline" "$evidence" >> "$GITHUB_ENV"
          git rev-parse HEAD > "$evidence/candidate-sha.txt"
          python3 dev/perf/jmdict-qualification-20261119.py plan > "$evidence/frozen-plan.json"

      - uses: ./.github/actions/setup

      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore pinned source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}

      - name: Build both revisions before timing
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$PERF_EVIDENCE_ROOT/preparation.log") 2>&1
          git cat-file -e "${PERF_BASELINE_SHA}^{commit}"
          git worktree add --detach "$PERF_BASELINE_ROOT" "$PERF_BASELINE_SHA"
          cmp package.json "$PERF_BASELINE_ROOT/package.json"
          cmp package-lock.json "$PERF_BASELINE_ROOT/package-lock.json"
          cmp test/perf/dictionaries.lock.json "$PERF_BASELINE_ROOT/test/perf/dictionaries.lock.json"
          node dev/perf/prepare-dictionaries.js
          mkdir -p "$PERF_BASELINE_ROOT/builds/e2e-dictionary-cache"
          cp builds/e2e-dictionary-cache/*.zip "$PERF_BASELINE_ROOT/builds/e2e-dictionary-cache/"
          (
            cd "$PERF_BASELINE_ROOT"
            npm ci
            npm run build:libs
            npm run license-report:html
            npm run build -- --target chrome
          )
          npm run build -- --target chrome
          python3 dev/perf/jmdict-qualification-20261119.py prepare

      - name: Run the frozen warmup, control and six-pair schedule
        timeout-minutes: 20
        run: python3 dev/perf/jmdict-qualification-20261119.py run

      - name: Capture separate baseline and candidate CPU traces
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        timeout-minutes: 8
        run: python3 dev/perf/jmdict-qualification-20261119.py trace

      - name: Preserve all observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jmdict-qualification-${{ matrix.dictionary }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PERF_EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 14
