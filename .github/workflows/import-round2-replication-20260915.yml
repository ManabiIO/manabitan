name: Empty-string import independent replication
on:
  push:
    branches: [verify/import-round2-20260915]
    paths: [.github/workflows/import-round2-replication-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50a1b96299568130ea3ce2b3b1dec50957a11ce3
          persist-credentials: false
      - name: Pin review inputs and baseline
        run: |
          cp -a dev/perf/round2-20260915 "$RUNNER_TEMP/round2-review"
          git fetch --depth=1 origin 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round2-review/source-screen.py'
          s = p.read_text()
          assert s.count('EXPECTED = {') == 1
          s = s.replace('EXPECTED = {', "EXPECTED = {\n    'empty-strings': 'e3ba0849015956aa97f668795457863b8277dd6936921166ec633e363bcfb970',")
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round2-review/source-screen.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Checksum-pinned complete dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Build baseline
        run: node dev/bin/build.js --target chrome-dev
      - name: Twelve alternating pairs and six interleaved AA controls
        env:
          CANDIDATE: empty-strings
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: python3 "$RUNNER_TEMP/round2-review/source-screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round2-replication-empty-strings-${{ matrix.dictionary }}
          path: builds/round2-screen
          retention-days: 30
