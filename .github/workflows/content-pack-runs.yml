name: Content packing source and import verification
on:
  push:
    branches: [verify/content-pack-runs-20260909]
    paths:
      - .github/workflows/content-pack-runs.yml
      - dev/perf/pack-runs/**
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.publish.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Reconstruct exact source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          echo '72a741d9a97a4242d31423560c07d9fe3a11de89ea894b3bad31bfc937705eb5  dev/perf/pack-runs/runtime.patch' | sha256sum -c -
          git worktree add --detach "$RUNNER_TEMP/source" 03478be25506176610b2133be658ee697d9bb3f1
          cd "$RUNNER_TEMP/source"
          git apply "$GITHUB_WORKSPACE/dev/perf/pack-runs/runtime.patch"
          cp "$GITHUB_WORKSPACE/dev/perf/pack-runs/regressions.txt" test/term-content-pack-runs.test.js
          git add ext/js/dictionary/term-content-block-store.js test/term-content-pack-runs.test.js
          test "$(git write-tree)" = 938a65e6349e8e737d54a1bb90c88acae134e330
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' -c core.hooksPath=/dev/null commit -m 'perf(import): coalesce adjacent definition-content packing copies'
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/source.txt"
          git diff HEAD^ HEAD --binary > "$RUNNER_TEMP/evidence/source-and-tests.patch"
      - name: Unit, options, strict types, handwritten lint and builds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          npm ci > "$RUNNER_TEMP/evidence/install.log" 2>&1
          node dev/bin/build-libs.js > "$RUNNER_TEMP/evidence/build-libs.log" 2>&1
          node node_modules/vitest/vitest.mjs run test/term-content-pack-runs.test.js test/term-content-block-store.test.js > "$RUNNER_TEMP/evidence/focused.log" 2>&1
          npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
          npm run test:js > "$RUNNER_TEMP/evidence/lint.log" 2>&1
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
          node dev/bin/build.js --dryRun --all > "$RUNNER_TEMP/evidence/dry-build.log" 2>&1
          test -z "$(git status --porcelain)"
      - name: Publish verified source-only branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          branch=perf/content-pack-runs-20260909
          if git ls-remote --exit-code --heads origin "$branch"; then
            echo 'Refusing to replace an existing candidate branch' >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$branch"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-pack-source
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
  compare:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmnedict, jmdict, jitendex]
    env:
      CANDIDATE: ${{ needs.source.outputs.source_sha }}
      DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Build both immutable arms and prepare pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          git worktree add --detach "$RUNNER_TEMP/A" 03478be25506176610b2133be658ee697d9bb3f1
          git worktree add --detach "$RUNNER_TEMP/B" "$CANDIDATE"
          for arm in A B; do
            (cd "$RUNNER_TEMP/$arm" && npm ci && node dev/bin/build-libs.js && node dev/bin/build.js --target chrome-dev) > "$evidence/build-$arm.log" 2>&1
            test -z "$(git -C "$RUNNER_TEMP/$arm" status --porcelain)"
          done
          (cd "$RUNNER_TEMP/A" && node node_modules/playwright/cli.js install --with-deps chromium && node dev/perf/prepare-dictionaries.js) > "$evidence/runtime-fixtures.log" 2>&1
          cp -a "$RUNNER_TEMP/A/builds/e2e-dictionary-cache" "$RUNNER_TEMP/B/builds/"
          node --version > "$evidence/node.txt"
          clang --version > "$evidence/clang.txt"
          lscpu > "$evidence/cpu.txt"
          free -b > "$evidence/memory.txt"
          cp dev/perf/pack-runs/paired.py "$evidence/paired.py"
          cd "$RUNNER_TEMP/A"
          node --input-type=module <<'NODE' > "$evidence/native-policy.json"
          import {createServer} from 'node:http';
          import {chromium} from 'playwright';
          const server = createServer((req, res) => res.end('<!doctype html><title>policy</title>'));
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          const browser = await chromium.launch({headless: true});
          try {
            const page = await browser.newPage();
            await page.goto(`http://127.0.0.1:${server.address().port}`);
            const policy = await page.evaluate(async () => {
              const url = URL.createObjectURL(new Blob(['postMessage({deviceMemory:navigator.deviceMemory,hardwareConcurrency:navigator.hardwareConcurrency})'], {type:'text/javascript'}));
              const worker = new Worker(url);
              const value = await new Promise(resolve => worker.onmessage = event => resolve(event.data));
              worker.terminate(); URL.revokeObjectURL(url);
              return {page:{deviceMemory:navigator.deviceMemory,hardwareConcurrency:navigator.hardwareConcurrency},worker:value};
            });
            console.log(JSON.stringify({browser:browser.version(),...policy}, null, 2));
          } finally { await browser.close(); server.close(); }
          NODE
      - name: Six fixed pairs with reversed initial order and same-binary controls
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/perf/pack-runs/paired.py --baseline "$RUNNER_TEMP/A" --candidate "$RUNNER_TEMP/B" --output "$RUNNER_TEMP/evidence/paired" --pairs 6 --dictionaries "$DICTIONARY" --reverse > "$RUNNER_TEMP/evidence/driver.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-pack-${{ matrix.dictionary }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
