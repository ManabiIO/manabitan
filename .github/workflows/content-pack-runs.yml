name: Content packing source verification
on:
  push:
    branches: [verify/content-pack-runs-20260909]
    paths:
      - .github/workflows/content-pack-runs.yml
      - dev/perf/pack-runs/**
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Reconstruct exact source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          echo '72a741d9a97a4242d31423560c07d9fe3a11de89ea894b3bad31bfc937705eb5  dev/perf/pack-runs/runtime.patch' | sha256sum -c -
          git worktree add --detach "$RUNNER_TEMP/source" 03478be25506176610b2133be658ee697d9bb3f1
          cd "$RUNNER_TEMP/source"
          git apply "$GITHUB_WORKSPACE/dev/perf/pack-runs/runtime.patch"
          cp "$GITHUB_WORKSPACE/dev/perf/pack-runs/regressions.txt" test/term-content-pack-runs.test.js
          git apply "$GITHUB_WORKSPACE/dev/perf/pack-runs/oracle-fix.patch"
          git add ext/js/dictionary/term-content-block-store.js test/term-content-pack-runs.test.js
          test "$(git write-tree)" = d0010802b4d3218257b239b9d5c784fd7e662dbb
          git -c user.name='OpenAI' -c user.email='noreply@openai.com' -c core.hooksPath=/dev/null commit -m 'perf(import): coalesce adjacent definition-content packing copies'
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/evidence/source.txt"
          git diff HEAD^ HEAD --binary > "$RUNNER_TEMP/evidence/source-and-tests.patch"
      - name: Units, options, all strict types, full lint and builds
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          npm ci > "$RUNNER_TEMP/evidence/install.log" 2>&1
          node dev/bin/build-libs.js > "$RUNNER_TEMP/evidence/build-libs.log" 2>&1
          node node_modules/vitest/vitest.mjs run test/term-content-pack-runs.test.js test/term-content-block-store.test.js > "$RUNNER_TEMP/evidence/focused.log" 2>&1
          npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
          npm run test:js > "$RUNNER_TEMP/evidence/lint.log" 2>&1
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
          node dev/bin/build.js --dryRun --all > "$RUNNER_TEMP/evidence/dry-build.log" 2>&1
          test -z "$(git status --porcelain)"
      - name: Publish verified source-only branch
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/source"
          branch=perf/content-pack-runs-20260909
          if git ls-remote --exit-code --heads origin "$branch"; then
            echo 'Refusing to replace an existing candidate branch' >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$branch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-pack-source
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
