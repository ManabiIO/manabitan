name: Reader web real-browser qualification
on:
  push:
    branches: [research/reader-web-e2e-20260918]
    paths: [.github/workflows/reader-web-real-e2e.yml]
permissions:
  contents: read
concurrency:
  group: reader-web-real-e2e-candidate
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ttu-ttu/ebook-reader
          ref: 301aef4957c3cb22162276b11f4a47b35533faae
          path: reader-fixture
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Build and exercise real Reader and ManabiTan
        run: |
          python3 test/reader-web/enable-completion-observer.py
          python3 test/reader-web/prepare-candidate.py
          bash test/reader-web/qualify.sh
      - name: Retain runnable test sources and complete runtime diff
        if: always()
        run: |
          mkdir -p reader-web-results
          git -C reader-fixture add -N -- apps/web
          git -C reader-fixture diff --binary -- apps/web package.json pnpm-lock.yaml > reader-web-results/reader-composed-runtime.patch
          tar -czf reader-web-results/test-sources.tar.gz test/reader-web/run.mjs test/reader-web/make-fixtures.py test/reader-web/qualify.sh .github/workflows/reader-web-real-e2e.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-web-real-chromium
          path: reader-web-results/
          retention-days: 7
          if-no-files-found: error
