name: WTY flagged ABBA screen
on:
  push:
    branches: [verify/wty-import-abba-20260916]
    paths: [.github/workflows/wty-screen-20260916.yml]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-en-en-21b1b22-c0a1b7ee-v1
      - name: Prepare pinned fixture, common correctness fix and independent flags
        shell: bash
        run: |
          mkdir -p builds/wty-abba
          cp -R dev/perf/wty-abba-20260916 "$RUNNER_TEMP/wty-assets"
          python3 "$RUNNER_TEMP/wty-assets/prepare.py"
          printf '%s\n' 'b9603db16dee82afd811386302ccd78bab591a6513b0d3194d937dc9110dd4a5  builds/e2e-dictionary-cache/wty-en-en.zip' | sha256sum -c -
          python3 "$RUNNER_TEMP/wty-assets/apply-decoder-fix.py"
          python3 "$RUNNER_TEMP/wty-assets/apply-candidates.py" range simd capacity
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=p.read_text()
          old="const {stdout} = await execFileAsync('unzip', ['-p', zipPath, banks[bankIndex]], {maxBuffer: 32 * 1024 * 1024});"
          assert s.count(old)==1
          p.write_text(s.replace(old,old.replace('32 * 1024','128 * 1024')))
          PY
          cp "$RUNNER_TEMP/wty-assets/abba.mjs" test/chromium/wty-abba-benchmark.mjs
          rm -rf dev/perf/wty-abba-20260916
          git diff -- ext types test/chromium dev/perf/dictionary-fixtures.js test/perf/dictionaries.lock.json > builds/wty-abba/measured-source.patch
          cp test/chromium/wty-abba-benchmark.mjs builds/wty-abba/driver.mjs
          cp builds/wty-profile/fixture.json builds/wty-abba/fixture.json
      - run: npm ci
      - name: Build and run existing focused correctness tests
        shell: bash
        run: |
          set -o pipefail
          npm run build:libs > builds/wty-abba/build-libs.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-experiments.test.js test/dictionary-import-ownership.test.js 2>&1 | tee builds/wty-abba/focused.log
          node dev/bin/build.js --target chrome-dev > builds/wty-abba/build.log 2>&1
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Serial whole-import ABBA screen with same-binary controls
        shell: bash
        run: |
          set -o pipefail
          node test/chromium/wty-abba-benchmark.mjs control,range,simd,capacity,capacitySingle 2 2>&1 | tee builds/wty-abba/driver.log
      - name: Preserve tested source and runtime
        if: always()
        shell: bash
        run: |
          mkdir -p builds/wty-abba
          tar -czf builds/wty-abba/measured-source.tar.gz ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-source-pipeline.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/dictionary-importer.js ext/js/dictionary/wasm/term-bank-parser.c types/ext/dictionary-importer.d.ts test/chromium/extension-two-dictionary-import.e2e.js dev/perf/dictionary-fixtures.js test/perf/dictionaries.lock.json
          cp ext/lib/term-bank-parser.wasm builds/wty-abba/term-bank-parser.wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wty-flagged-abba-screen
          path: builds/wty-abba
          retention-days: 30
