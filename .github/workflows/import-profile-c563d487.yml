name: Import profile c563d487

on:
  push:
    branches: ['perf/import-profile-20261128-c563d487']
    paths: ['.github/workflows/import-profile-c563d487.yml']

permissions:
  contents: read

concurrency:
  group: import-profile-c563d487
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Prepare pinned dictionary
        run: node dev/perf/prepare-dictionaries.js ${{ matrix.dictionary }}
      - name: Install locked Chromium
        run: npx playwright install --with-deps chromium
      - name: Profile exact current release import
        run: |
          node dev/perf/import-benchmark.js ${{ matrix.dictionary }} \
            --trace --runs 1 --build-target chrome --media-check sample \
            --output builds/perf/current-import-profile-c563d487
      - name: Preserve successful and failed observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: import-profile-c563d487-${{ matrix.dictionary }}
          path: builds/perf/current-import-profile-c563d487
          if-no-files-found: warn
          retention-days: 14
