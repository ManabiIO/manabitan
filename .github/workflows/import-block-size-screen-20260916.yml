name: Term-content block-size full-import screens
on:
  push:
    branches: [verify/import-crc-lifetime-20260916]
    paths: [.github/workflows/import-block-size-screen-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [block-8m, block-16m]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8d62304aaa9ac5b3d29ae2968999c09a3dcf6565
          persist-credentials: false
      - name: Derive fixed source-isolated driver
        run: |
          mkdir -p "$RUNNER_TEMP/block-inputs"
          cp dev/perf/block-size-20260916/apply.py "$RUNNER_TEMP/block-inputs/apply.py"
          git fetch --depth=1 origin 17c8fb5f98bd5314fb93750eade2b451fa4c62fb
          git show FETCH_HEAD:dev/perf/pipeline-research-20260916/screen.py > "$RUNNER_TEMP/block-inputs/screen.py"
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'block-inputs/screen.py'; s=p.read_text()
          s=s.replace("('gather32', 'gather64', 'cache64', 'scalar-pending', 'gather-aligned', 'typed-pending')", "('block-8m', 'block-16m')")
          s=s.replace("assert str(source) in ('dev/lib/zstd-wasm.js', 'ext/js/dictionary/dictionary-database.js')", "assert str(source) == 'ext/js/dictionary/term-content-block-store.js'")
          s=s.replace("allowed = {'lib/zstd-wasm.js', 'lib/zstd-wasm.js.map'} if variant.startswith('gather') else {source.relative_to('ext').as_posix()}", "allowed = {source.relative_to('ext').as_posix()}")
          s=s.replace("tests = ['test/zstd-wasm.test.js'] if variant.startswith('gather') else ['test/dictionary-database-content-dedup.test.js', 'test/term-content-block-store.test.js']", "tests = ['test/term-content-block-store.test.js']")
          p.write_text(s)
          PY
          git fetch --depth=1 origin c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          git checkout --detach c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Six alternating browser pairs with A/A controls
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: |
          mkdir -p builds/pipeline-review
          python3 "$RUNNER_TEMP/block-inputs/screen.py" 2>&1 | tee builds/pipeline-review/driver.log
      - name: Preserve exact driver
        if: always()
        run: |
          mkdir -p builds/pipeline-review/executed-inputs
          cp "$RUNNER_TEMP/block-inputs/"*.py builds/pipeline-review/executed-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: block-size-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/pipeline-review
          retention-days: 30
