name: Research PR352 Large Import AB

on:
  push:
    branches:
      - research/pr352-large-import-ab-20260929

permissions:
  contents: read

jobs:
  large-import-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          path: candidate

      - name: Checkout integrated baseline
        uses: actions/checkout@v6
        with:
          ref: 8f7933c1bf6659deb0641a174205a34b3ec399a8
          path: baseline

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install dependencies and libraries
        working-directory: candidate
        run: |
          npm ci
          npm run build:libs

      - name: Reuse exact dependencies and build baseline libraries
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/candidate/node_modules" "$GITHUB_WORKSPACE/baseline/node_modules"
          cd baseline
          npm run build:libs

      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install chromium

      - name: Prepare verified pinned JMdict
        working-directory: candidate
        run: node ./dev/perf/prepare-dictionaries.js

      - name: Derive a valid archive above the ranged-read cutoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          path = Path('candidate/builds/e2e-dictionary-cache/JMdict.zip')
          with zipfile.ZipFile(path, 'a', compression=zipfile.ZIP_STORED, allowZip64=True) as archive:
              info = zipfile.ZipInfo('manabitan-perf-unused-padding.bin')
              info.compress_type = zipfile.ZIP_STORED
              with archive.open(info, 'w', force_zip64=True) as output:
                  chunk = b'\0' * (1024 * 1024)
                  for _ in range(129):
                      output.write(chunk)

          with zipfile.ZipFile(path, 'r') as archive:
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'corrupt derived ZIP member: {bad}')
          print(path.stat().st_size)
          if path.stat().st_size <= 128 * 1024 * 1024:
              raise SystemExit('derived archive did not cross ranged-read threshold')
          PY

      - name: Pin the derived archive identically in both workspaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline/builds/e2e-dictionary-cache
          cp candidate/builds/e2e-dictionary-cache/JMdict.zip baseline/builds/e2e-dictionary-cache/JMdict.zip
          # Other fixture files are not used by quick benchmark but keep cache complete.
          cp candidate/builds/e2e-dictionary-cache/JMnedict.zip baseline/builds/e2e-dictionary-cache/JMnedict.zip
          cp candidate/builds/e2e-dictionary-cache/jitendex-yomitan.zip baseline/builds/e2e-dictionary-cache/jitendex-yomitan.zip
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto'
          import {readFileSync, writeFileSync, statSync} from 'node:fs'
          const zipPath = 'candidate/builds/e2e-dictionary-cache/JMdict.zip'
          const bytes = readFileSync(zipPath)
          const sha256 = createHash('sha256').update(bytes).digest('hex')
          const sizeBytes = statSync(zipPath).size
          for (const root of ['candidate', 'baseline']) {
              const lockPath = `${root}/test/perf/dictionaries.lock.json`
              const lock = JSON.parse(readFileSync(lockPath, 'utf8'))
              lock.dictionaries.jmdict.sha256 = sha256
              lock.dictionaries.jmdict.sizeBytes = sizeBytes
              writeFileSync(lockPath, JSON.stringify(lock, null, 4) + '\n')
          }
          console.log(JSON.stringify({sha256, sizeBytes}))
          NODE

      - name: Build both extensions once
        shell: bash
        run: |
          set -euo pipefail
          (cd baseline && node ./dev/bin/build.js --target chrome-dev)
          (cd candidate && node ./dev/bin/build.js --target chrome-dev)

      - name: Run alternating large-JMdict import pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/results"
          for pair in 1 2 3 4 5 6; do
            if (( pair % 2 == 1 )); then
              order="baseline candidate"
            else
              order="candidate baseline"
            fi
            for arm in $order; do
              out="$GITHUB_WORKSPACE/results/pair${pair}-${arm}"
              echo "::group::large JMdict pair ${pair} ${arm}"
              (cd "$arm" && node ./dev/perf/import-benchmark.js jmdict --runs 1 --no-build --output "$out")
              echo "::endgroup::"
            done
          done

      - name: Run adjacent baseline A/A controls
        shell: bash
        run: |
          set -euo pipefail
          for pair in 1 2 3 4; do
            for sample in a b; do
              out="$GITHUB_WORKSPACE/results/aa${pair}-${sample}"
              echo "::group::large JMdict A/A ${pair} ${sample}"
              (cd baseline && node ./dev/perf/import-benchmark.js jmdict --runs 1 --no-build --output "$out")
              echo "::endgroup::"
            done
          done

      - name: Summarize paired timing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs'
          import path from 'node:path'

          const root = process.env.GITHUB_WORKSPACE
          const readTiming = (dir) => {
              const value = JSON.parse(readFileSync(path.join(root, 'results', dir, 'summary.json'), 'utf8'))
              return {
                  total: value.timing.medianMs,
                  worker: value.workerTiming?.medianMs ?? null,
                  source: value.source,
                  fixture: value.fixture,
              }
          }
          const median = (values) => {
              const sorted = [...values].sort((a, b) => a - b)
              const middle = Math.floor(sorted.length / 2)
              return sorted.length % 2 === 1 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2
          }
          const pairs = []
          for (let pair = 1; pair <= 6; ++pair) {
              const baseline = readTiming(`pair${pair}-baseline`)
              const candidate = readTiming(`pair${pair}-candidate`)
              pairs.push({
                  pair,
                  baselineMs: baseline.total,
                  candidateMs: candidate.total,
                  changePct: (candidate.total / baseline.total - 1) * 100,
                  workerBaselineMs: baseline.worker,
                  workerCandidateMs: candidate.worker,
                  workerChangePct: baseline.worker !== null && candidate.worker !== null ?
                      (candidate.worker / baseline.worker - 1) * 100 :
                      null,
              })
          }
          const aaPairs = []
          for (let pair = 1; pair <= 4; ++pair) {
              const a = readTiming(`aa${pair}-a`).total
              const b = readTiming(`aa${pair}-b`).total
              aaPairs.push({
                  pair,
                  aMs: a,
                  bMs: b,
                  changePct: (b / a - 1) * 100,
                  absoluteChangePct: Math.abs((b / a - 1) * 100),
              })
          }
          const output = {
              schemaVersion: 1,
              candidate: process.env.GITHUB_SHA,
              baseline: '8f7933c1bf6659deb0641a174205a34b3ec399a8',
              pairs,
              pairedMedianChangePct: median(pairs.map((x) => x.changePct)),
              fasterPairs: pairs.filter((x) => x.candidateMs < x.baselineMs).length,
              pairedWorkerMedianChangePct: median(pairs.flatMap((x) => x.workerChangePct === null ? [] : [x.workerChangePct])),
              aa: {
                  pairs: aaPairs,
                  medianAbsoluteChangePct: median(aaPairs.map((x) => x.absoluteChangePct)),
                  maxAbsoluteChangePct: Math.max(...aaPairs.map((x) => x.absoluteChangePct)),
              },
          }
          writeFileSync(path.join(root, 'results', 'ab-summary.json'), JSON.stringify(output, null, 2))
          console.log(JSON.stringify(output, null, 2))
          NODE

      - name: Upload raw results
        uses: actions/upload-artifact@v6
        with:
          name: pr352-large-real-import-ab
          path: results
          compression-level: 6
          retention-days: 7
