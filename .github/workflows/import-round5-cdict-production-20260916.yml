name: Prepared dictionary production-baseline confirmation
on:
  push:
    branches: [verify/import-round5-20260916]
    paths: [.github/workflows/import-round5-cdict-production-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5eab7e8a44227ce5349d4c5cf5cf8d500e3b9577
          persist-credentials: false
      - name: Keep the production A source and binary unchanged
        run: |
          cp -a dev/perf/round5-20260916 "$RUNNER_TEMP/round5-review"
          python3 "$RUNNER_TEMP/round5-review/prepare-same-path.py" "$RUNNER_TEMP/round5-review/screen.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round5-review/screen.py'
          s = p.read_text()
          start = s.index("    for item in ['dev/lib/zstd-simd-module.js', 'dev/data/zstd-simd.wasm']:")
          end = s.index("commit(candidate,", start)
          s = s[:start] + "    control_kind = 'unchanged production source and native codec; independent twelve-pair confirmation'\n" + s[end:]
          old = "    'cdict': {'lib/zstd-wasm.js', 'lib/zstd-wasm.js.map'},"
          assert s.count(old) == 1
          s = s.replace(old, "    'cdict': {'lib/zstd-wasm.js', 'lib/zstd-wasm.js.map', 'lib/zstd.wasm', 'lib/zstd-simd-module.js', 'lib/zstd-simd-module.js.map'},")
          old = "assert identities['A']['zstdWasm'] == identities['B']['zstdWasm']"
          assert s.count(old) == 1
          s = s.replace(old, "assert identities['A']['commit'] == BASE\nassert identities['A']['zstdWasm'] == 'ad3a18c197d72167262d01fd202976325f57a6697bca627f4527c96d4dbbcfcc'\nassert identities['B']['zstdWasm'] == '26e457ed3abbf9ab33bbf81f2351bae61c9ca8f71a57ef451b125cd3ed5024ff'")
          old = "assert all(not item['status'] for item in identities.values())"
          assert s.count(old) == 1
          s = s.replace(old, "(output / 'admission-identities.json').write_text(json.dumps(identities, indent=2))\n" + old)
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round5-review/"*.py
          git fetch --depth=1 origin b4094a423c20bb0ed424d944238f922c1b36559c
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.10'
          actions-cache-folder: emsdk-cache
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Isolate the compiler installation from source identity
        run: |
          mkdir -p builds/round5
          git status --porcelain > builds/round5/installer-status.txt
          printf '\n/emsdk-cache/\n' >> .git/info/exclude
          node --version > builds/round5/node.txt
          emcc --version > builds/round5/emscripten.txt
          test "$(node --version)" = v24.20.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify complete checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Twelve reversed-order pairs with six interleaved same-binary controls
        env:
          CANDIDATE: cdict
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: python3 "$RUNNER_TEMP/round5-review/screen.py" 2>&1 | tee builds/round5/driver.log
      - name: Preserve exact inputs and all outcomes
        if: always()
        run: |
          mkdir -p builds/round5/driver-inputs builds/round5/candidate-codec
          cp "$RUNNER_TEMP/round5-review/"*.* builds/round5/driver-inputs/
          if test -f "$RUNNER_TEMP/round5-candidate/dev/data/zstd-simd.wasm"; then
            cp "$RUNNER_TEMP/round5-candidate/dev/data/zstd-simd.wasm" builds/round5/candidate-codec/
            cp "$RUNNER_TEMP/round5-candidate/dev/lib/zstd-simd-module.js" builds/round5/candidate-codec/
            cp "$RUNNER_TEMP/round5-candidate/dev/lib/zstd-wasm.js" builds/round5/candidate-codec/
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round5-cdict-production-${{ matrix.dictionary }}
          path: builds/round5
          retention-days: 30
