name: Wide sequence current-develop recompose
on:
  push:
    branches: [codex/recompose-sequence-105-20260921]
permissions:
  contents: write
jobs:
  recompose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check out the composed product branch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sequence-105"
          git switch --detach origin/codex/recomposed-sequence-105-20260921
          git rev-parse HEAD > "$RUNNER_TEMP/sequence-105/recomposed-head.txt"
          git merge-base HEAD 03712ff99031d37a6b4411f15d408d4d576212a7 > "$RUNNER_TEMP/sequence-105/merge-base.txt"
          test "$(cat "$RUNNER_TEMP/sequence-105/merge-base.txt")" = "03712ff99031d37a6b4411f15d408d4d576212a7"
          git diff --stat 03712ff99031d37a6b4411f15d408d4d576212a7 HEAD > "$RUNNER_TEMP/sequence-105/stat.txt"
          git diff 03712ff99031d37a6b4411f15d408d4d576212a7 HEAD > "$RUNNER_TEMP/sequence-105/product.patch"
      - uses: ./.github/actions/setup
        if: success()
      - name: Rebuild production libraries
        if: success()
        run: |
          set -euo pipefail
          npm run build:libs 2>&1 | tee "$RUNNER_TEMP/sequence-105/build-libs.log"
      - name: Strict qualification
        if: success()
        run: |
          set -euo pipefail
          npm run test:js 2>&1 | tee "$RUNNER_TEMP/sequence-105/lint.log"
          npm run test:ts:main 2>&1 | tee "$RUNNER_TEMP/sequence-105/ts-main.log"
          npm run test:ts:test 2>&1 | tee "$RUNNER_TEMP/sequence-105/ts-test.log"
          npx vitest run test/term-bank-wasm-parser.test.js test/term-record-opfs-store.test.js --reporter=json --outputFile="$RUNNER_TEMP/sequence-105/tests.json" 2>&1 | tee "$RUNNER_TEMP/sequence-105/tests.log"
          git diff --check
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequence-105-current-develop-recompose
          path: ${{ runner.temp }}/sequence-105/
          retention-days: 14
