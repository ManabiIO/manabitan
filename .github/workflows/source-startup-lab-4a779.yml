name: Compressed source startup experiment 4a779

on:
  push:
    branches: [perf/source-startup-lab-20261127-4a779]

permissions:
  contents: read

concurrency:
  group: source-startup-lab-4a779-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Compressed startup window (${{ matrix.dictionary }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_CANDIDATE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Compare complete imports with identical-code controls
        run: |
          args=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            args+=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" --initial-order AB --pairs 6 \
            "${args[@]}" \
            --expected-package-entry js/dictionary/term-bank-wasm-parser.js \
            --evidence "builds/perf/lab-source-startup/$PERF_DICTIONARY"
      - name: Preserve all observations and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-lab-source-startup-${{ matrix.dictionary }}
          path: builds/perf/lab-source-startup/${{ matrix.dictionary }}
          if-no-files-found: error
          retention-days: 14
