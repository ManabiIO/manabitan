name: Export pinned import review inputs
on:
  push:
    branches: [verify/import-review-20260916-1705]
    paths: [.github/workflows/import-review-export-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          persist-credentials: false
      - name: Export exact tracked source and reusable measurement drivers
        run: |
          mkdir -p "$RUNNER_TEMP/review-export"
          git archive HEAD | gzip -1 > "$RUNNER_TEMP/review-export/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/review-export/identity.txt"
          git fetch --depth=1 origin 23524cf48cb08482ebd271406fe48da773bb516c
          git archive FETCH_HEAD dev/perf/round6-20260916 | gzip -1 > "$RUNNER_TEMP/review-export/previous-drivers.tar.gz"
          sha256sum "$RUNNER_TEMP/review-export/"*.tar.gz > "$RUNNER_TEMP/review-export/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: import-review-source-c0a1b7e
          path: ${{ runner.temp }}/review-export
          compression-level: 0
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - name: Download checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Export offline dependencies and corpus
        run: |
          mkdir -p "$RUNNER_TEMP/review-runtime"
          tar -czf "$RUNNER_TEMP/review-runtime/runtime.tar.gz" node_modules ext/lib builds/e2e-dictionary-cache
          sha256sum "$RUNNER_TEMP/review-runtime/runtime.tar.gz" > "$RUNNER_TEMP/review-runtime/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: import-review-runtime-c0a1b7e
          path: ${{ runner.temp }}/review-runtime
          compression-level: 0
          retention-days: 7
