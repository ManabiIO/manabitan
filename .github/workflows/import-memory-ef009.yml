name: Import memory qualification ef009

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: import-memory-ef009-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  memory:
    if: github.head_ref == 'codex/import-memory-20261125-ef009' && github.event.pull_request.head.repo.full_name == github.repository
    name: media memory ${{ matrix.dictionary }} host ${{ matrix.replication }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        replication: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify observer coverage, clocks, overlays, and fixed protocol
        run: python3 -m unittest discover -s dev/perf/import-memory-ef009 -p 'test_*.py'
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore source archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fetch frozen media candidate
        run: |
          set -euo pipefail
          candidate_sha=$(python3 -c 'import json, re; sha = json.load(open("dev/perf/import-memory-ef009/protocol.json"))["candidate"]["commit"]; assert isinstance(sha, str) and re.fullmatch("[0-9a-f]{40}", sha), "Unfrozen candidate"; print(sha)')
          git fetch origin "$candidate_sha"
      - name: Execute all four predetermined memory observations
        run: python3 dev/perf/import-memory-ef009/run_memory.py '${{ matrix.dictionary }}' '${{ matrix.replication }}'
      - name: Retain compact memory summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-memory-summary-ef009-${{ matrix.dictionary }}-${{ matrix.replication }}
          path: builds/memory-qualification-summary
          if-no-files-found: error
          retention-days: 14
      - name: Retain exact packages, raw scans, and every failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-memory-ef009-${{ matrix.dictionary }}-${{ matrix.replication }}
          path: builds/memory-qualification
          if-no-files-found: error
          retention-days: 14
