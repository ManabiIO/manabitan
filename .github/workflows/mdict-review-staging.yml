name: MDict reviewed patch staging
on:
  push:
    branches: [review/mdict-delivery-20260921]
permissions:
  contents: write
concurrency:
  group: mdict-reviewed-patch-staging
  cancel-in-progress: false
jobs:
  combine-reviewed-stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7d5a0918a1c86ca05f85e2d79b8f318c716b4b9b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build:libs
      - name: Qualify CSS isolation with the complete redirect and lookup stack
        run: |
          git config user.name 'MDict review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/mdict-combined-results
          git merge --no-edit e71319260b5257813cb9622de5c5e329038c08e3
          git diff --check HEAD~1 HEAD
          node --test --test-reporter=tap test/util/mdict-*-cases.js test/util/search-refresh-cases.js > /tmp/mdict-combined-results/pr121-native.tap
          node test/fixtures/term-row-materialization/check.mjs /tmp/mdict-combined-results/pr121-materialization.json > /tmp/mdict-combined-results/pr121-materialization.log
          git push origin HEAD:refs/heads/review/mdict-pr121-combined-20260921
          git rev-parse HEAD > /tmp/mdict-combined-results/pr121.sha
      - name: Qualify the literal-selector follow-up on the combined parent
        run: |
          parent="$(cat /tmp/mdict-combined-results/pr121.sha)"
          git checkout d99a78a0af63c250670533755df562280138af0c
          git merge --no-edit "$parent"
          git diff --check HEAD~1 HEAD
          node --test --test-reporter=tap test/util/mdict-*-cases.js test/util/search-refresh-cases.js > /tmp/mdict-combined-results/pr126-native.tap
          node test/fixtures/term-row-materialization/check.mjs /tmp/mdict-combined-results/pr126-materialization.json > /tmp/mdict-combined-results/pr126-materialization.log
          git push origin HEAD:refs/heads/review/mdict-pr126-combined-20260921
          git rev-parse HEAD > /tmp/mdict-combined-results/pr126.sha
      - name: Preserve source, results and any integration conflict
        if: always()
        run: |
          mkdir -p /tmp/mdict-combined-results/working
          git status --short > /tmp/mdict-combined-results/status.txt
          git diff > /tmp/mdict-combined-results/working.diff
          cp ext/js/dictionary/mdx/mdx-converter.js /tmp/mdict-combined-results/working/mdx-converter.js
          cp test/util/mdict-native-cases.js /tmp/mdict-combined-results/working/mdict-native-cases.js
          git archive HEAD | gzip > /tmp/mdict-combined-results/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdict-combined-review-${{ github.run_id }}
          path: /tmp/mdict-combined-results/
          retention-days: 7
