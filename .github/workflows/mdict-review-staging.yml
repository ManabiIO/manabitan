name: MDict reviewed patch staging
on:
  push:
    branches: [review/mdict-delivery-20260921]
permissions:
  contents: write
concurrency:
  group: mdict-reviewed-patch-staging
  cancel-in-progress: false
jobs:
  integrate-media-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 70be7a17d51f3b276419a8ac3d46aa6ec263f83e
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci && npm run build:libs
      - name: Qualify each exact PR composition before publishing new staging refs
        run: |
          git config user.name 'MDict review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/mdict-integration-results
          stage() {
            local id="$1" old="$2" parent="$3"
            git checkout -B "work-$id" "$old"
            git merge --no-edit "$parent"
            git diff --check "$old" HEAD
            node --test --test-reporter=tap test/util/mdict-*-cases.js test/util/search-refresh-cases.js > "/tmp/mdict-integration-results/$id-native.tap"
            node test/fixtures/term-row-materialization/check.mjs "/tmp/mdict-integration-results/$id-materialization.json" > "/tmp/mdict-integration-results/$id-materialization.log"
            git push origin "HEAD:refs/heads/review/mdict-$id-media-20260921"
            git rev-parse HEAD > "/tmp/mdict-integration-results/$id.sha"
          }
          stage pr119 e32cd9346855d54fdf2c205893ec6bb51103cb86 70be7a17d51f3b276419a8ac3d46aa6ec263f83e
          stage pr120 811a85b21163d019ff36d28aa2f0602888f8d017 work-pr119
          stage pr124 3724113b61c1dd2936da5b73f646d813ada18b1f work-pr120
          stage pr121 709586ba9d8cb43de1bc74e5fc27bbd5a96187de 70be7a17d51f3b276419a8ac3d46aa6ec263f83e
          stage pr126 22f00beb8d5118654cf023cee18facc6b3d2d218 work-pr121
      - name: Preserve the final composition source
        if: always()
        run: |
          mkdir -p /tmp/mdict-integration-results
          git status --short > /tmp/mdict-integration-results/status.txt
          git archive HEAD | gzip > /tmp/mdict-integration-results/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdict-media-integration-${{ github.run_id }}
          path: /tmp/mdict-integration-results/
          retention-days: 7
