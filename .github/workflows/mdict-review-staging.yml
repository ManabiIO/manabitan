name: MDict reviewed patch staging

on:
  push:
    branches: [review/mdict-delivery-20260921]

permissions:
  contents: write

concurrency:
  group: mdict-reviewed-patch-staging
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pr120
            base: 0f31184408d486bd6fd12e8388484bbd69d701ce
          - id: pr121
            base: 6bcdc2cdfb7900d191c65b11879124be784a7a5a
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - uses: actions/checkout@v6
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.base }}
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Replay reviewed mailbox commits on the exact PR head
        env:
          SERIES: ${{ matrix.id }}
          EXPECTED_BASE: ${{ matrix.base }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git config user.name 'MDict review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am "../packet/.mdict-review-delivery/$SERIES.patch"
          git diff --check "$EXPECTED_BASE" HEAD
      - name: Install and build dependencies
        run: npm ci && npm run build:libs
      - name: Native regression qualification
        run: |
          set -o pipefail
          mkdir -p ../results
          node --test --test-reporter=tap test/util/mdict-*-cases.js test/util/search-refresh-cases.js 2>&1 | tee ../results/native.tap
      - name: Publish staging branch without modifying PRs or trunk
        env:
          SERIES: ${{ matrix.id }}
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/review/mdict-$SERIES-staged-20260921"
          git rev-parse HEAD > "../results/$SERIES.sha"
      - name: Stage the separate StripKey follow-up after the lookup corrections
        if: matrix.id == 'pr120'
        run: |
          set -euo pipefail
          git am ../packet/.mdict-review-delivery/stripkey.patch
          git diff --check HEAD~2 HEAD
          node --test --test-reporter=tap test/util/mdict-*-cases.js test/util/search-refresh-cases.js 2>&1 | tee ../results/stripkey-native.tap
          git push origin HEAD:refs/heads/review/mdict-stripkey-staged-20260921
          git rev-parse HEAD > ../results/stripkey.sha
      - name: JavaScript validation
        run: npm run test:js 2>&1 | tee ../results/javascript.log
      - name: TypeScript validation
        if: success() || failure()
        run: npm run test:ts 2>&1 | tee ../results/typescript.log
      - name: Preserve source and test results
        if: always()
        run: |
          mkdir -p ../results
          git rev-parse HEAD > ../results/tested-head.sha
          git archive HEAD | gzip > ../results/source.tar.gz
          tar -czf ../results/built-libs.tar.gz ext/lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mdict-reviewed-${{ matrix.id }}-${{ github.run_id }}
          path: results/
          retention-days: 7
