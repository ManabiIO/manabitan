name: MDict reviewed patch staging
on:
  push:
    branches: [review/mdict-delivery-20260921]
permissions:
  contents: read
concurrency:
  group: mdict-reviewed-patch-staging
  cancel-in-progress: false
jobs:
  media-serialization:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - uses: actions/checkout@v6
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 0cbf216a69d66518759cc53d3810d70ca1b18501
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install and build dependencies
        run: npm ci && npm run build:libs
      - name: Prove regression tests fail before applying the fix
        run: |
          git config user.name 'MDict review'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am ../packet/.mdict-review-delivery/media-tests.patch
          mkdir -p ../results
          if node test/fixtures/term-row-materialization/check.mjs ../results/before.json > ../results/before.log 2>&1; then
            echo 'Expected the known media serialization regressions to fail'
            exit 1
          fi
          node -e 'const r=require("../results/before.json"); if(r.failed!==24 || r.passed!==46) process.exit(1)'
      - name: Apply correction and qualify the complete native materialization suite
        run: |
          git am ../packet/.mdict-review-delivery/media-fix.patch
          git diff --check HEAD~2 HEAD
          node test/fixtures/term-row-materialization/check.mjs ../results/after.json > ../results/after.log
          node -e 'const r=require("../results/after.json"); if(r.failed!==0 || r.passed!==70) process.exit(1)'
          git push origin HEAD:refs/heads/fix/native-media-serialization-20260921
          git rev-parse HEAD > ../results/tested-head.sha
      - name: JavaScript and TypeScript qualification
        run: |
          npm run test:js 2>&1 | tee ../results/javascript.log
          npm run test:ts 2>&1 | tee ../results/typescript.log
      - name: Build static runtime and existing media fixture
        if: success() || failure()
        run: |
          node web/build.mjs
          python3 - <<'PY'
          import pathlib, json, zipfile, base64
          root = pathlib.Path('/tmp/mdict-media-probe')
          root.mkdir(exist_ok=True)
          source = pathlib.Path('web/prepare-fixtures.py').read_text()
          exec(source[source.index('def write('):])
          PY
          npx playwright install --with-deps chromium
      - name: Recheck real importer, SQLite and rendered image on the repaired source
        if: success() || failure()
        env:
          DICTIONARY_FIXTURES: /tmp/mdict-media-probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('web/e2e.mjs').read_text()
          prefix = source[:source.index('try {\n    await launch();')]
          suffix = '''try {
              await launch();
              await page.evaluate(() => openRuntime());
              await importFile('web-media.zip');
              await page.evaluate(() => find('画像検査'));
              await expect(page.locator('#result .gloss-image')).toHaveCount(1);
              await expect.poll(() => page.locator('#result .gloss-image').evaluate(el => el.complete && el.naturalWidth > 0)).toBe(true);
              console.log('MEDIA_REPAIRED', await page.locator('#result').innerHTML());
          } catch (error) {
              console.log('MEDIA_FAILURE', String(error));
              console.log('MEDIA_DOM', await page.locator('#result').innerHTML());
              process.exitCode = 1;
          } finally {
              await context?.close();
              await new Promise(r => server.close(r));
              await fs.rm(profile, {recursive: true, force: true});
              await save();
          }
          '''
          Path('web/media-review-probe.mjs').write_text(prefix + suffix)
          PY
          node web/media-review-probe.mjs 2>&1 | tee ../results/media-probe.log
      - name: Preserve source and results
        if: always()
        run: |
          mkdir -p ../results
          git rev-parse HEAD > ../results/tested-head.sha
          git archive HEAD | gzip > ../results/source.tar.gz
          tar -czf ../results/built-libs.tar.gz ext/lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-media-serialization-${{ github.run_id }}
          path: results/
          retention-days: 7
