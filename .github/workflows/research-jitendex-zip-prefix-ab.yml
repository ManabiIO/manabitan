name: Research Jitendex ZIP Prefix AB

on:
  push:
    branches:
      - research/jitendex-zip-prefix-ab-20261001

permissions:
  contents: read

jobs:
  import-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          path: candidate
      - name: Checkout baseline
        uses: actions/checkout@v6
        with:
          ref: e433f8ce407ee6cba7ccc48ded3571e01602fc83
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - name: Install and build libraries
        working-directory: candidate
        run: |
          npm ci
          npm run build:libs
      - name: Reuse dependencies and build baseline libraries
        shell: bash
        run: |
          ln -s "$GITHUB_WORKSPACE/candidate/node_modules" "$GITHUB_WORKSPACE/baseline/node_modules"
          cd baseline
          npm run build:libs
      - name: Install Chromium
        working-directory: candidate
        run: npx playwright install chromium
      - name: Prepare pinned dictionaries
        working-directory: candidate
        run: node ./dev/perf/prepare-dictionaries.js
      - name: Share dictionary cache
        shell: bash
        run: |
          mkdir -p baseline/builds
          cp -a candidate/builds/e2e-dictionary-cache baseline/builds/
      - name: Build both extensions once
        shell: bash
        run: |
          (cd baseline && node ./dev/bin/build.js --target chrome-dev)
          (cd candidate && node ./dev/bin/build.js --target chrome-dev)
      - name: Run alternating Jitendex pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/results"
          for pair in 1 2 3 4 5 6 7 8; do
            if (( pair % 2 == 1 )); then order="baseline candidate"; else order="candidate baseline"; fi
            for arm in $order; do
              out="$GITHUB_WORKSPACE/results/jitendex-pair${pair}-${arm}"
              (cd "$arm" && node ./dev/perf/import-benchmark.js jitendex --runs 1 --no-build --output "$out")
            done
          done
      - name: Run Jitendex baseline A/A controls
        shell: bash
        run: |
          set -euo pipefail
          for pair in 1 2 3 4; do
            for sample in a b; do
              out="$GITHUB_WORKSPACE/results/jitendex-aa${pair}-${sample}"
              (cd baseline && node ./dev/perf/import-benchmark.js jitendex --runs 1 --no-build --output "$out")
            done
          done
      - name: Summarize
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs'
          import path from 'node:path'
          const root = process.env.GITHUB_WORKSPACE
          const read = (dir) => JSON.parse(readFileSync(path.join(root, 'results', dir, 'summary.json'), 'utf8'))
          const median = (values) => {
            const s=[...values].sort((a,b)=>a-b); const m=Math.floor(s.length/2)
            return s.length%2?s[m]:(s[m-1]+s[m])/2
          }
          const pairs=[]
          for(let pair=1;pair<=8;++pair){
            const a=read(`jitendex-pair${pair}-baseline`)
            const b=read(`jitendex-pair${pair}-candidate`)
            const phase=(summary,name)=>{
              const p=summary.runs[0]?.stepTimingSummary?.phases?.find?.((x)=>x.name===name)
              return p?.durationMs ?? null
            }
            pairs.push({
              pair,
              baselineMs:a.timing.medianMs,
              candidateMs:b.timing.medianMs,
              changePct:(b.timing.medianMs/a.timing.medianMs-1)*100,
              workerBaselineMs:a.workerTiming?.medianMs??null,
              workerCandidateMs:b.workerTiming?.medianMs??null,
              sourceBaselineMs:phase(a,'term-file-fast-path'),
              sourceCandidateMs:phase(b,'term-file-fast-path'),
            })
          }
          const aa=[]
          for(let pair=1;pair<=4;++pair){
            const a=read(`jitendex-aa${pair}-a`).timing.medianMs
            const b=read(`jitendex-aa${pair}-b`).timing.medianMs
            aa.push({pair,aMs:a,bMs:b,changePct:(b/a-1)*100,absoluteChangePct:Math.abs((b/a-1)*100)})
          }
          const out={
            baseline:'e433f8ce407ee6cba7ccc48ded3571e01602fc83',
            candidate:process.env.GITHUB_SHA,
            pairs,
            summary:{
              pairedMedianChangePct:median(pairs.map(x=>x.changePct)),
              fasterPairs:pairs.filter(x=>x.candidateMs<x.baselineMs).length,
              baselineMedianMs:median(pairs.map(x=>x.baselineMs)),
              candidateMedianMs:median(pairs.map(x=>x.candidateMs)),
            },
            aa:{
              pairs:aa,
              medianAbsoluteChangePct:median(aa.map(x=>x.absoluteChangePct)),
              maxAbsoluteChangePct:Math.max(...aa.map(x=>x.absoluteChangePct)),
            }
          }
          console.log(JSON.stringify(out,null,2))
          writeFileSync(path.join(root,'results','summary-ab.json'),JSON.stringify(out,null,2))
          NODE
      - uses: actions/upload-artifact@v6
        with:
          name: jitendex-zip-prefix-ab
          path: results
          retention-days: 7
