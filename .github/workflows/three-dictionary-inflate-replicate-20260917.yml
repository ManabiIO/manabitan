name: Three dictionary exact decoder replication
on:
  push:
    branches: [verify/three-dictionary-import-20260917]
    paths: [.github/workflows/three-dictionary-inflate-replicate-20260917.yml]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/three-replication
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8191f6c6997d7afc5d54e647e93af6def48dfa98
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35175334044
          name: three-inflate-confirm-jitendex
          path: ${{ runner.temp }}/qualified
      - name: Verify immutable selected source and completed qualification
        run: |
          mkdir -p builds/three-replication
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'qualified'
          assert (p/'complete.txt').read_text().strip()=='QUALIFIED'
          assert hashlib.sha256((p/'product.patch').read_bytes()).hexdigest()=='4496e241a56bd344a3be7170f042cd68bcac6b8cd4616070bacdd2c325f653c4'
          assert hashlib.sha256((p/'source/inflate-abba.mjs').read_bytes()).hexdigest()=='70ef1cb988f56eb0b662c3d19f5b1cb5b5c843b63a872f23e3a8c79405884e29'
          report=json.loads((p/'summary.json').read_text())
          assert report['status']=='success' and len(report['observations'])==52
          PY
      - run: npm ci
      - name: Build the unmodified parent package at the same filesystem path
        run: |
          npm run build:libs > builds/three-replication/parent-libs.log 2>&1
          node dev/bin/build.js --target chrome-dev > builds/three-replication/parent-build.log 2>&1
          cp builds/manabitan-chrome-dev.zip "$RUNNER_TEMP/parent-chrome.zip"
          cp ext/lib/term-bank-parser.wasm "$RUNNER_TEMP/parent-parser.wasm"
      - name: Apply only the qualified source and build the identical executable
        run: |
          git apply --check "$RUNNER_TEMP/qualified/product.patch"
          git apply "$RUNNER_TEMP/qualified/product.patch"
          npm run build:libs > builds/three-replication/libs.log 2>&1
          sha256sum -c "$RUNNER_TEMP/qualified/qualified-inputs.sha256"
          node dev/bin/build.js --target chrome-dev > builds/three-replication/chrome-build.log 2>&1
          python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])
          a=p/'parent-chrome.zip'; b=Path('builds/manabitan-chrome-dev.zip')
          ha=lambda data:hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(a) as x,zipfile.ZipFile(b) as y:
              aa={n:ha(x.read(n)) for n in x.namelist() if not n.endswith('/')}
              bb={n:ha(y.read(n)) for n in y.namelist() if not n.endswith('/')}
          result={'parentZipBytes':a.stat().st_size,'candidateZipBytes':b.stat().st_size,
                  'parentWasmBytes':(p/'parent-parser.wasm').stat().st_size,'candidateWasmBytes':Path('ext/lib/term-bank-parser.wasm').stat().st_size,
                  'parentWasmSha256':ha((p/'parent-parser.wasm').read_bytes()),'candidateWasmSha256':ha(Path('ext/lib/term-bank-parser.wasm').read_bytes()),
                  'changedExistingMembers':[n for n in aa.keys()&bb.keys() if aa[n]!=bb[n]],'addedMembers':sorted(bb.keys()-aa.keys()),'removedMembers':sorted(aa.keys()-bb.keys())}
          Path('builds/three-replication/package-cost.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare identical checksum-locked harness and browser
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          path=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=path.read_text(); assert s.count('maxBuffer: 32 * 1024 * 1024')==2
          path.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/three-replication/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          npx playwright install --with-deps chromium
      - name: Fresh six-block same-build ABBA with reversed candidate/control order
        run: |
          node "$RUNNER_TEMP/qualified/source/inflate-abba.mjs" inflate,control 6 | tee builds/three-replication/abba.log
          sha256sum -c "$RUNNER_TEMP/qualified/qualified-inputs.sha256"
          echo COMPLETE > builds/three-replication/complete.txt
      - name: Retain every observation and source identity
        if: always()
        run: |
          mkdir -p builds/three-replication/source
          cp "$RUNNER_TEMP/qualified/product.patch" "$RUNNER_TEMP/qualified/qualified-inputs.sha256" builds/three-replication/ 2>/dev/null || true
          cp "$RUNNER_TEMP/qualified/source/inflate-abba.mjs" builds/three-replication/source/ 2>/dev/null || true
          git rev-parse HEAD > builds/three-replication/base.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-inflate-replication-${{ matrix.dictionary }}
          path: builds/three-replication
          retention-days: 30
