name: Import generic overlap 20260925
on:
  push:
    branches: [bench/import-generic-overlap-20260925]
    paths: [.github/workflows/import-generic-overlap-20260925.yml]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - dictionary: wty-en-en
            cohort: generic-on
            flags: '{"experimentalGenericSpanCompression":true}'
          - dictionary: jmnedict
            cohort: generic-on
            flags: '{"experimentalGenericSpanCompression":true}'
          - dictionary: jmdict
            cohort: generic-on
            flags: '{"experimentalGenericSpanCompression":true}'
          - dictionary: jitendex
            cohort: generic-on
            flags: '{"experimentalGenericSpanCompression":true}'
          - dictionary: wty-en-en
            cohort: disabled-control
            flags: '{}'
    env:
      DICTIONARY: ${{ matrix.dictionary }}
      FLAGS: ${{ matrix.flags }}
      PAIRS: '6'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Prepare exact arms and retained benchmark driver
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/perf/overlap-round-20260925/prepare.py
          git fetch --depth=1 origin da89ec3c9befdbd457ad66b47b5786a3243c7518
          git show FETCH_HEAD:dev/perf/numeric-round-20260925/ab.mjs > /tmp/ab.mjs
          git fetch --depth=1 origin 68a01320869e091a90344df7e9f992329b7e8eec
          git show FETCH_HEAD:dev/perf/hash-round-20260925/prepare.py > /tmp/fixture.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/ab.mjs').read_text().replace('builds/numeric-round', 'builds/overlap-round').replace('ext/js/dictionary/term-bank-wasm-parser.js', 'ext/js/dictionary/term-content-block-store.js')
          Path('dev/perf/overlap-round-20260925/ab.mjs').write_text(s)
          fixture=Path('/tmp/fixture.py').read_text().split("if os.environ.get('DICTIONARY') == 'wty-en-en':",1)[1]
          exec("from pathlib import Path\nimport json, os\nroot=Path('.')\nif os.environ.get('DICTIONARY') == 'wty-en-en':"+fixture)
          PY
          git diff > builds/overlap-round/source.patch
          cp dev/perf/overlap-round-20260925/ab.mjs builds/overlap-round/driver.mjs
          sha256sum builds/overlap-round/base.js builds/overlap-round/candidate.js ext/lib/term-bank-parser.wasm > builds/overlap-round/SHA256SUMS
      - name: Reservation codec and dedup regressions before timing
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run test/generic-span-codec-integration.test.js test/term-content-block-store.test.js test/dictionary-database-content-dedup.test.js test/term-content-opfs-store.test.js --no-file-parallelism 2>&1 | tee builds/overlap-round/tests.log
      - run: npx playwright install --with-deps chromium
      - uses: actions/cache@v5
        with:
          path: builds/e2e-dictionary-cache
          key: import-qualification-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fixed counterbalanced complete imports
        run: xvfb-run -a node dev/perf/overlap-round-20260925/ab.mjs
      - name: Preserve every observation and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-overlap-${{ matrix.dictionary }}-${{ matrix.cohort }}
          path: builds/overlap-round/
          retention-days: 30
          if-no-files-found: error
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MANABITAN_CHROMIUM_HEADLESS: '1'
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
      MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
      MANABITAN_E2E_PHASE_PROFILING: '0'
      MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
      MANABITAN_E2E_PROCESS_SAMPLING: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Isolate runtime and tests from research
        shell: bash
        run: |
          set -euo pipefail
          cp dev/perf/overlap-round-20260925/prepare.py /tmp/prepare.py
          git fetch --depth=1 origin 46c54d548c6d0739a9aed81f764c98ffb4d8fde8
          git reset --hard FETCH_HEAD
          python3 /tmp/prepare.py
      - uses: ./.github/actions/setup
      - name: All unit type lint and build checks
        shell: bash
        run: |
          mkdir -p builds/overlap-validation
          git diff --check
          git diff > builds/overlap-validation/source.patch
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          commands={
            'unit':['npm','run','test:unit','--','--no-file-parallelism'],
            'options':['npm','run','test:unit:options'],
            'types-main':['npm','run','test:ts:main'],
            'types-dev':['npm','run','test:ts:dev'],
            'types-test':['npm','run','test:ts:test'],
            'types-bench':['npm','run','test:ts:bench'],
            'lint':['npx','eslint','ext/js/dictionary/term-content-block-store.js','test/term-content-block-store.test.js','test/generic-span-codec-integration.test.js'],
            'build':['npm','run','build'],
          }
          status={}
          for name,args in commands.items():
            with open('builds/overlap-validation/'+name+'.log','w') as log:
              status[name]=subprocess.run(args,stdout=log,stderr=subprocess.STDOUT).returncode
            print(name,status[name],flush=True)
          Path('builds/overlap-validation/status.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
      - run: npx playwright install --with-deps chromium
      - name: Full lifecycle with generic reservations active
        shell: bash
        env:
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{"experimentalGenericSpanCompression":true}'
        run: |
          set -euo pipefail
          xvfb-run -a npm run test:e2e:chromium-extension 2>&1 | tee builds/overlap-validation/lifecycle.log
          cp builds/chromium-e2e-import-report.json builds/overlap-validation/lifecycle.json
      - name: Preserve all check outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generic-overlap-validation
          path: builds/overlap-validation/
          retention-days: 30
          if-no-files-found: error
      - name: Require all recorded checks
        run: python3 -c "import json; s=json.load(open('builds/overlap-validation/status.json')); assert s and all(v==0 for v in s.values()),s"
