name: Three dictionary CRC screen
on:
  push:
    branches: [verify/three-crc-20260917]
    paths: [.github/workflows/three-crc-screen-20260917.yml]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, wty-en-en]
    env:
      THREE_DICTIONARY: ${{ matrix.dictionary }}
      THREE_OUTPUT: builds/crc-screen
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35175334044
          name: three-inflate-confirm-jitendex
          path: ${{ runner.temp }}/prior
      - name: Prepare default-off candidates and immutable timing driver
        run: |
          mkdir -p builds/crc-screen
          python3 dev/perf/crc-round-20260917/prepare.py
          cp dev/perf/crc-round-20260917/test-crc.js test/term-bank-crc.test.js
          python3 dev/perf/crc-round-20260917/setup-harness.py "$RUNNER_TEMP/prior/source/inflate-abba.mjs"
          git diff --check
      - run: npm ci
      - name: Build and test actual WASM paths before timing
        run: |
          npm run build:libs > builds/crc-screen/libs.log 2>&1
          node node_modules/vitest/vitest.mjs run test/term-bank-crc.test.js test/term-bank-experiments.test.js test/term-bank-inflater.test.js > builds/crc-screen/focused.log 2>&1
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-next-fixtures-b9603db-v1
      - name: Prepare complete pinned dictionaries and common browser harness
        run: |
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])
          (p/'fixture.py').write_text((p/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          p=Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s=p.read_text(); assert s.count('maxBuffer: 32 * 1024 * 1024')==2
          p.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/fixture.py" > builds/crc-screen/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/crc-screen/chrome-build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Serial same-build ABBA with full imports and interleaved A/A
        run: node "$RUNNER_TEMP/prior/source/crc-abba.mjs" control,slice16,slice32,braid 2 | tee builds/crc-screen/abba.log
      - name: Retain every observation and exact runtime source
        if: always()
        run: |
          mkdir -p builds/crc-screen/source
          git add -N test/term-bank-crc.test.js
          git diff HEAD -- ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/wasm/term-bank-parser.c types/ext/dictionary-importer.d.ts test/term-bank-crc.test.js > builds/crc-screen/product.patch
          cp "$RUNNER_TEMP/prior/source/crc-abba.mjs" builds/crc-screen/source/ 2>/dev/null || true
          cp dev/perf/crc-round-20260917/prepare.py dev/perf/crc-round-20260917/setup-harness.py builds/crc-screen/source/
          tar -czf builds/crc-screen/source.tar.gz ext/js/dictionary/term-bank-wasm-parser.js ext/js/dictionary/term-bank-experiments.js ext/js/dictionary/wasm/term-bank-parser.c types/ext/dictionary-importer.d.ts test/term-bank-crc.test.js ext/lib/term-bank-parser.wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crc-screen-${{ matrix.dictionary }}
          path: builds/crc-screen
          retention-days: 30
