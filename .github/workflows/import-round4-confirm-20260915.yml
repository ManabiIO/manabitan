name: Storage and string compaction independent confirmation
on:
  push:
    branches: [verify/import-round4-20260915]
    paths: [.github/workflows/import-round4-confirm-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [record-direct, string-runs]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 23365332a4f913fd2fbefe86bdeff3908f004375
          persist-credentials: false
      - name: Preserve immutable inputs and baseline
        run: |
          cp -a dev/perf/round4-20260915 "$RUNNER_TEMP/round4-review"
          git fetch --depth=1 origin 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          git checkout --detach 30ffb604e0a87f0aa252bd4331bc54668062b1e1
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round4-review/source-screen.py'
          s = p.read_text()
          assert s.count('CANDIDATES = {') == 1
          p.write_text(s.replace('CANDIDATES = {', "CANDIDATES = {\n    'string-runs': ('term-record-preinterned-plan.js', 'a6f19c1f090f24ff51cc06da444ec3060da731fc8826bf60353f7df0fb927a1f'),"))
          PY
          python3 -m py_compile "$RUNNER_TEMP/round4-review/source-screen.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - run: node dev/bin/build.js --target chrome-dev
      - name: Twelve reversed-order pairs and six interleaved AA controls
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: python3 "$RUNNER_TEMP/round4-review/source-screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round4-confirm-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/round4-screen
          retention-days: 30
