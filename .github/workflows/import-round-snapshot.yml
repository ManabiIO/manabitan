name: Import round snapshot
on:
  push:
    branches: [verify/import-round-20260924-b73d]
    paths: [.github/workflows/import-round-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2185eeaac05efa0fd60eea49e3f00ce3e048aabe
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '22.16.0'
      - name: Package source and test dependencies
        run: |
          git rev-parse HEAD > /tmp/source-head.txt
          tar --exclude=.git --exclude='./.env*' -czf /tmp/manabitan-review-source.tgz .
          sha256sum /tmp/manabitan-review-source.tgz > /tmp/source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: import-round-source-b73d
          path: |
            /tmp/manabitan-review-source.tgz
            /tmp/source-head.txt
            /tmp/source-sha256.txt
          retention-days: 3
          compression-level: 0
