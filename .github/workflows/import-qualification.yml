name: Import qualification (fixed sources)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/import-qualification.yml'
      - 'dev/perf/import-qualification/**'
      - 'test/import-qualification.test.js'

permissions:
  contents: read

jobs:
  qualify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'perf/import-qualification-20261125-0a404'
    name: ${{ matrix.candidate }} / ${{ matrix.dictionary }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        candidate: [startup, media]
        dictionary: [jmdict, jitendex, vndb]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'

      - name: Install lockfile-matched Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore pinned dictionaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}

      - name: Prepare pinned dictionaries
        env:
          QUALIFICATION_DICTIONARY: ${{ matrix.dictionary }}
        run: node dev/perf/prepare-dictionaries.js jmdict jmnedict jitendex "$QUALIFICATION_DICTIONARY"

      - name: Run fixed source comparison
        timeout-minutes: 25
        env:
          QUALIFICATION_CANDIDATE: ${{ matrix.candidate }}
          QUALIFICATION_DICTIONARY: ${{ matrix.dictionary }}
          QUALIFICATION_PROTOCOL_SHA: ${{ github.event.pull_request.head.sha }}
        run: node dev/perf/import-qualification/run.js run "$QUALIFICATION_CANDIDATE" "$QUALIFICATION_DICTIONARY"

      - name: Preserve every observation, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-qualification-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/perf/import-qualification/
          if-no-files-found: warn
          retention-days: 14
