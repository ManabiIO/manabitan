name: Compression setup import source comparison
on:
  push:
    branches: [verify/import-round5-20260916]
    paths: [.github/workflows/import-round5-screen-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        candidate: [cdict, shared, overlap]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58b837633d09becd191fc95b1623b13a4f0bc7f4
          persist-credentials: false
      - name: Preserve immutable review inputs and select production baseline
        run: |
          cp -a dev/perf/round5-20260916 "$RUNNER_TEMP/round5-review"
          git fetch --depth=1 origin b4094a423c20bb0ed424d944238f922c1b36559c
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
          python3 -m py_compile "$RUNNER_TEMP/round5-review/"*.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: mymindstorm/setup-emsdk@v14
        if: matrix.candidate == 'cdict'
        with:
          version: '4.0.10'
          actions-cache-folder: emsdk-cache
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify checksum-pinned complete dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Actual codec conformance and six alternating source pairs
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: python3 "$RUNNER_TEMP/round5-review/screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round5-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/round5
          retention-days: 30
