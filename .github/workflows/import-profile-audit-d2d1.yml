name: Existing JMdict profile attribution audit d2d1

on:
  push:
    branches: [lab/import-profile-audit-20261128-d2d1]
    paths: [.github/workflows/import-profile-audit-d2d1.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: import-profile-audit-d2d1
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Reanalyze frozen existing profile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile
          from collections import Counter, defaultdict
          artifact_id = 15244699610
          expected_sha256 = "a5b5205577d59e80533f1e2b313c561b091c5194c7dc9afc4ed9efa110cc9148"
          request = urllib.request.Request(
              f"https://api.github.com/repos/ManabiIO/manabitan/actions/artifacts/{artifact_id}/zip",
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(request, timeout=120) as response:
              archive_bytes = response.read()
          actual_sha256 = hashlib.sha256(archive_bytes).hexdigest()
          assert actual_sha256 == expected_sha256, (actual_sha256, expected_sha256)
          archive = zipfile.ZipFile(io.BytesIO(archive_bytes))
          paths = archive.namelist()
          trace_paths = [name for name in paths if name.endswith("trace/run-1.trace.json")]
          assert len(trace_paths) == 1, trace_paths
          trace_bytes = archive.read(trace_paths[0])
          trace = json.loads(trace_bytes)
          events = trace if isinstance(trace, list) else trace["traceEvents"]
          groups = defaultdict(lambda: {"nodes": {}, "samples": [], "deltas": [], "profileEvents": []})
          event_counts = Counter()
          for event in events:
              event_counts[event.get("name")] += 1
              if event.get("name") not in ("Profile", "ProfileChunk"):
                  continue
              data = event.get("args", {}).get("data", {})
              key = (event.get("pid"), event.get("tid"), str(event.get("id", event.get("id2", ""))))
              group = groups[key]
              if event.get("name") == "Profile":
                  group["profileEvents"].append(data)
              profile = data.get("cpuProfile", {})
              for node in profile.get("nodes", []):
                  old = group["nodes"].get(node["id"])
                  if old is None:
                      group["nodes"][node["id"]] = node
                  else:
                      children = list(dict.fromkeys(old.get("children", []) + node.get("children", [])))
                      old.update(node)
                      if children:
                          old["children"] = children
              group["samples"].extend(profile.get("samples", []))
              group["deltas"].extend(data.get("timeDeltas", profile.get("timeDeltas", [])))
          summaries = []
          for key, group in groups.items():
              samples, deltas, nodes = group["samples"], group["deltas"], group["nodes"]
              if not samples:
                  continue
              assert len(samples) == len(deltas), (key, len(samples), len(deltas))
              self_us = Counter()
              inclusive_us = Counter()
              parents = {}
              for node_id, node in nodes.items():
                  for child in node.get("children", []):
                      assert child not in parents or parents[child] == node_id, (key, child)
                      parents[child] = node_id
                  if "parent" in node:
                      assert node_id not in parents or parents[node_id] == node["parent"], (key, node_id)
                      parents[node_id] = node["parent"]
              for node_id, delta in zip(samples, deltas):
                  assert node_id in nodes, (key, node_id)
                  assert delta >= 0, (key, node_id, delta)
                  self_us[node_id] += delta
                  seen = set()
                  cursor = node_id
                  while cursor is not None:
                      assert cursor not in seen, (key, cursor)
                      seen.add(cursor)
                      inclusive_us[cursor] += delta
                      cursor = parents.get(cursor)
              rows = []
              for node_id in nodes:
                  frame = nodes[node_id].get("callFrame", {})
                  parent = nodes.get(parents.get(node_id), {}).get("callFrame", {})
                  rows.append({"nodeId": node_id, "function": frame.get("functionName"), "url": frame.get("url"),
                               "lineNumber": frame.get("lineNumber"), "selfMs": self_us[node_id] / 1000,
                               "inclusiveMs": inclusive_us[node_id] / 1000, "parentFunction": parent.get("functionName"),
                               "parentUrl": parent.get("url")})
              rows.sort(key=lambda row: row["selfMs"], reverse=True)
              summaries.append({"pid": key[0], "tid": key[1], "profileId": key[2],
                                "samples": len(samples), "sampledMs": sum(deltas) / 1000,
                                "profileEvents": group["profileEvents"], "functions": rows})
          output = {"kind": "existing-profile-attribution-audit", "authoritativeTiming": False,
                    "source": "1f1f9ff00b8a33df338d3640e6e14498465fe631", "runId": 46100048089,
                    "artifactId": artifact_id, "artifactSha256": actual_sha256, "tracePath": trace_paths[0],
                    "traceSha256": hashlib.sha256(trace_bytes).hexdigest(), "eventCount": len(events),
                    "eventNames": event_counts, "profiles": summaries,
                    "limits": "Reanalysis of one existing profiled baseline import. Samples overlap across threads and are not additive wall time or a controlled speed comparison."}
          pathlib.Path("profile-audit").mkdir()
          pathlib.Path("profile-audit/summary.json").write_text(json.dumps(output, indent=2) + "\n")
          print("PROFILE_AUDIT_METADATA " + json.dumps({key: value for key, value in output.items() if key != "profiles"}, sort_keys=True))
          for summary in summaries:
              compact = dict(summary)
              compact["functions"] = [row for row in summary["functions"] if row["selfMs"] > 0][:35]
              print("PROFILE_AUDIT_FUNCTIONS " + json.dumps(compact, sort_keys=True))
          assert summaries, "Trace contained no CPU samples"
          PY
      - name: Retain source profile attribution
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: existing-jmdict-profile-audit-d2d1
          path: profile-audit/
          if-no-files-found: error
          retention-days: 90
