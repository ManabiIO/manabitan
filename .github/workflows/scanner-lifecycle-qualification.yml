name: Scanner lifetime qualification
on:
  push:
    branches: [research/scanner-lifecycle-refinement-20260918]
    paths: [.github/workflows/scanner-lifecycle-qualification.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.21.0'}
      - name: Apply exact reviewed source
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess,json
          data=''.join(pathlib.Path(f'research/scanner-refinement-{i}.b64').read_text().strip() for i in range(1,5))
          raw=gzip.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='da9c2f54f5a189487a2e9539bf81a7cb036cca5f878faa4799a1232a67782d29'
          pathlib.Path('evidence/scanner.patch').write_bytes(raw)
          subprocess.run(['git','apply','--check','evidence/scanner.patch'],check=True)
          subprocess.run(['git','apply','evidence/scanner.patch'],check=True)
          files=['ext/js/language/text-scanner.js','test/text-scanner.test.js','test/reader-scanner-lifecycle.test.js','test/dictionary-importer-shared-buffer.test.js']
          pathlib.Path('evidence/reviewed-source.json').write_text(json.dumps([{'path':p,'content':pathlib.Path(p).read_text()} for p in files]))
          PY
      - run: npm ci
      - run: npm run build:libs
      - name: Unit and static checks
        run: |
          set -o pipefail
          npx vitest run test/reader-scanner-lifecycle.test.js test/text-scanner.test.js test/dictionary-importer-shared-buffer.test.js test/web-asset-fetch.test.js test/web-asset-paths.test.js test/dictionary-worker-backend.test.js 2>&1 | tee evidence/unit.log
          npx eslint ext/js/language/text-scanner.js test/text-scanner.test.js test/reader-scanner-lifecycle.test.js test/dictionary-importer-shared-buffer.test.js 2>&1 | tee evidence/lint.log
          npx tsc --noEmit --project tsconfig.json 2>&1 | tee evidence/types-main.log
          npx tsc --noEmit --project test/tsconfig.json 2>&1 | tee evidence/types-test.log
      - name: Build real extension
        run: node dev/bin/build.js chrome-dev 2>&1 | tee evidence/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-lifetime-evidence
          path: evidence/
          retention-days: 7
  record:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {name: scanner-lifetime-evidence}
      - name: Record source blobs without modifying branches
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import os,json,hashlib,pathlib,urllib.request
          allowed={'ext/js/language/text-scanner.js','test/text-scanner.test.js','test/reader-scanner-lifecycle.test.js','test/dictionary-importer-shared-buffer.test.js'}
          files=json.loads(pathlib.Path('reviewed-source.json').read_text());assert {e['path'] for e in files}==allowed
          result=[]
          for e in files:
            raw=e['content'].encode();expected=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            r=urllib.request.Request('https://api.github.com/repos/ManabiIO/manabitan/git/blobs',data=json.dumps({'content':e['content'],'encoding':'utf-8'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(r,timeout=30) as response: actual=json.load(response)['sha']
            assert actual==expected
            result.append({'path':e['path'],'sha':actual,'mode':'100644','type':'blob'})
          pathlib.Path('reviewed-blobs.json').write_text(json.dumps(result));print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: scanner-lifetime-blobs, path: reviewed-blobs.json, retention-days: 7}
