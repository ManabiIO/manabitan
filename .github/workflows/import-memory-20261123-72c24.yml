name: Frozen key-view import-window memory diagnosis

on:
  push:
    branches: ['perf/import-memory-key-view-20261123-72c24']

permissions:
  contents: read

concurrency:
  group: import-memory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        replication: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Check observer coverage rules and readback guards
        run: |
          python3 dev/perf/import-memory-20261123-72c24/test_chromium_memory.py
          python3 dev/perf/import-memory-20261123-72c24/test_import_window.py
          python3 dev/perf/import-memory-20261123-72c24/test_parallel_reads.py
          node --test dev/perf/import-study-20261123/verify.test.mjs
          python3 dev/perf/import-study-20261123/test_media_reference.py
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore locked dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: import-study-20261123-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Acquire every predeclared memory observation once
        run: python3 dev/perf/import-memory-20261123-72c24/run_memory.py --dictionary '${{ matrix.dictionary }}' --replication '${{ matrix.replication }}'
      - name: Retain all samples and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-window-memory-${{ matrix.dictionary }}-${{ matrix.replication }}-attempt-${{ github.run_attempt }}
          path: builds/import-memory-20261123-72c24
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
