name: WTY candidate ABBA confirmation
on:
  push:
    branches: [verify/wty-import-abba-20260916]
    paths: [.github/workflows/wty-confirm-20260916.yml]
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-en-en-21b1b22-c0a1b7ee-v1
      - name: Prepare exact WTY workload and candidate source
        shell: bash
        run: |
          mkdir -p builds/wty-confirm "$RUNNER_TEMP/wty-assets"
          cp -R dev/perf/wty-abba-20260916/. "$RUNNER_TEMP/wty-assets/"
          python3 dev/perf/wty-abba-20260916/prepare.py
          python3 "$RUNNER_TEMP/wty-assets/apply-candidates.py" simd capacity
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s = p.read_text()
          old = "const {stdout} = await execFileAsync('unzip', ['-p', zipPath, banks[bankIndex]], {maxBuffer: 32 * 1024 * 1024});"
          assert s.count(old) == 1
          p.write_text(s.replace(old, old.replace('32 * 1024', '128 * 1024')))
          PY
          cp "$RUNNER_TEMP/wty-assets/abba.mjs" test/chromium/wty-abba-benchmark.mjs
          git diff -- ext types test/chromium dev/perf/dictionary-fixtures.js test/perf/dictionaries.lock.json > builds/wty-confirm/measured-source.patch
      - run: npm ci
      - name: Build exact measured package
        shell: bash
        run: |
          set -o pipefail
          npm run build:libs 2>&1 | tee builds/wty-confirm/build-libs.log
          node dev/bin/build.js --target chrome-dev 2>&1 | tee builds/wty-confirm/build.log
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          sha256sum ext/lib/term-bank-parser.wasm builds/manabitan-chrome-dev.zip > builds/wty-confirm/runtime.sha256
      - name: Six-block serial ABBA replication
        shell: bash
        env:
          WTY_ABBA_OUTPUT: builds/wty-confirm
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
        run: |
          set -o pipefail
          node test/chromium/wty-abba-benchmark.mjs control,simd,capacitySingle,capacitySingleNative,combined,native,spans 6 2>&1 | tee builds/wty-confirm/driver.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wty-candidate-abba-confirmation
          path: builds/wty-confirm
          retention-days: 30
