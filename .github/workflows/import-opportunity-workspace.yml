name: Import opportunity workspace
on:
  push:
    branches: [verify/import-opportunities-20260914]
    paths: [.github/workflows/import-opportunity-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 385857d029cb32160f05f4923e08712e34cc327b
          persist-credentials: false
      - name: Export exact source
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          git archive HEAD | gzip > "$RUNNER_TEMP/source/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source/identity.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source/tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: import-opportunity-source
          path: ${{ runner.temp }}/source
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm ci
      - run: node dev/perf/prepare-dictionaries.js
      - uses: actions/upload-artifact@v4
        with:
          name: import-opportunity-pinned-dictionaries
          path: builds/e2e-dictionary-cache/*.zip
          retention-days: 7
