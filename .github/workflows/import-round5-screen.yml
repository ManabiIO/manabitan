name: Research-driven import source comparisons
on:
  push:
    branches: [verify/import-round5-20260915]
    paths: [.github/workflows/import-round5-screen.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preserve reviewed native patch, then select pinned develop
        run: |
          cp dev/perf/round5-20260915/native-exports.patch "$RUNNER_TEMP/native.patch"
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '5.0.1'
      - name: Record stock reproducibility separately from extra exports
        run: |
          mkdir -p "$RUNNER_TEMP/native-assets/dev/data" "$RUNNER_TEMP/native-assets/dev/lib"
          cp dev/data/zstd-simd.wasm "$RUNNER_TEMP/stock.wasm"
          cp dev/lib/zstd-simd-module.js "$RUNNER_TEMP/stock.js"
          node dev/bin/build-zstd-wasm.js --write
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          t=Path(os.environ['RUNNER_TEMP'])
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          result={kind:{'stock':h(t/f'stock.{kind}'),'rebuilt':h(Path(path))}
              for kind,path in [('wasm','dev/data/zstd-simd.wasm'),('js','dev/lib/zstd-simd-module.js')]}
          (t/'native-assets/stock-rebuild.json').write_text(json.dumps(result,indent=2))
          print(result)
          PY
          git restore dev/data/zstd-simd.wasm dev/lib/zstd-simd-module.js
          git apply --check "$RUNNER_TEMP/native.patch"
          git apply "$RUNNER_TEMP/native.patch"
          node dev/bin/build-zstd-wasm.js --write
          cp dev/data/zstd-simd.wasm "$RUNNER_TEMP/native-assets/dev/data/"
          cp dev/lib/zstd-simd-module.js "$RUNNER_TEMP/native-assets/dev/lib/"
          emcc --version > "$RUNNER_TEMP/native-assets/toolchain.txt"
          sha256sum dev/data/zstd-simd.wasm dev/lib/zstd-simd-module.js >> "$RUNNER_TEMP/native-assets/toolchain.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: round5-native-assets
          path: ${{ runner.temp }}/native-assets
          retention-days: 30
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [media-local, media-streams]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preserve reviewed driver and select pinned baseline
        run: |
          cp -a dev/perf/round5-20260915 "$RUNNER_TEMP/round5-review"
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
          python3 -m py_compile "$RUNNER_TEMP/round5-review/screen.py"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - run: node dev/bin/build.js --target chrome-dev
      - name: Six alternating source pairs with interleaved AA controls
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
        run: python3 "$RUNNER_TEMP/round5-review/screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round5-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/round5
          retention-days: 30
  compression:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [cdict, exports-control]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Preserve reviewed driver and select pinned baseline
        run: |
          cp -a dev/perf/round5-20260915 "$RUNNER_TEMP/round5-review"
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
          python3 -m py_compile "$RUNNER_TEMP/round5-review/screen.py"
      - uses: actions/download-artifact@v4
        with:
          name: round5-native-assets
          path: ${{ runner.temp }}/native-assets
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch checksum-pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - run: node dev/bin/build.js --target chrome-dev
      - name: Real codec conformance and six alternating source pairs
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
        run: python3 "$RUNNER_TEMP/round5-review/screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round5-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/round5
          retention-days: 30
