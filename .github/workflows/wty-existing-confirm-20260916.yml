name: WTY existing-flag ABBA confirmation
on:
  push:
    branches: [verify/wty-import-abba-20260916]
    paths: [.github/workflows/wty-existing-confirm-20260916.yml]
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-en-en-21b1b22-c0a1b7ee-v1
      - name: Prepare pinned workload and common baseline correction
        shell: bash
        run: |
          mkdir -p builds/wty-existing-confirm "$RUNNER_TEMP/wty-assets"
          cp -R dev/perf/wty-abba-20260916/. "$RUNNER_TEMP/wty-assets/"
          python3 dev/perf/wty-abba-20260916/prepare.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s = p.read_text()
          old = "const {stdout} = await execFileAsync('unzip', ['-p', zipPath, banks[bankIndex]], {maxBuffer: 32 * 1024 * 1024});"
          assert s.count(old) == 1
          p.write_text(s.replace(old, old.replace('32 * 1024', '128 * 1024')))
          PY
          cp "$RUNNER_TEMP/wty-assets/abba.mjs" test/chromium/wty-existing-abba.mjs
      - run: npm ci
      - name: Build one flags-off/flags-on package
        run: |
          npm run build:libs > builds/wty-existing-confirm/build-libs.log 2>&1
          node dev/bin/build.js --target chrome-dev > builds/wty-existing-confirm/build.log 2>&1
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          sha256sum builds/manabitan-chrome-dev.zip ext/lib/term-bank-parser.wasm > builds/wty-existing-confirm/runtime.sha256
      - name: Four-block serial ABBA replication
        shell: bash
        env:
          WTY_ABBA_OUTPUT: builds/wty-existing-confirm
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
        run: |
          set -o pipefail
          node test/chromium/wty-existing-abba.mjs control,validatedGlossary,globalContent,lookupScratch,segmentedLookup,fastGlossary 4 2>&1 | tee builds/wty-existing-confirm/driver.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wty-existing-flag-confirmation
          path: builds/wty-existing-confirm
          retention-days: 30
