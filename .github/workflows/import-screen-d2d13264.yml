name: Import source registration screen d2d13264

on:
  push:
    branches:
      - perf/import-screen-registration-20261127-d2d13264
    paths:
      - .github/workflows/import-screen-d2d13264.yml

permissions:
  contents: read

concurrency:
  group: import-screen-d2d13264-${{ github.ref }}
  cancel-in-progress: false

env:
  PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
  PERF_CANDIDATE: 6d6600a3277f83782729fcce14ea7e02f48a4b40

jobs:
  validation:
    name: Frozen candidate validation
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MANABITAN_CLANG: /usr/bin/clang-21
      MANABITAN_WASM_LD: /usr/bin/wasm-ld-21
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PERF_CANDIDATE }}
          persist-credentials: false
      - name: Install pinned native test compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-21 lld-21
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Lint changed source and tests
        run: node node_modules/eslint/bin/eslint.js ext/js/dictionary/dictionary-database.js test/dictionary-in-flight-source-validation.test.js
      - name: Type-check product and tests
        run: npm run test:ts:main && npm run test:ts:test
      - name: Run complete unit suite
        run: npm run test:unit
      - name: Verify all build targets
        run: npm run test:build

  screen:
    needs: validation
    name: ${{ matrix.dictionary }} (six AB pairs)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Check qualification receipt tests
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore locked dictionaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Screen frozen source with unchanged qualification tooling
        shell: bash
        run: |
          set -euo pipefail
          evidence_root=builds/perf/import-screen-d2d13264
          mkdir -p "$evidence_root"
          git rev-parse HEAD HEAD^{tree} > "$evidence_root/workflow-source.txt"
          sha256sum .github/workflows/import-screen-d2d13264.yml > "$evidence_root/workflow-sha256.txt"
          policy=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            policy+=(--vndb-sah-allocation-units 37 37)
          fi
          python - <<'PY'
          import json, pathlib
          plan = json.loads("{\"stage\":\"exploratory-six-pair-screen\",\"frozenBeforeFirstTiming\":true,\"primaryDictionary\":\"jmdict\",\"screenIsNotPromotion\":true,\"confirmation\":{\"hosts\":2,\"pairsPerHost\":12,\"initialOrders\":[\"AB\",\"BA\"],\"minimumMedianImprovementPercent\":3,\"minimumFasterPairs\":10,\"candidateMedianIntervalUpperPercent\":0,\"equalWorkMustImprove\":true,\"maximumAbsoluteControlMedianAndEqualWorkPercent\":1.5,\"minimumEffectToControlShiftRatio\":2,\"otherDictionaryMedianEqualWorkAndIntervalUpperRegressionPercent\":3,\"independentHostsNotPooled\":true,\"allObservationsAndFailuresRetained\":true},\"otherGates\":\"Unchanged semantic, source/package identity, storage, lookup, and qualified sampled-memory checks; report package-size delta separately.\"}")
          pathlib.Path('builds/perf/import-screen-d2d13264/review-criteria.json').write_text(json.dumps(plan, indent=2) + '\n')
          print('REVIEW_CRITERIA ' + json.dumps(plan, sort_keys=True))
          PY
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order AB \
            --pairs 6 \
            --expected-package-entry js/dictionary/dictionary-database.js \
            "${policy[@]}" \
            --evidence "$evidence_root/cohort" \
            2>&1 | tee "$evidence_root/acquisition.log"
      - name: Print compact retained evidence for independent audit
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('builds/perf/import-screen-d2d13264')
          cohort = root / 'cohort'
          paths = ['analysis.json', 'observations.json', 'registered-plan.json', 'browser-identity.json',
                   'memory/memory-comparison.json', 'memory/memory-audit.json',
                   'memory/memory-audit-failure.json', 'memory/semantic-failures.json']
          for relative in paths:
              path = cohort / relative
              if path.is_file():
                  print('EVIDENCE_JSON ' + relative + ' ' + json.dumps(json.loads(path.read_text()), sort_keys=True))
          source = cohort / 'source-identities.json'
          if source.is_file():
              identities = json.loads(source.read_text())
              for arm in identities['arms'].values():
                  arm['packagedEntryCount'] = len(arm.pop('entries'))
              print('EVIDENCE_JSON source-identities-compact.json ' + json.dumps(identities, sort_keys=True))
          for path in sorted(cohort.glob('package-*.zip')):
              print('PACKAGE_BYTES ' + json.dumps({'name': path.name, 'bytes': path.stat().st_size,
                                                   'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}, sort_keys=True))
          if not (cohort / 'analysis.json').is_file():
              for path in sorted(root.rglob('*.log')):
                  lines = path.read_text(errors='replace').splitlines()
                  print('INCOMPLETE_LOG_TAIL ' + str(path) + '\n' + '\n'.join(lines[-35:]))
          PY
      - name: Preserve all observations, packages and failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: import-registration-d2d13264-${{ matrix.dictionary }}-${{ github.run_id }}
          path: builds/perf/import-screen-d2d13264
          if-no-files-found: error
          retention-days: 90
