name: Qualify develop runtime lifecycle final

on:
  push:
    branches:
      - fix/runtime-lifecycle-develop-final-20260914
    paths:
      - .github/workflows/qualify-develop-runtime-lifecycle-final.yml
      - dev/qualify-develop-runtime-lifecycle.py

permissions:
  contents: write

concurrency:
  group: qualify-develop-runtime-lifecycle-final
  cancel-in-progress: true

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build:libs

      - name: Confirm untouched develop baseline and its two stale unit expectations
        shell: bash
        run: |
          mkdir -p /tmp/develop-lifecycle-final
          git rev-parse HEAD > /tmp/develop-lifecycle-final/input-commit.txt
          test "$(git hash-object ext/js/background/backend.js)" = 5867b976053287fa250d6cf006dc9a5641eed29e
          test "$(git hash-object ext/js/background/offscreen-proxy.js)" = 2ebdd4770e79e58642fde5da17ebbb7b9a43efe4
          test "$(git hash-object test/offscreen-dictionary-worker-import.test.js)" = 9b5c564cd2bb0e1a2e776e706a33a7dd659ed995
          set +e
          npm run test:unit -- --reporter=json --outputFile=/tmp/develop-lifecycle-final/baseline-unit.json
          status=$?
          set -e
          test "$status" -ne 0
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          const report = JSON.parse(readFileSync('/tmp/develop-lifecycle-final/baseline-unit.json', 'utf8'))
          const failed = report.testResults.flatMap((suite) => suite.assertionResults).filter((test) => test.status === 'failed')
          assert.equal(failed.length, 2)
          assert.deepEqual(failed.map((test) => test.title).sort(), [
              'fans out adjacent lookups after an import instead of serializing them',
              'queues lookups behind import while processing cancellation outside the mutation queue',
          ])
          JS

      - name: Add lifecycle regressions and confirm red state
        shell: bash
        run: |
          python dev/qualify-develop-runtime-lifecycle.py add-tests
          set +e
          npx vitest run test/runtime-lifecycle-develop.test.js --reporter=json --outputFile=/tmp/develop-lifecycle-final/lifecycle-red.json
          status=$?
          set -e
          test "$status" -ne 0
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import {readFileSync} from 'node:fs'
          const report = JSON.parse(readFileSync('/tmp/develop-lifecycle-final/lifecycle-red.json', 'utf8'))
          const results = report.testResults.flatMap((suite) => suite.assertionResults)
          for (const title of [
              'publishes the mutation tail before a task can synchronously re-enter',
              'coalesces the offscreen existence probe and creation',
              'ordinary offscreen recovery closes the port owned by a vanished document',
              'successful control-port bootstrap clears its registration deadline',
          ]) {
              assert.equal(results.find((test) => test.title === title)?.status, 'failed', title)
              console.log(`Confirmed red: ${title}`)
          }
          JS

      - name: Apply narrowed fixes and import-busy test reconciliation
        run: python dev/qualify-develop-runtime-lifecycle.py apply-fixes

      - name: Require clean lint and all type projects
        shell: bash
        run: |
          npx eslint \
            ext/js/background/backend.js \
            ext/js/background/offscreen-proxy.js \
            test/runtime-lifecycle-develop.test.js \
            test/offscreen-dictionary-worker-import.test.js
          npm run test:ts:main
          npm run test:ts:dev
          npm run test:ts:test
          npm run test:ts:bench
          git diff --check

      - name: Run focused reliability suites
        run: >-
          npx vitest run
          test/runtime-lifecycle-develop.test.js
          test/offscreen-proxy-bridge.test.js
          test/offscreen-dictionary-worker-import.test.js
          test/dictionary-worker-client.test.js
          test/offscreen-worker-recovery.test.js
          test/backend-lookup-refresh.test.js
          --reporter=json
          --outputFile=/tmp/develop-lifecycle-final/focused-green.json

      - name: Run full unit and options suites
        shell: bash
        run: |
          npm run test:unit -- --reporter=json --outputFile=/tmp/develop-lifecycle-final/unit-green.json
          npm run test:unit:options -- --reporter=json --outputFile=/tmp/develop-lifecycle-final/options-green.json

      - name: Build all targets and Chromium development package
        shell: bash
        run: |
          npm run license-report:html
          npm run test:build > /tmp/develop-lifecycle-final/build-all.log 2>&1
          node ./dev/bin/build.js --target chrome-dev > /tmp/develop-lifecycle-final/build-chromium.log 2>&1
          git diff --check

      - name: Commit only qualified source and tests
        shell: bash
        run: |
          git fetch origin fix/runtime-lifecycle-develop-final-20260914
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            ext/js/background/backend.js \
            ext/js/background/offscreen-proxy.js \
            test/runtime-lifecycle-develop.test.js \
            test/offscreen-dictionary-worker-import.test.js
          git rm \
            .github/workflows/qualify-develop-runtime-lifecycle-final.yml \
            dev/qualify-develop-runtime-lifecycle.py
          git diff --cached --stat > /tmp/develop-lifecycle-final/commit-stat.txt
          git commit -m 'Close develop runtime lifecycle races and align import-busy coverage'
          git rev-parse HEAD > /tmp/develop-lifecycle-final/verified-commit.txt
          git push origin HEAD:fix/runtime-lifecycle-develop-final-20260914

      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: develop-lifecycle-final-${{ github.run_id }}
          path: /tmp/develop-lifecycle-final
          if-no-files-found: error
