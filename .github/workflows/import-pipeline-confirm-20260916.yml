name: Independent pipeline candidate confirmation
on:
  push:
    branches: [verify/import-pipeline-research-20260916]
    paths: [.github/workflows/import-pipeline-confirm-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [gather64, cache64, scalar-pending]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 40e8dc579e256a8bc7249acd9b620c3d7b30bff4
          persist-credentials: false
      - name: Preserve immutable driver and check out exact production baseline
        run: |
          mkdir -p "$RUNNER_TEMP/pipeline-inputs"
          cp dev/perf/pipeline-research-20260916/{apply,screen}.py "$RUNNER_TEMP/pipeline-inputs/"
          git fetch --depth=1 origin c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
          git checkout --detach c0a1b7ee6fa1383a0a422361d2a8b7f826499fff
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Twelve reversed-order pairs with six interleaved A/A controls
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: |
          mkdir -p builds/pipeline-review
          python3 "$RUNNER_TEMP/pipeline-inputs/screen.py" 2>&1 | tee builds/pipeline-review/driver.log
      - name: Retain executable inputs
        if: always()
        run: |
          mkdir -p builds/pipeline-review/executed-inputs
          cp "$RUNNER_TEMP/pipeline-inputs/"*.py builds/pipeline-review/executed-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-confirm-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/pipeline-review
          retention-days: 30
