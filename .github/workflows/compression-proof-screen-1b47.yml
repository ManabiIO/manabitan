name: Zstd physical and decoded proof browser screen (1b47)

on:
  push:
    branches: [perf/compression-proof-screen-20261128-1b47]

permissions:
  contents: read

jobs:
  validation:
    name: Validate current compression source and corrected proof policy
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      PERF_VALIDATION: builds/perf/compression-proof-gates-1b47
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize validation evidence
        run: |
          mkdir -p "$PERF_VALIDATION"
          git rev-parse HEAD > "$PERF_VALIDATION/source-sha.txt"
          git diff --stat dcfc02a0a5534929b1e9fa1f2801ec7a0784ea16 HEAD > "$PERF_VALIDATION/source-diff-stat.txt"

      - name: Install pinned dictionary WASM toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 lld-21
          clang-21 --version | tee "$PERF_VALIDATION/clang-version.txt"
          wasm-ld-21 --version | tee "$PERF_VALIDATION/lld-version.txt"

      - uses: ./.github/actions/setup
        with:
          node-version: 22.22.0

      - name: Verify native bytes against pinned compiler and manifest
        shell: bash
        run: |
          set -euo pipefail
          npm run build:dictionary-wasm -- --check 2>&1 | tee "$PERF_VALIDATION/native-check.log"

      - name: Check the corrected proof, driver guards and unchanged receipt policies
        shell: bash
        env:
          PYTHONPATH: dev/perf/import-memory-20261125-a7f7:dev/perf/import-compression-level-20261128-1b47
        run: |
          set -euo pipefail
          python3 -m py_compile \
            dev/perf/import-compression-proof-20261128-1b47.py \
            dev/perf/import-compression-proof-20261128-1b47/*.py
          python3 -m unittest discover \
            -s dev/perf/import-compression-proof-20261128-1b47 \
            -p 'test_*.py' -v 2>&1 | tee "$PERF_VALIDATION/proof-policy-driver-tests.log"
          python3 -m unittest discover \
            -s dev/perf/import-compression-level-20261128-1b47 \
            -p 'test_*.py' -v 2>&1 | tee "$PERF_VALIDATION/original-storage-policy-tests.log"
          python3 -m unittest discover \
            -s dev/perf/import-memory-20261125-a7f7 \
            -p 'test_qualification_receipts.py' -v 2>&1 | tee "$PERF_VALIDATION/original-receipt-tests.log"

      - name: Run full unit suite with bounded workers
        shell: bash
        run: |
          set -euo pipefail
          npm run test:unit -- --maxWorkers=2 2>&1 | tee "$PERF_VALIDATION/unit.log"

      - name: Test all build targets
        shell: bash
        run: |
          set -euo pipefail
          npm run test:build 2>&1 | tee "$PERF_VALIDATION/build.log"

      - name: Lint changed runtime and existing test expectations
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npx eslint --no-cache \
            ext/js/dictionary/zstd-term-content.js \
            test/zstd-compression-worker-context.test.js \
            test/zstd-term-content-startup-overlap.test.js \
            2>&1 | tee "$PERF_VALIDATION/lint.log"

      - name: Validate runtime and test types
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npm run test:ts:main 2>&1 | tee "$PERF_VALIDATION/types-main.log"
          npm run test:ts:test 2>&1 | tee "$PERF_VALIDATION/types-test.log"

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compression-proof-1b47-validation
          path: builds/perf/compression-proof-gates-1b47
          if-no-files-found: error
          retention-days: 14

  browser-screen:
    name: Complete import screen (${{ matrix.dictionary }})
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex]
    env:
      PERF_BASELINE_SHA: dcfc02a0a5534929b1e9fa1f2801ec7a0784ea16
      PERF_CANDIDATE_SHA: ${{ github.sha }}
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_EVIDENCE_PARENT: builds/perf/compression-proof-screen-1b47
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize frozen screen identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PERF_EVIDENCE_PARENT"
          test "$(git rev-parse HEAD)" = "$PERF_CANDIDATE_SHA"
          git cat-file -e "${PERF_BASELINE_SHA}^{commit}"
          git rev-parse HEAD > "$PERF_EVIDENCE_PARENT/candidate-sha.txt"
          git rev-parse "${PERF_BASELINE_SHA}^{tree}" > "$PERF_EVIDENCE_PARENT/baseline-tree.txt"
          git diff --exit-code "$PERF_BASELINE_SHA" HEAD -- \
            dev/perf/import-qualification-20261125-a7f7.py \
            dev/perf/import-memory-20261125-a7f7 \
            .github/actions/setup/action.yml \
            package.json package-lock.json test/perf/dictionaries.lock.json
          git diff --name-status "$PERF_BASELINE_SHA" HEAD > "$PERF_EVIDENCE_PARENT/source-diff.txt"

      - uses: ./.github/actions/setup
        with:
          node-version: 22.22.0

      - name: Install the lockfile-pinned Chromium revision
        run: npx playwright install --with-deps chromium

      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}

      - name: Run the fixed corrected physical and decoded proof qualification
        shell: bash
        run: |
          set -euo pipefail
          # The active common baseline is dcfc02a0. The exact f798 compression
          # runtime and two expectation tests are the only product delta.
          # Historical 9e10 frame predictions remain fixed fail-closed predicates:
          # JMdict +312404 and Jitendex +750018 content and total bytes, <=2% total.
          # A symmetric registered harness retains physical preimages and full
          # decoded JSON outside the unchanged complete-import timer. Original
          # failed observations are never reused or retroactively qualified.
          python3 dev/perf/import-compression-proof-20261128-1b47.py \
            --baseline "$PERF_BASELINE_SHA" \
            --candidate "$PERF_CANDIDATE_SHA" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order AB \
            --pairs 6 \
            --expected-workers 3 \
            --expected-package-entry js/dictionary/zstd-term-content.js \
            --evidence "$GITHUB_WORKSPACE/$PERF_EVIDENCE_PARENT/$PERF_DICTIONARY" \
            2>&1 | tee "$PERF_EVIDENCE_PARENT/$PERF_DICTIONARY-driver.log"

      - name: Print observations and qualification results for remote inspection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PERF_EVIDENCE_PARENT"
          python3 - <<'PY' | tee "$PERF_EVIDENCE_PARENT/$PERF_DICTIONARY-summary.log"
          import json, os
          from pathlib import Path
          root = Path(os.environ["PERF_EVIDENCE_PARENT"]) / os.environ["PERF_DICTIONARY"]
          def emit(label, value):
              print(label + " " + json.dumps(value, ensure_ascii=False, separators=(",", ":")))
          for name in (
              "registered-plan.json", "browser-identity.json", "observations.json",
              "analysis.json", "overlay-restoration.json", "memory/memory-comparison.json", "memory/memory-audit.json",
              "memory/memory-audit-failure.json", "memory/semantic-failures.json"):
              path = root / name
              if not path.exists():
                  emit("MISSING", name)
                  continue
              try:
                  emit(name, json.loads(path.read_text()))
              except Exception as error:
                  emit("UNREADABLE", {"path": name, "error": str(error)})
          identity = root / "source-identities.json"
          if identity.exists():
              data = json.loads(identity.read_text())
              emit("SOURCE_IDENTITIES", {
                  "changedPackageEntries": data.get("changedPackageEntries"),
                  "sourceContext": data.get("sourceContext"),
                  "proofOverlay": data.get("proofOverlay"),
                  "arms": {label: {key: arm.get(key) for key in (
                      "sha", "tree", "packageSha256", "lockSha256", "fixtureLockSha256")}
                      for label, arm in data.get("arms", {}).items()}})
          for path in sorted(root.rglob("compression-proof-policy.json")) if root.exists() else []:
              try:
                  emit("PROOF_POLICY_AUDIT", {"path": str(path.relative_to(root)), **json.loads(path.read_text())})
              except Exception as error:
                  emit("UNREADABLE", {"path": str(path), "error": str(error)})
          reports = sorted(root.rglob("run-1.json")) if root.exists() else []
          for path in reports:
              try:
                  data = json.loads(path.read_text())
                  emit("RUN_STATUS", {"path": str(path.relative_to(root)),
                      "status": data.get("status"), "failureReason": data.get("failureReason"),
                      "browserVersion": data.get("browserVersion")})
              except Exception as error:
                  emit("UNREADABLE", {"path": str(path), "error": str(error)})
          if not (root / "analysis.json").exists() and root.exists():
              logs = sorted(root.rglob("*.log"), key=lambda p: p.stat().st_mtime)[-4:]
              for path in logs:
                  emit("FAILURE_LOG_TAIL", {"path": str(path.relative_to(root)),
                      "lines": path.read_text(errors="replace").splitlines()[-80:]})
          PY

      - name: Preserve every raw observation and failed-run record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compression-proof-1b47-screen-${{ matrix.dictionary }}
          path: |
            builds/perf/compression-proof-screen-1b47
            !builds/perf/compression-proof-screen-1b47/*-sources/**
          if-no-files-found: error
          retention-days: 14
