name: Single-block compression overlap verification
on:
  push:
    branches: [verify/single-block-overlap-20260910]
    paths:
      - .github/workflows/single-block-overlap.yml
      - dev/perf/single-block-overlap/**
permissions:
  contents: read
env:
  BASELINE: d5dd9cb0072059b326f333ef425018ce1227a756
  CANDIDATE_TREE: 5ca1fa88fc05b711bee75943229cadf9bb3cf0f3
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [correctness, jmdict, jmnedict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - name: Reconstruct exact source-only arms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/arms"
          echo '39254be5604a5775ade761bc9dd6c518b46b8a8f917b5e5fb50d27b6943255d4  dev/perf/single-block-overlap/source.patch' | sha256sum -c -
          cp dev/perf/single-block-overlap/source.patch "$RUNNER_TEMP/evidence/source.patch"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path('dev/perf/stable-word-copy/paired.py').read_text()
          replacements = [
              ('8385544b3e978ea4c3140d78a27c1e31118392f4', os.environ['CANDIDATE_TREE']),
              ("{'js/core/copy-stable-bytes.js'}", 'set()'),
              ("['js/dictionary/dictionary-database.js']", "['js/dictionary/zstd-term-content.js']"),
          ]
          for old, new in replacements:
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          Path(os.environ['RUNNER_TEMP'], 'evidence', 'paired.py').write_text(text)
          PY
          git worktree add --detach "$RUNNER_TEMP/arms/A" "$BASELINE"
          git worktree add --detach "$RUNNER_TEMP/arms/B" "$BASELINE"
          git -C "$RUNNER_TEMP/arms/B" apply --index "$RUNNER_TEMP/evidence/source.patch"
          test "$(git -C "$RUNNER_TEMP/arms/B" write-tree)" = "$CANDIDATE_TREE"
          git -C "$RUNNER_TEMP/arms/B" -c core.hooksPath=/dev/null -c user.name='Manabitan verification' -c user.email='verification@users.noreply.github.com' commit -m 'perf(import): overlap substantial single shared-block compression'
          git -C "$RUNNER_TEMP/arms/B" rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/evidence/source.txt"
          git -C "$RUNNER_TEMP/arms/B" cat-file commit HEAD > "$RUNNER_TEMP/evidence/commit.txt"
          for arm in A B; do
            cp -al "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/arms/$arm/node_modules"
            (cd "$RUNNER_TEMP/arms/$arm" && node dev/bin/build-libs.js && node dev/bin/build.js --target chrome-dev) > "$RUNNER_TEMP/evidence/build-$arm.log" 2>&1
            test -z "$(git -C "$RUNNER_TEMP/arms/$arm" status --porcelain)"
          done
      - name: Full source correctness checks
        if: matrix.lane == 'correctness'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/arms/B"
          node node_modules/vitest/vitest.mjs run > "$RUNNER_TEMP/evidence/unit.log" 2>&1
          node node_modules/vitest/vitest.mjs run --config test/data/vitest.options.config.json > "$RUNNER_TEMP/evidence/options.log" 2>&1
          npm run test:ts > "$RUNNER_TEMP/evidence/types.log" 2>&1
          npm run test:js > "$RUNNER_TEMP/evidence/lint.log" 2>&1
          node dev/bin/build.js --dryRun --all > "$RUNNER_TEMP/evidence/dry-build.log" 2>&1
          test -z "$(git status --porcelain)"
      - name: Prepare locked browser and fixtures
        if: matrix.lane != 'correctness'
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/playwright/cli.js install --with-deps chromium
          (cd "$RUNNER_TEMP/arms/A" && node dev/perf/prepare-dictionaries.js) > "$RUNNER_TEMP/evidence/fixtures.log" 2>&1
          ln -s "$RUNNER_TEMP/arms/A/builds/e2e-dictionary-cache" "$RUNNER_TEMP/arms/B/builds/e2e-dictionary-cache"
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/evidence/native-memory.json"
          import {createServer} from 'node:http';
          import {chromium} from 'playwright';
          const server = createServer((req, res) => res.end('<!doctype html><title>memory preflight</title>'));
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          const browser = await chromium.launch({headless: true});
          try {
            const page = await browser.newPage();
            await page.goto(`http://127.0.0.1:${server.address().port}`);
            const policy = await page.evaluate(async () => {
              const url = URL.createObjectURL(new Blob(['postMessage({deviceMemory: navigator.deviceMemory, hardwareConcurrency: navigator.hardwareConcurrency})'], {type: 'text/javascript'}));
              const worker = new Worker(url);
              const value = await new Promise(resolve => worker.onmessage = event => resolve(event.data));
              worker.terminate();
              URL.revokeObjectURL(url);
              return {page: {deviceMemory: navigator.deviceMemory, hardwareConcurrency: navigator.hardwareConcurrency}, worker: value};
            });
            console.log(JSON.stringify({browserVersion: browser.version(), ...policy}, null, 2));
          } finally { await browser.close(); server.close(); }
          NODE
          clang --version > "$RUNNER_TEMP/evidence/compiler.txt"
          node --version > "$RUNNER_TEMP/evidence/node.txt"
          lscpu > "$RUNNER_TEMP/evidence/cpu.txt"
      - name: Six fixed A/B pairs, excluded warmups, same-binary controls, no retries
        if: matrix.lane != 'correctness'
        shell: bash
        env:
          DICTIONARY: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/evidence/paired.py" --baseline "$RUNNER_TEMP/arms/A" --candidate "$RUNNER_TEMP/arms/B" --dictionary "$DICTIONARY" --pairs 6 --reverse --output "$RUNNER_TEMP/evidence/paired" 2>&1 | tee "$RUNNER_TEMP/evidence/driver.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-block-${{ matrix.lane }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14
          if-no-files-found: error
