name: Lint GitHub Actions workflows
on: [push, pull_request]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check workflow files
        run: |
            echo "::add-matcher::.github/actionlint-matcher.json"
            # Download script source pinned to v1.7.4 commit 5db9d9cde2f3deb5035dea3e45f0a9fff2f29448.
            bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/5db9d9cde2f3deb5035dea3e45f0a9fff2f29448/scripts/download-actionlint.bash)
            ./actionlint -color
        shell: bash
