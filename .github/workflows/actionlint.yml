name: Lint GitHub Actions workflows
on: [push, pull_request]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check workflow files
        run: |
            echo "::add-matcher::.github/actionlint-matcher.json"
            # Download script source pinned to v1.7.12 commit 914e7df21a07ef503a81201c76d2b11c789d3fca.
            # Pass the version explicitly because the script's default version can differ from its source revision.
            actionlint_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
            curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash -o "$actionlint_dir/download-actionlint.bash"
            bash "$actionlint_dir/download-actionlint.bash" 1.7.12 "$actionlint_dir"
            "$actionlint_dir/actionlint" -color
        shell: bash
