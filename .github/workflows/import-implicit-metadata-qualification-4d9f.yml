name: Implicit import metadata qualification 4d9f

on:
  push:
    branches: [experiment/implicit-import-metadata-20261128-4d9f]
    paths: [.github/workflows/import-implicit-metadata-qualification-4d9f.yml]

permissions:
  contents: read

jobs:
  qualify:
    # Acquire one source-frozen cohort only on initial branch publication.
    if: github.event.before == '0000000000000000000000000000000000000000' && github.run_attempt == 1
    name: ${{ matrix.dictionary }} (${{ matrix.order }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    env:
      PERF_BASELINE: dcfc02a0a5534929b1e9fa1f2801ec7a0784ea16
      PERF_CANDIDATE: 6a05b649de2bf220b21f5365902c76d78d1cde29
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify qualification receipt checks
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore pinned dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Compare complete imports and verify memory and persisted results
        shell: bash
        run: |
          allocation_args=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            allocation_args=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 12 \
            --expected-package-entry js/dictionary/dictionary-database.js \
            --expected-package-entry js/dictionary/term-content-canonical-scan.js \
            --expected-package-entry js/dictionary/term-content-metadata-arena.js \
            --expected-package-entry js/dictionary/wasm/term-content-canonical-scan-v1.c \
            --expected-package-entry lib/term-content-canonical-scan-v1.wasm \
            "${allocation_args[@]}" \
            --evidence "builds/perf/import-implicit-metadata-$PERF_DICTIONARY-$PERF_ORDER-cohort1-4d9f"
      - name: Retain every observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-implicit-metadata-${{ matrix.dictionary }}-${{ matrix.order }}-cohort1-4d9f
          path: builds/perf/import-implicit-metadata-${{ matrix.dictionary }}-${{ matrix.order }}-cohort1-4d9f
          if-no-files-found: error
          retention-days: 14
