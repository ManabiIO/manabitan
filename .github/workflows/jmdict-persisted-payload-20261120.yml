name: JMdict full persisted payload diagnostic (2026-11-20)

on:
  push:
    branches:
      - 'perf/jmdict-payload-20261120-ccf816-*'

permissions:
  contents: read
  actions: read

jobs:
  payload:
    if: >-
      github.repository == 'ManabiIO/manabitan' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/perf/jmdict-payload-20261120-ccf816-')
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      PERSISTED_PAYLOAD_EVIDENCE: ${{ github.workspace }}/builds/jmdict-persisted-payload-20261120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record the two-observation correctness plan
        run: >-
          python3 dev/perf/jmdict-persisted-payload-20261120.py init
          --evidence "$PERSISTED_PAYLOAD_EVIDENCE"

      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'

      - name: Check reader, observer integration and fail-closed comparator
        run: >-
          python3 dev/perf/jmdict-persisted-payload-20261120.py check
          --evidence "$PERSISTED_PAYLOAD_EVIDENCE"

      - name: Install Firefox runtime dependencies
        run: npx playwright install-deps firefox

      - name: Verify pinned Firefox artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 dev/perf/jmdict-firefox-runtime/firefox-runtime.py verify-source
          --output "$RUNNER_TEMP/official-firefox-artifact"

      - name: Retrieve pinned Firefox runtime
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: '14621448317'
          run-id: '44720953991'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/official-firefox-artifact

      - name: Verify and install pinned Firefox runtime
        run: >-
          python3 dev/perf/jmdict-firefox-runtime/firefox-runtime.py install
          --artifact "$RUNNER_TEMP/official-firefox-artifact"
          --output "$RUNNER_TEMP/official-firefox"

      - name: Restore locked dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}

      - name: Verify exact sources and build both release packages
        run: >-
          python3 dev/perf/jmdict-persisted-payload-20261120.py prepare
          --evidence "$PERSISTED_PAYLOAD_EVIDENCE"

      - name: Read all persisted term payloads before and after reload
        run: >-
          xvfb-run -a python3 dev/perf/jmdict-persisted-payload-20261120.py observe
          --evidence "$PERSISTED_PAYLOAD_EVIDENCE"

      - name: Preserve all correctness evidence including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jmdict-persisted-payload-20261120-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PERSISTED_PAYLOAD_EVIDENCE }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
