name: Parser inlining import comparisons
on:
  push:
    branches: [verify/import-round7-20260916]
    paths: [.github/workflows/import-round7-inline-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [inline-string, inline-composite]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ff8704f1dd6eb397f5393781dee528d387a28632
          persist-credentials: false
      - name: Preserve source-only candidates and immutable same-path driver
        run: |
          mkdir -p "$RUNNER_TEMP/round7-review"
          cp dev/perf/round7-20260916/apply-inline.py "$RUNNER_TEMP/round7-review/apply.py"
          git fetch --depth=1 origin 23524cf48cb08482ebd271406fe48da773bb516c
          git show FETCH_HEAD:dev/perf/round6-20260916/screen.py > "$RUNNER_TEMP/round7-review/screen.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round7-review/screen.py'
          s = p.read_text().replace("('word-jump', 'simd-jump', 'inflight-bounds')", "('inline-string', 'inline-composite')")
          s = s.replace('round6', 'round7').replace('round-six', 'round-seven')
          old = "identities = {arm: identity(directory) for arm, directory in roots.items()}"
          assert s.count(old) == 1
          s = s.replace(old, old + "\n(output / 'sizes.json').write_text(json.dumps({arm: {'wasmBytes': (directory / 'ext/lib/term-bank-parser.wasm').stat().st_size, 'packageBytes': (directory / package).stat().st_size} for arm, directory in roots.items()}, indent=2))")
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round7-review/"*.py
          git fetch --depth=1 origin b4094a423c20bb0ed424d944238f922c1b36559c
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify pinned full dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Focused tests, full-corpus output agreement and six paired imports
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: |
          mkdir -p builds/round7
          python3 "$RUNNER_TEMP/round7-review/screen.py" 2>&1 | tee builds/round7/driver.log
      - name: Preserve exact driver even on failure
        if: always()
        run: |
          mkdir -p builds/round7/driver-inputs
          cp "$RUNNER_TEMP/round7-review/"*.py builds/round7/driver-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round7-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/round7
          retention-days: 30
