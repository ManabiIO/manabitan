name: Frozen native hint qualification 20261128 0f1f

on:
  push:
    branches: ['perf/native-hint-locals-qualification-20261128-0f1f']
    paths:
      - '.github/workflows/native-hint-locals-qualification-20261128-0f1f.yml'

permissions:
  contents: read

env:
  PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
  PERF_CANDIDATE: 486330b71ef0734e52174b76f45b65c580623798

jobs:
  correctness:
    name: Frozen candidate / ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: unit
            os: ubuntu-latest
          - check: lint-types
            os: ubuntu-latest
          - check: build
            os: ubuntu-26.04
    env:
      PERF_CHECK: ${{ matrix.check }}
      PERF_EVIDENCE: builds/perf/native-hint-locals-checks-20261128-0f1f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 486330b71ef0734e52174b76f45b65c580623798
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify exact source and run the required gate
        run: |
          mkdir -p "$PERF_EVIDENCE"
          test "$(git rev-parse HEAD)" = "$PERF_CANDIDATE"
          git rev-parse HEAD 'HEAD^{tree}' > "$PERF_EVIDENCE/source.txt"
          case "$PERF_CHECK" in
            unit) npm run test:unit > "$PERF_EVIDENCE/check.log" 2>&1 ;;
            lint-types)
              npx eslint test/term-bank-composite-state.test.js > "$PERF_EVIDENCE/check.log" 2>&1
              npm run test:ts >> "$PERF_EVIDENCE/check.log" 2>&1
              ;;
            build)
              sudo apt-get update > "$PERF_EVIDENCE/check.log" 2>&1
              sudo apt-get install -y --no-install-recommends clang-21 lld-21 >> "$PERF_EVIDENCE/check.log" 2>&1
              npm run build:dictionary-wasm -- --check >> "$PERF_EVIDENCE/check.log" 2>&1
              npm run test:build >> "$PERF_EVIDENCE/check.log" 2>&1
              ;;
            *) exit 1 ;;
          esac
          git status --porcelain=v1 > "$PERF_EVIDENCE/source-status.txt"
          test ! -s "$PERF_EVIDENCE/source-status.txt"
      - name: Preserve exact-commit checks and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-hint-locals-checks-${{ matrix.check }}-20261128-0f1f
          path: builds/perf/native-hint-locals-checks-20261128-0f1f
          if-no-files-found: error
          retention-days: 14

  qualify:
    name: Native hints / ${{ matrix.dictionary }} / ${{ matrix.order }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        order: [AB, BA]
        dictionary: [jmdict, jitendex, vndb]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: '1'
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify unchanged qualification observer and receipts
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Install lockfile-pinned Chromium
        run: npx playwright install --with-deps chromium
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Fetch both frozen product revisions
        run: git fetch --no-tags origin "$PERF_BASELINE" "$PERF_CANDIDATE"
      - name: Run complete imports, controls, and separate memory checks
        run: |
          qualification_extra=()
          if [ "$PERF_DICTIONARY" = 'vndb' ]; then
            qualification_extra+=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261125-a7f7.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 12 \
            --expected-workers 3 \
            --expected-package-entry js/dictionary/wasm/term-bank-parser.c \
            --expected-package-entry lib/term-bank-parser.wasm \
            "${qualification_extra[@]}" \
            --evidence builds/perf/native-hint-locals-20261128-0f1f
      - name: Retain every prescribed observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-hint-locals-${{ matrix.dictionary }}-${{ matrix.order }}-20261128-0f1f
          path: builds/perf/native-hint-locals-20261128-0f1f
          if-no-files-found: error
          retention-days: 14
