name: Finalize qualified native lookup defaults
on:
  push:
    branches: [research/import-structural-20260918]
    paths: [.github/workflows/import-native-finalize-20260918.yml]
permissions:
  contents: write
  actions: read
defaults:
  run:
    shell: bash
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fb7241deb70950dc113089cd774c9489ede48f8a
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35388506078
          pattern: native-confirm-*
          path: builds/native-reference
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35389994261
          name: native-defaults-validation
          path: builds/native-candidate
      - name: Retain every observation and restore the validated runtime patch
        run: |
          mkdir -p builds/native-final "$RUNNER_TEMP/native-tools"
          node builds/native-candidate/evidence.mjs
          git apply builds/native-candidate/research-only.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/perf-import-experiment-evidence.test.js');s=p.read_text()
          s=s.replace('invalid global controls remain default-off','invalid global controls use the qualified defaults')
          old='{details: {parserExperiments: snapshotTermBankExperiments()}},';assert s.count(old)==1
          s=s.replace(old,'{details: {parserExperiments: snapshotTermBankExperiments({[key]: false})}},')
          old='phases.push({details: {parserExperiments: snapshotTermBankExperiments()}})';assert s.count(old)==1
          s=s.replace(old,'phases.push({details: {parserExperiments: snapshotTermBankExperiments({experimentalNativeSegmentedLookup: false, experimentalLookupScratchReuse: false})}})')
          p.write_text(s)
          PY
          cat > dev/perf/native-lookup-promotion-20260918.md <<'MD'
          # Native lookup production qualification — 2026-09-18

          Promote the existing native segmented lookup and retired-parser-workspace reuse paths. The structural win removes JavaScript compaction/encoding of large lookup groups, not another worker-count tweak. The only runtime changes are these two defaults. Other experiments remain off; explicit false retains the old path independently for either switch, and invalid truthy values remain disabled. Native algorithms, uint16 limits, bounded capacity fallback and storage formats are unchanged.

          ## Independent complete-import qualification

          Baseline `fb7241deb70950dc113089cd774c9489ede48f8a`; [run 35388506078](https://github.com/ManabiIO/manabitan/actions/runs/35388506078). Two independent hosts per dictionary with opposite initial order; each has one excluded warmup pair, three pre-control pairs, twelve measured adjacent alternating pairs, and three post-control pairs. All observations, controls, report hashes, path receipts and fixture identities are retained in `native-lookup-qualification-20260918.json`. No tails, pairs or hosts were discarded.

          | Dictionary | Host AB paired median | Host BA paired median | Faster pairs |
          | --- | ---: | ---: | ---: |
          | JMdict | -11.34% | -12.21% | 24/24 |
          | JMnedict | -11.56% | -11.92% | 24/24 |
          | Jitendex | +1.01% | -0.47% | 12/24 |

          Jitendex is not a demonstrated speedup. Its BA host had a noisy pre-control (-16.08%); that host and every observation remain included. Do not pool absolute times across hosts. Controls on the JMdict/JMnedict hosts are materially smaller than the measured improvements.

          The timing boundary is the schema-3 browser monotonic file-input-change through current-operation post-UI completion. Every report verifies pinned full title/revision/rows, persisted content probes, non-fallback OPFS/SQLite storage and matching effective flags. Content, record and lookup write bytes match across arms. JMdict has 15 native segments and eight scratch-reuse groups. JMnedict has 23 segments/seven reuse groups and one existing bounded scratch-capacity fallback to the portable path. This is not zero parser fallback; no storage fallback or import errors occurred.

          ## Regression oracles and rollout

          Tests explicitly select false for the portable baseline and intentionally mismatched worker receipts. Otherwise default promotion could silently turn native-versus-portable comparisons into native-versus-native. The real worker alternates true, false, omitted, false, omitted across five requests and checks full index digests plus path counters. The earlier unit preflight exposed three old negative fixtures using omission as false; these fixtures were corrected without weakening assertions.

          Exact-policy validation, the WTY control/production schedule, full Chromium lifecycle, compiler/build logs and product SHA are preserved by `import-native-finalize-20260918.yml` on the research branch. No research workflows, generic compression, three-worker defaults, extra overlap, or fixture/harness changes are in this product commit. Future `{}` comparisons use the new qualified defaults; explicitly set both switches false to measure the old route.
          MD
      - run: npm ci
      - name: Validate all units, explicit negative receipts, types, and build plans
        run: |
          npm run build:libs > builds/native-final/libs.log 2>&1
          node node_modules/eslint/bin/eslint.js ext/js/dictionary/term-bank-experiments.js test/lookup-construction-experiments.test.js test/perf-import-experiment-evidence.test.js > builds/native-final/lint.log 2>&1
          npm run test:unit -- --no-file-parallelism > builds/native-final/unit.log 2>&1
          npm run test:unit:options > builds/native-final/options.log 2>&1
          npm run test:ts:main > builds/native-final/types-main.log 2>&1
          npm run test:ts:dev > builds/native-final/types-dev.log 2>&1
          npm run test:ts:bench > builds/native-final/types-bench.log 2>&1
          npm run test:build > builds/native-final/build-plans.log 2>&1
          npx prettier dev/perf/native-lookup-promotion-20260918.md dev/perf/native-lookup-qualification-20260918.json --write
          git diff --check
      - name: Commit only the qualified production policy, tests, and evidence
        run: |
          git switch -c perf/native-lookup-defaults-20260918
          git add ext/js/dictionary/term-bank-experiments.js types/ext/dictionary-importer.d.ts test/lookup-construction-experiments.test.js test/perf-import-experiment-evidence.test.js dev/perf/native-lookup-promotion-20260918.md dev/perf/native-lookup-qualification-20260918.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf: enable qualified native lookup construction and scratch reuse'
          git rev-parse HEAD > builds/native-final/PRODUCT_HEAD
          git show --stat HEAD > builds/native-final/product-stat.txt
      - name: Prepare exact-policy WTY control schedule
        run: |
          git fetch --depth=1 origin f00b61bb2d851024f4124f1d854502ba602b506d
          git show FETCH_HEAD:dev/perf/import-transport-20260917/abba.mjs > "$RUNNER_TEMP/native-tools/abba-original.mjs"
          git fetch --depth=1 origin 9c843c8a0e06190948ae0d52c29094a45a2555f1
          git show FETCH_HEAD:dev/perf/wty-abba-20260916/prepare.py > "$RUNNER_TEMP/native-tools/fixture-original.py"
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess
          tools=Path(os.environ['RUNNER_TEMP'])/'native-tools';s=(tools/'abba-original.mjs').read_text()
          start=s.index('const variants=');end=s.index('\n',start)
          s=s[:start]+"const legacy={experimentalNativeSegmentedLookup:false,experimentalLookupScratchReuse:false}; const variants={control:legacy,production:{}}"+s[end:]
          old="flags:arm==='A'?{}:variants[id]";assert s.count(old)==2;s=s.replace(old,"flags:arm==='A'?legacy:variants[id]")
          old="assert.deepEqual(finalization.compressionExperiments,snapshotTermBankExperiments(entry.flags),'Storage-side flags differ')";assert s.count(old)==1
          s=s.replace(old,"assert.deepEqual(parser.parserExperiments,snapshotTermBankExperiments(entry.flags),'Parser-side flags differ')")
          s=s.replace("base:'2f407e86fae0d3e39f506e6b1ce30886697698ea'","base:"+repr(subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()))
          (tools/'abba.mjs').write_text(s);(tools/'fixture.py').write_text((tools/'fixture-original.py').read_text().split('# Common correctness prerequisite')[0])
          p=Path('test/chromium/extension-two-dictionary-import.e2e.js');s=p.read_text();assert s.count('maxBuffer: 32 * 1024 * 1024')==2;p.write_text(s.replace('maxBuffer: 32 * 1024 * 1024','maxBuffer: 256 * 1024 * 1024'))
          PY
          python3 "$RUNNER_TEMP/native-tools/fixture.py" > builds/native-final/fixture.log
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
          node dev/bin/build.js --target chrome-dev > builds/native-final/build.log 2>&1
          npx playwright install --with-deps chromium
      - name: Complete WTY imports with excluded warmups and retained controls
        env:
          THREE_DICTIONARY: wty-en-en
          THREE_OUTPUT: builds/native-final/wty
        run: node "$RUNNER_TEMP/native-tools/abba.mjs" control,production 2 | tee builds/native-final/wty.log
      - name: Production-default Chromium import and recovery lifecycle
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{}'
          MANABITAN_E2E_IMPORT_BENCH_QUICK: '0'
          MANABITAN_E2E_SKIP_BUILD: '1'
          MANABITAN_E2E_PHASE_PROFILING: '0'
          MANABITAN_E2E_PHASE_SCREENSHOTS: '0'
          MANABITAN_E2E_PROCESS_SAMPLING: '0'
          MANABITAN_CHROMIUM_E2E_REPORT: builds/native-final/lifecycle.html
        run: |
          node test/chromium/extension-two-dictionary-import.e2e.js > builds/native-final/lifecycle.log 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('builds/native-final/lifecycle.json').read_text());assert r['status']=='success' and r['skippedVerification'] is False
          PY
      - name: Publish only the validated product branch
        run: |
          test -z "$(git ls-remote --heads origin refs/heads/perf/native-lookup-defaults-20260918)"
          git push origin HEAD:refs/heads/perf/native-lookup-defaults-20260918
      - name: Retain product, diagnostics, and research-only changes
        if: always()
        run: |
          git diff > builds/native-final/research-only.patch
          git diff --binary fb7241deb70950dc113089cd774c9489ede48f8a HEAD > builds/native-final/product.patch
          find "$RUNNER_TEMP/native-tools" -maxdepth 1 -type f -exec cp '{}' builds/native-final/ ';'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-defaults-final-validation
          path: builds/native-final
          retention-days: 30
          if-no-files-found: error
