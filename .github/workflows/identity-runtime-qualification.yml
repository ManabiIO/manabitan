name: Identity runtime closeout qualification
on:
  push:
    branches: [codex/delivery-identity-runtime-20260921b]
permissions:
  contents: write
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preserve tests and merge pinned accepted develop
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/identity-runtime"
          cp test/dictionary-identity-runtime.test.js "$RUNNER_TEMP/identity-runtime/new-tests.js"
          git config user.name 'ManabiTan correctness qualification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch --detach 296e85dd2c6c93b88196fb9aac5829130c17cc62
          if ! git merge --no-ff --no-commit f0b2ef32fc0d26d68051acf2fb8fda8dc7639c2a; then
            python3 - <<'PY'
          import pathlib, subprocess
          conflicts = subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          assert conflicts == ['test/term-record-opfs-store.test.js'], conflicts
          p=conflicts[0]
          ours=subprocess.check_output(['git','show',f':2:{p}'],text=True)
          theirs=subprocess.check_output(['git','show',f':3:{p}'],text=True)
          a="describe('TermRecordOpfsStore exact dictionary identity', () => {"
          b="describe('TermRecordOpfsStore preserves length-delimited Unicode fields', () => {"
          assert ours.count(a)==1 and theirs.count(b)==1
          prefix_a,tail_a=ours.split(a)
          prefix_b,tail_b=theirs.split(b)
          assert prefix_a==prefix_b, 'Existing test bodies or imports unexpectedly differ'
          # Both changes append a complete top-level describe. Preserve both
          # verbatim, not a union merge of their shared closing delimiters.
          data=prefix_a+a+tail_a.rstrip()+'\n\n'+b+tail_b
          assert data.count(a)==1 and data.count(b)==1
          assert data.count("import assert from 'node:assert/strict'")==1
          pathlib.Path(p).write_text(data)
          subprocess.run(['node','--check',p],check=True)
          subprocess.run(['git','add',p],check=True)
          PY
          fi
          git commit -m 'Merge accepted develop into dictionary identity repair; preserve both complete regression groups'
          cp "$RUNNER_TEMP/identity-runtime/new-tests.js" test/dictionary-identity-runtime.test.js
      - uses: ./.github/actions/setup
      - name: Format and reproduce runtime identity failures before repair
        run: |
          set -euo pipefail
          npx eslint test/dictionary-identity-runtime.test.js --fix
          cp test/dictionary-identity-runtime.test.js "$RUNNER_TEMP/identity-runtime/formatted-tests.js"
          set +e
          npx vitest run test/dictionary-identity-runtime.test.js --reporter=json --outputFile="$RUNNER_TEMP/identity-runtime/before.json" >"$RUNNER_TEMP/identity-runtime/before.log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          python3 - <<'PY'
          import os,json,pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'identity-runtime/before.json').read_text())
          print({k:d.get(k) for k in ['numTotalTests','numPassedTests','numFailedTests']})
          assert d['numTotalTests']==18 and d['numFailedTests']==16 and d['numPassedTests']==2, d
          PY
          git add test/dictionary-identity-runtime.test.js
          git commit -m 'test: reproduce exact-identity loss across runtime probes and verification'
      - name: Retain prior backend repair and finish probe production and warmup
        run: |
          set -euo pipefail
          git merge --no-ff 87a8c7644a4293a00864982472823e8658ec95a9 -m 'Merge prior backend identity repair and regression tests into current composition'
          python3 - <<'PY'
          from pathlib import Path
          for path in ['ext/js/background/backend.js','ext/js/background/offscreen-dictionary-worker.js']:
              s=Path(path).read_text()
              assert "String(dictionaryNameRaw || '').trim()" not in s
          s=Path('ext/js/background/backend.js').read_text()
          assert "typeof dictionaryTitle === 'string' ? dictionaryTitle.trim() : ''" not in s
          assert '[probe.expression, probe.reading].filter((value) => value.length > 0)' in s
          assert 'probe.expression.length > 0 ? probe.expression : probe.reading' in s
          changes={
          'ext/js/dictionary/dictionary-database.js':[
          ("this._asString(record.expression).trim()","this._asString(record.expression)",1),
          ("this._asString(record.reading).trim()","this._asString(record.reading)",1),
          ("terms.map((term) => `${term}`.trim()).filter((term) => term.length > 0)","terms.map((term) => `${term}`).filter((term) => term.length > 0)",1)],
          'ext/js/app/frontend.js':[("terms.map((term) => `${term}`.trim()).filter((term) => term.length > 0)","terms.map((term) => `${term}`).filter((term) => term.length > 0)",1)]}
          for path,replacements in changes.items():
              p=Path(path); s=p.read_text()
              for before,after,count in replacements:
                  assert s.count(before)==count,(path,before,s.count(before))
                  s=s.replace(before,after)
              p.write_text(s)
          assert "new TextDecoder('utf-8', {ignoreBOM: true})" in Path('ext/js/dictionary/term-record-opfs-store.js').read_text()
          PY
          git diff --check
          git add ext/js/dictionary/dictionary-database.js ext/js/app/frontend.js
          git commit -m 'fix: preserve persisted fields when producing and warming lookup probes'
      - name: Full lint and type checks
        run: |
          set -euo pipefail
          npm run test:js 2>&1 | tee "$RUNNER_TEMP/identity-runtime/lint.log"
          npm run test:ts:main 2>&1 | tee "$RUNNER_TEMP/identity-runtime/types-main.log"
          npm run test:ts:test 2>&1 | tee "$RUNNER_TEMP/identity-runtime/types-test.log"
          npm run test:ts:dev 2>&1 | tee "$RUNNER_TEMP/identity-runtime/types-dev.log"
      - name: Qualify the merged correctness composition
        run: |
          set -euo pipefail
          npx vitest run test/dictionary-identity-runtime.test.js test/backend-dictionary-identity.test.js test/term-record-opfs-store.test.js test/dictionary-database-import-cleanup.test.js test/dictionary-import-controller-update-profile.test.js test/dictionary-worker-handler-cleanup.test.js test/backend-lookup-refresh.test.js test/offscreen-dictionary-worker-import.test.js test/frontend-database-updated.test.js --reporter=json --outputFile="$RUNNER_TEMP/identity-runtime/after.json" 2>&1 | tee "$RUNNER_TEMP/identity-runtime/after.log"
          git diff --check
          git diff --exit-code
          git rev-parse HEAD > "$RUNNER_TEMP/identity-runtime/qualified-head.txt"
          git diff --stat f0b2ef32fc0d26d68051acf2fb8fda8dc7639c2a HEAD > "$RUNNER_TEMP/identity-runtime/final-stat.txt"
          git diff 296e85dd2c6c93b88196fb9aac5829130c17cc62 HEAD > "$RUNNER_TEMP/identity-runtime/changes.patch"
          git push origin HEAD:refs/heads/codex/identity-runtime-qualified-20260921b
      - name: Preserve qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-runtime-closeout
          path: ${{ runner.temp }}/identity-runtime/
          retention-days: 14
