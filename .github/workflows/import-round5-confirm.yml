name: Research-driven import independent confirmation
on:
  push:
    branches: [verify/import-round5-20260915]
    paths: [.github/workflows/import-round5-confirm.yml]
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [media-streams, cdict]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 946c08843a84ce2fee6af83db4e5a127c469fc9a
          persist-credentials: false
          fetch-depth: 2
      - name: Freeze driver and candidate sources before timing
        run: |
          cp -a dev/perf/round5-20260915 "$RUNNER_TEMP/round5-review"
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
          python3 -m py_compile "$RUNNER_TEMP/round5-review/screen.py"
      - uses: actions/download-artifact@v4
        if: matrix.candidate == 'cdict'
        with:
          name: round5-native-assets
          run-id: 35049557275
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-assets
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch locked complete dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - run: node dev/bin/build.js --target chrome-dev
      - name: Twelve reversed-order pairs and six same-binary control pairs
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '12'
          INITIAL_ORDER: BA
        run: python3 "$RUNNER_TEMP/round5-review/screen.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round5-confirm-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/round5
          retention-days: 30
