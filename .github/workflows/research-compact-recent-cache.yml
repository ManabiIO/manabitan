name: Research Compact Recent Content Cache

on:
  push:
    branches:
      - research/compact-recent-content-cache-20260930

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          path: candidate

      - name: Checkout baseline
        uses: actions/checkout@v6
        with:
          ref: 0486aed4ac61e65e06a26cf53589625ae1c7f7d5
          path: baseline

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: candidate/package-lock.json

      - name: Install dependencies and libraries
        working-directory: candidate
        run: |
          npm ci
          npm run build:libs

      - name: Reuse dependencies and build baseline libraries
        shell: bash
        run: |
          ln -s "$GITHUB_WORKSPACE/candidate/node_modules" "$GITHUB_WORKSPACE/baseline/node_modules"
          cd baseline
          npm run build:libs

      - name: Install Chromium and fixtures
        working-directory: candidate
        run: |
          npx playwright install chromium
          node ./dev/perf/prepare-dictionaries.js

      - name: Share verified fixtures and build both arms
        shell: bash
        run: |
          mkdir -p baseline/builds
          cp -a candidate/builds/e2e-dictionary-cache baseline/builds/
          (cd baseline && node ./dev/bin/build.js --target chrome-dev)
          (cd candidate && node ./dev/bin/build.js --target chrome-dev)

      - name: Run alternating whole-import pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for dictionary in jmdict jmnedict; do
            for pair in 1 2 3 4 5 6; do
              if (( pair % 2 == 1 )); then order="baseline candidate"; else order="candidate baseline"; fi
              for arm in $order; do
                out="$GITHUB_WORKSPACE/results/${dictionary}-pair${pair}-${arm}"
                (cd "$arm" && node ./dev/perf/import-benchmark.js "$dictionary" --runs 1 --no-build --output "$out")
              done
            done
          done

      - name: Summarize timing and cache metrics
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from 'node:fs'
          import path from 'node:path'
          const root=process.env.GITHUB_WORKSPACE
          const median=(v)=>{const s=[...v].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}
          const read=(dictionary,pair,arm)=>{
            const d=JSON.parse(readFileSync(path.join(root,'results',`${dictionary}-pair${pair}-${arm}`,'summary.json'),'utf8'))
            const run=d.runs[0]
            const fast=(run.importDebug?.importerPhaseTimings??[]).find(x=>String(x.phase).startsWith('term-file-fast-path:'))
            const det=fast?.details??{}
            return {
              totalMs:d.timing.medianMs,
              workerMs:d.workerTiming?.medianMs??null,
              cacheMs:det.dedupRecentSourceCacheMs??null,
              cacheBytes:det.dedupRecentSourceCacheBytes??null,
              recentHits:det.dedupRecentSourceHitCount??null,
              persistedHits:det.dedupPersistedHitCount??null,
            }
          }
          const out={schemaVersion:1,baseline:'0486aed4ac61e65e06a26cf53589625ae1c7f7d5',candidate:process.env.GITHUB_SHA,dictionaries:{}}
          for(const dictionary of ['jmdict','jmnedict']){
            const pairs=[]
            for(let pair=1;pair<=6;pair++){
              const b=read(dictionary,pair,'baseline'), c=read(dictionary,pair,'candidate')
              pairs.push({
                pair,baseline:b,candidate:c,
                totalChangePct:(c.totalMs/b.totalMs-1)*100,
                workerChangePct:b.workerMs&&c.workerMs?(c.workerMs/b.workerMs-1)*100:null,
              })
            }
            out.dictionaries[dictionary]={
              pairs,
              pairedMedianTotalChangePct:median(pairs.map(x=>x.totalChangePct)),
              pairedMedianWorkerChangePct:median(pairs.flatMap(x=>x.workerChangePct===null?[]:[x.workerChangePct])),
              fasterPairs:pairs.filter(x=>x.candidate.totalMs<x.baseline.totalMs).length,
              baselineCacheMsMedian:median(pairs.map(x=>x.baseline.cacheMs)),
              candidateCacheMsMedian:median(pairs.map(x=>x.candidate.cacheMs)),
              baselineCacheBytesMedian:median(pairs.map(x=>x.baseline.cacheBytes)),
              candidateCacheBytesMedian:median(pairs.map(x=>x.candidate.cacheBytes)),
              recentHits:[...new Set(pairs.map(x=>x.candidate.recentHits))],
              persistedHits:[...new Set(pairs.map(x=>x.candidate.persistedHits))],
            }
          }
          writeFileSync(path.join(root,'results','summary.json'),JSON.stringify(out,null,2))
          console.log(JSON.stringify(out,null,2))
          NODE

      - uses: actions/upload-artifact@v6
        with:
          name: compact-recent-content-cache-ab
          path: results
          retention-days: 7
