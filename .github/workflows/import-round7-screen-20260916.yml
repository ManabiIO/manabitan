name: Import round seven source comparisons
on:
  push:
    branches: [verify/import-round7-20260916]
    paths: [.github/workflows/import-round7-screen-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        candidate: [hash-vector, key-bulk, gather-once]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7ba3b0c221b1dc913064012f10b6d579bfd6eb5
          persist-credentials: false
      - name: Preserve exact candidate and known fixed-plan harness
        run: |
          cp -a dev/perf/round7-20260916 "$RUNNER_TEMP/round7-review"
          git fetch --depth=1 origin 23524cf48cb08482ebd271406fe48da773bb516c
          git show FETCH_HEAD:dev/perf/round6-20260916/screen.py > "$RUNNER_TEMP/round7-review/screen.py"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['RUNNER_TEMP']) / 'round7-review/screen.py'
          s = p.read_text().replace("('word-jump', 'simd-jump', 'inflight-bounds')", "('hash-vector', 'key-bulk', 'gather-once')")
          s = s.replace('round6', 'round7').replace('round-six', 'round-seven')
          s = s.replace("variant != 'inflight-bounds'", "variant != 'gather-once'").replace("variant == 'inflight-bounds'", "variant == 'gather-once'")
          s = s.replace("allowed = {source.relative_to('ext').as_posix()}", "allowed = {'lib/zstd-wasm.js', 'lib/zstd-wasm.js.map'} if variant == 'gather-once' else {source.relative_to('ext').as_posix()}")
          s = s.replace("['test/dictionary-database-content-dedup.test.js', 'test/term-content-block-store.test.js']", "['test/zstd-wasm.test.js', 'test/zstd-term-content-pool.test.js', 'test/term-content-block-store.test.js', 'test/dictionary-database-content-dedup.test.js']")
          p.write_text(s)
          PY
          python3 -m py_compile "$RUNNER_TEMP/round7-review/"*.py
          git fetch --depth=1 origin b4094a423c20bb0ed424d944238f922c1b36559c
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify full locked dictionaries
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Focused correctness, full-corpus equality and six alternating pairs
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: |
          mkdir -p builds/round7
          python3 "$RUNNER_TEMP/round7-review/screen.py" 2>&1 | tee builds/round7/driver.log
      - name: Preserve exact driver even on failure
        if: always()
        run: |
          mkdir -p builds/round7/driver-inputs
          cp "$RUNNER_TEMP/round7-review/"*.py builds/round7/driver-inputs/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round7-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/round7
          retention-days: 30
