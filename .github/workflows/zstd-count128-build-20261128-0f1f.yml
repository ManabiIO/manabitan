name: Frozen Zstd count128 compiler experiment 20261128 0f1f

on:
  push:
    branches: ['perf/zstd-count128-study-20261128-0f1f']
    paths:
      - '.github/workflows/zstd-count128-build-20261128-0f1f.yml'
      - 'dev/perf/zstd-count128-20261128/build-compressors.py'
      - 'dev/perf/zstd-count128-20261128/source-binding.json'
      - 'dev/perf/zstd-count128-20261128/zstd-count128.patch'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      EMSDK_COMMIT: a7c808831a666cc903fedb906c171a718cd97341
      PERF_EVIDENCE: builds/perf/zstd-count128-build-20261128-0f1f
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record frozen inputs
        run: |
          mkdir -p "$PERF_EVIDENCE"
          git rev-parse HEAD 'HEAD^{tree}' > "$PERF_EVIDENCE/tooling-source.txt"
          sha256sum dev/perf/zstd-count128-20261128/* > "$PERF_EVIDENCE/tooling-sha256.txt"
          git fetch --no-tags --depth 1 origin "$PERF_BASELINE"
          git worktree add --detach "$RUNNER_TEMP/zstd-count128-product" "$PERF_BASELINE"
          git -C "$RUNNER_TEMP/zstd-count128-product" rev-parse HEAD 'HEAD^{tree}' > "$PERF_EVIDENCE/product-source.txt"
      - name: Install exact Emscripten distribution
        run: |
          mkdir -p "$RUNNER_TEMP/zstd-count128-emsdk"
          git -C "$RUNNER_TEMP/zstd-count128-emsdk" init --quiet
          git -C "$RUNNER_TEMP/zstd-count128-emsdk" remote add origin https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/zstd-count128-emsdk" fetch --quiet --depth 1 origin "$EMSDK_COMMIT"
          git -C "$RUNNER_TEMP/zstd-count128-emsdk" checkout --quiet FETCH_HEAD
          cd "$RUNNER_TEMP/zstd-count128-emsdk"
          ./emsdk install 5.0.1 > "$GITHUB_WORKSPACE/$PERF_EVIDENCE/compiler-install.log" 2>&1
          ./emsdk activate 5.0.1 >> "$GITHUB_WORKSPACE/$PERF_EVIDENCE/compiler-install.log" 2>&1
      - name: Reproduce baseline bytes and build the isolated candidate
        run: |
          source "$RUNNER_TEMP/zstd-count128-emsdk/emsdk_env.sh"
          python3 dev/perf/zstd-count128-20261128/build-compressors.py \
            --project-root "$RUNNER_TEMP/zstd-count128-product" \
            --output "$GITHUB_WORKSPACE/$PERF_EVIDENCE/compiler" \
            > "$PERF_EVIDENCE/build-driver.log" 2>&1
      - name: Retain generated bytes and all attempt logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zstd-count128-build-20261128-0f1f
          path: |
            builds/perf/zstd-count128-build-20261128-0f1f/*.txt
            builds/perf/zstd-count128-build-20261128-0f1f/*.log
            builds/perf/zstd-count128-build-20261128-0f1f/compiler/*.json
            builds/perf/zstd-count128-build-20261128-0f1f/compiler/*.txt
            builds/perf/zstd-count128-build-20261128-0f1f/compiler/baseline/*
            builds/perf/zstd-count128-build-20261128-0f1f/compiler/count128/*
          if-no-files-found: error
          retention-days: 14
