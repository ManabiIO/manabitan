name: Profile-guided import comparison round six
on:
  push:
    branches: [verify/import-round6-20260916]
    paths: [.github/workflows/import-round6-screen-20260916.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        candidate: [word-jump, simd-jump, inflight-bounds]
        dictionary: [jmdict, jitendex]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ef53e3bb8d7acaa645dba562cc818c4b35fe94bb
          persist-credentials: false
      - name: Pin review inputs and production source
        run: |
          cp -a dev/perf/round6-20260916 "$RUNNER_TEMP/round6-review"
          python3 -m py_compile "$RUNNER_TEMP/round6-review/"*.py
          git fetch --depth=1 origin b4094a423c20bb0ed424d944238f922c1b36559c
          git checkout --detach b4094a423c20bb0ed424d944238f922c1b36559c
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Same-path builds, correctness and six alternating pairs
        env:
          CANDIDATE: ${{ matrix.candidate }}
          DICTIONARY: ${{ matrix.dictionary }}
          PAIRS: '6'
          INITIAL_ORDER: AB
        run: |
          mkdir -p builds/round6
          python3 "$RUNNER_TEMP/round6-review/screen.py" 2>&1 | tee builds/round6/driver.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round6-screen-${{ matrix.candidate }}-${{ matrix.dictionary }}
          path: builds/round6
          retention-days: 30
