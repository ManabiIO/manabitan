name: Owned shared confirmed-zombie memory qualification 20261123

on:
  push:
    branches: [perf/import-memory-zombies-20261123-71149b]

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        replication: [1, 2]
    env:
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_REPLICATION: ${{ matrix.replication }}
      NODE_OPTIONS: --max-old-space-size=1536
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Verify process discovery without launching a browser
        run: |
          mkdir -p builds/import-memory-zombies-study
          python3 dev/perf/import-memory-zombies-study-20261123/test_chromium_memory.py > builds/import-memory-zombies-study/process-witness.log 2>&1
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Restore dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: import-memory-20261122-${{ matrix.dictionary }}-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Sample four fixed process-tree memory observations
        run: python3 dev/perf/import-memory-zombies-study-20261123/run_memory.py
      - name: Preserve every observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-memory-zombies-20261123-${{ matrix.dictionary }}-${{ matrix.replication }}
          path: builds/import-memory-zombies-study
          if-no-files-found: error
          retention-days: 30
