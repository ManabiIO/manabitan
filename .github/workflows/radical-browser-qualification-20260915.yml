name: Published decoder browser qualification
on:
  push:
    branches: [verify/import-radical-20260915]
    paths: [.github/workflows/radical-browser-qualification-20260915.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 726c5b7444a1b3c131c90de356f8261ac2fe65a2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Checksum-pinned complete dictionary cache
        run: node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Full strict Chromium import and runtime suite
        env:
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_E2E_USE_PERF_DICTIONARY_LOCK: '1'
          MANABITAN_E2E_IMPORT_USE_PRODUCTION_DEFAULTS: '1'
          MANABITAN_E2E_IMPORT_FLAGS_JSON: '{}'
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_CHROMIUM_E2E_REPORT: ./builds/decoder-browser/chromium.html
        run: |
          mkdir -p builds/decoder-browser
          npm run test:e2e:chromium-extension 2>&1 | tee builds/decoder-browser/chromium.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('builds/decoder-browser/chromium.json').read_text())
          assert data['status']=='success' and data['skippedVerification'] is False, data.get('failureReason')
          PY
      - name: Record exact runtime bytes and unchanged source
        if: always()
        run: |
          mkdir -p builds/decoder-browser
          git rev-parse HEAD 'HEAD^{tree}' > builds/decoder-browser/source.txt
          sha256sum ext/lib/term-bank-parser.wasm ext/js/dictionary/wasm/term-bank-parser.c ext/js/dictionary/wasm/term-bank-inflate.c > builds/decoder-browser/runtime-sha256.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-libdeflate-chromium-qualification
          path: builds/decoder-browser
          retention-days: 30
