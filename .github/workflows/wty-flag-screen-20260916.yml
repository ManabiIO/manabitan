name: WTY feature-flag ABBA screen
on:
  push:
    branches: [verify/wty-import-abba-20260916]
    paths: [.github/workflows/wty-flag-screen-20260916.yml]
permissions:
  contents: read
jobs:
  screen:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - id: term-spans
            label: Term bank spans
            flags: '{"experimentalTermBankSpans":true}'
          - id: native-escaped-keys
            label: Native escaped keys
            flags: '{"experimentalNativeEscapedKeys":true}'
          - id: validated-glossary-reuse
            label: Validated glossary reuse
            flags: '{"experimentalValidatedGlossaryReuse":true}'
          - id: global-exact-content-reuse
            label: Global exact content reuse
            flags: '{"experimentalGlobalExactContentReuse":true}'
          - id: fast-glossary-normalization
            label: Fast glossary normalization
            flags: '{"experimentalFastGlossaryNormalization":true}'
          - id: fused-single-bank
            label: Fused single bank
            flags: '{"experimentalFusedSingleBank":true}'
          - id: lookup-scratch-reuse
            label: Lookup scratch reuse
            flags: '{"experimentalLookupScratchReuse":true}'
          - id: native-segmented-lookup
            label: Native segmented lookup
            flags: '{"experimentalNativeSegmentedLookup":true}'
          - id: direct-lookup-arena
            label: Direct lookup arena
            flags: '{"experimentalDirectLookupArena":true}'
          - id: single-pass-lookup-compaction
            label: Single pass lookup compaction
            flags: '{"experimentalSinglePassLookupCompaction":true}'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: builds/e2e-dictionary-cache
          key: wty-en-en-21b1b22-c0a1b7ee-v1
      - name: Pin WTY, apply common prerequisite and raise validation buffer
        shell: bash
        run: |
          python3 dev/perf/wty-abba-20260916/prepare.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/chromium/extension-two-dictionary-import.e2e.js')
          s = p.read_text()
          old = "const {stdout} = await execFileAsync('unzip', ['-p', zipPath, banks[bankIndex]], {maxBuffer: 32 * 1024 * 1024});"
          assert s.count(old) == 1
          p.write_text(s.replace(old, old.replace('32 * 1024', '128 * 1024')))
          PY
      - run: npm ci
      - name: Build one package for both A and B arms
        run: |
          npm run build:libs
          node dev/bin/build.js --target chrome-dev
          npx playwright install --with-deps chromium
          node --input-type=module -e "import {ensurePinnedDictionaryCache} from './dev/perf/dictionary-fixtures.js'; await ensurePinnedDictionaryCache('./builds/e2e-dictionary-cache')"
      - name: Two-pair ABBA screen
        env:
          MANABITAN_CHROMIUM_HEADLESS: '1'
          MANABITAN_E2E_STRICT_RUNTIME: '1'
          MANABITAN_AB_BULKADD_BYTES_METRICS: '0'
          MANABITAN_AB_QUICK_MODE: '1'
        run: |
          mkdir -p "builds/wty-screen/${{ matrix.id }}"
          node test/chromium/import-flags-ab-benchmark.js wty-en-en --pairs 2 --flags '${{ matrix.flags }}' --label '${{ matrix.label }}' 2>&1 | tee "builds/wty-screen/${{ matrix.id }}/screen.log"
          cp builds/chromium-e2e-import-flags-isolated-summary-*.json "builds/wty-screen/${{ matrix.id }}/" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wty-screen-${{ matrix.id }}
          path: builds/wty-screen/${{ matrix.id }}
          retention-days: 30
