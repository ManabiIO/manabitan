name: Import diagnostic traces 2026-11-23

on:
  push:
    branches: [perf/import-r2-study-20261123-fcff]
    paths:
      - .github/workflows/import-r2-profile-20261123.yml
      - dev/perf/import-r2-profile-20261123.py

permissions:
  contents: read

jobs:
  profile:
    name: Baseline trace / ${{ matrix.dictionary }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
    env:
      PROFILE_OUTPUT: ${{ github.workspace }}/builds/perf/import-r2-profile/${{ matrix.dictionary }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve research source before setup
        run: |
          mkdir -p "$PROFILE_OUTPUT/research-sources"
          cp --parents .github/workflows/import-r2-profile-20261123.yml \
            dev/perf/import-r2-profile-20261123.py "$PROFILE_OUTPUT/research-sources"
          git rev-parse HEAD > "$PROFILE_OUTPUT/research-sha.txt"
      - uses: ./.github/actions/setup
        with:
          node-version: '22.22.0'
      - name: Install matching Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture one diagnostic trace
        run: >-
          python3 dev/perf/import-r2-profile-20261123.py '${{ matrix.dictionary }}'
          --output "$PROFILE_OUTPUT"
      - name: Preserve diagnostic and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: import-r2-profile-${{ matrix.dictionary }}
          path: ${{ env.PROFILE_OUTPUT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
