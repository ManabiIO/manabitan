name: Source startup qualification 88711

on:
  push:
    branches: [perf/source-startup-qualification-20261128-88711]
    paths:
      - .github/workflows/source-startup-qualification-88711.yml
      - dev/perf/source-startup-qualification-20261128-88711.json

permissions:
  contents: read

concurrency:
  group: source-startup-qualification-88711-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'ManabiIO/manabitan'
    name: Frozen source validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STARTUP_SOURCE: 1c32ca03a4e0a8e5361ffdb5c90693b657ffad24
      STARTUP_TREE: 24688d89b0ce95c385fc960b4ca86badf3eb5300
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 1c32ca03a4e0a8e5361ffdb5c90693b657ffad24
          persist-credentials: false
      - name: Bind the exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/source-startup-qualification-static-88711"
          mkdir -p "$evidence"
          test "$(git rev-parse HEAD)" = "$STARTUP_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$STARTUP_TREE"
          git rev-parse HEAD > "$evidence/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$evidence/source-tree.txt"
          sha256sum ext/js/dictionary/dictionary-importer.js \
            ext/js/dictionary/term-bank-source-pipeline.js \
            ext/js/dictionary/term-bank-wasm-parser.js \
            test/term-bank-owned-source-startup.test.js \
            test/term-bank-wasm-startup.test.js > "$evidence/source-files.sha256"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install pinned dependencies and libraries
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v22.22.0
          npm ci
          npm run build:libs
      - name: Complete test-project TypeScript gate
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/typescript/bin/tsc --noEmit --project test/jsconfig.typecheck.json \
            2>&1 | tee "$RUNNER_TEMP/source-startup-qualification-static-88711/types-test.log"
      - name: Complete importer and source-pipeline lint gates
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/eslint/bin/eslint.js \
            ext/js/dictionary/dictionary-importer.js \
            ext/js/dictionary/term-bank-source-pipeline.js \
            2>&1 | tee "$RUNNER_TEMP/source-startup-qualification-static-88711/lint.log"
      - name: Verify source remained frozen
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$STARTUP_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$STARTUP_TREE"
          test -z "$(git status --porcelain)"
          sha256sum --check "$RUNNER_TEMP/source-startup-qualification-static-88711/source-files.sha256"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-startup-qualification-static-88711
          path: ${{ runner.temp }}/source-startup-qualification-static-88711
          if-no-files-found: error
          retention-days: 14

  qualify:
    needs: validate
    if: github.repository == 'ManabiIO/manabitan'
    name: ${{ matrix.dictionary }} / ${{ matrix.order }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        dictionary: [jmdict, jitendex, vndb]
        order: [AB, BA]
    env:
      PERF_BASELINE: 9e10d3b3fcf66d344ab31bc42c9b522fa5215da2
      PERF_CANDIDATE: 1c32ca03a4e0a8e5361ffdb5c90693b657ffad24
      PERF_DICTIONARY: ${{ matrix.dictionary }}
      PERF_ORDER: ${{ matrix.order }}
      MANABITAN_E2E_STRICT_RUNTIME: "1"
      MANABITAN_CHROMIUM_ALLOW_HEADED_FALLBACK: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Verify the unchanged memory observer and receipt gates
        run: python -m unittest discover -s dev/perf/import-memory-20261125-a7f7 -p 'test_*.py'
      - name: Restore locked dictionary archives
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: builds/e2e-dictionary-cache
          key: perf-source-dictionaries-${{ runner.os }}-${{ hashFiles('test/perf/dictionaries.lock.json') }}
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Fetch the frozen product revisions
        run: git fetch --no-tags origin "$PERF_BASELINE" "$PERF_CANDIDATE"
      - name: Acquire complete imports, exhaustive media, and separate memory observations
        shell: bash
        run: |
          set -euo pipefail
          allocation=()
          if [[ "$PERF_DICTIONARY" == vndb ]]; then
            allocation=(--vndb-sah-allocation-units 37 37)
          fi
          python dev/perf/import-qualification-20261127-88711ca9.py \
            --baseline "$PERF_BASELINE" \
            --candidate "$PERF_CANDIDATE" \
            --dictionary "$PERF_DICTIONARY" \
            --initial-order "$PERF_ORDER" \
            --pairs 12 \
            --expected-workers 3 \
            --expected-source-entry ext/js/dictionary/dictionary-importer.js \
            --expected-source-entry ext/js/dictionary/term-bank-source-pipeline.js \
            --expected-source-entry ext/js/dictionary/term-bank-wasm-parser.js \
            --expected-source-entry test/term-bank-owned-source-startup.test.js \
            --expected-source-entry test/term-bank-wasm-startup.test.js \
            --expected-package-entry js/dictionary/dictionary-importer.js \
            --expected-package-entry js/dictionary/term-bank-source-pipeline.js \
            --expected-package-entry js/dictionary/term-bank-wasm-parser.js \
            "${allocation[@]}" \
            --evidence "builds/perf/source-startup-qualification-88711/$PERF_DICTIONARY-$PERF_ORDER"
      - name: Preserve every prescribed observation and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-startup-qualification-88711-${{ matrix.dictionary }}-${{ matrix.order }}
          path: builds/perf/source-startup-qualification-88711/${{ matrix.dictionary }}-${{ matrix.order }}
          if-no-files-found: error
          retention-days: 14
